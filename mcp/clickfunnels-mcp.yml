  exact OAuth shape the MCP authorization spec expects. What ClickFunnels ships for agents today is a set of
  16 Markdown Agent Skills at /.well-known/<area>/skill.md driving the plain REST API. No tools are derived
  here and no MCPServer pointer is emitted: an agent has nothing to connect to yet.'
