openapi: 3.2.0
info:
  title: ClickFunnels Page API
  termsOfService: https://www.clickfunnels.com/terms-of-service
  contact:
    name: ClickFunnels API Team
    url: https://developers.myclickfunnels.com
  x-logo:
    url: https://statics.myclickfunnels.com/image/1126065/file/31edf05760fafe41a82f16a668ab251f.png
  description: 'The ClickFunnels REST API that powers webhooks, native integrations, and Zapier lets you manage your ClickFunnels data, automate your workflows, and recreate ClickFunnels functionality in your own apps.


    ### For AI agents


    This document is the catalogue: every operation ClickFunnels exposes over REST is described here, with a unique operationId, typed schemas, and the scopes it needs. It is served from `/openapi.json`, `/openapi.yaml`, `/api/openapi.{json,yaml}`, and `/api/v2/openapi.{json,yaml}` on the accounts host.


    Three things it does not describe, each one request away:


    - MCP server: the app-native Model Context Protocol server (Streamable HTTP, OAuth 2.1 with PKCE). Prefer it over raw REST when your client supports MCP - it describes itself at runtime.

    - Skill guides, also as an Agent Skills index: one task guide per job (pages, blogs, products, orders, workflows, emails, courses, stats, external SDK pages). Read the guide that matches your job before your first write. llms.txt covers when to use ClickFunnels at all, how to get credentials, and how to behave around rate limits.

    - Protected resource metadata (RFC 9728) and authorization server metadata (RFC 8414): the scope vocabulary and the OAuth endpoints. Dynamic client registration is for MCP clients only.


    On ClickFunnels-owned API hosts (`myclickfunnels.com` and its subdomains), the OpenAPI specification responses and API authentication failures (401, or 403 for insufficient scope) carry those links in an RFC 8288 `Link` header, so clients can discover the documentation and authentication metadata from those responses. Requests sent through a customer''s custom domain keep the Bearer challenge but omit those discovery pointers.'
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  version: 2.0.0
servers:
- url: https://{subdomain}.myclickfunnels.com/api/v2
  description: ClickFunnels API
  variables:
    subdomain:
      default: myworkspace
security:
- BearerAuth: []
- OAuth2: []
tags:
- name: Page
  description: '> Page offers extra information about ClickFunnels pages, like those that are part of funnels.


    It''s the main element that the user modifies when editing a Page in the ClickFunnels editor.


    You can also learn how to source Page name and public ID from your ClickFunnels UI

    here.


    See the Pages Skill for building a page and positioning it within a funnel; the page body is authored in PML — see the Page Markup Skill. For pages you host yourself, see Create an External Page and Add Checkout to an External Page. To move those externally-hosted pages to a new domain, see Migrate an External Page Domain.'
paths:
  /workspaces/{workspace_id}/pages:
    get:
      tags:
      - Page
      summary: List Pages
      description: Page offers extra information about ClickFunnels pages, like those that are part of funnels.
      operationId: listPages
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/after'
      - $ref: '#/components/parameters/per_page'
      - $ref: '#/components/parameters/sort_order'
      - $ref: '#/components/parameters/sort_property'
      - name: filter
        in: query
        description: 'Filter by available properties in query params, like this: `api/v2/resources?filter[id]=value&filter[another_property]=value1,value2`. Check our Filtering guide for examples and all about filtering [here](https://developers.myclickfunnels.com/docs/filtering).

          '
        required: false
        schema:
          type: object
          properties:
            id:
              type: string
              description: A comma-separated list of page IDs to filter by.
              example: 1,42
            theme_id:
              type: string
              description: A comma-separated list of theme IDs to filter by.
              example: 1,42
            funnel_pages:
              type: boolean
              description: Only show pages that belong to a funnel as opposed to standalone landing or site pages.
              example: true
            funnel_ids:
              type: string
              description: A comma-separated list of funnel IDs to filter pages by. Returns only pages belonging to the specified funnels.
              example: 123,456
        style: deepObject
        explode: true
      - $ref: '#/components/parameters/ExpandPageFields'
      responses:
        '200':
          description: OK
          headers:
            Pagination-Next:
              $ref: '#/components/headers/PaginationNext'
            Link:
              $ref: '#/components/headers/Link'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PageAttributes'
              example:
              - id: 61
                public_id: eldUyN
                workspace_id: 42000
                name: Great Page
                theme_id: null
                created_at: '2025-01-01T00:00:00.000Z'
                updated_at: '2025-01-01T00:00:00.000Z'
                type: funnel_page
                custom_html_page: false
                current_path: /great-page
                url: https://myteam.myclickfunnels.com/funnel-great-page
                show_page_step:
                  id: 100
                  public_id: xYz123
                  name: Great Page Step
                  current_path: /funnel-great-page
                  sort_order: 0
                  products: []
                funnel:
                  id: 50
                  public_id: AbC789
                  name: Sales Funnel
                sdk: null
                block_ai_assistant: false
                block_ai_crawler: false
                block_ai_search: false
                description: null
                seo_description: null
                seo_index: false
                seo_title: null
              - id: 62
                public_id: AtcUVH
                workspace_id: 42000
                name: Landing Page
                theme_id: null
                created_at: '2025-01-01T00:00:00.000Z'
                updated_at: '2025-01-01T00:00:00.000Z'
                type: landing_page
                custom_html_page: false
                current_path: /landing-page
                url: https://myteam.myclickfunnels.com/landing-page
                show_page_step: null
                funnel: null
                sdk: null
                block_ai_assistant: false
                block_ai_crawler: false
                block_ai_search: false
                description: null
                seo_description: null
                seo_index: false
                seo_title: null
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  hint:
                    type:
                    - string
                    - 'null'
                    description: 'The next step for the caller: how to authenticate, which scope was missing, or where the route list lives. Always present, and null when this error has no next step to offer.'
              example:
                error: API key missing or invalid
                hint: 'Send the token as `Authorization: Bearer <token>`. Create one under Account > Team > Platform Applications (a workspace API key), or obtain one with OAuth 2.1; both use the same scopes. See https://developers.myclickfunnels.com/docs/authentication, or append .md to that URL for markdown.'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Not found - This usually happens when you try to access a record that does not exist in your account. It can also happen when the provided parent record is missing, e.g. you have put in a non-existent Workspaces parent ID.
                  hint:
                    type:
                    - string
                    - 'null'
                    description: 'The next step for the caller: how to authenticate, which scope was missing, or where the route list lives. Always present, and null when this error has no next step to offer.'
              example:
                error: 'Not found: Record missing'
                hint: null
        '422':
          $ref: '#/components/responses/InvalidPageSize'
    post:
      tags:
      - Page
      summary: Create Page
      description: 'Create a new internal page in the workspace. By default, creating a page without references to a funnel or show page step will create a standalone landing page.


        You can optionally attach the page to a funnel by providing either:

        - `funnel.funnel_id`: Creates a new show page step in the specified funnel. When provided without `show_page_step_id`, the page is added as the last step of the funnel, positioned after the currently last page.

        - `funnel.show_page_step_id`: Swaps the referenced step to point at this newly created page. The page previously linked to that step becomes an orphan (kept in the workspace, no longer linked to any step).


        **`sort_order`** (optional, top-level): Controls the zero-based position within the funnel when creating with `funnel.funnel_id`. `0` inserts before the first existing step; omit to append at the end. Out-of-bounds values (negative or greater than the current step count) return 422. `sort_order` is ignored when `funnel.show_page_step_id` is used — the swap target''s current position is preserved.


        **`funnel.after_show_page_step_id`** (optional, with `funnel.funnel_id`): Insert the new step right after the referenced show page step — also places the page inside a split branch. Alternative to `sort_order`. An id that does not resolve to a step in the funnel returns 400.


        To also attach products to the page''s checkout step in the same call, pass `show_page_step.product_ids: [...]` (sibling of `funnel`). This is the only way to set products at create time — the legacy `funnel.products` shape is rejected with a 400. Products attachment is **additive** and **all-or-nothing**: any unresolved id fails the whole request and the page is not created.


        **Order bumps**: pass `show_page_step.bumps: [{product_id, preheadline}]` (same semantics as `product_ids`) to attach products as order bumps instead of main products, each with its own optional `preheadline` — the line of copy shown above that bump''s offer. A product may appear in only one of the two blocks per request; naming it in both returns a 400.


        **`external_url` is rejected** — to create an externally-hosted (SDK) page use `POST /api/v2/workspaces/:workspace_id/pages/external`.'
      operationId: createPage
      externalDocs:
        description: Pages Skill - building a page (PML body)
        url: https://accounts.myclickfunnels.com/.well-known/pages/skill.md#building-a-page
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/ExpandPageFields'
      requestBody:
        description: Information about the Page to create
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                page:
                  type: object
                  $ref: '#/components/schemas/PageParameters'
            example:
              page:
                name: My New Page
                current_path: /my-new-page
                theme_id: 12345
                description: A landing page for our new product launch
                seo_title: New Product Launch - My Brand
                seo_description: Discover our latest product offering
                seo_index: true
                block_ai_crawler: true
                block_ai_search: false
                block_ai_assistant: false
                funnel:
                  funnel_id: xyz789
                show_page_step:
                  product_ids:
                  - PrdAbc
                head_code: <script>console.log('hello');</script>
                head_code_mode: append
                markup: "<section>\n  <row cols=\"1\">\n    <column>\n      <headline>Welcome to our page</headline>\n      <subheadline>Start your journey here</subheadline>\n    </column>\n  </row>\n</section>\n"
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageAttributes'
              example:
                id: 70
                public_id: NewPgX
                workspace_id: 42000
                name: My New Page
                theme_id: 12345
                created_at: '2025-01-01T00:00:00.000Z'
                updated_at: '2025-01-01T00:00:00.000Z'
                type: funnel_page
                custom_html_page: false
                current_path: /my-new-page-xyz123
                url: https://myteam.myclickfunnels.com/my-new-page
                show_page_step:
                  id: 200
                  public_id: StpNew
                  name: My New Page
                  current_path: /my-new-page
                  sort_order: 0
                  products: []
                funnel:
                  id: 100
                  public_id: xyz789
                  name: Target Funnel
                sdk: null
                block_ai_assistant: false
                block_ai_crawler: false
                block_ai_search: false
                description: null
                seo_description: null
                seo_index: false
                seo_title: null
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  hint:
                    type:
                    - string
                    - 'null'
                    description: 'The next step for the caller: how to authenticate, which scope was missing, or where the route list lives. Always present, and null when this error has no next step to offer.'
              examples:
                invalid_funnel_id:
                  summary: Invalid funnel_id
                  value:
                    error: 'Bad request: The funnel with the provided ID cannot be found.'
                    hint: null
                invalid_show_page_step_id:
                  summary: Invalid show_page_step_id
                  value:
                    error: 'Bad request: The step with the provided ID cannot be found.'
                    hint: null
                invalid_code_mode:
                  summary: Invalid code mode
                  value:
                    error: 'Bad request: Invalid code mode ''invalid''. Must be ''append'' or ''replace''.'
                    hint: null
                invalid_markup:
                  summary: Invalid PML markup
                  value:
                    error: 'Bad request: Markup is not valid PML: unknown top-level element(s) <foo>. Top-level elements must be one of: <section>, <row>, <column>, <flex>, <headline>, <subheadline>, <paragraph>, <image>, <input>, <button>, <list>, <video>, <divider>, <link>, <countdown>, <accordion>, <customhtml>, <product-carousel>, <order-summary>, <checkout>, <confirmation>, <product-name>, <product-description>, <product-price>, <product-image>, <product-link>, <saved-section>. (line 3)'
                    hint: null
                product_in_both_lists:
                  summary: a product is named as both a main product and an order bump
                  value:
                    error: 'Bad request: Product(s) cannot be listed in both product_ids and bumps: PrdBmp'
                    hint: null
                bumps_entry_without_product_id:
                  summary: a show_page_step.bumps entry is missing its product_id
                  value:
                    error: 'Bad request: Every show_page_step.bumps entry requires a product_id.'
                    hint: null
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  hint:
                    type:
                    - string
                    - 'null'
                    description: 'The next step for the caller: how to authenticate, which scope was missing, or where the route list lives. Always present, and null when this error has no next step to offer.'
              example:
                error: API key missing or invalid
                hint: 'Send the token as `Authorization: Bearer <token>`. Create one under Account > Team > Platform Applications (a workspace API key), or obtain one with OAuth 2.1; both use the same scopes. See https://developers.myclickfunnels.com/docs/authentication, or append .md to that URL for markdown.'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  hint:
                    type:
                    - string
                    - 'null'
                    description: 'The next step for the caller: how to authenticate, which scope was missing, or where the route list lives. Always present, and null when this error has no next step to offer.'
              example:
                error: 'Not found: Record missing'
                hint: null
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  hint:
                    type:
                    - string
                    - 'null'
                    description: 'The next step for the caller: how to authenticate, which scope was missing, or where the route list lives. Always present, and null when this error has no next step to offer.'
              examples:
                name_blank:
                  summary: Name is blank
                  value:
                    error: 'Request unprocessable: Name can''t be blank'
                    hint: null
                external_url_rejected:
                  summary: external_url is not allowed on this endpoint
                  value:
                    error: 'Request unprocessable: The following fields are not valid on this endpoint: external_url. Use POST /api/v2/workspaces/:workspace_id/pages/external to create externally-hosted (SDK) pages.'
                    hint: null
                out_of_bounds_sort_order:
                  summary: sort_order out of bounds
                  value:
                    error: 'Request unprocessable: sort_order 5 is out of bounds (funnel has 3 step(s)).'
                    hint: null
  /workspaces/{workspace_id}/pages/external:
    post:
      tags:
      - Page
      summary: Create External Page
      description: 'Create an externally-hosted (SDK) page. Unlike internal pages, the visual content lives on your own domain and is registered with ClickFunnels via a lightweight SDK integration.


        **Required fields:**

        - `external_url`: The fully-qualified URL where your page is hosted.


        **Standalone vs in a funnel:** the `funnel` block is optional.

        - Omit it to create a **standalone** external page: registered with an SDK token and visit tracking enabled, but not a step in any funnel. Place it later by passing its id in a conditional split''s `branches[].page_id`, a split test''s fresh-variant slot, an update swap (`funnel.show_page_step_id`), or the funnel `attach_page` flow. SDK checkout and form submission require placement and return a `page_not_in_funnel` error until the page is a funnel step.

        - Provide `funnel.funnel_id` OR `funnel.show_page_step_id` to create it inside a funnel in one call.


        **Funnel positioning:**

        - `funnel.funnel_id` + optional `sort_order`: Creates a new show page step in the funnel at the specified zero-based position (`0` = first, omit = append at end).

        - `funnel.show_page_step_id`: Swaps the existing step to point at the new external page. The previous page on that step becomes an orphan. `sort_order` is ignored in this case.

        - Positioning params without their funnel target return 422: `sort_order` requires `funnel.funnel_id`, and `funnel.after_show_page_step_id` requires `funnel.funnel_id`.


        **Rejected fields** (returns 422 if present): `markup`, `theme_id`, `current_path`, `seo_title`, `seo_description`, `seo_index`, `block_ai_crawler`, `block_ai_search`, `block_ai_assistant`, `head_code`, `footer_code`, `live_data_changes`, `show_page_step.product_ids`, `show_page_step.bumps`. Attach products and order bumps in a follow-up `PATCH /api/v2/pages/:id`.


        **SDK onboarding:** The response includes an `sdk` block with a `token` (prefixed `cfp_`). To register the page:

        1. Add `">` to your page''s ``.

        2. Include the ClickFunnels SDK script tag on the page.


        The Create an External Page Skill is the end-to-end guide for the page itself. To sell products from that page, see Add Checkout to an External Page.'
      operationId: createExternalPage
      externalDocs:
        description: SDK Skill - create an external page
        url: https://accounts.myclickfunnels.com/.well-known/sdk/create-external-page/skill.md#the-entire-public-surface
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        description: Information about the external page to create
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - page
              properties:
                page:
                  type: object
                  required:
                  - external_url
                  properties:
                    name:
                      type: string
                      description: Page name. Defaults to the URL host if omitted.
                    description:
                      type:
                      - string
                      - 'null'
                      description: A short description of the page (max 1000 characters).
                    external_url:
                      type: string
                      description: The fully-qualified URL of the externally-hosted page (e.g. `https://acme.example.com/my-page`). Must be unique within the workspace.
                    sort_order:
                      type: integer
                      description: Optional zero-based position within the funnel when using `funnel.funnel_id` (422 without it). `0` inserts before the first step; omit to append. Ignored when `funnel.show_page_step_id` is used.
                    funnel:
                      type: object
                      description: Optional funnel association — provide either `funnel_id` or `show_page_step_id`. Omit the whole block to create a standalone external page (no funnel step).
                      properties:
                        funnel_id:
                          type: string
                          description: The public ID of the funnel to attach this page to.
                        after_show_page_step_id:
                          type:
                          - integer
                          - string
                          description: 'With `funnel_id`: insert the new step right after this show page step (pass the `show_page_step_id` from GET /funnels/:id/structure; also places the page inside a split branch). Alternative to `sort_order`.'
                        show_page_step_id:
                          type:
                          - integer
                          - string
                          description: The ID of an existing show page step to swap this page onto.
            example:
              page:
                name: My External Landing Page
                external_url: https://acme.example.com/my-page
                funnel:
                  funnel_id: xyz789
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageAttributes'
              example:
                id: 71
                public_id: ExtPgY
                workspace_id: 42000
                name: My External Landing Page
                description: null
                theme_id: null
                seo_title: null
                seo_description: null
                seo_index: false
                block_ai_crawler: false
                block_ai_search: false
                block_ai_assistant: false
                created_at: '2025-01-01T00:00:00.000Z'
                updated_at: '2025-01-01T00:00:00.000Z'
                type: funnel_page
                custom_html_page: false
                current_path: null
                url: https://acme.example.com/my-page
                show_page_step:
                  id: 201
                  public_id: StpExt
                  name: My External Landing Page
                  current_path: null
                  sort_order: 0
                  products: []
                funnel:
                  id: 100
                  public_id: xyz789
                  name: Target Funnel
                sdk:
                  token: cfp_abc123def456
                  external_url: https://acme.example.com/my-page
        '400':
          description: Bad Request — a referenced funnel or step id could not be resolved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  hint:
                    type:
                    - string
                    - 'null'
                    description: 'The next step for the caller: how to authenticate, which scope was missing, or where the route list lives. Always present, and null when this error has no next step to offer.'
              example:
                error: 'Bad request: The funnel or show_page_step with the provided ID cannot be found.'
                hint: null
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  hint:
                    type:
                    - string
                    - 'null'
                    description: 'The next step for the caller: how to authenticate, which scope was missing, or where the route list lives. Always present, and null when this error has no next step to offer.'
              example:
                error: API key missing or invalid
                hint: 'Send the token as `Authorization: Bearer <token>`. Create one under Account > Team > Platform Applications (a workspace API key), or obtain one with OAuth 2.1; both use the same scopes. See https://developers.myclickfunnels.com/docs/authentication, or append .md to that URL for markdown.'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  hint:
                    type:
                    - string
                    - 'null'
                    description: 'The next step for the caller: how to authenticate, which scope was missing, or where the route list lives. Always present, and null when this error has no next step to offer.'
              example:
                error: 'Not found: Record missing'
                hint: null
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  hint:
                    type:
                    - string
                    - 'null'
                    description: 'The next step for the caller: how to authenticate, which scope was missing, or where the route list lives. Always present, and null when this error has no next step to offer.'
              examples:
                missing_external_url:
                  summary: external_url is required
                  value:
                    error: 'Request unprocessable: external_url is required for external pages.'
                    hint: null
                unknown_funnel_keys:
                  summary: funnel block has unsupported keys
                  value:
                    error: 'Request unprocessable: page.funnel has unsupported keys: funnelId. Accepted keys: funnel_id, show_page_step_id, after_show_page_step_id.'
                    hint: null
                positioning_without_target:
                  summary: positioning param without funnel.funnel_id
                  value:
                    error: 'Request unprocessable: funnel.after_show_page_step_id requires funnel.funnel_id; omit the funnel block to create a standalone external page.'
                    hint: null
                rejected_fields:
                  summary: forbidden fields present
                  value:
                    error: 'Request unprocessable: The following fields are not valid for external pages: markup, theme_id.'
                    hint: null
                out_of_bounds_sort_order:
                  summary: sort_order out of bounds
                  value:
                    error: 'Request unprocessable: sort_order 5 is out of bounds (funnel has 3 step(s)).'
                    hint: null
                malformed_external_url:
                  summary: external_url is not a valid URL
                  value:
                    error: 'Request unprocessable: Validation failed: URL is not a valid URL (expected something like https://example.com/my-page)'
                    hint: null
                duplicate_url:
                  summary: external_url already in use
                  value:
                    error: 'Request unprocessable: Validation failed: URL is already in use by another external page in this workspace'
                    hint: null
  /workspaces/{workspace_id}/pages/custom_html:
    post:
      tags:
      - Page
      summary: Create Custom HTML Page
      description: 'Create a ClickFunnels-hosted custom HTML page: you supply the complete HTML document and ClickFunnels serves it verbatim at a path on the funnel''s domain — no page editor, no PML. Ideal for AI-generated pages: generate the HTML, POST it here, and the page is live as a funnel step.


        **Required fields:**

        - `name`: The page name.

        - `custom_html`: The complete HTML document (max 2MB). Served byte-for-byte — include your own CSS/JS inline.


        **Making the page work with ClickFunnels (opt-ins, tracking):** the response includes an `sdk` block with a `token` (prefixed `cfp_`). The HTML should contain:

        1. `">` inside ``.

        2. The ClickFunnels SDK script tag (`/sdk.js" defer>`).

        3. Form fields marked with `data-cf-element` attributes (`email`, `first-name`, `last-name`, `name`, `phone`, `custom-attribute:`) inside a plain ``.


        Since the token is minted by this call, either create the page first and then PATCH the HTML with the token inserted, or create with placeholder HTML and swap it. The Create an External Page Skill documents the exact form markup convention (it applies to custom HTML pages too — the only difference is ClickFunnels hosts the file).


        **Standalone vs in a funnel:** the `funnel` block is optional and behaves exactly like `POST /pages/external`:

        - Omit it to create a **standalone** page.

        - `funnel.funnel_id` + optional `sort_order` or `funnel.after_show_page_step_id`: create as a step in the funnel.

        - `funnel.show_page_step_id`: swap an existing step onto this page.


        **Path:** pass `current_path` (e.g. `/my-landing`) to choose the URL path on the funnel''s domain; omitted, the path derives from the name. Change it later via `PATCH /pages/{id}` with `current_path`.


        **Limitation:** viewing a custom HTML page does not advance the visitor''s funnel run (form submissions do), so run-based view attribution treats un-submitted custom HTML steps as unvisited.


        **Rejected fields** (returns 422 if present): `markup`, `theme_id`, `seo_title`, `seo_description`, `seo_index`, `block_ai_crawler`, `block_ai_search`, `block_ai_assistant`, `head_code`, `footer_code`, `custom_css`, `live_data_changes`, `external_url`, `show_page_step.product_ids`, `show_page_step.bumps`. To list the page in the domain''s `sitemap.xml` or opt it out of AI crawlers, set `seo_index` or the `block_ai_*` flags afterwards via `PATCH /pages/{id}`.'
      operationId: createCustomHtmlPage
      externalDocs:
        description: SDK Skill - form markup convention (applies to custom HTML pages)
        url: https://accounts.myclickfunnels.com/.well-known/sdk/create-external-page/skill.md#the-entire-public-surface
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        description: Information about the custom HTML page to create
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - page
              properties:
                page:
                  type: object
                  required:
                  - name
                  - custom_html
                  properties:
                    name:
                      type: string
                      description: Page name.
                    description:
                      type:
                      - string
                      - 'null'
                      description: A short description of the page (max 1000 characters).
                    custom_html:
                      type: string
                      description: The complete HTML document to serve (max 2MB).
                    current_path:
                      type: string
                      description: Optional URL path on the funnel's domain (e.g. `/my-landing`). Derived from the name when omitted.
                    sort_order:
                      type: integer
                      description: Optional zero-based position within the funnel when using `funnel.funnel_id` (422 without it). `0` inserts before the first step; omit to append. Ignored when `funnel.show_page_step_id` is used.
                    funnel:
                      type: object
                      description: Optional funnel association — provide either `funnel_id` or `show_page_step_id`. Omit the whole block to create a standalone page.
                      properties:
                        funnel_id:
                          type:
                          - integer
                          - string
                          description: The ID (or public ID) of the funnel to attach this page to.
                        after_show_page_step_id:
                          type:
                          - integer
                          - string
                          description: 'With `funnel_id`: insert the new step right after this show page step. Alternative to `sort_order`.'
                        show_page_step_id:
                          type:
                          - integer
                          - string
                          description: The ID of an existing show page step to swap this page onto.
            example:
              page:
                name: AI Landing Page
                custom_html: <!doctype html><html><head><title>Hi</title></head><body><h1>Hello</h1></body></html>
                current_path: /ai-landing
                funnel:
                  funnel_id: xyz789
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageAttributes'
              example:
                id: 72
                public_id: CstPgZ
                workspace_id: 42000
                name: AI Landing Page
                description: null
                theme_id: null
                seo_title: null
                seo_description: null
                seo_index: false
                block_ai_crawler: false
                block_ai_search: false
                block_ai_assistant: false
                created_at: '2025-01-01T00:00:00.000Z'
                updated_at: '2025-01-01T00:00:00.000Z'
                type: funnel_page
                custom_html_page: true
                current_path: /ai-landing-page-page
                url: https://myteam.myclickfunnels.com/ai-landing
                show_page_step:
                  id: 202
                  public_id: StpCst
                  name: AI Landing Page
                  current_path: /ai-landing
                  sort_order: 0
                  products: []
                funnel:
                  id: 100
                  public_id: xyz789
                  name: Target Funnel
                sdk:
                  token: cfp_abc123def456
        '400':
          description: Bad Request — a referenced funnel or step id could not be resolved.
          content:
            application/json:
              schema:
                type: object
