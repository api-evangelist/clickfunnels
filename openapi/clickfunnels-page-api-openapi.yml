                  sort_order: 0
                  products: []
                funnel:
                  id: 80
                  public_id: FnlUpd
                  name: Updated Funnel
                sdk: null
                block_ai_assistant: false
                block_ai_crawler: false
                block_ai_search: false
                description: null
                seo_description: null
                seo_index: false
                seo_title: null
        '400':
          description: Bad Request
