    put:
      tags:
      - Page
      summary: Update Page
      description: 'Update an existing internal, custom HTML, or external (SDK) page.


        This existing write saves supported page content live; there is currently no separate public page publish or status operation. Read the page back with `GET /api/v2/pages/:id` to confirm the resource, then check its computed `url` separately when public delivery matters. A successful write requests cache invalidation but does not prove propagation or reachability. The path accepts a numeric id or public id, and the JSON body uses the `page` root. PATCH is also supported.


        For internal pages, `markup` replaces live content; it does not promote a saved editor draft or promise deletion of an existing draft blob. For custom HTML pages, `custom_html` replaces the ClickFunnels-hosted HTML body. For external SDK pages, deploy content on your own host; `external_url` only changes its registration.


        Field availability depends on the page type — see `PageParametersUpdate` for the full breakdown. Sending an internal-only field on an external page (or `external_url` on an internal page) returns 422 with an explicit list of the rejected field names — never silently ignored.


        **`sort_order`** (optional, top-level): Reposition the page within its funnel. Zero-based. Ignored when `funnel.show_page_step_id` is also provided.


        **`funnel.show_page_step_id`** (optional): Swap the page onto an existing show page step. The previous page on that step becomes an orphan. Shared by both page types.


        **`external_url`** (external pages only): Update the external URL. The SDK token is preserved.


        **`show_page_step.product_ids` / `show_page_step.bumps`** (optional, both page types): Append products to the page''s checkout step as main products or as order bumps. Both are additive; `bumps` also promotes a product already attached to the step into a bump, which is how an existing attachment becomes one. Each `bumps` entry is `{product_id, preheadline}`, where `preheadline` is the optional copy shown above that bump''s offer. Requires the page to be part of a funnel (400 otherwise).


        **`markup`** (internal pages only): Replaces live page content. PML covers only a subset of what the ClickFunnels page editor can build, so if this page could have been created or edited in the editor, stop and get explicit approval from the user first: see the approval guardrail. Never resubmit a lossy PML read merely to publish an editor page.


        To move externally-hosted pages to a new domain, see Patch one page at a time in the Migrate an External Page Domain Skill.'
      operationId: updatePages
      externalDocs:
        description: Pages Skill - building a page (PML body)
        url: https://accounts.myclickfunnels.com/.well-known/pages/skill.md#building-a-page
