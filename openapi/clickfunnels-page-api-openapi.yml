  /pages/{id}/products:
    delete:
      tags:
      - Page
      summary: Remove Products from Page
      description: 'Detach one or more products from the page''s show page step. This is the **only** way

        to remove products from a page via the API — the `show_page_step.product_ids` and

        `show_page_step.bumps` fields on `POST/PATCH /api/v2/pages` are

        additive-only and never remove products.


        Detaching is by product id and ignores the bump flag: main products and order bumps

        are removed the same way. Detach-then-re-attach via `show_page_step.product_ids` is

        also how you turn an order bump back into a main product.


        Accepts `product_ids: [...]` in the request body or query string. The batch is

        transactional — if any id does not resolve to a workspace product, or any id is not

        currently attached to the step, no products are detached.


        Returns 204 with no body on success.


        See Manage products on a checkout page in the Pages Skill for the attach and detach lifecycle.'
      operationId: removeProductsFromPage
      parameters:
      - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - product_ids
              properties:
                product_ids:
                  type: array
                  items:
                    type: string
                  description: One or more product public IDs (or numeric IDs) to detach.
            example:
              product_ids:
              - PrdXyz
              - PrdAbc
      responses:
        '204':
          description: No Content — products successfully detached
        '400':
          description: 'Bad Request — `product_ids` missing, the page is not part of a funnel, or one or more

            ids do not resolve to a workspace product (no products are detached in this case).

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  hint:
                    type:
                    - string
                    - 'null'
                    description: 'The next step for the caller: how to authenticate, which scope was missing, or where the route list lives. Always present, and null when this error has no next step to offer.'
              examples:
                missing_product_ids:
                  summary: product_ids missing
                  value:
                    error: 'Bad request: product_ids is required'
                    hint: null
                not_a_funnel_page:
                  summary: page is not part of a funnel
                  value:
                    error: 'Bad request: Cannot detach products from a page that isn''t part of a funnel.'
                    hint: null
                invalid_product:
                  summary: at least one id does not resolve to a workspace product
                  value:
                    error: 'Bad request: Product(s) not found: PrdXyz'
                    hint: null
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  hint:
                    type:
                    - string
                    - 'null'
                    description: 'The next step for the caller: how to authenticate, which scope was missing, or where the route list lives. Always present, and null when this error has no next step to offer.'
              example:
                error: API key missing or invalid
                hint: 'Send the token as `Authorization: Bearer <token>`. Create one under Account > Team > Platform Applications (a workspace API key), or obtain one with OAuth 2.1; both use the same scopes. See https://developers.myclickfunnels.com/docs/authentication, or append .md to that URL for markdown.'
        '404':
          description: 'Not Found — at least one product is not currently attached to the page''s step

            (no products are detached in this case), or the page is not accessible.

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  hint:
                    type:
                    - string
                    - 'null'
                    description: 'The next step for the caller: how to authenticate, which scope was missing, or where the route list lives. Always present, and null when this error has no next step to offer.'
              example:
                error: 'Not found: Product(s) not attached to this page: PrdXyz'
                hint: null
  /pages/{page_id}/stats:
    get:
      tags:
      - Page
      summary: Fetch Page Stats
      description: 'Retrieve statistics for a page, including views, opt-ins, sales, and earnings.

        Stats are computed from the page''s associated funnel step.


        `funnel` and `step` are `null` when the page is not part of a funnel

        (e.g. a standalone page or site page). This endpoint currently only reports

        analytics for pages reached via a funnel step; page-level analytics for standalone

        pages will be exposed in a future release.


        Defaults to a 30-day timerange ending now. Override with `timerange_start` and

        `timerange_end`. Timerange values are automatically clamped: future end dates

        are clamped to now, windows exceeding 90 days are clamped to 90 days, and if

        start is after end the window resets to 30 days ending at `timerange_end`.


        The metric names in the response are defined in Metric vocabulary in the Stats Skill.'
      operationId: getPageStats
      externalDocs:
        description: Stats Skill - page stats
        url: https://accounts.myclickfunnels.com/.well-known/stats/skill.md#page-stats
      parameters:
      - name: page_id
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/StatsTimerangeStart'
      - $ref: '#/components/parameters/StatsTimerangeEnd'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageStatsAttributes'
              example:
                currency: USD
                timerange:
                  from: '2026-03-03T00:00:00Z'
                  to: '2026-04-02T23:59:59Z'
                page:
                  id: 100
                  public_id: abc123
                  name: Order Page
                  current_path: /order-canonical
                  type: funnel_page
                funnel:
                  id: 3
                  public_id: xYzAbC
                  name: Sales Funnel
                step:
                  page_id: 100
                  name: Order Page
                  current_path: /order
                  views_all: 100
                  views_unique: 80
                  optins: 3
                  optin_rate: 0.0375
                  sales_count: 5
                  sales_rate: 0.0625
                  sales_value: '500.00'
                  recurring_sales_count: 2
                  recurring_sales_value: '100.00'
                  earnings_per_view: '5.00'
                  earnings_per_unique_view: '6.25'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  hint:
                    type:
                    - string
                    - 'null'
                    description: 'The next step for the caller: how to authenticate, which scope was missing, or where the route list lives. Always present, and null when this error has no next step to offer.'
              example:
                error: API key missing or invalid
                hint: 'Send the token as `Authorization: Bearer <token>`. Create one under Account > Team > Platform Applications (a workspace API key), or obtain one with OAuth 2.1; both use the same scopes. See https://developers.myclickfunnels.com/docs/authentication, or append .md to that URL for markdown.'
        '403':
          $ref: '#/components/responses/WorkspaceGrantForbidden'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  hint:
                    type:
                    - string
                    - 'null'
                    description: 'The next step for the caller: how to authenticate, which scope was missing, or where the route list lives. Always present, and null when this error has no next step to offer.'
              example:
                error: 'Not found: Record missing'
                hint: null
        '422':
          description: 'Unprocessable Entity — a timerange parameter is not a real date or time. Unparseable

            values and calendar dates that do not exist (2026-02-31) are refused rather than

            silently answered with a different window.

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  hint:
                    type:
                    - string
                    - 'null'
                    description: 'The next step for the caller: how to authenticate, which scope was missing, or where the route list lives. Always present, and null when this error has no next step to offer.'
              example:
                error: 'Request unprocessable: timerange_start ''2026-13-01'' is not a valid date or time. Use an ISO 8601 value, e.g. 2026-09-01T00:00:00Z.'
                hint: null
components:
  parameters:
    StatsTimerangeStart:
      name: timerange_start
      in: query
      description: Start of the stats timerange (ISO 8601 only; any other value is a 422. Send an offset's `+` as `%2B`, since an unencoded `+` arrives as a space). Defaults to 30 days before `timerange_end`. If the window between start and end exceeds 90 days, start is automatically clamped to 90 days before end. If start is after end, the window resets to the default 30 days ending at `timerange_end`. See [Timerange parameters (both endpoints)](https://accounts.myclickfunnels.com/.well-known/stats/skill.md#timerange-parameters-both-endpoints) in the [Stats Skill](https://accounts.myclickfunnels.com/.well-known/stats/skill.md) for the clamping rules and how to cover longer windows.
      required: false
      schema:
        type: string
        format: date-time
      example: '2026-01-01T00:00:00Z'
    per_page:
      name: per_page
      in: query
      required: false
      description: Records per page. Defaults to 20; raise it up to 100 for bulk reads. A larger value returns 100 records. Zero, a negative or a non-integer value is a 422. The `Link` next-page URL keeps the value, so a client following it keeps the page size. More [in our guides](https://developers.myclickfunnels.com/docs/pagination).
      schema:
        type: integer
        minimum: 1
        default: 20
    ExpandPageFields:
      name: expand[]
      in: query
      description: 'Expand additional data in the response. Use `expand[]=field_name` to include optional fields (e.g., `expand[]=head_code&expand[]=footer_code&expand[]=custom_css&expand[]=markup`). Markup is opt-in on every endpoint (show, list, create, update) because PML serialization runs per page. `custom_css` is available on internal pages only. See the [Expanding guide](https://developers.myclickfunnels.com/docs/expand) for available fields and examples. Read a page''s existing markup with `expand[]=markup` before editing it: see [Reading Current Markup](https://accounts.myclickfunnels.com/.well-known/pages/skill.md#reading-current-markup) in the [Pages Skill](https://accounts.myclickfunnels.com/.well-known/pages/skill.md).'
      required: false
      schema:
        type: array
        items:
          type: string
          enum:
          - head_code
          - footer_code
          - custom_css
          - markup
    StatsTimerangeEnd:
      name: timerange_end
      in: query
      description: End of the stats timerange (ISO 8601 only; any other value is a 422. Send an offset's `+` as `%2B`, since an unencoded `+` arrives as a space). Defaults to the current time. Values in the future are automatically clamped to now.
      required: false
      schema:
        type: string
        format: date-time
      example: '2026-01-31T23:59:59Z'
    id:
      name: id
      in: path
      required: true
      schema:
        type: string
    sort_order:
      name: sort_order
      in: query
      description: Sort order of a list response. Use 'desc' to reverse the default 'asc' (ascending) sort order. Examples [in our guides](https://developers.myclickfunnels.com/docs/pagination).
      required: false
      schema:
        type: string
        enum:
        - asc
        - desc
    sort_property:
      name: sort_property
      in: query
      description: 'Sort property of a list response. The default is id and thus the created_at order.

        If you sort by other properties, we additionally sort by id implicitly as a secondary sort property, so that you can rely on the sort order to be deterministic even if the main sort property ends up with the same values.

        '
      required: false
      schema:
        type: string
        enum:
        - id
        - updated_at
    after:
      name: after
      in: query
      required: false
      schema:
        type: string
      description: ID of item after which the collection should be returned. More examples and info about pagination [in our guides](https://developers.myclickfunnels.com/docs/pagination).
  responses:
    InvalidPageSize:
      description: Unprocessable Entity - `per_page` must be a positive integer.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
              hint:
                type:
                - string
                - 'null'
                description: Next step for the caller, or null when no additional guidance applies.
          example:
            error: 'Request unprocessable: per_page must be a positive integer, capped at 100 (got "0")'
            hint: null
    WorkspaceGrantForbidden:
      description: "Forbidden — this request's workspace is closed to it.\n\nThree cases return this:\n\n* The access token is limited to specific workspaces (see the workspace selection made when\n  the key was provisioned, or the workspaces approved on the OAuth consent screen) and the\n  request acts on a workspace outside that set.\n* The access token is limited to specific workspaces and the request's workspace could not be\n  determined at all. The gate is fail-closed, so a workspace-limited token is denied rather\n  than allowed through when the target workspace is ambiguous.\n* The workspace's team has no active ClickFunnels subscription: it was canceled, is paused,\n  or is locked out after failed payments. Reads and writes are both refused until the\n  subscription is reactivated, and the body carries `\"code\": \"subscription_inactive\"`.\n\nA token with no workspace restriction never receives the first two."
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
              code:
                type: string
                description: A machine-readable cause, when there is one. `subscription_inactive` means the workspace's team has no active ClickFunnels subscription.
                enum:
                - subscription_inactive
              hint:
                type:
                - string
                - 'null'
                description: 'The next step for the caller: how to authenticate, which scope was missing, or where the route list lives. Always present, and null when this error has no next step to offer.'
          examples:
            workspace_not_granted:
              summary: Token not granted this workspace
              value:
                error: 'Forbidden: This access token is limited to specific workspaces and was not granted access to this one.'
                hint: The token's workspace grant was chosen when it was provisioned (Platform Applications) or on the OAuth consent screen. Use GET /api/v2/teams/{team_id}/workspaces to list the workspaces this token can reach (GET /api/v2/teams lists the team ids).
            subscription_inactive:
              summary: Team subscription inactive
              value:
                error: 'Forbidden: This workspace''s team does not have an active ClickFunnels subscription, so API access to it is disabled until the subscription is reactivated.'
                hint: null
                code: subscription_inactive
  schemas:
    PageStatsAttributes:
      type: object
      title: Page Stats
      description: Statistics for a page, including views, opt-ins, sales, and earnings. Stats are computed from the page's associated funnel step. `funnel` and `step` are `null` when the page is not part of a funnel (e.g. a standalone page or site page). This endpoint currently only reports analytics for pages reached via a funnel step; page-level analytics for standalone pages will be exposed in a future release.
      properties:
        currency:
          type: string
          description: ISO 4217 currency code for all monetary values (e.g. USD, EUR)
        timerange:
          type: object
          description: The actual time range used for the stats (after any clamping)
          properties:
            from:
              type: string
              format: date-time
              description: Start of the timerange (ISO 8601)
            to:
              type: string
              format: date-time
              description: End of the timerange (ISO 8601)
        page:
          $ref: '#/components/schemas/PageSummary'
        funnel:
          description: The funnel associated with this page. Null if the page is not linked to a funnel.
          oneOf:
          - $ref: '#/components/schemas/FunnelSummary'
          - type: 'null'
        step:
          description: Per-step statistics for the funnel step this page belongs to. Null if the page is not linked to a funnel step.
          oneOf:
          - $ref: '#/components/schemas/FunnelStepStats'
          - type: 'null'
      example:
        currency: USD
        timerange:
          from: '2026-03-03T00:00:00Z'
          to: '2026-04-02T23:59:59Z'
        page:
          id: 100
          public_id: abc123
          name: Order Page
          current_path: /order-canonical
          type: funnel_page
        funnel:
          id: 3
          public_id: xYzAbC
          name: Sales Funnel
        step:
          page_id: 100
          name: Order Page
          current_path: /order
          views_all: 100
          views_unique: 80
          optins: 3
          optin_rate: 0.0375
          sales_count: 5
          sales_rate: 0.0625
          sales_value: '500.00'
          recurring_sales_count: 2
          recurring_sales_value: '100.00'
          earnings_per_view: '5.00'
          earnings_per_unique_view: '6.25'
    PageParametersUpdate:
      type: object
      title: Pages
      description: 'Update parameters for a page. Field availability depends on the page type:


        **Shared (all page types):** `name`, `description`, `sort_order`, `funnel.show_page_step_id`, `show_page_step.product_ids`, `show_page_step.bumps`.


        **Internal (editor) pages only** (returns 422 on external and custom HTML pages): `markup`, `theme_id`, `seo_title`, `seo_description`, `head_code`, `footer_code`, `custom_css`, `live_data_changes`.


        **Internal and custom HTML pages** (returns 422 on external pages): `seo_index`, `block_ai_crawler`, `block_ai_search`, `block_ai_assistant`. These act on the page''s URL rather than its content (the domain''s `sitemap.xml` and `robots.txt`), so they apply to a custom HTML page too. A custom HTML page''s own HTML sets its title and meta tags, which is why `seo_title` and `seo_description` are not accepted there.


        **External-only** (returns 422 on other page types): `external_url`.


        **Custom HTML pages only** (returns 422 on other page types): `custom_html`. Custom HTML pages also accept `current_path` (like internal pages) — it moves the funnel step''s path when the page is a funnel step, or the page''s own path when standalone.


        The three `block_ai_*` flags are accepted on any internal or custom HTML page. robots.txt expresses the block at every path ClickFunnels serves the page at on its domain: the page''s own URL, its funnel step paths, and `/` when it is the site''s home page. A page that is only served through another resource''s URL (a theme or template page other than the home page, a blog or course page) contributes no rules, so its preference is stored and read back but not enforced. A `200` is therefore not proof that a page is blocked; fetch the domain''s `/robots.txt` to confirm. See [Crawler access (AI opt-out)](https://accounts.myclickfunnels.com/.well-known/pages/skill.md#crawler-access-ai-opt-out) in the [Pages Skill](https://accounts.myclickfunnels.com/.well-known/pages/skill.md).

        '
      required: []
      properties:
        name:
          type: string
          description: Page name of the editable page element.
        description:
          type:
          - string
          - 'null'
          description: A short description of the page (max 1000 characters).
        sort_order:
          type: integer
          description: Reposition the page within its funnel. Zero-based. `0` moves it to the first position. The page must belong to exactly one funnel step; pages with zero or multiple funnel steps return 422. Out-of-bounds values return 422. Ignored when `funnel.show_page_step_id` is also provided — the swap target's position takes precedence.
        funnel:
          type: object
          description: Optional funnel mutation block. On update, only `show_page_step_id` is supported — swap the page onto an existing show page step.
          properties:
            show_page_step_id:
              type:
              - integer
              - string
              description: The ID of an existing show page step to attach this page to. The page previously linked to that step becomes an orphan (kept in the workspace, no longer linked to any step). Shared by both internal and external pages.
        current_path:
          type: string
          description: Move the page's URL path (e.g. `/my-page`). Internal and custom HTML pages — returns 422 on external pages. For a custom HTML page that is a funnel step, this moves the STEP's path (the customer-facing URL); when standalone, the page's own path. Returns 422 when the page backs more than one funnel step — the target would be ambiguous.
        custom_html:
          type: string
          minLength: 1
          description: Replace the entire HTML body of a custom HTML page (max 2MB). An empty or whitespace-only string is rejected with a 422 (omit the field to leave the body unchanged). The stored HTML is served verbatim at the page's URL; the edge cache is purged on write. Custom HTML pages only — returns 422 on other page types. Read the current HTML via `GET /pages/{id}/custom_html`.
        seo_title:
          type:
          - string
          - 'null'
          description: Custom title for search engine results. Internal pages only — returns 422 on external and custom HTML pages.
        seo_description:
          type:
          - string
          - 'null'
          description: Custom meta description for search engine results. Internal pages only — returns 422 on external and custom HTML pages.
        seo_index:
          type: boolean
          description: Whether search engines should index this page. An indexable funnel step page is listed in its domain's `sitemap.xml`. Internal and custom HTML pages — returns 422 on external pages.
        block_ai_crawler:
          type: boolean
          description: Block AI training crawlers (GPTBot, ClaudeBot, Google-Extended and others) from using this page's content to train models. Internal and custom HTML pages — returns 422 on external pages. See [Crawler access (AI opt-out)](https://accounts.myclickfunnels.com/.well-known/pages/skill.md#crawler-access-ai-opt-out) in the [Pages Skill](https://accounts.myclickfunnels.com/.well-known/pages/skill.md) for coverage limits.
        block_ai_search:
          type: boolean
          description: Block AI answer engines (OAI-SearchBot, PerplexityBot and others) from indexing this page and citing it in answers. Internal and custom HTML pages — returns 422 on external pages. See [Crawler access (AI opt-out)](https://accounts.myclickfunnels.com/.well-known/pages/skill.md#crawler-access-ai-opt-out) in the [Pages Skill](https://accounts.myclickfunnels.com/.well-known/pages/skill.md) for coverage limits.
        block_ai_assistant:
          type: boolean
          description: Block AI assistants (ChatGPT-User, Claude-User and others) from opening this page when a person asks them to. Internal and custom HTML pages — returns 422 on external pages. See [Crawler access (AI opt-out)](https://accounts.myclickfunnels.com/.well-known/pages/skill.md#crawler-access-ai-opt-out) in the [Pages Skill](https://accounts.myclickfunnels.com/.well-known/pages/skill.md) for coverage limits.
        head_code:
          type:
          - string
          - 'null'
          description: Custom code to inject into the page's <head> section. Internal pages only — returns 422 on external pages. Set to null to clear existing code.
        head_code_mode:
          type: string
          enum:
          - append
          - replace
          description: How to handle head_code. 'append' adds to existing code (default), 'replace' overwrites. Internal pages only.
        footer_code:
          type:
          - string
          - 'null'
          description: Custom code to inject before the closing </body> tag. Internal pages only — returns 422 on external pages. Set to null to clear existing code.
        footer_code_mode:
          type: string
          enum:
          - append
          - replace
          description: How to handle footer_code. 'append' adds to existing code (default), 'replace' overwrites. Internal pages only.
        custom_css:
          type:
          - string
          - 'null'
          description: Raw CSS to apply at the page level (no <style> wrapper). Maps to the CSS tab in the page editor's Code Editor panel. Internal pages only — returns 422 on external pages. Set to null to clear existing CSS.
        custom_css_mode:
          type: string
          enum:
          - append
          - replace
          description: How to handle custom_css. 'append' adds to existing CSS (default), 'replace' overwrites. Internal pages only.
        markup:
          type: string
          description: 'A valid PML (Page Markup Language) string that replaces live visual content; it is not a saved-draft promotion and does not promise deletion of an existing draft blob. PML covers only a subset of what the ClickFunnels page editor can build, so round-tripping an editor page through PML can silently drop content it cannot express. **If the page could have been created or edited in the ClickFunnels editor, stop and get explicit approval from the user before sending this** (a general instruction to update or publish the page does not count): see [the approval guardrail](https://accounts.myclickfunnels.com/.well-known/page-markup/skill.md#stop-get-approval-before-overwriting-an-existing-page). Internal pages only — returns 422 on external pages. Markup that stops mid-construct (a tag, attribute value, comment or `<customhtml>` body that never closes, or elements still open at the end of the document) is rejected with a 400 and the page is left untouched — re-send the complete document rather than the missing tail. To add a tracking pixel or other custom code, use `head_code`/`footer_code` instead of rewriting the body; see [Add a tracking pixel or custom code](https://accounts.myclickfunnels.com/.well-known/pages/skill.md#add-a-tracking-pixel-or-custom-code). See the [Page Markup Skill](https://accounts.myclickfunnels.com/.well-known/page-markup/skill.md) for the full DSL reference. The parser errors are listed under [Common Validation Errors](https://accounts.myclickfunnels.com/.well-known/page-markup/skill.md#common-validation-errors).'
        external_url:
          type: string
          description: Update the external URL for an SDK page. External pages only — returns 422 on internal pages. The SDK token is preserved across URL updates. To move external pages to a new origin, see the [Migrate an External Page Domain Skill](https://accounts.myclickfunnels.com/.well-known/sdk/migrate-external-page-domain/skill.md#4-patch-one-page-at-a-time).
        show_page_step:
          type: object
          description: 'Optional. Mutates the show_page_step that this page is attached to. Only valid when the page is part of a funnel — passing `show_page_step.product_ids` or `show_page_step.bumps` for a page that isn''t linked to a funnel returns 400. Shared by both internal and external pages.

            '
          properties:
            product_ids:
              type: array
              items:
                type: string
              description: 'List of product public IDs to append to the step''s checkout as regular (main) products. This is **additive** — products listed are appended; products already attached are skipped; no products are ever removed via this field, and an existing order bump is never demoted back to a main product by it. All-or-nothing — if any ID does not resolve to a workspace product, no changes are saved and a 400 is returned. To remove products, use `DELETE /api/v2/pages/:id/products`. See [Manage products on a checkout page](https://accounts.myclickfunnels.com/.well-known/pages/skill.md#manage-products-on-a-checkout-page) in the [Pages Skill](https://accounts.myclickfunnels.com/.well-known/pages/skill.md).

                '
            bumps:
              type: array
              description: 'Products to attach to the step as **order bumps** — the optional add-ons offered next to the main products, served to `<checkout/>` and to the SDK as `bumpProducts`. One object per bump, each carrying its own copy. Same additive, all-or-nothing semantics as `product_ids`. A product already attached to the step as a main product is promoted to a bump in place (it keeps its position and its configured variants/prices), which is how you turn an existing attachment into a bump. A product named in both `product_ids` and `bumps` in the same request is a 400 — a product is either a main product or a bump on a given step, never both. To turn a bump back into a main product, detach it with `DELETE /api/v2/pages/:id/products` and re-attach it via `product_ids`.

                '
              items:
                type: object
                required:
                - product_id
                properties:
                  product_id:
                    type: string
                    description: Public ID of the product to attach as an order bump. Required on every entry; an entry without one is a 400.
                  preheadline:
                    type: string
                    description: 'Optional short line of copy shown above this bump''s offer (for example "One-time offer"). Sending it for a product that is already a bump replaces that bump''s copy, so this is also how you edit it; omit it to leave the current copy alone. Read it back under `show_page_step.products[].bump_preheadline`.

                      '
      example:
        page:
          name: Example Page
          description: Updated page description
          seo_title: Updated SEO Title
          seo_description: Updated meta description
          seo_index: true
          block_ai_crawler: true
          block_ai_search: true
          block_ai_assistant: false
          head_code: <script>console.log('updated');</script>
          head_code_mode: append
          markup: "<section>\n  <row cols=\"1\">\n    <column>\n      <headline>Welcome to our page</headline>\n      <subheadline>Start your journey here</subheadline>\n    </column>\n  </row>\n</section>\n"
          show_page_step:
            product_ids:
            - PrdXyz
            bumps:
            - product_id: PrdBmp
              preheadline: One-time offer
    PageParameters:
      type: object
      title: Pages
      description: Pages
      required:
      - name
      properties:
        name:
          type: string
          description: Page name of the editable page element.
        current_path:
          type: string
          description: The URL path for the page. If left blank, a randomized path will be generated. When attaching to a funnel, this value becomes the ShowPageStep path (the user-facing URL), and the page's own current_path will be set to a randomized value with a suffix, since the ShowPageStep path is the source of truth for funnel pages. See [Setting a page's path (`current_path`)](https://accounts.myclickfunnels.com/.well-known/pages/skill.md#setting-a-pages-path-current_path) in the [Pages Skill](https://accounts.myclickfunnels.com/.well-known/pages/skill.md) for the path rules.
        theme_id:
          type: integer
          description: The ID of the theme to use for this page.
        description:
          type:
          - string
          - 'null'
          description: A short description of the page (max 1000 characters).
        seo_title:
          type:
          - string
          - 'null'
          description: Custom title for search engine results.
        seo_description:
          type:
          - string
          - 'null'
          description: Custom meta description for search engine results.
        seo_index:
          type: boolean
          description: Whether search engines should index this page. Defaults to false.
        block_ai_crawler:
          type: boolean
          description: Block AI training crawlers (GPTBot, ClaudeBot, Google-Extended and others) from using this page's content to train models. Defaults to false. Enforced via robots.txt — see [Crawler access (AI opt-out)](https://accounts.myclickfunnels.com/.well-known/pages/skill.md#crawler-access-ai-opt-out) in the [Pages Skill](https://accounts.myclickfunnels.com/.well-known/pages/skill.md) for coverage limits.
        block_ai_search:
          type: boolean
          description: Block AI answer engines (OAI-SearchBot, PerplexityBot and others) from indexing this page and citing it in answers. Defaults to false. See [Crawler access (AI opt-out)](https://accounts.myclickfunnels.com/.well-known/pages/skill.md#crawler-access-ai-opt-out) in the [Pages Skill](https://accounts.myclickfunnels.com/.well-known/pages/skill.md) for coverage limits.
        block_ai_assistant:
          type: boolean
          description: Block AI assistants (ChatGPT-User, Claude-User and others) from opening this page when a person asks them to. Defaults to false. See [Crawler access (AI opt-out)](https://accounts.myclickfunnels.com/.well-known/pages/skill.md#crawler-access-ai-opt-out) in the [Pages Skill](https://accounts.myclickfunnels.com/.well-known/pages/skill.md) for coverage limits.
        sort_order:
          type: integer
          description: Optional zero-based position within the funnel when creating with `funnel.funnel_id`. `0` inserts before the first step; omit to append at the end. Ignored when `funnel.show_page_step_id` is provided. Out-of-bounds values return 422.
        funnel:
          type: object
          description: Optional funnel association. Use either funnel_id (to create a new step) or show_page_step_id (to attach to existing step). If both are provided, show_page_step_id takes precedence and funnel_id is ignored.
          properties:
            funnel_id:
              type: string
              description: The public ID of the funnel to attach this page to. A new show page step will be created as the last step of the funnel, unless `after_show_page_step_id` is provided.
            after_show_page_step_id:
              type:
              - integer
              - string
              - 'null'
              description: 'Controls where the new step is inserted within the funnel (only relevant when `funnel_id` is provided). Accepts either:

                - A ShowPageStep `id` (the function id, as exposed under `show_page_step.id` in page responses) — inserts the new step immediately after the referenced show page step.

                - The workflow root step''s id (integer) — inserts the new step at the beginning of the funnel.

                If omitted or null, the page is appended after the currently last step of the funnel. Returns 400 if the id does not resolve to a valid step in the funnel.

                '
            show_page_step_id:
              type: string
              description: The ID of an existing show page step to attach this page to. Takes precedence over funnel_id if both are provided.
        show_page_step:
          type: object
          description: 'Optional. Mutates the show_page_step that the page is attached to via the `funnel` block above. Only valid when the page is also being linked to a funnel via the `funnel` block — passing `show_page_step.product_ids` or `show_page_step.bumps` without a funnel link returns 400.

            '
          properties:
            product_ids:
              type: array
              items:
                type: string
              description: 'List of product public IDs to append to the step''s checkout as regular (main) products. This is **additive** — products are appended to any products already on the step (relevant when `funnel.show_page_step_id` is used to attach to an existing step); products already attached are skipped. All-or-nothing — if any ID does not resolve to a workspace product, the page is not created and a 400 is returned. To remove products, use `DELETE /api/v2/pages/:id/products`. See [Manage products on a checkout page](https://accounts.myclickfunnels.com/.well-known/pages/skill.md#manage-products-on-a-checkout-page) in the [Pages Skill](https://accounts.myclickfunnels.com/.well-known/pages/skill.md).

                '
            bumps:
              type: array
              description: 'Products to attach to the step as **order bumps** — the optional add-ons offered next to the main products, served to `<checkout/>` and to the SDK as `bumpProducts`. One object per bump, each carrying its own copy. Same additive, all-or-nothing semantics as `product_ids`. A product already attached to the step as a main product is promoted to a bump in place (it keeps its position and its configured variants/prices). A product named in both `product_ids` and `bumps` in the same request is a 400 — a product is either a main product or a bump on a given step, never both. To turn a bump back into a main product, detach it with `DELETE /api/v2/pages/:id/products` and re-attach it via `product_ids`.

                '
              items:
                type: object
                required:
                - product_id
                properties:
                  product_id:
                    type: string
                    description: Public ID of the product to attach as an order bump. Required on every entry; an entry without one is a 400.
                  preheadline:
                    type: string
                    description: 'Optional short line of copy shown above this bump''s offer (for example "One-time offer"). Omit to leave any copy already set on the bump alone. Read it back under `show_page_step.products[].bump_preheadline`.

                      '
        head_code:
          type:
          - string
          - 'null'
          description: Custom code to inject into the page's <head> section. Content should be wrapped in appropriate HTML tags such as <script>, <link>, <meta>, or <style>. Set to null to clear existing code.
        head_code_mode:
          type: string
          enum:
          - append
          - replace
          description: How to handle head_code. 'append' adds to existing code (default), 'replace' overwrites.
        footer_code:
          type:
          - string
          - 'null'
          description: Custom code to inject before the closing </body> tag. JavaScript should be wrapped in <script> tags. Set to null to clear existing code.
        footer_code_mode:
          type: string
          enum:
          - append
          - replace
          description: How to handle footer_code. 'append' adds to existing code (default), 'replace' overwrites.
        custom_css:
          type:
          - string
          - 'null'
          description: Raw CSS to apply at the page level (no <style> wrapper). Maps to the CSS tab in the page editor's Code Editor panel. Internal pages only. Set to null to clear existing CSS.
        custom_css_mode:
          type: string
          enum:
          - append
          - replace
          description: How to handle custom_css. 'append' adds to existing CSS (default), 'replace' overwrites.
        markup:
          type: string
          description: A valid PML (Page Markup Language) string that replaces the page's visual tree. Page metadata (name, path, SEO settings) is preserved. Markup that stops mid-construct (a tag, attribute value, comment or `<customhtml>` body that never closes, or elements still open at the end of the document) is rejected with a 400 and the page is not created — re-send the complete document rather than the missing tail. See the [Page Markup Skill](https://accounts.myclickfunnels.com/.well-known/page-markup/skill.md) for the full DSL reference. The parser errors are listed under [Common Validation Errors](https://accounts.myclickfunnels.com/.well-known/page-markup/skill.md#common-validation-errors).
      example:
        page:
          name: My New Page
          current_path: /my-new-page
          theme_id: 12345
          description: A landing page for our new product launch
          seo_title: New Product Launch - My Brand
          seo_description: Discover our latest product offering
          seo_index: true
          block_ai_crawler: true
          block_ai_search: false
          block_ai_assistant: false
          funnel:
            funnel_id: xyz789
          show_page_step:
            product_ids:
            - PrdAbc
            bumps:
            - product_id: PrdBmp
              preheadline: One-time offer
          head_code: <script>console.log('hello');</script>
          head_code_mode: append
          markup: "<section>\n  <row cols=\"1\">\n    <column>\n      <headline>Welcome to our page</headline>\n      <subheadline>Start your journey here</subheadline>\n    </column>\n  </row>\n</section>\n"
    FunnelStepStats:
      type: object
      title: Funnel Step Stats
      description: Per-step statistics for a funnel step. Used in the `steps` array of the Funnel Stats response and as the `step` object in the Page Stats response.
      properties:
        page_id:
          type:
          - integer
          - 'null'
          description: The id of the page this step renders (when the step is a show-page step). `null` for non-page steps.
        name:
          type: string
          description: The step name
        current_path:
          type: string
          description: 'The workflow-level routing segment for this step (from the `Workflows::Step#current_path` attribute). Note: this is the workflow step path, not the page''s own `current_path` which is the page-level canonical path.'
        views_all:
          type: integer
          description: Total pageviews for this step
        views_unique:
          type: integer
          description: Unique pageviews for this step
        optins:
          type: integer
          description: Number of opt-ins on this step
        optin_rate:
          type: number
          format: float
          description: Opt-in rate (optins / unique views)
        sales_count:
          type: integer
          description: Number of sales on this step
        sales_rate:
          type: number
          format: float
          description: Sales conversion rate (sales / unique views)
        sales_value:
          type: string
          description: Total sales value as a decimal string (see top-level currency field)
        recurring_sales_count:
          type: integer
          description: Number of recurring sales
        recurring_sales_value:
          type: string
          description: Total recurring sales value as a decimal string (see top-level currency field)
        earnings_per_view:
          type: string
          description: Earnings per view as a decimal string (see top-level currency field)
        earnings_per_unique_view:
          type: string
          description: Earnings per unique view as a decimal string (see top-level currency field)
      example:
        page_id: 100
        name: Sign Up Page
        current_path: /
        views_all: 17
        views_unique: 17
        optins: 0
        optin_rate: 0.0
        sales_count: 0
        sales_rate: 0.0
        sales_value: '0.00'
        recurring_sales_count: 0
        recurring_sales_value: '0.00'
        earnings_per_view: '0.00'
        earnings_per_unique_view: '0.00'
    PageSummary:
      type: object
      title: Page Summary
      description: Lightweight page identifier used inside the Page Stats response.
      properties:
        id:
          type: integer
          description: The page ID
        public_id:
          type: string
          description: The public identifier of the page
        name:
          type: string
          description: The page name
        current_path:
          type: string
          description: The canonical page-level path for this page
        type:
          type: string
          description: The page type (e.g. `landing_page`, `site_page`, `funnel_page`, `theme_page`)
      example:
        id: 100
        public_id: abc123
        name: Order Page
        current_path: /order-canonical
        type: funnel_page
    FunnelSummary:
      type: object
      title: Funnel Summary
      description: Lightweight funnel identifier used inside stats responses.
      properties:
        id:
          type: integer
          description: The funnel ID
        public_id:
          type: string
          description: The public identifier of the funnel
        name:
          type: string
          description: The name of the funnel
      example:
        id: 1
        public_id: gESyMv
        name: My Sales Funnel
    PageAttributes:
      type: object
      title: Pages
      description: Pages
      properties:
        id:
          type: integer
          description: Page ID
        public_id:
          type: string
          description: The public identifier of the page
        workspace_id:
          type: integer
          description: Workspace ID that the page belongs to.
        name:
          type: string
          description: Page name of the editable page element. Want to filter by it? See our <i><u><a href="https://developers.myclickfunnels.com/docs/filtering-by-page" target="_blank">help guide on that topic</a><u><i>.
        description:
          type:
          - string
          - 'null'
          description: A short description of the page (max 1000 characters).
        theme_id:
          type:
          - integer
          - 'null'
          description: Theme
        created_at:
          type: string
          format: date-time
          description: Created at
        seo_title:
          type:
          - string
          - 'null'
          description: Custom title for search engine results. Falls back to the site's SEO title if not set.
        seo_description:
          type:
          - string
          - 'null'
          description: Custom meta description for search engine results. Falls back to the site's SEO description if not set.
        seo_index:
          type: boolean
          description: Whether search engines should index this page. Defaults to false.
        block_ai_crawler:
          type: boolean
          description: Whether AI training crawlers (GPTBot, ClaudeBot, Google-Extended, Applebot-Extended, CCBot and others) are blocked from using this page's content to train models. Defaults to false. Enforced by a `Disallow` rule in the domain's robots.txt — see [Crawler access (AI opt-out)](https://accounts.myclickfunnels.com/.well-known/pages/skill.md#crawler-access-ai-opt-out) in the [Pages Skill](https://accounts.myclickfunnels.com/.well-known/pages/skill.md) for coverage limits. Independent of `seo_index` and of the other two AI flags.
        block_ai_search:
          type: boolean
          description: Whether AI answer engines (OAI-SearchBot, Claude-SearchBot, PerplexityBot and others) are blocked from indexing this page and citing it when people ask questions. Defaults to false. Enforced via robots.txt. See [Crawler access (AI opt-out)](https://accounts.myclickfunnels.com/.well-known/pages/skill.md#crawler-access-ai-opt-out) in the [Pages Skill](https://accounts.myclickfunnels.com/.well-known/pages/skill.md) for coverage limits.
        block_ai_assistant:
          type: boolean
          description: Whether AI assistants (ChatGPT-User, Claude-User, Perplexity-User and others) are blocked from opening this page when a person asks them to — for example pasting the page's link into a chat. Defaults to false. Enforced via robots.txt. See [Crawler access (AI opt-out)](https://accounts.myclickfunnels.com/.well-known/pages/skill.md#crawler-access-ai-opt-out) in the [Pages Skill](https://accounts.myclickfunnels.com/.well-known/pages/skill.md) for coverage limits.
        updated_at:
          type: string
          format: date-time
          description: Updated at
        type:
          type:
          - string
          - 'null'
          enum:
          - landing_page
          - site_page
          - funnel_page
          - theme_page
          - null
          description: The type of page. Can be one of `landing_page`, `site_page`, `funnel_page` or `theme_page`. May be `null` for a page that matches none of these categories.
        custom_html_page:
          type: boolean
          description: Whether this is a ClickFunnels-hosted custom HTML page — a page whose entire body is author-supplied HTML served verbatim (no page editor, no PML). Read the HTML via `GET /pages/{id}/custom_html` and replace it by sending the write-only `custom_html` string on `PATCH /pages/{id}`. Create these via `POST /workspaces/{workspace_id}/pages/custom_html`. (Deliberately named differently from the `custom_html` request field so echoing a GET payload back into PATCH never collides.)
        current_path:
          type:
          - string
          - 'null'
          description: The current URL path for the page resource. This is the canonical URL for landing and site pages. `null` for externally-hosted (SDK) pages. **For funnel pages this is NOT the customer-facing URL** — that's `url` (or `show_page_step.current_path` for the path component). The page-level current_path on a funnel page does not route the visitor through the workflow step, so a `<checkout/>` element on it will not see the step's attached products. See [Setting a page's path (`current_path`)](https://accounts.myclickfunnels.com/.well-known/pages/skill.md#setting-a-pages-path-current_path) in the [Pages Skill](https://accounts.myclickfunnels.com/.well-known/pages/skill.md).
        url:
          type:
          - string
          - 'null'
          description: The customer-facing URL for the page on the live site. For funnel pages this routes through the workflow step (which feeds `<checkout/>` its IncludedProducts). Always prefer this over `current_path` when constructing links.
        show_page_step:
          type:
          - object
          - 'null'
          description: The show page step (the workflow step's _function_) associated with this page. The `products` array is the live list of products attached to this step's checkout — main products and order bumps alike, each flagged by its own `bump` field; it is mutated via `show_page_step.product_ids` / `show_page_step.bumps` on page create/update (additive) and `DELETE /api/v2/pages/:id/products` (removal).
          properties:
            id:
              type: integer
              description: The ID of the show page step (function). Pass this as `show_page_step_id` when positioning split-test or conditional-split steps via `/api/v2/funnels/:id/split_test_steps` and `/api/v2/funnels/:id/conditional_split_steps`.
            public_id:
              type: string
              description: The public identifier of the show page step (function). May be passed as `show_page_step_id` alongside other `public_id` references in your code.
            name:
              type: string
              description: The name of the step in the funnel. This is the page name that is visible in the funnel builder for a show page step.
            current_path:
              type:
              - string
              - 'null'
              description: The current URL path for the step in the funnel. This is the path component of the live, customer-facing URL for funnel pages. `null` for externally-hosted (SDK) pages.
            sort_order:
              type: integer
              description: The zero-based position of this step within the funnel. The first step is 0, the second is 1, and so on. Returned in every page response; pass `sort_order` on create/update to control positioning.
            products:
              type: array
              description: Products currently attached to this step's checkout, main products and order bumps together in display order. Mutated via `show_page_step.product_ids` (main) and `show_page_step.bumps` (bumps) on page create/update (additive) and `DELETE /api/v2/pages/:id/products` (removal, either kind).
              items:
                type: object
                properties:
                  id:
                    type: integer
                    description: Product ID
                  public_id:
                    type: string
                    description: Product public ID
                  name:
                    type: string
                    description: Product name
                  bump:
                    type: boolean
                    description: Whether this product is attached as an **order bump** (an optional add-on offered next to the main products) rather than a main product. `true` for products served to `<checkout/>` and to the SDK as `bumpProducts`. Set via `show_page_step.bumps` on page create/update.
                  bump_preheadline:
                    type:
                    - string
                    - 'null'
                    description: The short line of copy shown above this order bump's offer, when one was set via that bump's `preheadline` in `show_page_step.bumps`. Always `null` for products that are not bumps.
        funnel:
          type:
          - object
          - 'null'
          description: The funnel associated with this page (if the page is part of a funnel)
          properties:
            id:
              type: integer
              description: The unique identifier of the funnel
            public_id:
              type: string
              description: The public identifier of the funnel
            name:
              type: string
              description: The name of the funnel
        sdk:
          type:
          - object
          - 'null'
          description: Present for SDK-enabled pages — externally-hosted (SDK) pages and ClickFunnels-hosted custom HTML pages; `null` for other pages. Contains the SDK integration token, plus the external URL for externally-hosted pages.
          properties:
            token:
              type: string
              description: The SDK page token (prefixed `cfp_`). Embed this in the page via a `<meta name="cf-page-token" content="<token>">` tag and include the SDK script tag to register the page with ClickFunnels. See [The entire public surface](https://accounts.myclickfunnels.com/.well-known/sdk/create-external-page/skill.md#the-entire-public-surface) in the [Create an External Page Skill](https://accounts.myclickfunnels.com/.well-known/sdk/create-external-page/skill.md) for the exact tags to paste.
            external_url:
              type: string
              description: The fully-qualified URL of the externally-hosted page. Only present for externally-hosted pages (absent for custom HTML pages, which live on the funnel's own domain).
        head_code:
          type:
          - string
          - 'null'
          description: '**Expandable** Custom HTML/JavaScript code injected into the page head section. Only returned when expand[]=head_code is provided. Note: expanding may add latency, especially on list endpoints. Use sparingly.'
        footer_code:
          type:
          - string
          - 'null'
          description: '**Expandable** Custom HTML/JavaScript code injected before the closing body tag. Only returned when expand[]=footer_code is provided. Note: expanding may add latency, especially on list endpoints. Use sparingly.'
        custom_css:
          type:
          - string
          - 'null'
          description: '**Expandable** Raw CSS applied at the page level (no <style> wrapper). Maps to the CSS tab in the page editor''s Code Editor panel. Internal pages only. Only returned when expand[]=custom_css is provided. Note: expanding may add latency, especially on list endpoints. Use sparingly.'
        markup:
          type: string
          description: '**Expandable** The PML (Page Markup Language) representation of the page''s visual tree. Only returned when expand[]=markup is provided. Note: expanding may add latency, especially on list endpoints. This serialization is lossy: elements PML has no equivalent for are omitted with no error and no placeholder, so a round-tripped read is not a safe basis for rewriting a page (see [the approval guardrail](https://accounts.myclickfunnels.com/.well-known/page-markup/skill.md#stop-get-approval-before-overwriting-an-existing-page)). An empty string therefore does not prove the page is empty: a page built entirely from elements PML cannot express also reads back empty. The value `<!-- markup unavailable: page tree could not be serialized -->` means the read failed; treat the page as unreadable and do not write that string back. See the [Page Markup Skill](https://accounts.myclickfunnels.com/.well-known/page-markup/skill.md) for the full DSL reference.'
      example:
        id: 9
        public_id: kJzvQi
        workspace_id: 42000
        name: Great Page
        description: A high-converting sales page
        theme_id: null
        seo_title: Great Page - My Brand
        seo_description: Learn more about our amazing offer
        seo_index: true
        block_ai_crawler: false
        block_ai_search: false
        block_ai_assistant: false
        created_at: '2025-01-01T00:00:00.000Z'
        updated_at: '2025-01-01T00:00:00.000Z'
        type: funnel_page
        custom_html_page: false
        current_path: /my-page-canonical
        url: https://myteam.myclickfunnels.com/my-funnel-page
        show_page_step:
          id: 42
          public_id: aBcDeF
          name: Best Page Step
          current_path: /my-funnel-page
          sort_order: 0
          products: []
        funnel:
          id: 123
          public_id: xYzAbC
          name: My Sales Funnel
        sdk: null
        markup: "<section>\n  <row cols=\"1\">\n    <column>\n      <headline>Great Page</headline>\n      <subheadline>Start your journey here</subheadline>\n    </column>\n  </row>\n</section>\n"
  headers:
    Link:
      description: A direct link to the next page for the cursor-based pagination. It includes the `after` and the Pagination-Next ID value.
      schema:
        type: string
    PaginationNext:
      description: ID of the last item in the current response after which more records exist. You can use it in an `after` query parameter for cursor-based pagination to get to the next page.
      schema:
        type: string
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: 'A workspace API key or an OAuth access token, sent as `Authorization: Bearer <token>`.


        Both carry the same scope vocabulary as the `OAuth2` scheme below. Category-only

        scopes restrict access to the categories they name. Coarse wildcards remain additive:

        `read contacts:read` reads every category, while `write contacts:read` can write every

        category. Omit coarse scopes when restricting access to specific categories.

        Legacy tokens with only coarse scopes retain their existing unrestricted access;

        a bare `read` scope alone does not enforce read-only access.

        '
    OAuth2:
      type: oauth2
      description: 'OAuth 2.0 authorization code flow for REST integrations. Create a Platform Application

        and follow `https://developers.myclickfunnels.com/docs/oauth-20` to connect users.

        Authorization server metadata is published at

        `https://accounts.myclickfunnels.com/.well-known/oauth-authorization-server`.

        Dynamic client registration at `/oauth/register` is for MCP clients only; MCP-scoped

        tokens must use `https://agents.myclickfunnels.com/mcp`, not the REST API.


        Scopes are least-privilege by category. Ask for the two coarse wildcards (`read`,

        `write`) only when an integration genuinely needs the whole workspace; otherwise ask

        for the `<category>:read` / `<category>:write` pairs you use. `write` implies `read`

        for the same category. Protected resource metadata (RFC 9728) for this API lives at

        `https://accounts.myclickfunnels.com/.well-known/oauth-protected-resource`.

        '
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.myclickfunnels.com/oauth/authorize
          tokenUrl: https://accounts.myclickfunnels.com/oauth/token
          refreshUrl: https://accounts.myclickfunnels.com/oauth/token
          scopes:
            read: Read any resource in the granted workspaces
            write: Read and write any resource in the granted workspaces
            contacts:read: Read Contacts
