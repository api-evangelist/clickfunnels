  /courses/{id}/publish:
    post:
      tags:
      - Course
      summary: Publish Course
      description: 'Makes the course live by setting `published_at`. Pass an optional future `published_at` to schedule the publish; omit it (or leave it blank) to publish immediately. A `published_at` in the past is rejected.

        By default this publishes only the course record. To publish a brand-new course in one step, pass `publish_sections_and_lessons: true`. Before the `200 OK` response, the requested publish timestamp is set on the course, every eligible unpublished non-root section, and all unpublished or scheduled lessons underneath it. Drip and blocked section gates remain in effect. Section publish actions may still perform follow-up work asynchronously, and each records how many lessons it published in `published_lessons_count`. Otherwise sections and lessons stay draft until published via the `Courses::Sections::PublishAction` resource.

        Returns 422 if `published_at` is supplied but is not a valid ISO 8601 datetime, or if it is in the past.

        See Publishing in the Courses Skill for the publish paths.'
      operationId: publishCourse
      parameters:
      - $ref: '#/components/parameters/id'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                published_at:
                  type: string
                  format: date-time
                  description: Optional ISO 8601 datetime at which the course should become live. Must be now or in the future — a past datetime is rejected with a 422. Omit or leave blank to publish immediately.
                publish_sections_and_lessons:
                  type: boolean
                  description: When `true`, sets the requested publish timestamp on the course, every eligible unpublished non-root section, and all unpublished or scheduled lessons before returning the response. Drip and blocked section gates remain in effect. Section publish actions may continue follow-up processing asynchronously. Use this for a one-step publish of a new course. Defaults to `false`.
            example:
              published_at: '2026-09-01T09:00:00.000Z'
              publish_sections_and_lessons: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseAttributes'
              example:
                id: 9
                public_id: gVWRTP
                title: Example Course
                published_at: '2026-09-01T09:00:00.000Z'
                root_section_id: null
                description: A practical and engaging course designed to build core skills in Marketing.
                current_path: null
                sharing_fingerprint: null
                show_in_community: false
                show_to_non_members: false
                upgrade_url: null
                redirect_to_full_course: true
                unauthorized_redirect_url: null
                comments_enabled: false
                created_at: '2025-01-01T00:00:00.000Z'
                updated_at: '2026-09-01T09:00:00.000Z'
                image_url: https://example.myclickfunnels.com/uploads/image/1/file/9c8d1e7d480dc9882c519d4b4528826f.png
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  hint:
                    type:
                    - string
                    - 'null'
                    description: 'The next step for the caller: how to authenticate, which scope was missing, or where the route list lives. Always present, and null when this error has no next step to offer.'
              example:
                error: API key missing or invalid
                hint: 'Send the token as `Authorization: Bearer <token>`. Create one under Account > Team > Platform Applications (a workspace API key), or obtain one with OAuth 2.1; both use the same scopes. See https://developers.myclickfunnels.com/docs/authentication, or append .md to that URL for markdown.'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  hint:
                    type:
                    - string
                    - 'null'
                    description: 'The next step for the caller: how to authenticate, which scope was missing, or where the route list lives. Always present, and null when this error has no next step to offer.'
              example:
                error: 'Not found: Record missing'
                hint: null
        '422':
          description: Unprocessable Entity — `published_at` is not a valid datetime
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  hint:
                    type:
                    - string
                    - 'null'
                    description: 'The next step for the caller: how to authenticate, which scope was missing, or where the route list lives. Always present, and null when this error has no next step to offer.'
              example:
                error: published_at is not a valid datetime
                hint: null
components:
  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: string
    per_page:
      name: per_page
      in: query
      required: false
      description: Records per page. Defaults to 20; raise it up to 100 for bulk reads. A larger value returns 100 records. Zero, a negative or a non-integer value is a 422. The `Link` next-page URL keeps the value, so a client following it keeps the page size. More [in our guides](https://developers.myclickfunnels.com/docs/pagination).
      schema:
        type: integer
        minimum: 1
        default: 20
    sort_property:
      name: sort_property
      in: query
      description: 'Sort property of a list response. The default is id and thus the created_at order.

        If you sort by other properties, we additionally sort by id implicitly as a secondary sort property, so that you can rely on the sort order to be deterministic even if the main sort property ends up with the same values.

        '
      required: false
      schema:
        type: string
        enum:
        - id
        - updated_at
    sort_order:
      name: sort_order
      in: query
      description: Sort order of a list response. Use 'desc' to reverse the default 'asc' (ascending) sort order. Examples [in our guides](https://developers.myclickfunnels.com/docs/pagination).
      required: false
      schema:
        type: string
        enum:
        - asc
        - desc
    after:
      name: after
      in: query
      required: false
      schema:
        type: string
      description: ID of item after which the collection should be returned. More examples and info about pagination [in our guides](https://developers.myclickfunnels.com/docs/pagination).
  responses:
    InvalidPageSize:
      description: Unprocessable Entity - `per_page` must be a positive integer.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
              hint:
                type:
                - string
                - 'null'
                description: Next step for the caller, or null when no additional guidance applies.
          example:
            error: 'Request unprocessable: per_page must be a positive integer, capped at 100 (got "0")'
            hint: null
  schemas:
    CourseParameters:
      type: object
      title: Courses
      description: Courses
      required:
      - title
      properties:
        title:
          type: string
          description: Title
        description:
          type: string
          description: Description
        show_in_community:
          type:
          - boolean
          - 'null'
          description: Show In Customer Center?
        redirect_to_full_course:
          type:
          - boolean
          - 'null'
          description: Redirect To Full Course
        image_id:
          type:
          - integer
          - 'null'
          description: The ID of an Image to show on the storefront of the main course page
      example:
        course:
          title: Getting Started
    CourseAttributes:
      type: object
      title: Courses
      description: Courses
      properties:
        id:
          type: integer
          description: Course ID
        public_id:
          type:
          - string
          - 'null'
          description: Course public ID
        title:
          type: string
          description: Title
        published_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Available at
        root_section_id:
          type:
          - string
          - 'null'
          description: Root section. Auto-created with the course and the implicit parent of every top-level module. See [How a course is structured](https://accounts.myclickfunnels.com/.well-known/courses/skill.md#how-a-course-is-structured) in the [Courses Skill](https://accounts.myclickfunnels.com/.well-known/courses/skill.md).
        description:
          type: string
          description: Description
        current_path:
          type:
          - string
          - 'null'
          description: Course Path URL
        sharing_fingerprint:
          type:
          - string
          - 'null'
          description: Sharing Fingerprint
        show_in_community:
          type:
          - boolean
          - 'null'
          description: Show In Customer Center?
        show_to_non_members:
          type:
          - boolean
          - 'null'
          description: Show To Non Members
        upgrade_url:
          type:
          - string
          - 'null'
          description: Upgrade URL
        redirect_to_full_course:
          type:
          - boolean
          - 'null'
          description: Redirect To Full Course
        unauthorized_redirect_url:
          type:
          - string
          - 'null'
          description: Unauthorized Redirect
        comments_enabled:
          type:
          - boolean
          - 'null'
          description: Enable Lesson Comments?
        created_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Created at
        updated_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Updated at
        image_url:
          type:
          - string
          - 'null'
          description: The URL of the image that is shown on the storefront of the main course page
      example:
        id: 1
        public_id: iawbIp
        title: Example Course
        published_at: '2025-01-01T00:00:00.000Z'
        root_section_id: null
        description: A practical and engaging course designed to build core skills in Marketing.
        current_path: null
        sharing_fingerprint: null
        show_in_community: false
        show_to_non_members: false
        upgrade_url: null
        redirect_to_full_course: true
        unauthorized_redirect_url: null
        comments_enabled: false
        created_at: '2025-01-01T00:00:00.000Z'
        updated_at: '2025-01-01T00:00:00.000Z'
        image_url: https://example.myclickfunnels.com/uploads/image/1/file/9c8d1e7d480dc9882c519d4b4528826f.png
    CourseParametersUpdate:
      type: object
      title: Courses
      description: Courses. Updates are partial — only the attributes you include are changed; omitted attributes are left unchanged.
      properties:
        title:
          type: string
          description: Title
        description:
          type: string
          description: Description
        show_in_community:
          type:
          - boolean
          - 'null'
          description: Show In Customer Center?
        redirect_to_full_course:
          type:
          - boolean
          - 'null'
          description: Redirect To Full Course
        image_id:
          type:
          - integer
          - 'null'
          description: The ID of an Image to show on the storefront of the main course page
      example:
        course:
          title: Example Course
          description: A practical and engaging course designed to build core skills in Marketing.
          show_in_community: false
          redirect_to_full_course: true
          image_id: 1
  headers:
    PaginationNext:
      description: ID of the last item in the current response after which more records exist. You can use it in an `after` query parameter for cursor-based pagination to get to the next page.
      schema:
        type: string
    Link:
      description: A direct link to the next page for the cursor-based pagination. It includes the `after` and the Pagination-Next ID value.
      schema:
        type: string
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: 'A workspace API key or an OAuth access token, sent as `Authorization: Bearer <token>`.


        Both carry the same scope vocabulary as the `OAuth2` scheme below. Category-only

        scopes restrict access to the categories they name. Coarse wildcards remain additive:

        `read contacts:read` reads every category, while `write contacts:read` can write every

        category. Omit coarse scopes when restricting access to specific categories.

        Legacy tokens with only coarse scopes retain their existing unrestricted access;

        a bare `read` scope alone does not enforce read-only access.

        '
    OAuth2:
      type: oauth2
      description: 'OAuth 2.0 authorization code flow for REST integrations. Create a Platform Application

        and follow `https://developers.myclickfunnels.com/docs/oauth-20` to connect users.

        Authorization server metadata is published at

        `https://accounts.myclickfunnels.com/.well-known/oauth-authorization-server`.

        Dynamic client registration at `/oauth/register` is for MCP clients only; MCP-scoped

        tokens must use `https://agents.myclickfunnels.com/mcp`, not the REST API.


        Scopes are least-privilege by category. Ask for the two coarse wildcards (`read`,

        `write`) only when an integration genuinely needs the whole workspace; otherwise ask

        for the `<category>:read` / `<category>:write` pairs you use. `write` implies `read`

        for the same category. Protected resource metadata (RFC 9728) for this API lives at

        `https://accounts.myclickfunnels.com/.well-known/oauth-protected-resource`.

        '
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.myclickfunnels.com/oauth/authorize
          tokenUrl: https://accounts.myclickfunnels.com/oauth/token
          refreshUrl: https://accounts.myclickfunnels.com/oauth/token
          scopes:
            read: Read any resource in the granted workspaces
            write: Read and write any resource in the granted workspaces
            contacts:read: Read Contacts
            contacts:write: Read and write Contacts
            workflows:read: Read Workflows (Automations)
            workflows:write: Read and write Workflows (Automations)
            funnels:read: Read Funnels
            funnels:write: Read and write Funnels
            sites:read: Read Sites & Design
            sites:write: Read and write Sites & Design
            courses:read: Read Courses
            courses:write: Read and write Courses
            emails:read: Read Emails
            emails:write: Read and write Emails
            blog:read: Read Blog
            blog:write: Read and write Blog
            community:read: Read Community
            community:write: Read and write Community
            appointments:read: Read Appointments
            appointments:write: Read and write Appointments
            opportunities:read: Read Opportunities
            opportunities:write: Read and write Opportunities
            store:read: Read Store
            store:write: Read and write Store
            forms:read: Read Forms
            forms:write: Read and write Forms
            media:read: Read Media
            media:write: Read and write Media
            webhooks:read: Read Webhooks
            webhooks:write: Read and write Webhooks
            account:read: Read Account
            account:write: Read and write Account
            reference:read: Read Reference Data
