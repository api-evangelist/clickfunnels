              example:
                id: 101
                public_id: AbCdEf
                contact_id: 55
                title: Welcome to the community!
                body: Hi everyone, excited to be here.
                url: https://example.myclickfunnels.com/communities/posts/AbCdEf
                contact:
                  id: 55
                  public_id: GhIjKl
                  email_address: jane@example.com
