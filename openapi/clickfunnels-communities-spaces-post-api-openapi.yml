components:
  schemas:
    CommunitiesSpacesPostParametersUpdate:
      type: object
      title: Communities::Spaces::Post
      description: Communities::Spaces::Post
      properties:
        title:
          type:
          - string
          - 'null'
          description: Post title
        body:
          type:
          - string
          - 'null'
          description: Post body as rich HTML
        image_id:
          type:
          - integer
          - 'null'
          description: Cover image ID
        is_pinned:
          type:
          - boolean
          - 'null'
          description: Whether to pin the post at the top of the space
        current_path:
          type:
          - string
          - 'null'
          description: Current path (used for tracking purposes)
      example:
        communities_spaces_post:
          title: Updated post title
          is_pinned: true
    CommunitiesSpacesPostAttributes:
      type: object
      title: Communities::Spaces::Post
      description: Communities::Spaces::Post
      properties:
        id:
          type: integer
          description: Post ID
        public_id:
          type:
          - string
          - 'null'
          description: Post public ID
        contact_id:
          type:
          - integer
          - 'null'
          description: ID of the Contact who authored the post
        title:
          type:
          - string
          - 'null'
          description: Post title
        body:
          type:
          - string
          - 'null'
          description: Post body as plain text
        url:
          type:
          - string
          - 'null'
          description: Canonical URL of the post
        contact:
          description: Short representation of the authoring Contact, or null if the contact has been deleted
          type:
          - object
          - 'null'
          properties:
            id:
              type: integer
              description: Contact ID
            public_id:
              type: string
              description: Contact public ID
            email_address:
              type:
              - string
              - 'null'
              description: Contact email address
            first_name:
              type:
              - string
              - 'null'
              description: Contact first name
            last_name:
              type:
              - string
              - 'null'
              description: Contact last name
            phone_number:
              type:
              - string
              - 'null'
              description: Contact phone number
        group:
          description: The Space Group this post belongs to
          type: object
          properties:
            id:
              type: integer
              description: Space Group ID
            public_id:
              type:
              - string
              - 'null'
              description: Space Group public ID
            name:
              type:
              - string
              - 'null'
              description: Space Group name
        topic:
          description: The Space (topic) this post belongs to
          type: object
          properties:
            id:
              type: integer
              description: Space ID
            public_id:
              type:
              - string
              - 'null'
              description: Space public ID
            name:
              type:
              - string
              - 'null'
              description: Space name
        created_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Created at
        updated_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Updated at
      example:
        id: 101
        public_id: AbCdEf
        contact_id: 55
        title: Welcome to the community!
        body: Hi everyone, excited to be here.
        url: https://example.myclickfunnels.com/communities/posts/AbCdEf
        contact:
          id: 55
          public_id: GhIjKl
          email_address: jane@example.com
          first_name: Jane
          last_name: Doe
          phone_number: null
        group:
          id: 1
          public_id: BcDeFg
          name: General
        topic:
          id: 2
          public_id: CdEfGh
          name: Introductions
        created_at: '2025-01-01T00:00:00.000Z'
        updated_at: '2025-01-01T00:00:00.000Z'
      required:
      - body
      - contact
      - contact_id
      - created_at
      - group
      - id
      - public_id
      - title
      - topic
      - updated_at
      - url
    CommunitiesSpacesPostParameters:
      type: object
      title: Communities::Spaces::Post
      description: Communities::Spaces::Post
      required:
      - title
      properties:
        title:
          type: string
          description: Post title
        body:
          type:
          - string
          - 'null'
          description: Post body as rich HTML
        contact_id:
          type:
          - integer
          - 'null'
          description: ID of the Contact to author the post. Optional — defaults to the connected user's own contact.
        image_id:
          type:
          - integer
          - 'null'
          description: Cover image ID
        is_pinned:
          type:
          - boolean
          - 'null'
          description: Whether to pin the post at the top of the space
        current_path:
          type:
          - string
          - 'null'
          description: Current path (used for tracking purposes)
      example:
        communities_spaces_post:
          title: Welcome to the community!
          body: <p>Hi everyone, excited to be here.</p>
  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: string
    sort_property:
      name: sort_property
      in: query
      description: 'Sort property of a list response. The default is id and thus the created_at order.

        If you sort by other properties, we additionally sort by id implicitly as a secondary sort property, so that you can rely on the sort order to be deterministic even if the main sort property ends up with the same values.

        '
      required: false
      schema:
        type: string
        enum:
        - id
        - updated_at
    sort_order:
      name: sort_order
      in: query
      description: Sort order of a list response. Use 'desc' to reverse the default 'asc' (ascending) sort order. Examples [in our guides](https://developers.myclickfunnels.com/docs/pagination).
      required: false
      schema:
        type: string
        enum:
        - asc
        - desc
    after:
      name: after
      in: query
      required: false
      schema:
        type: string
      description: ID of item after which the collection should be returned. More examples and info about pagination [in our guides](https://developers.myclickfunnels.com/docs/pagination).
  headers:
    Link:
      description: A direct link to the next page for the cursor-based pagination. It includes the `after` and the Pagination-Next ID value.
      schema:
        type: string
    PaginationNext:
      description: ID of the last item in the current response after which more records exist. You can use it in an `after` query parameter for cursor-based pagination to get to the next page.
      schema:
        type: string
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
