                updated_at: '2025-01-01T00:00:00.000Z'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: API key missing or invalid
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: 'Not found: Record missing'
    put:
      tags:
      - Communities::Spaces::Post
      summary: Update Post
      description: Update a post. The `contact_id` field is ignored on update.
      operationId: updateCommunitiesSpacesPosts
      parameters:
      - $ref: '#/components/parameters/id'
      requestBody:
        description: Information about updated fields in Post
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                communities_spaces_post:
                  type: object
                  $ref: '#/components/schemas/CommunitiesSpacesPostParametersUpdate'
            example:
              communities_spaces_post:
                title: Updated post title
                is_pinned: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunitiesSpacesPostAttributes'
              example:
                id: 101
                public_id: AbCdEf
                contact_id: 55
                title: Updated post title
                body: Hi everyone, excited to be here.
                url: https://example.myclickfunnels.com/communities/posts/AbCdEf
                contact:
                  id: 55
                  public_id: GhIjKl
                  email_address: jane@example.com
                  first_name: Jane
                  last_name: Doe
                  phone_number: null
                group:
                  id: 1
                  public_id: BcDeFg
                  name: General
                topic:
                  id: 2
                  public_id: CdEfGh
                  name: Introductions
                created_at: '2025-01-01T00:00:00.000Z'
                updated_at: '2025-01-01T00:00:00.000Z'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: 'Bad request: HTTP body must be valid JSON'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: API key missing or invalid
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: 'Not found: Record missing'
    delete:
      tags:
      - Communities::Spaces::Post
      summary: Remove Post
      description: Delete a post
      operationId: removeCommunitiesSpacesPosts
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '204':
          description: No Content
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: API key missing or invalid
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: 'Not found: Record missing'
  /communities/spaces/posts/{id}/approve:
    post:
      tags:
      - Communities::Spaces::Post
      summary: Approve Post
      description: Approve a post. Sets `approved_at` to the current time, applies any pending draft edit to the live body, and notifies any contacts mentioned in the post body.
      operationId: approveCommunitiesSpacesPost
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunitiesSpacesPostAttributes'
              example:
                id: 101
                public_id: AbCdEf
                contact_id: 55
                title: Welcome to the community!
                body: Hi everyone, excited to be here.
                url: https://example.myclickfunnels.com/communities/posts/AbCdEf
                contact:
                  id: 55
