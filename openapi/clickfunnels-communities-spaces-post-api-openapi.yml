  /communities/spaces/posts/{id}/dismiss_reports:
    post:
      tags:
      - Communities::Spaces::Post
      summary: Dismiss Reports on Post
      description: Dismiss all pending moderation reports on a post. Clears the report flags and approves the post, making it visible in the community feed.
      operationId: dismissReportsCommunitiesSpacesPost
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
