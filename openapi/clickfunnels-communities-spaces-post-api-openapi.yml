components:
  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: string
    per_page:
      name: per_page
      in: query
      required: false
      description: Records per page. Defaults to 20; raise it up to 100 for bulk reads. A larger value returns 100 records. Zero, a negative or a non-integer value is a 422. The `Link` next-page URL keeps the value, so a client following it keeps the page size. More [in our guides](https://developers.myclickfunnels.com/docs/pagination).
      schema:
        type: integer
        minimum: 1
        default: 20
    sort_property:
      name: sort_property
      in: query
      description: 'Sort property of a list response. The default is id and thus the created_at order.

        If you sort by other properties, we additionally sort by id implicitly as a secondary sort property, so that you can rely on the sort order to be deterministic even if the main sort property ends up with the same values.

        '
      required: false
      schema:
        type: string
        enum:
        - id
        - updated_at
    sort_order:
      name: sort_order
      in: query
      description: Sort order of a list response. Use 'desc' to reverse the default 'asc' (ascending) sort order. Examples [in our guides](https://developers.myclickfunnels.com/docs/pagination).
      required: false
      schema:
        type: string
        enum:
        - asc
        - desc
    after:
      name: after
      in: query
      required: false
      schema:
        type: string
      description: ID of item after which the collection should be returned. More examples and info about pagination [in our guides](https://developers.myclickfunnels.com/docs/pagination).
  responses:
    InvalidPageSize:
      description: Unprocessable Entity - `per_page` must be a positive integer.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
              hint:
                type:
                - string
                - 'null'
                description: Next step for the caller, or null when no additional guidance applies.
          example:
            error: 'Request unprocessable: per_page must be a positive integer, capped at 100 (got "0")'
            hint: null
  schemas:
    CommunitiesSpacesPostParameters:
      type: object
      title: Communities::Spaces::Post
      description: Communities::Spaces::Post
      required:
      - title
      properties:
        title:
          type: string
          description: Post title
        body:
          type:
          - string
          - 'null'
          description: Post body as rich HTML
        contact_id:
          type:
          - integer
          - 'null'
          description: ID of the Contact to author the post. Optional — defaults to the connected user's own contact.
        image_id:
          type:
          - integer
          - 'null'
          description: Cover image ID
        is_pinned:
          type:
          - boolean
          - 'null'
          description: Whether to pin the post at the top of the space
        current_path:
          type:
          - string
          - 'null'
          description: Current path (used for tracking purposes)
      example:
        communities_spaces_post:
          title: Welcome to the community!
          body: <p>Hi everyone, excited to be here.</p>
    CommunitiesSpacesPostParametersUpdate:
      type: object
      title: Communities::Spaces::Post
      description: Communities::Spaces::Post
      properties:
        title:
          type:
          - string
          - 'null'
          description: Post title
        body:
          type:
          - string
          - 'null'
          description: Post body as rich HTML
        image_id:
          type:
          - integer
          - 'null'
          description: Cover image ID
        is_pinned:
          type:
          - boolean
          - 'null'
          description: Whether to pin the post at the top of the space
        current_path:
