openapi: 3.2.0
info:
  title: ClickFunnels Communities::Spaces::Post API
  termsOfService: https://www.clickfunnels.com/terms-of-service
  contact:
    name: ClickFunnels API Team
    url: https://developers.myclickfunnels.com
  x-logo:
    url: https://statics.myclickfunnels.com/image/1126065/file/31edf05760fafe41a82f16a668ab251f.png
  description: 'The ClickFunnels REST API that powers webhooks, native integrations, and Zapier lets you manage your ClickFunnels data, automate your workflows, and recreate ClickFunnels functionality in your own apps.

    '
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  version: 2.0.0
servers:
- url: https://{subdomain}.myclickfunnels.com/api/v2
  description: ClickFunnels API
  variables:
    subdomain:
      default: myworkspace
security:
- BearerAuth: []
tags:
- name: Communities::Spaces::Post
  description: '> Posts are member-created content items within a Community Space.


    A Post belongs to a Space and is authored by a Contact. Posts support rich HTML body content, optional titles, pinning, and cover images. Posts created via the API are auto-approved. Use `Communities::Spaces::Post::Comment`, `Communities::Spaces::Post::Like`, and `Communities::Spaces::Post::VideoEmbed` to manage the sub-resources of a post.

    '
paths:
  /communities/spaces/{space_id}/posts:
    get:
      tags:
      - Communities::Spaces::Post
      summary: List Posts
      description: List posts for a space
      operationId: listCommunitiesSpacesPosts
      parameters:
      - name: space_id
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/after'
      - $ref: '#/components/parameters/sort_order'
      - $ref: '#/components/parameters/sort_property'
      responses:
        '200':
          description: OK
          headers:
            Pagination-Next:
              $ref: '#/components/headers/PaginationNext'
            Link:
              $ref: '#/components/headers/Link'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CommunitiesSpacesPostAttributes'
              example:
              - id: 101
                public_id: AbCdEf
                contact_id: 55
                title: Welcome to the community!
                body: Hi everyone, excited to be here.
                url: https://example.myclickfunnels.com/communities/posts/AbCdEf
                contact:
                  id: 55
                  public_id: GhIjKl
                  email_address: jane@example.com
                  first_name: Jane
                  last_name: Doe
                  phone_number: null
                group:
                  id: 1
                  public_id: BcDeFg
                  name: General
                topic:
                  id: 2
                  public_id: CdEfGh
                  name: Introductions
                created_at: '2025-01-01T00:00:00.000Z'
                updated_at: '2025-01-01T00:00:00.000Z'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: API key missing or invalid
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: 'Not found: Record missing'
    post:
      tags:
      - Communities::Spaces::Post
      summary: Create Post
      description: Create a post in a space. Posts created via the API are auto-approved. The `contact_id` is optional and defaults to the connected user's own contact.
      operationId: createCommunitiesSpacesPosts
      parameters:
      - name: space_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        description: Information about a new Post
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                communities_spaces_post:
                  type: object
                  $ref: '#/components/schemas/CommunitiesSpacesPostParameters'
            example:
              communities_spaces_post:
                title: Welcome to the community!
                body: <p>Hi everyone, excited to be here.</p>
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunitiesSpacesPostAttributes'
              example:
                id: 101
                public_id: AbCdEf
                contact_id: 55
                title: Welcome to the community!
                body: Hi everyone, excited to be here.
                url: https://example.myclickfunnels.com/communities/posts/AbCdEf
                contact:
                  id: 55
                  public_id: GhIjKl
                  email_address: jane@example.com
                  first_name: Jane
                  last_name: Doe
                  phone_number: null
                group:
                  id: 1
                  public_id: BcDeFg
                  name: General
                topic:
                  id: 2
                  public_id: CdEfGh
                  name: Introductions
                created_at: '2025-01-01T00:00:00.000Z'
                updated_at: '2025-01-01T00:00:00.000Z'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: API key missing or invalid
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: Title can't be blank
  /communities/spaces/posts/{id}:
    get:
      tags:
      - Communities::Spaces::Post
      summary: Fetch Post
      description: Retrieve a post
      operationId: getCommunitiesSpacesPosts
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunitiesSpacesPostAttributes'
              example:
                id: 101
                public_id: AbCdEf
                contact_id: 55
                title: Welcome to the community!
                body: Hi everyone, excited to be here.
                url: https://example.myclickfunnels.com/communities/posts/AbCdEf
                contact:
                  id: 55
