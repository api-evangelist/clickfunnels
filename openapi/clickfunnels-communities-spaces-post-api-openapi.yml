  /communities/spaces/posts/{id}/decline:
    post:
      tags:
      - Communities::Spaces::Post
      summary: Decline Post
      description: Decline a post. Sets `declined_at` to the current time, marking the post as rejected and hiding it from the community feed.
      operationId: declineCommunitiesSpacesPost
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
