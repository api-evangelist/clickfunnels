  /communities/spaces/posts/{id}/pin:
    post:
      tags:
      - Communities::Spaces::Post
      summary: Pin Post
      description: Pin a post. Sets `is_pinned` to true, causing the post to appear at the top of the community space feed.
      operationId: pinCommunitiesSpacesPost
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunitiesSpacesPostAttributes'
              example:
