                  phone_number: null
                group:
                  id: 1
                  public_id: BcDeFg
                  name: General
                topic:
                  id: 2
                  public_id: CdEfGh
                  name: Introductions
                created_at: '2025-01-01T00:00:00.000Z'
                updated_at: '2025-01-01T00:00:00.000Z'
        '401':
          description: Unauthorized
