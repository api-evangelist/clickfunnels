components:
  responses:
    WorkspaceGrantForbidden:
      description: "Forbidden — this request's workspace is closed to it.\n\nThree cases return this:\n\n* The access token is limited to specific workspaces (see the workspace selection made when\n  the key was provisioned, or the workspaces approved on the OAuth consent screen) and the\n  request acts on a workspace outside that set.\n* The access token is limited to specific workspaces and the request's workspace could not be\n  determined at all. The gate is fail-closed, so a workspace-limited token is denied rather\n  than allowed through when the target workspace is ambiguous.\n* The workspace's team has no active ClickFunnels subscription: it was canceled, is paused,\n  or is locked out after failed payments. Reads and writes are both refused until the\n  subscription is reactivated, and the body carries `\"code\": \"subscription_inactive\"`.\n\nA token with no workspace restriction never receives the first two."
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
              code:
                type: string
                description: A machine-readable cause, when there is one. `subscription_inactive` means the workspace's team has no active ClickFunnels subscription.
                enum:
                - subscription_inactive
              hint:
                type:
                - string
                - 'null'
                description: 'The next step for the caller: how to authenticate, which scope was missing, or where the route list lives. Always present, and null when this error has no next step to offer.'
          examples:
            workspace_not_granted:
              summary: Token not granted this workspace
              value:
                error: 'Forbidden: This access token is limited to specific workspaces and was not granted access to this one.'
                hint: The token's workspace grant was chosen when it was provisioned (Platform Applications) or on the OAuth consent screen. Use GET /api/v2/teams/{team_id}/workspaces to list the workspaces this token can reach (GET /api/v2/teams lists the team ids).
            subscription_inactive:
              summary: Team subscription inactive
              value:
                error: 'Forbidden: This workspace''s team does not have an active ClickFunnels subscription, so API access to it is disabled until the subscription is reactivated.'
                hint: null
                code: subscription_inactive
    InvalidPageSize:
      description: Unprocessable Entity - `per_page` must be a positive integer.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
              hint:
                type:
                - string
                - 'null'
                description: Next step for the caller, or null when no additional guidance applies.
          example:
            error: 'Request unprocessable: per_page must be a positive integer, capped at 100 (got "0")'
            hint: null
  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: string
    per_page:
      name: per_page
      in: query
      required: false
      description: Records per page. Defaults to 20; raise it up to 100 for bulk reads. A larger value returns 100 records. Zero, a negative or a non-integer value is a 422. The `Link` next-page URL keeps the value, so a client following it keeps the page size. More [in our guides](https://developers.myclickfunnels.com/docs/pagination).
      schema:
        type: integer
        minimum: 1
        default: 20
    sort_property:
      name: sort_property
      in: query
      description: 'Sort property of a list response. The default is id and thus the created_at order.

        If you sort by other properties, we additionally sort by id implicitly as a secondary sort property, so that you can rely on the sort order to be deterministic even if the main sort property ends up with the same values.

        '
      required: false
      schema:
        type: string
        enum:
        - id
        - updated_at
    sort_order:
      name: sort_order
      in: query
      description: Sort order of a list response. Use 'desc' to reverse the default 'asc' (ascending) sort order. Examples [in our guides](https://developers.myclickfunnels.com/docs/pagination).
      required: false
      schema:
        type: string
        enum:
        - asc
        - desc
    after:
      name: after
      in: query
      required: false
      schema:
        type: string
      description: ID of item after which the collection should be returned. More examples and info about pagination [in our guides](https://developers.myclickfunnels.com/docs/pagination).
  schemas:
    BillingSubscriptionIncludedPriceAttributes:
      type: object
      title: Billing Subscription Included Prices
      description: A price included in a billing subscription.
      properties:
        id:
          type: integer
          description: Included price ID
        subscription_id:
          type: integer
          description: The ID of the billing subscription this price belongs to
        price_id:
          type: string
          description: The identifier of the underlying price
        quantity:
          type:
          - integer
          - 'null'
          description: The quantity of the price included in the subscription
        created_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Created
        updated_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Updated
      example:
        id: 9000
        subscription_id: 8000
        price_id: price_basic_monthly
        quantity: 1
        created_at: '2025-01-01T00:00:00.000Z'
        updated_at: '2025-01-01T00:00:00.000Z'
    TeamAttributes:
      type: object
      title: Teams
      description: Teams
      properties:
        id:
          type: integer
          description: Team ID
        public_id:
          type:
          - string
          - 'null'
          description: Team public ID
        name:
          type: string
          description: The name of your Team
        time_zone:
          type:
          - string
          - 'null'
          description: 'The human-readable time zone set manually by a ClickFunnels user or dynamically by the app.

            Read more about time zones and how to map them back to the TZ standard in [our Time Zones guide.](https://dash.readme.com/project/cf2/v2/docs/timezones).

            '
        locale:
          type: string
          description: The main language used to create a new website.
          enum:
          - en
          - ja
          - pt
        created_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Created
        updated_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Updated
        billing_subscriptions:
          type: array
          description: The team's billing subscriptions. Present only when the team has at least one subscription (omitted entirely otherwise).
          items:
            $ref: '#/components/schemas/BillingSubscriptionAttributes'
        memberships:
          type: array
          description: The team's non-platform (human) memberships. Platform-agent / bot memberships (such as the API client the request authenticates as) are excluded from this list.
          items:
            $ref: '#/components/schemas/MembershipAttributes'
      example:
        id: 42000
        public_id: ClNcfI
        name: Example Team
        time_zone: Pacific Time (US & Canada)
        locale: en
        created_at: '2025-01-01T00:00:00.000Z'
        updated_at: '2025-01-01T00:00:00.000Z'
        billing_subscriptions:
        - id: 8000
          public_id: SbTcfQ
          team_id: 42000
          status: active
          cycle_ends_at: '2025-02-01T00:00:00.000Z'
          created_at: '2025-01-01T00:00:00.000Z'
          updated_at: '2025-01-01T00:00:00.000Z'
          included_prices:
          - id: 9000
            subscription_id: 8000
            price_id: price_basic_monthly
            quantity: 1
            created_at: '2025-01-01T00:00:00.000Z'
            updated_at: '2025-01-01T00:00:00.000Z'
        memberships:
        - id: 5000
          public_id: MbRcfK
          team_id: 42000
          user_id: 1
          user_first_name: Lili
          user_last_name: Stiedemann
          user_profile_photo_id: null
          user_email: test@email.com
          added_by_id: null
          platform_agent_of_id: null
          role_ids:
          - admin
          created_at: '2025-01-01T00:00:00.000Z'
          updated_at: '2025-01-01T00:00:00.000Z'
          user:
            id: 1
            public_id: prbtEx
            email: test@email.com
            first_name: Lili
            last_name: Stiedemann
            time_zone: Pacific Time (US & Canada)
            locale: en
            created_at: '2025-01-01T00:00:00.000Z'
            updated_at: '2025-01-01T00:00:00.000Z'
    UserAttributes:
      type: object
      title: Profile
      description: 'A user profile. This includes **platform-agent** users — the synthetic user an OAuth/API

        client authenticates as (e.g. "Default API Client") — as well as human users. Workflow

        `notify_step` targets exclude platform agents (they resolve against non-platform team

        members); discover those via `GET /api/v2/teams/{team_id}/memberships`.

        '
      properties:
        id:
          type: integer
          description: User ID
        public_id:
          type:
          - string
          - 'null'
          description: User public ID
        email:
          type: string
          description: Email Address
        first_name:
          type: string
          description: First Name
        last_name:
          type: string
          description: Last Name
        time_zone:
          type:
          - string
          - 'null'
          description: Your Time Zone
        locale:
          type:
          - string
          - 'null'
          description: Language
        created_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Signed up
        updated_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Updated
      example:
        id: 1
        public_id: prbtEx
        email: test@email.com
        first_name: Lili
        last_name: Stiedemann
        time_zone: Pacific Time (US & Canada)
        locale: en
        created_at: '2025-01-01T00:00:00.000Z'
        updated_at: '2025-01-01T00:00:00.000Z'
    TeamParametersUpdate:
      type: object
      title: Teams
      description: Teams
      required: []
      properties:
        name:
          type: string
          description: The name of your Team
        time_zone:
          type:
          - string
          - 'null'
          description: 'The human-readable time zone set manually by a ClickFunnels user or dynamically by the app.

            Read more about time zones and how to map them back to the TZ standard in [our Time Zones guide.](https://dash.readme.com/project/cf2/v2/docs/timezones).

            '
        locale:
          type: string
          description: The main language used to create a new website.
          enum:
          - en
          - ja
          - pt
          default: en
      example:
        team:
          name: Example Team
          time_zone: Pacific Time (US & Canada)
          locale: en
    BillingSubscriptionAttributes:
      type: object
      title: Billing Subscriptions
      description: A billing subscription for a team. Embedded in the `Team` resource's `billing_subscriptions` array.
      properties:
        id:
          type: integer
          description: Billing subscription ID
        public_id:
          type:
          - string
          - 'null'
          description: Billing subscription public ID
        team_id:
          type: integer
          description: The ID of the team the subscription belongs to
        status:
          type:
          - string
          - 'null'
          description: The subscription's current status (e.g. `active`, `canceled`, `delinquent`)
        cycle_ends_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the current billing cycle ends
        created_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Created
        updated_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Updated
        included_prices:
          type: array
          description: The prices included in the subscription
          items:
            $ref: '#/components/schemas/BillingSubscriptionIncludedPriceAttributes'
      example:
        id: 8000
        public_id: SbTcfQ
        team_id: 42000
        status: active
        cycle_ends_at: '2025-02-01T00:00:00.000Z'
        created_at: '2025-01-01T00:00:00.000Z'
        updated_at: '2025-01-01T00:00:00.000Z'
        included_prices:
        - id: 9000
          subscription_id: 8000
          price_id: price_basic_monthly
          quantity: 1
          created_at: '2025-01-01T00:00:00.000Z'
          updated_at: '2025-01-01T00:00:00.000Z'
    MembershipAttributes:
      type: object
      title: Memberships
      description: A membership joins a user to a team. Embedded in the `Team` resource's `memberships` array (platform-agent / bot memberships are excluded there).
      properties:
        id:
          type: integer
          description: Membership ID
        public_id:
          type:
          - string
          - 'null'
          description: Membership public ID
