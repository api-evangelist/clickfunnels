        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: 'Not found: Record missing'
components:
  schemas:
    SalesPipelineParametersUpdate:
      type: object
      title: Pipelines
      description: Pipelines
      required: []
      properties:
        name:
          type: string
          description: Pipeline name
        stages_attributes:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                description: The name of the stage
              close_probability:
                type: integer
                description: The probability of closing a deal in this stage
          description: The stages of the pipeline. The stages are ordered by the position attribute.
      example:
        sales_pipeline:
          name: Example Pipeline
    SalesPipelineAttributes:
      type: object
      title: Pipelines
      description: Pipelines
      properties:
        id:
          type: integer
          description: Pipeline ID
        public_id:
          type:
          - string
          - 'null'
          description: Pipeline public ID
        workspace_id:
          type: integer
          description: Workspace ID
        name:
          type: string
          description: Pipeline name
        created_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Created at
        updated_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Updated at
        total_value:
          type:
          - integer
          - 'null'
          description: Total value of the opportunities
        stages:
          type:
          - array
          - 'null'
          items:
            type: object
            title: Pipelines
            description: Pipelines
            properties:
              id:
                type: integer
                description: Pipeline ID
              public_id:
                type:
                - string
                - 'null'
                description: Pipeline public ID
              workspace_id:
                type: integer
                description: Workspace ID
              pipeline_id:
                type: integer
                description: Pipeline ID
              name:
                type: string
                description: Pipeline name
              sort_order:
                type:
                - integer
                - 'null'
                description: The position of the stage in the pipeline
              close_probability:
                type:
                - number
                - 'null'
                description: Close probability of the opportunities in this stage
              opportunity_ids:
                type:
                - array
                - 'null'
                minContains: 0
                contains:
                  type: integer
                description: Opportunities in this stage
              total_value:
                type:
                - integer
                - 'null'
                description: Total value of the opportunities
              weighted_value:
                type:
                - number
                - 'null'
                description: A calculation of the weighted value of all opportunities in this stage
          description: Stages in the pipeline
      example:
        id: 1
        public_id: LbCUlW
        workspace_id: 42000
        name: Example Pipeline
        created_at: '2025-01-01T00:00:00.000Z'
        updated_at: '2025-01-01T00:00:00.000Z'
        total_value: 0
        stages:
        - id: 35
          public_id: LNKqFC
          workspace_id: 2
          pipeline_id: 1
          name: Example Stage
          sort_order: 1
          close_probability: 20
          opportunity_ids:
          - 1
          - 2
          total_value: 0
          weighted_value: 0
        - id: 36
          public_id: vhICuX
          workspace_id: 2
          pipeline_id: 1
          name: Example Stage
          sort_order: 2
          close_probability: 20
          opportunity_ids:
          - 3
          - 4
          total_value: 0
          weighted_value: 0
      required:
      - created_at
      - id
      - name
      - public_id
      - stages
      - total_value
      - updated_at
      - workspace_id
    SalesPipelineParameters:
      type: object
      title: Pipelines
      description: Pipelines
      required:
      - name
      - stages_attributes
      properties:
        name:
          type: string
          description: Pipeline name
        stages_attributes:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                description: The name of the stage
              close_probability:
                type: integer
                description: The probability of closing a deal in this stage
          description: The stages of the pipeline. The stages are ordered by the position attribute.
      example:
        sales_pipeline:
          name: Example Pipeline
  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: string
    sort_property:
      name: sort_property
      in: query
      description: 'Sort property of a list response. The default is id and thus the created_at order.

        If you sort by other properties, we additionally sort by id implicitly as a secondary sort property, so that you can rely on the sort order to be deterministic even if the main sort property ends up with the same values.

        '
      required: false
      schema:
        type: string
        enum:
        - id
        - updated_at
    sort_order:
      name: sort_order
      in: query
      description: Sort order of a list response. Use 'desc' to reverse the default 'asc' (ascending) sort order. Examples [in our guides](https://developers.myclickfunnels.com/docs/pagination).
      required: false
      schema:
        type: string
        enum:
        - asc
        - desc
    after:
      name: after
      in: query
      required: false
      schema:
        type: string
      description: ID of item after which the collection should be returned. More examples and info about pagination [in our guides](https://developers.myclickfunnels.com/docs/pagination).
  headers:
    Link:
      description: A direct link to the next page for the cursor-based pagination. It includes the `after` and the Pagination-Next ID value.
      schema:
        type: string
    PaginationNext:
      description: ID of the last item in the current response after which more records exist. You can use it in an `after` query parameter for cursor-based pagination to get to the next page.
      schema:
        type: string
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
externalDocs:
  description: More in-depth guides and further resources
  url: https://developers.myclickfunnels.com
