openapi: 3.2.0
info:
  title: ClickFunnels Sales::Pipeline API
  termsOfService: https://www.clickfunnels.com/terms-of-service
  contact:
    name: ClickFunnels API Team
    url: https://developers.myclickfunnels.com
  x-logo:
    url: https://statics.myclickfunnels.com/image/1126065/file/31edf05760fafe41a82f16a668ab251f.png
  description: 'The ClickFunnels REST API that powers webhooks, native integrations, and Zapier lets you manage your ClickFunnels data, automate your workflows, and recreate ClickFunnels functionality in your own apps.

    '
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  version: 2.0.0
servers:
- url: https://{subdomain}.myclickfunnels.com/api/v2
  description: ClickFunnels API
  variables:
    subdomain:
      default: myworkspace
security:
- BearerAuth: []
tags:
- name: Sales::Pipeline
  description: '>  Sales Pipelines


    Pipelines allow you to organize, track and advance Opportunies between different Stages. A Pipeline consists of multiple Stages.


    When creating a Pipeline, you must specify one or more stages by passing them in the `stages_attributes` parameter. The Stages

    will be created in the order in which they are given in the `stages_attributes` parameter.

    '
paths:
  /workspaces/{workspace_id}/sales/pipelines:
    get:
      tags:
      - Sales::Pipeline
      summary: List Pipelines
      description: List Pipelines
      operationId: listSalesPipelines
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/after'
      - $ref: '#/components/parameters/sort_order'
      - $ref: '#/components/parameters/sort_property'
      - name: filter
        in: query
        description: 'Filter by available properties in query params, like this: `api/v2/resources?filter[id]=value&filter[another_property]=value1,value2`. Check our Filtering guide for examples and all about filtering [here](https://developers.myclickfunnels.com/docs/filtering).

          '
        required: false
        schema:
          type: object
          properties:
            id:
              type: string
              description: A comma-separated list of pipeline IDs to filter by.
              example: 1,42
        style: deepObject
        explode: true
      responses:
        '200':
          description: OK
          headers:
            Pagination-Next:
              $ref: '#/components/headers/PaginationNext'
            Link:
              $ref: '#/components/headers/Link'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SalesPipelineAttributes'
              example:
              - id: 5
                public_id: zbeuIi
                workspace_id: 42000
                name: Example Pipeline
                created_at: '2025-01-01T00:00:00.000Z'
                updated_at: '2025-01-01T00:00:00.000Z'
                total_value: 0
                stages:
                - id: 46
                  public_id: sjARSr
                  workspace_id: 6
                  pipeline_id: 5
                  name: Example Stage
                  sort_order: 12
                  close_probability: 20
                  opportunity_ids:
                  - 25
                  - 26
                  total_value: 0
                  weighted_value: 0
                - id: 47
                  public_id: EqRVKx
                  workspace_id: 6
                  pipeline_id: 5
                  name: Example Stage
                  sort_order: 13
                  close_probability: 20
                  opportunity_ids:
                  - 27
                  - 28
                  total_value: 0
                  weighted_value: 0
              - id: 6
                public_id: jweGuo
                workspace_id: 42000
                name: Example Pipeline
                created_at: '2025-01-01T00:00:00.000Z'
                updated_at: '2025-01-01T00:00:00.000Z'
                total_value: 0
                stages:
                - id: 48
                  public_id: IuhMTS
                  workspace_id: 7
                  pipeline_id: 6
                  name: Example Stage
                  sort_order: 14
                  close_probability: 20
                  opportunity_ids:
                  - 29
                  - 30
                  total_value: 0
                  weighted_value: 0
                - id: 49
                  public_id: ypXweP
                  workspace_id: 7
                  pipeline_id: 6
                  name: Example Stage
                  sort_order: 15
                  close_probability: 20
                  opportunity_ids:
                  - 31
                  - 32
                  total_value: 0
                  weighted_value: 0
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: API key missing or invalid
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Not found - This usually happens when you try to access a record that does not exist in your account. It can also happen when the provided parent record is missing, e.g. you have put in a non-existent Workspaces parent ID.
              example:
                error: 'Not found: Record missing'
    post:
      tags:
      - Sales::Pipeline
      summary: Create Pipeline
      description: Create Pipeline
      operationId: createSalesPipelines
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        description: Information about a new Pipeline
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sales_pipeline:
                  type: object
                  $ref: '#/components/schemas/SalesPipelineParameters'
            example:
              sales_pipeline:
                name: Example Pipeline
                stages_attributes: []
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesPipelineAttributes'
              example:
                id: 8
                public_id: WCoLcG
                workspace_id: 42000
                name: Example Pipeline
                created_at: '2025-01-01T00:00:00.000Z'
                updated_at: '2025-01-01T00:00:00.000Z'
                total_value: 0
                stages:
                - id: 52
                  public_id: ZJntBy
                  workspace_id: 10
                  pipeline_id: 8
                  name: Example Stage
                  sort_order: 18
                  close_probability: 20
                  opportunity_ids:
                  - 37
                  - 38
                  total_value: 0
                  weighted_value: 0
                - id: 53
                  public_id: KBhPxe
                  workspace_id: 10
                  pipeline_id: 8
                  name: Example Stage
                  sort_order: 19
                  close_probability: 20
                  opportunity_ids:
                  - 39
                  - 40
                  total_value: 0
                  weighted_value: 0
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: 'Bad request: HTTP body must be valid JSON'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: API key missing or invalid
  /sales/pipelines/{id}:
    get:
      tags:
      - Sales::Pipeline
      summary: Fetch Pipeline
      description: Fetch Pipeline
      operationId: getSalesPipelines
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesPipelineAttributes'
              example:
                id: 7
                public_id: thGBgk
                workspace_id: 42000
                name: Example Pipeline
                created_at: '2025-01-01T00:00:00.000Z'
                updated_at: '2025-01-01T00:00:00.000Z'
                total_value: 0
                stages:
                - id: 50
                  public_id: iTRzlA
                  workspace_id: 9
