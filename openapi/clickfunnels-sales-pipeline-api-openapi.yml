        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: API key missing or invalid
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: 'Not found: Record missing'
    put:
      tags:
      - Sales::Pipeline
      summary: Update Pipeline
      description: Update Pipeline
      operationId: updateSalesPipelines
      parameters:
      - $ref: '#/components/parameters/id'
      requestBody:
        description: Information about updated fields in Pipeline
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sales_pipeline:
                  type: object
                  $ref: '#/components/schemas/SalesPipelineParametersUpdate'
            example:
              sales_pipeline:
                name: Example Pipeline
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesPipelineAttributes'
              example:
                id: 10
                public_id: SPTdGI
                workspace_id: 42000
                name: Example Pipeline
                created_at: '2025-01-01T00:00:00.000Z'
