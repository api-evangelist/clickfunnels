    put:
      tags:
      - Products::Price
      summary: Update Price
      description: Update a single price
      operationId: updateProductsPrices
      parameters:
      - $ref: '#/components/parameters/id'
      requestBody:
        description: Information about updated fields in Price
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                products_price:
                  type: object
                  $ref: '#/components/schemas/ProductsPriceParametersUpdate'
            example:
              products_price:
                name: Example Price
                amount: '100.00'
                cost: '0.00'
                currency: USD
                duration: 1
                interval: months
                trial_interval: days
                trial_duration: 14
                trial_amount: '0.00'
                setup_amount: null
                self_cancel: true
                self_upgrade: true
                self_downgrade: true
                self_reactivate: true
