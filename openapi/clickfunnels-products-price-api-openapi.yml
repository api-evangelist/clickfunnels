                public_id: UGpQZc
                variant_id: 78
                name: Example Price
                amount: '100.00'
                cost: '0.00'
                currency: USD
                duration: null
                interval: null
                trial_interval: null
                trial_duration: null
                trial_amount: '0.00'
                setup_amount: null
                self_cancel: true
                self_upgrade: true
