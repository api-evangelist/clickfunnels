openapi: 3.2.0
info:
  title: ClickFunnels Products::Price API
  termsOfService: https://www.clickfunnels.com/terms-of-service
  contact:
    name: ClickFunnels API Team
    url: https://developers.myclickfunnels.com
  x-logo:
    url: https://statics.myclickfunnels.com/image/1126065/file/31edf05760fafe41a82f16a668ab251f.png
  description: 'The ClickFunnels REST API that powers webhooks, native integrations, and Zapier lets you manage your ClickFunnels data, automate your workflows, and recreate ClickFunnels functionality in your own apps.

    '
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  version: 2.0.0
servers:
- url: https://{subdomain}.myclickfunnels.com/api/v2
  description: ClickFunnels API
  variables:
    subdomain:
      default: myworkspace
security:
- BearerAuth: []
tags:
- name: Products::Price
  description: Product Prices
paths:
  /products/{product_id}/prices:
    get:
      tags:
      - Products::Price
      summary: List Prices
      description: List all prices for a given product. This will include all prices for all variants of the product. You can also filter by variant_id to get prices for a specific variant.
      operationId: listProductsPrices
      parameters:
      - name: product_id
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/after'
      - $ref: '#/components/parameters/sort_order'
      - $ref: '#/components/parameters/sort_property'
      - name: filter
        in: query
        description: 'Filter by available properties in query params, like this: `api/v2/resources?filter[id]=value&filter[another_property]=value1,value2`. Check our Filtering guide for examples and all about filtering [here](https://developers.myclickfunnels.com/docs/filtering).

          '
        required: false
        schema:
          type: object
          properties:
            id:
              type: string
              description: A comma-separated list of price IDs to filter by.
              example: 1,2,3
            variant_id:
              type: string
              description: A comma-separated list of variant IDs to filter by.
              example: 1,2,3
            visible:
              type: boolean
              description: Filter prices by visibility in the online store.
              example: true
              enum:
              - true
              - false
            archived:
              type: boolean
              description: Filter prices by archived state.
              example: true
              enum:
              - true
              - false
        style: deepObject
        explode: true
      responses:
        '200':
          description: OK
          headers:
            Pagination-Next:
              $ref: '#/components/headers/PaginationNext'
            Link:
              $ref: '#/components/headers/Link'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductsPriceAttributes'
              example:
              - id: 75
                public_id: pLYvIn
                variant_id: 76
                name: Example Price
                amount: '100.00'
                cost: '0.00'
                currency: USD
                duration: null
                interval: null
                trial_interval: null
                trial_duration: null
                trial_amount: '0.00'
                setup_amount: null
                self_cancel: true
                self_upgrade: true
                self_downgrade: true
                self_reactivate: true
                interval_count: null
                payment_type: one_time
                visible: true
                compare_at_amount: null
                key: null
                archived: false
                created_at: '2025-01-01T00:00:00.000Z'
                updated_at: '2025-01-01T00:00:00.000Z'
              - id: 76
                public_id: eOSRMy
                variant_id: 77
                name: Example Price
                amount: '100.00'
                cost: '0.00'
                currency: USD
                duration: null
                interval: null
                trial_interval: null
                trial_duration: null
                trial_amount: '0.00'
                setup_amount: null
                self_cancel: true
                self_upgrade: true
                self_downgrade: true
                self_reactivate: true
                interval_count: null
                payment_type: one_time
                visible: true
                compare_at_amount: null
                key: null
                archived: false
                created_at: '2025-01-01T00:00:00.000Z'
                updated_at: '2025-01-01T00:00:00.000Z'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: API key missing or invalid
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Not found - This usually happens when you try to access a record that does not exist in your account. It can also happen when the provided parent record is missing, e.g. you have put in a non-existent Workspaces parent ID.
              example:
                error: 'Not found: Record missing'
