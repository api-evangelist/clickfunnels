  /products/variants/{variant_id}/prices:
    post:
      tags:
      - Products::Price
      summary: Create Price
      description: 'Create a new price for a given variant.

        Note that you must set a `variant_id` in the path.

        '
      operationId: createProductsPrices
      parameters:
      - name: variant_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        description: Information about a new Price
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                products_price:
                  type: object
                  $ref: '#/components/schemas/ProductsPriceParameters'
            example:
              products_price:
                name: Example Price
                amount: '100.00'
                cost: '0.00'
                currency: USD
                duration: null
