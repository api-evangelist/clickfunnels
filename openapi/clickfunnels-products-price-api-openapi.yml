components:
  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: string
    per_page:
      name: per_page
      in: query
      required: false
      description: Records per page. Defaults to 20; raise it up to 100 for bulk reads. A larger value returns 100 records. Zero, a negative or a non-integer value is a 422. The `Link` next-page URL keeps the value, so a client following it keeps the page size. More [in our guides](https://developers.myclickfunnels.com/docs/pagination).
      schema:
        type: integer
        minimum: 1
        default: 20
    sort_property:
      name: sort_property
      in: query
      description: 'Sort property of a list response. The default is id and thus the created_at order.

        If you sort by other properties, we additionally sort by id implicitly as a secondary sort property, so that you can rely on the sort order to be deterministic even if the main sort property ends up with the same values.

        '
      required: false
      schema:
        type: string
        enum:
        - id
        - updated_at
    sort_order:
      name: sort_order
      in: query
      description: Sort order of a list response. Use 'desc' to reverse the default 'asc' (ascending) sort order. Examples [in our guides](https://developers.myclickfunnels.com/docs/pagination).
      required: false
      schema:
        type: string
        enum:
        - asc
        - desc
    after:
      name: after
      in: query
      required: false
      schema:
        type: string
      description: ID of item after which the collection should be returned. More examples and info about pagination [in our guides](https://developers.myclickfunnels.com/docs/pagination).
  schemas:
    ProductsPriceParameters:
      type: object
      title: Prices
      description: Prices
      required:
      - amount
      properties:
        name:
          type:
          - string
          - 'null'
          description: Name
        amount:
          type: string
          description: Amount, as a decimal string. Omitting it does not fail — it silently creates a free price ('0.00') — so always send it.
        cost:
          type:
          - string
          - 'null'
          description: Cost
        currency:
          type: string
          description: Currency. Ignored on write — a price always takes its workspace's currency, so sending a different one has no effect.
        duration:
          type:
          - integer
          - 'null'
          description: Amount of payments. Required when payment_type is payment_plan; ignored for one_time and subscription.
        interval:
          type:
          - string
          - 'null'
          enum:
          - days
          - weeks
          - months
          - quarters
          - years
          - null
          description: Billing period unit — note the values are plural ('months', not 'month'). Required when payment_type is subscription or payment_plan; ignored for one_time.
        trial_interval:
          type:
          - string
          - 'null'
          enum:
          - days
          - weeks
          - months
          - quarters
          - years
          - null
          description: 'Trial period unit — same plural values as interval. An active recurring trial needs BOTH trial_interval and a positive trial_duration. Send both together: trial_duration alone is stored but inactive until trial_interval is added later, while trial_interval alone is cleared. Trial fields are cleared on a one_time price.'
        trial_duration:
          type:
          - integer
          - 'null'
          description: Length of the trial, in trial_interval units. Send a positive value together with trial_interval to create an active trial. Sent alone, it is stored but remains inactive until trial_interval is added later.
        trial_amount:
          type:
          - string
          - 'null'
          description: Amount charged for the trial. Leave at '0.00' for a free trial, or set it above 0 for a paid one. Only applies when trial_interval and trial_duration are both set.
        setup_amount:
          type:
          - string
          - 'null'
          description: Setup amount
        self_cancel:
          type:
          - boolean
          - 'null'
          description: Customer can cancel
        self_upgrade:
          type:
          - boolean
          - 'null'
          description: 'Legacy setting with no effect: no checkout, customer portal or API plan change reads it. `GET /products/prices/{price_id}/change_options` lists the upgrades and downgrades the API allows from this price.'
        self_downgrade:
          type:
          - boolean
          - 'null'
          description: 'Legacy setting with no effect: no checkout, customer portal or API plan change reads it. `GET /products/prices/{price_id}/change_options` lists the upgrades and downgrades the API allows from this price.'
        self_reactivate:
          type:
          - boolean
          - 'null'
          description: Customer can reactivate
        interval_count:
          type:
          - integer
          - 'null'
          description: How many intervals between charges — interval 'months' with interval_count 3 bills every 3 months. Required when payment_type is subscription or payment_plan.
        payment_type:
          type:
          - string
          - 'null'
          enum:
          - one_time
          - subscription
          - payment_plan
          - null
          description: Defaults to 'one_time' if left blank
        visible:
          type:
          - boolean
          - 'null'
          description: Visible
        compare_at_amount:
          type:
          - string
          - 'null'
          description: Compare at amount
        key:
          type:
          - string
          - 'null'
          description: Key
        archived:
          type:
          - boolean
          - 'null'
          description: Archived
      example:
        products_price:
          name: Example Price
          amount: '100.00'
          cost: '0.00'
          currency: USD
          duration: null
          interval: null
          trial_interval: null
          trial_duration: null
          trial_amount: '0.00'
          setup_amount: null
          self_cancel: true
          self_upgrade: true
          self_downgrade: true
          self_reactivate: true
          interval_count: null
          payment_type: one_time
          visible: true
          compare_at_amount: null
          key: null
          archived: false
    ProductsPriceAttributes:
      type: object
      title: Prices
      description: Prices
      properties:
        id:
          type: integer
          description: ID
        public_id:
          type:
          - string
          - 'null'
          description: Price public ID
        variant_id:
          type:
          - integer
          - 'null'
          description: Variant
        name:
          type:
          - string
          - 'null'
          description: Name
        amount:
          type: string
          description: Amount
        cost:
          type:
          - string
          - 'null'
          description: Cost
        currency:
          type: string
