components:
  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: string
    per_page:
      name: per_page
      in: query
      required: false
      description: Records per page. Defaults to 20; raise it up to 100 for bulk reads. A larger value returns 100 records. Zero, a negative or a non-integer value is a 422. The `Link` next-page URL keeps the value, so a client following it keeps the page size. More [in our guides](https://developers.myclickfunnels.com/docs/pagination).
      schema:
        type: integer
        minimum: 1
        default: 20
    sort_property:
      name: sort_property
      in: query
      description: 'Sort property of a list response. The default is id and thus the created_at order.

        If you sort by other properties, we additionally sort by id implicitly as a secondary sort property, so that you can rely on the sort order to be deterministic even if the main sort property ends up with the same values.

        '
      required: false
      schema:
        type: string
        enum:
        - id
        - updated_at
    sort_order:
      name: sort_order
      in: query
      description: Sort order of a list response. Use 'desc' to reverse the default 'asc' (ascending) sort order. Examples [in our guides](https://developers.myclickfunnels.com/docs/pagination).
      required: false
      schema:
        type: string
        enum:
        - asc
        - desc
    after:
      name: after
      in: query
      required: false
      schema:
        type: string
      description: ID of item after which the collection should be returned. More examples and info about pagination [in our guides](https://developers.myclickfunnels.com/docs/pagination).
  responses:
    InvalidPageSize:
      description: Unprocessable Entity - `per_page` must be a positive integer.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
              hint:
                type:
                - string
                - 'null'
                description: Next step for the caller, or null when no additional guidance applies.
          example:
            error: 'Request unprocessable: per_page must be a positive integer, capped at 100 (got "0")'
            hint: null
  schemas:
    CoursesEnrollmentParametersUpdate:
      type: object
      title: Enrollments
      description: Enrollments
      required: []
      properties:
        suspended:
          type:
          - boolean
          - 'null'
          description: Suspended
        suspension_reason:
          type:
          - string
          - 'null'
          description: Suspension Reason
      example:
        courses_enrollment:
          suspended: false
          suspension_reason: Call in to reapply after robot incident
    CoursesEnrollmentParameters:
      type: object
      title: Enrollments
      description: Enrollments
      required:
      - contact_id
      properties:
        contact_id:
          type: integer
          description: Contact ID
        suspended:
          type:
          - boolean
          - 'null'
          description: Suspended
        suspension_reason:
          type:
          - string
          - 'null'
          description: Suspension Reason
      example:
        courses_enrollment:
          contact_id: 3
          suspended: false
          suspension_reason: Call in to reapply after robot incident
    ContactShortAttributes:
      type: object
      title: Contact (Short)
      description: A compact contact representation used in nested resources.
      properties:
        id:
          type: integer
          description: The ID of the contact.
        public_id:
          type: string
          description: The public ID of the contact.
        email_address:
          type: string
          description: The email address of the contact.
        first_name:
          type:
          - string
          - 'null'
          description: The first name of the contact.
        last_name:
          type:
          - string
          - 'null'
          description: The last name of the contact.
        phone_number:
          type:
          - string
          - 'null'
          description: The phone number of the contact.
      example:
        id: 24359
        public_id: vQxYMj
        email_address: jane.doe@example.com
        first_name: Jane
        last_name: Doe
        phone_number: '+18005550199'
    CoursesEnrollmentAttributes:
      type: object
      title: Enrollments
      description: Enrollments
      properties:
        id:
          type: integer
          description: Enrollment ID
        public_id:
          type:
          - string
          - 'null'
          description: Enrollment public ID
        contact_id:
