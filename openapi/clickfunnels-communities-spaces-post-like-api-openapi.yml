openapi: 3.2.0
info:
  title: ClickFunnels Communities::Spaces::Post::Like API
  termsOfService: https://www.clickfunnels.com/terms-of-service
  contact:
    name: ClickFunnels API Team
    url: https://developers.myclickfunnels.com
  x-logo:
    url: https://statics.myclickfunnels.com/image/1126065/file/31edf05760fafe41a82f16a668ab251f.png
  description: 'The ClickFunnels REST API that powers webhooks, native integrations, and Zapier lets you manage your ClickFunnels data, automate your workflows, and recreate ClickFunnels functionality in your own apps.

    '
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  version: 2.0.0
servers:
- url: https://{subdomain}.myclickfunnels.com/api/v2
  description: ClickFunnels API
  variables:
    subdomain:
      default: myworkspace
security:
- BearerAuth: []
tags:
- name: Communities::Spaces::Post::Like
  description: '> Post Likes record a Contact''s like reaction on a Community Post.


    A Post Like belongs to a Post and is authored by a Contact. Likes have no update operation — create one to like, delete it to unlike.

    '
paths:
  /communities/spaces/posts/{post_id}/likes:
    get:
      tags:
      - Communities::Spaces::Post::Like
      summary: List Post Likes
      description: List likes for a post
      operationId: listCommunitiesSpacesPostsLikes
      parameters:
      - name: post_id
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/after'
      - $ref: '#/components/parameters/sort_order'
      - $ref: '#/components/parameters/sort_property'
      responses:
        '200':
          description: OK
          headers:
            Pagination-Next:
              $ref: '#/components/headers/PaginationNext'
            Link:
              $ref: '#/components/headers/Link'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CommunitiesSpacesPostsLikeAttributes'
              example:
              - id: 301
                public_id: StUvWx
                post_id: 101
                contact_id: 55
                contact_public_id: GhIjKl
                created_at: '2025-01-01T00:00:00.000Z'
                updated_at: '2025-01-01T00:00:00.000Z'
                contact: null
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: API key missing or invalid
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: 'Not found: Record missing'
    post:
      tags:
      - Communities::Spaces::Post::Like
      summary: Create Post Like
      description: Like a post. The `contact_id` is optional and defaults to the connected user's own contact.
      operationId: createCommunitiesSpacesPostsLikes
      parameters:
      - name: post_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        description: Information about a new Post Like
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                communities_spaces_posts_like:
                  type: object
                  $ref: '#/components/schemas/CommunitiesSpacesPostsLikeParameters'
            example:
              communities_spaces_posts_like: {}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunitiesSpacesPostsLikeAttributes'
              example:
                id: 301
                public_id: StUvWx
                post_id: 101
                contact:
                  id: 55
                  public_id: GhIjKl
                  email_address: jane@example.com
                  first_name: Jane
                  last_name: Doe
                  phone_number: null
                created_at: '2025-01-01T00:00:00.000Z'
                updated_at: '2025-01-01T00:00:00.000Z'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: API key missing or invalid
  /communities/spaces/posts/likes/{id}:
    delete:
      tags:
      - Communities::Spaces::Post::Like
      summary: Remove Post Like
      description: Unlike a post by deleting the like record
      operationId: removeCommunitiesSpacesPostsLikes
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '204':
          description: No Content
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: API key missing or invalid
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: 'Not found: Record missing'
components:
  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: string
    sort_property:
      name: sort_property
      in: query
      description: 'Sort property of a list response. The default is id and thus the created_at order.

        If you sort by other properties, we additionally sort by id implicitly as a secondary sort property, so that you can rely on the sort order to be deterministic even if the main sort property ends up with the same values.

        '
      required: false
      schema:
        type: string
        enum:
        - id
        - updated_at
    sort_order:
      name: sort_order
      in: query
      description: Sort order of a list response. Use 'desc' to reverse the default 'asc' (ascending) sort order. Examples [in our guides](https://developers.myclickfunnels.com/docs/pagination).
      required: false
      schema:
        type: string
        enum:
        - asc
        - desc
    after:
      name: after
      in: query
      required: false
      schema:
        type: string
      description: ID of item after which the collection should be returned. More examples and info about pagination [in our guides](https://developers.myclickfunnels.com/docs/pagination).
  schemas:
    CommunitiesSpacesPostsLikeAttributes:
      type: object
      title: Communities::Spaces::Post::Like
      description: Communities::Spaces::Post::Like
      properties:
        id:
          type: integer
          description: Like ID
        public_id:
          type:
          - string
          - 'null'
          description: Like public ID
        post_id:
          type: integer
          description: ID of the Post that was liked
        contact:
          description: Short representation of the Contact who liked the post, or null if the contact has been deleted
          type:
          - object
          - 'null'
          properties:
            id:
              type: integer
              description: Contact ID
            public_id:
              type: string
              description: Contact public ID
            email_address:
              type:
              - string
              - 'null'
              description: Contact email address
            first_name:
              type:
              - string
              - 'null'
              description: Contact first name
            last_name:
              type:
              - string
              - 'null'
              description: Contact last name
            phone_number:
              type:
              - string
              - 'null'
              description: Contact phone number
        created_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Created at
        updated_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Updated at
      example:
        id: 301
        public_id: StUvWx
        post_id: 101
        contact:
          id: 55
          public_id: GhIjKl
          email_address: jane@example.com
          first_name: Jane
          last_name: Doe
          phone_number: null
        created_at: '2025-01-01T00:00:00.000Z'
        updated_at: '2025-01-01T00:00:00.000Z'
      required:
      - contact
      - created_at
      - id
      - post_id
      - public_id
      - updated_at
    CommunitiesSpacesPostsLikeParameters:
      type: object
      title: Communities::Spaces::Post::Like
      description: Communities::Spaces::Post::Like
      properties:
        contact_id:
          type:
          - integer
          - 'null'
          description: ID of the Contact to record the like for. Optional — defaults to the connected user's own contact.
      example:
        communities_spaces_posts_like: {}
  headers:
    Link:
      description: A direct link to the next page for the cursor-based pagination. It includes the `after` and the Pagination-Next ID value.
      schema:
        type: string
    PaginationNext:
      description: ID of the last item in the current response after which more records exist. You can use it in an `after` query parameter for cursor-based pagination to get to the next page.
      schema:
        type: string
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
externalDocs:
  description: More in-depth guides and further resources
  url: https://developers.myclickfunnels.com
