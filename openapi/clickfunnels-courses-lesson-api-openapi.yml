  /courses/lessons/{id}/publish:
    post:
      tags:
      - Courses::Lesson
      summary: Publish Lesson
      description: 'Makes a single lesson live by setting `published_at`. Pass an optional future `published_at` to schedule it; omit it to publish now. A past `published_at` is rejected. A lesson''s `published_at` is not writable via `updateCoursesLessons`, so this is the way to publish or schedule an individual lesson.

        See Publishing in the Courses Skill for the other publish paths.'
      operationId: publishCoursesLessons
      parameters:
      - $ref: '#/components/parameters/id'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                published_at:
                  type: string
                  format: date-time
                  description: Optional ISO 8601 datetime at which the lesson should become live. Must be now or in the future — a past datetime is rejected. Omit to publish immediately.
            example:
              published_at: '2026-09-01T09:00:00.000Z'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoursesLessonAttributes'
              example:
                id: 5
                public_id: OfXUJp
                title: Lesson 5
                body: Example Lesson
                section_id: 15
                published_at: '2026-09-01T09:00:00.000Z'
                current_path: null
                sort_order: 4
                created_at: '2025-01-01T00:00:00.000Z'
                updated_at: '2025-01-01T00:00:00.000Z'
