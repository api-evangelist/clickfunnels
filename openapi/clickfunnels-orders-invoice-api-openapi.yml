          description: Not Found - the invoice does not exist, does not belong to a workspace your API key can access, is not in an abandonable status (`unpaid`, `draft`, `past_due`), or belongs to a deleted order. Fetch the invoice first and check `status` to tell these apart.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              examples:
                not_abandonable_or_inaccessible:
                  summary: Already paid, or outside the workspaces this key can reach
                  value:
                    error: Not found
                no_such_invoice:
                  summary: No invoice with that id
                  value:
                    error: 'Not found: Record 838 missing'
        '422':
          description: Unprocessable Entity - the payment processor rejected the abandon or did not move the invoice to `abandoned`. The invoice keeps its previous status and its retry schedule; safe to retry.
