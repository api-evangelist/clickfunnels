    OrdersInvoiceParametersUpdate:
      type: object
      title: External Invoice Update
      description: 'Parameters for updating an external invoice. Only external orders support invoice updates via the API.

        Note: The `invoice_type` cannot be changed after creation. New line items cannot be added during update;

        only existing line items can be modified by providing their `id`.

        '
      properties:
        status:
          type: string
          description: 'The billing status of the invoice.


            For external orders, valid statuses are: `unpaid`, `paid`, `voided`, `refunded`, `disputed`, `past-due`.


            When changing status to `paid`, you must also provide `paid_at`.

            A change in status will update the `billing_status` of the parent order.

            If a one-time order''s invoice status is changed to `paid`, the order''s `service_status` will also flip to `completed`.

            '
          enum:
          - unpaid
          - paid
          - voided
          - refunded
          - disputed
          - past-due
        external_id:
          type: string
          description: 'The unique identifier for this invoice in your external system.

            This ID allows you to correlate ClickFunnels invoices with records in your payment processor.

            '
        invoice_number:
          type:
          - string
          - 'null'
          description: 'A sequential number for bookkeeping purposes.

            '
        shipping_amount:
          type:
          - string
          - 'null'
          description: Invoiced shipping amount. Cannot be negative.
        issued_at:
          type:
          - string
          - 'null'
          format: date-time
          description: The date the invoice was issued.
        due_at:
          type:
          - string
          - 'null'
          format: date-time
          description: The date the invoice is due.
        paid_at:
          type:
          - string
          - 'null'
          format: date-time
          description: 'The date the invoice was paid. Required when changing `status` to `paid`.

            '
        line_items_attributes:
          type: array
          description: 'Update existing line items. Only line items with an `id` will be processed;

            new line items (without `id`) are ignored during updates.

            '
          items:
            type: object
            required:
            - id
            properties:
              id:
                type: integer
                description: 'Required. The ID of the existing line item to update.

                  Line items without an ID are ignored during updates.

                  '
              amount:
                type: string
                description: The price amount for this line item.
              quantity:
                type: integer
                description: The quantity of items.
              description:
                type:
                - string
                - 'null'
                description: Optional description for the line item.
      example:
        orders_invoice:
          status: paid
          paid_at: '2025-01-10T00:00:00.000Z'
          line_items_attributes:
          - id: 682
            amount: '99.00'
            quantity: 2
  headers:
    Link:
      description: A direct link to the next page for the cursor-based pagination. It includes the `after` and the Pagination-Next ID value.
      schema:
        type: string
    PaginationNext:
      description: ID of the last item in the current response after which more records exist. You can use it in an `after` query parameter for cursor-based pagination to get to the next page.
      schema:
        type: string
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
