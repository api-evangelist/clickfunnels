components:
  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: string
    sort_property:
      name: sort_property
      in: query
      description: 'Sort property of a list response. The default is id and thus the created_at order.

        If you sort by other properties, we additionally sort by id implicitly as a secondary sort property, so that you can rely on the sort order to be deterministic even if the main sort property ends up with the same values.

        '
      required: false
      schema:
        type: string
        enum:
        - id
        - updated_at
    sort_order:
      name: sort_order
      in: query
      description: Sort order of a list response. Use 'desc' to reverse the default 'asc' (ascending) sort order. Examples [in our guides](https://developers.myclickfunnels.com/docs/pagination).
      required: false
      schema:
        type: string
        enum:
        - asc
        - desc
    InvoiceFilter:
      name: filter
      in: query
      description: 'Filter by available properties in query params, like this: `api/v2/resources?filter[id]=value&filter[another_property]=value1,value2`. Check our Filtering guide for examples and all about filtering [here](https://developers.myclickfunnels.com/docs/filtering).

        '
      required: false
      schema:
        type: object
        properties:
          id:
            type: string
            description: A comma-separated list of Invoice IDs to filter by.
            example: 1,42
          status:
            type: string
            description: The status of the invoice to filter by.
            example: pending
          invoice_type:
            type: string
            description: The type of the invoice to filter by.
            example: one_time_sale
          invoice_number:
            type: string
            description: A comma-separated list of Invoice Numbers to filter by.
            example: '#1000,#1001'
          external_id:
            type: string
            description: A comma-separated list of External IDs to filter by.
            example: inv_1234567890,inv_0987654321
      style: deepObject
      explode: true
    after:
      name: after
      in: query
      required: false
      schema:
        type: string
      description: ID of item after which the collection should be returned. More examples and info about pagination [in our guides](https://developers.myclickfunnels.com/docs/pagination).
  schemas:
    OrderBaseAttributes:
      type: object
      title: Order (Base)
      description: 'Base order attributes used in nested responses (e.g., within invoice responses).

        This is a subset of the full OrderAttributes schema.

        '
      properties:
        id:
          type: integer
          description: ClickFunnels Order ID
        public_id:
          type: string
          description: ClickFunnels Order public ID
        order_number:
          type:
          - string
          - 'null'
          description: A sequential number for bookkeeping purposes increased by 1 for each new order in a workspace starting from
        total_amount:
          type:
          - string
          - 'null'
          description: The total amount of the order, considering taxes and discounts.
        origination_channel_id:
          type: integer
          description: Origination Channel ID
        origination_channel_type:
          type:
          - string
          - 'null'
          description: Origination Channel Type
        notes:
          type:
          - string
          - 'null'
          description: Your internal note about the order. This will be visible in ClickFunnels admin orders-related sections.
        live_mode:
          type: boolean
          description: Indicates if the Order will use a live payment gateway and process real credit cards.
        in_trial:
          type: boolean
          description: In Trial
        billing_status:
          type: string
          description: 'The billing status reflects the status of the invoice of an order.

            Billing status can be one of the following for Payments AI and Stripe orders:

            `pending`, `draft`, `paid`, `unpaid`, `partially-refunded`, `refunded`, `voided`, `disputed`, `past-due`.

            For external orders, the billing status can be one of: `pending`, `paid`, `unpaid`, `voided` and `refunded`.

            '
        service_status:
          type: string
          description: 'The service status reflects the activity state of the order.

            For external one-time orders possible service statuses are `pending` or `completed`.

            For external subscription orders possible statuses are `pending`, `active`, `churned`, `canceled`, `completed`, `paused`.

            '
        order_type:
          type: string
          description: Order Type
        next_charge_at:
          type:
          - string
          - 'null'
          description: Next Charge At
        trial_end_at:
          type:
          - string
          - 'null'
          description: Trial End At
        tag_ids:
          type: array
          items:
            type: integer
          description: Order Tags
        activated_at:
          type:
          - string
          - 'null'
          description: Date Activated
        canceled_at:
          type:
          - string
          - 'null'
          description: Order Canceled At
        canceled_by:
          type:
          - string
          - 'null'
          description: Order Canceled By
        cancel_reason:
          type:
          - string
          - 'null'
          description: 'The reason code for the cancelation. Possible codes for external orders are:

            `customer_service`, `low_quality`, `missing_features`, `other`, `switched_service`, `too_complex`, `too_expensive`, `unused`

            '
        cancel_description:
          type:
          - string
          - 'null'
          description: A free-text description of the cancellation reason.
