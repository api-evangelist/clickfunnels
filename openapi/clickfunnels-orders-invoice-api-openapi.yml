      parameters:
      - name: order_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        description: 'Information about a new external invoice. Only external orders support invoice creation via the API.

          External orders are orders where payments are processed outside of ClickFunnels.

          '
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                orders_invoice:
                  type: object
                  description: 'The invoice parameters. Only external orders support invoice creation via the API.

