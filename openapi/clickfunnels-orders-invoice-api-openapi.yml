    OrdersInvoiceParameters:
      type: object
      title: External Invoice
      description: 'Parameters for creating an external invoice. Only external orders support invoice creation via the API.

        External orders are orders where payments are processed outside of ClickFunnels.

        '
      required:
      - external_id
      - status
      properties:
        external_id:
          type: string
          description: 'Required. A unique identifier for this invoice in your external system.

            This ID allows you to correlate ClickFunnels invoices with records in your payment processor.

            '
        status:
          type: string
          description: 'Required. The billing status of the invoice.


            For external one-time orders, valid statuses are: `unpaid`, `paid`, `voided`, `refunded`, `disputed`, `past-due`.

            For external subscription orders, the same statuses apply.


            When creating an invoice with status `paid`, you must also provide `paid_at`.

            A change in status will update the `billing_status` of the parent order.

            If a one-time order''s invoice status is changed to `paid`, the order''s `service_status` will also flip to `completed`.

            '
          enum:
          - unpaid
          - paid
          - voided
          - refunded
          - disputed
          - past-due
        invoice_type:
          type: string
          description: 'The type of invoice. If not provided, defaults based on the order type:

            - For one-time orders: `one_time_sale`

            - For subscription orders: `initial`


            For subscription orders, valid types are: `initial`, `renewal`, `interim`, `cancellation`, `one_time`, `refund`, `charge`.

            For one-time orders, only `one_time_sale` is valid.

            '
          enum:
          - initial
          - renewal
          - interim
          - cancellation
          - one_time
          - refund
          - charge
          - one_time_sale
        invoice_number:
          type:
          - string
          - 'null'
          description: 'Optional. A sequential number for bookkeeping purposes.

            If not provided, one will be auto-generated.

            '
        shipping_amount:
          type:
          - string
          - 'null'
          description: Invoiced shipping amount. Cannot be negative. Defaults to "0.00".
        issued_at:
          type:
          - string
          - 'null'
          format: date-time
          description: The date the invoice was issued.
        due_at:
          type:
          - string
          - 'null'
          format: date-time
          description: The date the invoice is due.
        paid_at:
          type:
          - string
          - 'null'
          format: date-time
          description: 'The date the invoice was paid. Required when `status` is `paid`.

            '
        line_items_attributes:
          type: array
          description: 'Line items for the invoice. Each line item represents a product/variant being invoiced.

            Required fields for each line item: `amount`, `quantity`, `variant_id`, `products_price_id`.

            '
          items:
            type: object
            required:
            - amount
            - quantity
            - variant_id
            - products_price_id
            properties:
              amount:
                type: string
                description: The price amount for this line item.
              quantity:
                type: integer
                description: The quantity of items.
              variant_id:
                type: integer
                description: The product variant ID.
              products_price_id:
                type: integer
                description: The product price ID.
              description:
                type:
                - string
                - 'null'
                description: Optional description for the line item.
      example:
        orders_invoice:
          external_id: inv-ext-12345
          status: paid
          invoice_type: one_time_sale
          invoice_number: INV-001
          shipping_amount: '9.99'
          issued_at: '2025-01-01T00:00:00.000Z'
          due_at: '2025-01-15T00:00:00.000Z'
          paid_at: '2025-01-10T00:00:00.000Z'
          line_items_attributes:
          - amount: '99.00'
            quantity: 1
            variant_id: 123
            products_price_id: 456
            description: Premium Widget
