  /users/{id}:
    get:
      tags:
      - User
      summary: Fetch User
      description: Retrieve a single user
      operationId: fetchUser
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAttributes'
              example:
                id: 11
                public_id: nQDZEX
                email: test@email.com
                first_name: Eugenio
                last_name: Watsica
                time_zone: Pacific Time (US & Canada)
                locale: en
