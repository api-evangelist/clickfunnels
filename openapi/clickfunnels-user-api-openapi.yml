openapi: 3.2.0
info:
  title: ClickFunnels User API
  termsOfService: https://www.clickfunnels.com/terms-of-service
  contact:
    name: ClickFunnels API Team
    url: https://developers.myclickfunnels.com
  x-logo:
    url: https://statics.myclickfunnels.com/image/1126065/file/31edf05760fafe41a82f16a668ab251f.png
  description: 'The ClickFunnels REST API that powers webhooks, native integrations, and Zapier lets you manage your ClickFunnels data, automate your workflows, and recreate ClickFunnels functionality in your own apps.

    '
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  version: 2.0.0
servers:
- url: https://{subdomain}.myclickfunnels.com/api/v2
  description: ClickFunnels API
  variables:
    subdomain:
      default: myworkspace
security:
- BearerAuth: []
tags:
- name: User
  description: Users
paths:
  /users:
    get:
      tags:
      - User
      summary: List Users
      description: 'List users for the current account. Note: an OAuth/API integration authenticates as a

        **platform-agent user** (e.g. "Default API Client"), so this endpoint is scoped to that

        agent and typically returns only it — it is **not** the way to enumerate the human team

        members. To find real team members (for example a workflow `notify_step`''s `user_ids`),

        use `GET /api/v2/teams/{team_id}/memberships` and read each membership''s `user_id`

        (`notify_step` only accepts non-platform team members).

        '
      operationId: listUsers
      parameters:
      - $ref: '#/components/parameters/after'
      - $ref: '#/components/parameters/sort_order'
      - $ref: '#/components/parameters/sort_property'
      responses:
        '200':
          description: OK
          headers:
            Pagination-Next:
              $ref: '#/components/headers/PaginationNext'
            Link:
              $ref: '#/components/headers/Link'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserAttributes'
              example:
              - id: 9
                public_id: QxvoAS
                email: test@email.com
                first_name: Kevin
                last_name: Hoppe
                time_zone: Pacific Time (US & Canada)
                locale: en
                created_at: '2025-01-01T00:00:00.000Z'
                updated_at: '2025-01-01T00:00:00.000Z'
                memberships:
                - id: 10
                  public_id: vYxaJB
                  team_id: 4
                  user_id: 9
                  user_first_name: null
                  user_last_name: null
                  user_profile_photo_id: null
                  user_email: null
                  added_by_id: null
                  platform_agent_of_id: null
                  role_ids:
                  - admin
                  created_at: '2025-01-27T12:44:11.708Z'
                  updated_at: '2025-01-27T12:44:11.776Z'
                  user:
                    id: 4
