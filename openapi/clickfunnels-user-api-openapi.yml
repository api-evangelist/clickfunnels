                        quantity: 1
                        created_at: '2025-01-27T12:46:33.458Z'
                        updated_at: '2025-01-27T12:46:33.458Z'
              - id: 10
                public_id: boYPTU
                email: test@email.com
                first_name: Tandra
                last_name: Bechtelar
                time_zone: Pacific Time (US & Canada)
                locale: en
                created_at: '2025-01-01T00:00:00.000Z'
                updated_at: '2025-01-01T00:00:00.000Z'
                memberships:
                - id: 11
                  public_id: OezDJK
                  team_id: 6
                  user_id: 10
                  user_first_name: null
                  user_last_name: null
                  user_profile_photo_id: null
                  user_email: noreply+f59f2d7a1f5fbdf431a5772b5e4ca0e4@bullettrain.co
