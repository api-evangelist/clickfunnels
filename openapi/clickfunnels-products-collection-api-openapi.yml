openapi: 3.2.0
info:
  title: ClickFunnels Products::Collection API
  termsOfService: https://www.clickfunnels.com/terms-of-service
  contact:
    name: ClickFunnels API Team
    url: https://developers.myclickfunnels.com
  x-logo:
    url: https://statics.myclickfunnels.com/image/1126065/file/31edf05760fafe41a82f16a668ab251f.png
  description: 'The ClickFunnels REST API that powers webhooks, native integrations, and Zapier lets you manage your ClickFunnels data, automate your workflows, and recreate ClickFunnels functionality in your own apps.


    ### For AI agents


    This document is the catalogue: every operation ClickFunnels exposes over REST is described here, with a unique operationId, typed schemas, and the scopes it needs. It is served from `/openapi.json`, `/openapi.yaml`, `/api/openapi.{json,yaml}`, and `/api/v2/openapi.{json,yaml}` on the accounts host.


    Three things it does not describe, each one request away:


    - MCP server: the app-native Model Context Protocol server (Streamable HTTP, OAuth 2.1 with PKCE). Prefer it over raw REST when your client supports MCP - it describes itself at runtime.

    - Skill guides, also as an Agent Skills index: one task guide per job (pages, blogs, products, orders, workflows, emails, courses, stats, external SDK pages). Read the guide that matches your job before your first write. llms.txt covers when to use ClickFunnels at all, how to get credentials, and how to behave around rate limits.

    - Protected resource metadata (RFC 9728) and authorization server metadata (RFC 8414): the scope vocabulary and the OAuth endpoints. Dynamic client registration is for MCP clients only.


    On ClickFunnels-owned API hosts (`myclickfunnels.com` and its subdomains), the OpenAPI specification responses and API authentication failures (401, or 403 for insufficient scope) carry those links in an RFC 8288 `Link` header, so clients can discover the documentation and authentication metadata from those responses. Requests sent through a customer''s custom domain keep the Bearer challenge but omit those discovery pointers.'
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  version: 2.0.0
servers:
- url: https://{subdomain}.myclickfunnels.com/api/v2
  description: ClickFunnels API
  variables:
    subdomain:
      default: myworkspace
security:
- BearerAuth: []
- OAuth2: []
tags:
- name: Products::Collection
  description: Product Collections
paths:
  /workspaces/{workspace_id}/products/collections:
    get:
      tags:
      - Products::Collection
      summary: List Collections
      operationId: listProductsCollections
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/after'
      - $ref: '#/components/parameters/per_page'
      - $ref: '#/components/parameters/sort_order'
      - $ref: '#/components/parameters/sort_property'
      - name: filter
        in: query
        description: 'Filter by available properties in query params, like this: `api/v2/resources?filter[id]=value&filter[another_property]=value1,value2`. Check our Filtering guide for examples and all about filtering [here](https://developers.myclickfunnels.com/docs/filtering).

          '
        required: false
        schema:
          type: object
          properties:
            id:
              type: string
              description: A comma-separated list of collection IDs to filter by.
              example: 1,2,3
            visible_in_store:
              type: boolean
              description: Filter collections by visibility in the online store.
              example: true
              enum:
              - true
              - false
            archived:
              type: boolean
              description: Filter collections by archived state.
              example: true
              enum:
              - true
              - false
        style: deepObject
        explode: true
      responses:
        '200':
          description: OK
          headers:
            Pagination-Next:
              $ref: '#/components/headers/PaginationNext'
            Link:
              $ref: '#/components/headers/Link'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductsCollectionAttributes'
              example:
              - id: 2
                public_id: gkIDBR
                workspace_id: 42000
                name: Example Collection
                description: Example Description
                collection_type: manual
                product_ids: []
                sort_method: manually
                archived: false
                image_id: null
                visible_in_store: true
                current_path: null
                seo_title: Example SEO Title
                seo_description: Example SEO Description
                seo_indexable: null
                social_image_id: null
                created_at: null
                updated_at: null
              - id: 3
                public_id: zObwQt
                workspace_id: 42000
                name: Example Collection
                description: Example Description
                collection_type: manual
                product_ids: []
                sort_method: manually
                archived: false
                image_id: null
                visible_in_store: true
                current_path: null
                seo_title: Example SEO Title
                seo_description: Example SEO Description
                seo_indexable: null
                social_image_id: null
                created_at: null
                updated_at: null
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  hint:
                    type:
                    - string
                    - 'null'
                    description: 'The next step for the caller: how to authenticate, which scope was missing, or where the route list lives. Always present, and null when this error has no next step to offer.'
              example:
                error: API key missing or invalid
                hint: 'Send the token as `Authorization: Bearer <token>`. Create one under Account > Team > Platform Applications (a workspace API key), or obtain one with OAuth 2.1; both use the same scopes. See https://developers.myclickfunnels.com/docs/authentication, or append .md to that URL for markdown.'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Not found - This usually happens when you try to access a record that does not exist in your account. It can also happen when the provided parent record is missing, e.g. you have put in a non-existent Workspaces parent ID.
                  hint:
                    type:
                    - string
                    - 'null'
                    description: 'The next step for the caller: how to authenticate, which scope was missing, or where the route list lives. Always present, and null when this error has no next step to offer.'
              example:
                error: 'Not found: Record missing'
                hint: null
        '422':
          $ref: '#/components/responses/InvalidPageSize'
    post:
      tags:
      - Products::Collection
      summary: Create Collection
      operationId: createProductsCollections
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        description: Information about a new Collection
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                products_collection:
                  type: object
                  $ref: '#/components/schemas/ProductsCollectionParameters'
            example:
              products_collection:
                name: Example Collection
                description: Example Description
                collection_type: manual
                product_ids: []
                sort_method: manually
                image_id: null
                visible_in_store: true
                seo_title: Example SEO Title
                seo_description: Example SEO Description
                social_image_id: null
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductsCollectionAttributes'
              example:
                id: 5
                public_id: RxuFTU
                workspace_id: 42000
                name: Example Collection
                description: Example Description
                collection_type: manual
                product_ids: []
                sort_method: manually
                archived: false
                image_id: null
                visible_in_store: true
                current_path: null
                seo_title: Example SEO Title
                seo_description: Example SEO Description
                seo_indexable: null
                social_image_id: null
                created_at: null
                updated_at: null
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  hint:
                    type:
                    - string
                    - 'null'
                    description: 'The next step for the caller: how to authenticate, which scope was missing, or where the route list lives. Always present, and null when this error has no next step to offer.'
              example:
                error: 'Bad request: HTTP body must be valid JSON'
                hint: null
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  hint:
                    type:
                    - string
                    - 'null'
                    description: 'The next step for the caller: how to authenticate, which scope was missing, or where the route list lives. Always present, and null when this error has no next step to offer.'
              example:
                error: API key missing or invalid
                hint: 'Send the token as `Authorization: Bearer <token>`. Create one under Account > Team > Platform Applications (a workspace API key), or obtain one with OAuth 2.1; both use the same scopes. See https://developers.myclickfunnels.com/docs/authentication, or append .md to that URL for markdown.'
