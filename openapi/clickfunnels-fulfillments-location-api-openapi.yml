        '200':
          description: OK
          headers:
            Pagination-Next:
              $ref: '#/components/headers/PaginationNext'
            Link:
              $ref: '#/components/headers/Link'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FulfillmentsLocationAttributes'
              example:
              - id: 8
                public_id: OcTvQz
                workspace_id: 42000
                name: Example Location
                address_name: Example Address
                email_address: myemail1754939695@example.com
                phone_number: (123)-555-4567
                sort_order: 1
                archived: false
                external_app: true
                created_at: null
                updated_at: null
                address:
                  address_one: 3443 W. Bavaria St.
                  address_two: Suite 100
                  city: Eagle
                  region: Idaho
                  country: US
                  postal_code: '83616'
              - id: 9
                public_id: ZxWBnk
                workspace_id: 42000
                name: Example Location
                address_name: Example Address
                email_address: myemail1754939695@example.com
                phone_number: (123)-555-4567
                sort_order: 1
                archived: false
                external_app: true
                created_at: null
                updated_at: null
                address:
                  address_one: 3443 W. Bavaria St.
                  address_two: Suite 100
                  city: Eagle
                  region: Idaho
                  country: US
                  postal_code: '83616'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  hint:
                    type:
                    - string
                    - 'null'
                    description: 'The next step for the caller: how to authenticate, which scope was missing, or where the route list lives. Always present, and null when this error has no next step to offer.'
              example:
                error: API key missing or invalid
                hint: 'Send the token as `Authorization: Bearer <token>`. Create one under Account > Team > Platform Applications (a workspace API key), or obtain one with OAuth 2.1; both use the same scopes. See https://developers.myclickfunnels.com/docs/authentication, or append .md to that URL for markdown.'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Not found - This usually happens when you try to access a record that does not exist in your account. It can also happen when the provided parent record is missing, e.g. you have put in a non-existent Workspaces parent ID.
                  hint:
                    type:
                    - string
                    - 'null'
                    description: 'The next step for the caller: how to authenticate, which scope was missing, or where the route list lives. Always present, and null when this error has no next step to offer.'
              example:
                error: 'Not found: Record missing'
                hint: null
        '422':
