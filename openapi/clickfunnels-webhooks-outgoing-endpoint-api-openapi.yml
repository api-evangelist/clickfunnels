      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhooksOutgoingEndpointAttributes'
              example:
                id: 7
                public_id: esoAND
                workspace_id: 42000
                url: https://example.com/some-endpoint-url
