                webhooks_outgoing_endpoint:
                  type: object
                  $ref: '#/components/schemas/WebhooksOutgoingEndpointParametersUpdate'
            example:
              webhooks_outgoing_endpoint:
                url: https://example.com/some-endpoint-url
                name: Example Endpoint
                event_type_ids:
                - contact.identified
                - one-time-order.completed
                page_ids: []
