        '200':
          description: OK
          headers:
            Pagination-Next:
              $ref: '#/components/headers/PaginationNext'
            Link:
              $ref: '#/components/headers/Link'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WebhooksOutgoingEndpointAttributes'
              example:
              - id: 2
                public_id: oFinTJ
                workspace_id: 42000
                url: https://example.com/some-endpoint-url
                name: Example Endpoint
                event_type_ids:
                - contact.identified
                - one-time-order.completed
                api_version: 2
                created_at: '2025-01-01T00:00:00.000Z'
                updated_at: '2025-01-01T00:00:00.000Z'
                page_ids: []
                funnel_ids: []
                webhook_secret_last_four: c3d4
              - id: 3
                public_id: KlIDGN
                workspace_id: 42000
                url: https://example.com/some-endpoint-url
                name: Example Endpoint
                event_type_ids:
                - contact.identified
                - one-time-order.completed
                api_version: 2
                created_at: '2025-01-01T00:00:00.000Z'
                updated_at: '2025-01-01T00:00:00.000Z'
                page_ids: []
                funnel_ids: []
                webhook_secret_last_four: c3d4
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  hint:
                    type:
                    - string
                    - 'null'
                    description: 'The next step for the caller: how to authenticate, which scope was missing, or where the route list lives. Always present, and null when this error has no next step to offer.'
              example:
                error: API key missing or invalid
                hint: 'Send the token as `Authorization: Bearer <token>`. Create one under Account > Team > Platform Applications (a workspace API key), or obtain one with OAuth 2.1; both use the same scopes. See https://developers.myclickfunnels.com/docs/authentication, or append .md to that URL for markdown.'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Not found - This usually happens when you try to access a record that does not exist in your account. It can also happen when the provided parent record is missing, e.g. you have put in a non-existent Workspaces parent ID.
                  hint:
                    type:
                    - string
                    - 'null'
                    description: 'The next step for the caller: how to authenticate, which scope was missing, or where the route list lives. Always present, and null when this error has no next step to offer.'
              example:
                error: 'Not found: Record missing'
                hint: null
        '422':
          $ref: '#/components/responses/InvalidPageSize'
    post:
      tags:
      - Webhooks::Outgoing::Endpoint
      summary: Create Endpoint
      description: Add a new webhook endpoint to a workspace
      operationId: createWebhooksOutgoingEndpoints
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        description: Information about a new Endpoint
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                webhooks_outgoing_endpoint:
                  type: object
                  $ref: '#/components/schemas/WebhooksOutgoingEndpointParameters'
            example:
              webhooks_outgoing_endpoint:
                url: https://example.com/some-endpoint-url
                name: Example Endpoint
                event_type_ids:
                - contact.identified
                - one-time-order.completed
                page_ids: []
                funnel_ids: []
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhooksOutgoingEndpointCreatedAttributes'
              example:
                id: 5
                public_id: GrVNvI
                workspace_id: 42000
                url: https://example.com/some-endpoint-url
                name: Example Endpoint
                event_type_ids:
                - contact.identified
                - one-time-order.completed
                api_version: 2
                created_at: '2025-01-01T00:00:00.000Z'
                updated_at: '2025-01-01T00:00:00.000Z'
                page_ids: []
                funnel_ids: []
                webhook_secret_last_four: c3d4
                webhook_secret: 3f9a1c7e5b2d4e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b9c0dc3d4
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  hint:
                    type:
                    - string
                    - 'null'
                    description: 'The next step for the caller: how to authenticate, which scope was missing, or where the route list lives. Always present, and null when this error has no next step to offer.'
              example:
                error: 'Bad request: HTTP body must be valid JSON'
                hint: null
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
