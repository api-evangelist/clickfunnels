components:
  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: string
    per_page:
      name: per_page
      in: query
      required: false
      description: Records per page. Defaults to 20; raise it up to 100 for bulk reads. A larger value returns 100 records. Zero, a negative or a non-integer value is a 422. The `Link` next-page URL keeps the value, so a client following it keeps the page size. More [in our guides](https://developers.myclickfunnels.com/docs/pagination).
      schema:
        type: integer
        minimum: 1
        default: 20
    sort_property:
      name: sort_property
      in: query
      description: 'Sort property of a list response. The default is id and thus the created_at order.

        If you sort by other properties, we additionally sort by id implicitly as a secondary sort property, so that you can rely on the sort order to be deterministic even if the main sort property ends up with the same values.

        '
      required: false
      schema:
        type: string
        enum:
        - id
        - updated_at
    sort_order:
      name: sort_order
      in: query
      description: Sort order of a list response. Use 'desc' to reverse the default 'asc' (ascending) sort order. Examples [in our guides](https://developers.myclickfunnels.com/docs/pagination).
      required: false
      schema:
        type: string
        enum:
        - asc
        - desc
    after:
      name: after
      in: query
      required: false
      schema:
        type: string
      description: ID of item after which the collection should be returned. More examples and info about pagination [in our guides](https://developers.myclickfunnels.com/docs/pagination).
  schemas:
    WebhooksOutgoingEndpointCreatedAttributes:
      type: object
      title: Created Outgoing Webhook Endpoint
      description: 'The newly created endpoint. The signing secret is returned as `webhook_secret` in this

        response only, so save it immediately: later reads return just its last four characters.

        '
      allOf:
      - $ref: '#/components/schemas/WebhooksOutgoingEndpointAttributes'
      - type: object
        properties:
          webhook_secret:
            type: string
            description: Signing secret, returned only in this create response.
      example:
        id: 5
        public_id: GrVNvI
        workspace_id: 42000
        url: https://example.com/some-endpoint-url
        name: Example Endpoint
        event_type_ids:
        - contact.identified
        - one-time-order.completed
        api_version: 2
        created_at: '2025-01-01T00:00:00.000Z'
        updated_at: '2025-01-01T00:00:00.000Z'
        page_ids: []
        funnel_ids: []
        webhook_secret_last_four: c3d4
        webhook_secret: 3f9a1c7e5b2d4e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b9c0dc3d4
    WebhooksOutgoingEndpointParametersUpdate:
      type: object
      title: Webhooks
      description: Webhooks
      required: []
      properties:
        url:
          type: string
          description: The URL that ClickFunnels event webhooks will be sent to.
        name:
          type: string
          description: The custom name for the webhook endpoint.
        event_type_ids:
          type: array
          description: 'The event type keys to which the webhook endpoint subscribes. Each value is a dotted or slashed string key

            (e.g. `contact.updated`, `order.completed`, `orders/invoice.paid`) — these are NOT numeric IDs.

            Retrieve the full list of valid keys from GET /api/v2/webhooks/outgoing/event_types

            (operationId: `listWebhooksOutgoingEventTypes`). The <a class="link" href="https://developers.myclickfunnels.com/docs/webhook-event-types" target="_blank">Webhook Event Types guide</a> provides supplementary context.


            On create, one or more valid `event_type_ids` are required.


            To remove one `event_type_id` on update, pass an array of all current `event_type_ids` less the one to be removed.


            On update to remove all `event_type_ids` pass an empty array.

            '
        page_ids:
          type:
          - array
          - 'null'
          description: 'The pages scope of the webhook, i.e., the endpoint will only subscribe to events triggered by users from the pages with the given IDs.

            If not configured initially (equalling null) or empty, subscribes to events fired from any page in the workspace.

            Updating the array will override existing values. To remove all `page_ids` pass an empty array or null.

            '
        funnel_ids:
          type:
          - array
          - 'null'
          description: 'The funnel scope of the webhook, i.e., the endpoint will only subscribe to events triggered by users from the funnels with the given IDs.

            If not configured initially (equalling null) or empty, subscribes to events fired from any funnel in the workspace.

            Updating the array will override existing values. To remove all `funnel_ids` pass an empty array or null.

            '
      example:
        webhooks_outgoing_endpoint:
          url: https://example.com/some-endpoint-url
          name: Example Endpoint
          event_type_ids:
          - contact.identified
          - one-time-order.completed
          page_ids: []
          funnel_ids: []
    WebhooksOutgoingEndpointParameters:
      type: object
      title: Webhooks
      description: Webhooks
      required:
      - url
      - name
      properties:
        url:
          type: string
          description: The URL that ClickFunnels event webhooks will be sent to.
        name:
          type: string
          description: The custom name for the webhook endpoint.
        event_type_ids:
          type: array
          description: 'The event type keys to which the webhook endpoint subscribes. Each value is a dotted or slashed string key

            (e.g. `contact.updated`, `order.completed`, `orders/invoice.paid`) — these are NOT numeric IDs.

            Retrieve the full list of valid keys from GET /api/v2/webhooks/outgoing/event_types

            (operationId: `listWebhooksOutgoingEventTypes`). The <a class="link" href="https://developers.myclickfunnels.com/docs/webhook-event-types" target="_blank">Webhook Event Types guide</a> provides supplementary context.


            On create, one or more valid `event_type_ids` are required.


            To remove one `event_type_id` on update, pass an array of all current `event_type_ids` less the one to be removed.


            On update to remove all `event_type_ids` pass an empty array.

            '
        page_ids:
          type:
          - array
          - 'null'
          description: 'The pages scope of the webhook, i.e., the endpoint will only subscribe to events triggered by users from the pages with the given IDs.

            If not configured initially (equalling null) or empty, subscribes to events fired from any page in the workspace.

            Updating the array will override existing values. To remove all `page_ids` pass an empty array or null.

            '
        funnel_ids:
          type:
          - array
          - 'null'
          description: 'The funnel scope of the webhook, i.e., the endpoint will only subscribe to events triggered by users from the funnels with the given IDs.

            If not configured initially (equalling null) or empty, subscribes to events fired from any funnel in the workspace.

            Updating the array will override existing values. To remove all `funnel_ids` pass an empty array or null.

            '
      example:
        webhooks_outgoing_endpoint:
          url: https://example.com/some-endpoint-url
          name: Example Endpoint
          event_type_ids:
          - contact.identified
          - one-time-order.completed
          page_ids: []
          funnel_ids: []
    WebhooksOutgoingEndpointAttributes:
      type: object
      title: Webhooks
      description: Webhooks
      properties:
        id:
          type: integer
          description: Unique identifier for the webhook endpoint
        public_id:
          type:
          - string
          - 'null'
          description: Unique identifier for the webhook endpoint visible in the UI
        workspace_id:
          type: integer
          description: Workspace ID
        url:
          type: string
          description: The URL that ClickFunnels event webhooks will be sent to.
        name:
          type: string
          description: The custom name for the webhook endpoint.
        event_type_ids:
          type:
          - array
          - 'null'
          minContains: 0
          contains:
            type: string
          description: 'The event types that the webhook endpoint subscribes to. Each entry is a dotted or slashed string key

            (e.g. `contact.updated`, `order.completed`, `orders/invoice.paid`) — these are NOT numeric IDs.

            Retrieve the full list of valid keys from GET /api/v2/webhooks/outgoing/event_types

            (operationId: `listWebhooksOutgoingEventTypes`). The <a class=''link'' target=''_blank''

            href=''https://developers.myclickfunnels.com/docs/webhook-event-types''>Webhook Event Types guide</a>

            provides supplementary context.

            '
        api_version:
          type:
          - integer
          - 'null'
          description: The version of the API that the webhook endpoint is using. Only V2 endpoints can currently be created via the API, but V1 endpoints can be created via the UI. They will be visible when listing endpoints.
        created_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Created at
        updated_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Updated at
        page_ids:
          type:
          - array
          - 'null'
          description: 'The IDs of the pages that this endpoint is scoped to. Only events triggered from these pages will be sent to this endpoint.

            Can be null when first created. After an update, it can be null, an empty array or an array of page IDs.

            '
        funnel_ids:
          type:
          - array
          - 'null'
          description: 'The IDs of the funnels that this endpoint is scoped to. Only events triggered from these funnels will be sent to this endpoint.

            Can be null when first created. After an update, it can be null, an empty array or an array of page IDs.

            '
        webhook_secret_last_four:
          type:
          - string
          - 'null'
          description: 'Last four characters of the endpoint''s signing secret. Enough to tell whether the secret

            you hold is still the current one. The full value is returned only in the create

            response, as `webhook_secret`.

            '
      example:
        id: 1
        public_id: RcHPAt
        workspace_id: 42000
        url: https://example.com/some-endpoint-url
        name: Example Endpoint
        event_type_ids:
        - contact.identified
        - one-time-order.completed
        api_version: 2
        created_at: '2025-01-01T00:00:00.000Z'
        updated_at: '2025-01-01T00:00:00.000Z'
        page_ids: []
        funnel_ids: []
        webhook_secret_last_four: c3d4
  responses:
    InvalidPageSize:
      description: Unprocessable Entity - `per_page` must be a positive integer.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
              hint:
                type:
                - string
                - 'null'
