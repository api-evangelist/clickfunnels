      requestBody:
        description: Information about updated fields in Space Group
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                communities_space_group:
                  type: object
                  $ref: '#/components/schemas/CommunitiesSpaceGroupParametersUpdate'
            example:
              communities_space_group:
                name: General
                access: 0
                is_hidden: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunitiesSpaceGroupAttributes'
              example:
                id: 1
