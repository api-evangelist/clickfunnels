openapi: 3.2.0
info:
  title: ClickFunnels Communities::Space Group API
  termsOfService: https://www.clickfunnels.com/terms-of-service
  contact:
    name: ClickFunnels API Team
    url: https://developers.myclickfunnels.com
  x-logo:
    url: https://statics.myclickfunnels.com/image/1126065/file/31edf05760fafe41a82f16a668ab251f.png
  description: 'The ClickFunnels REST API that powers webhooks, native integrations, and Zapier lets you manage your ClickFunnels data, automate your workflows, and recreate ClickFunnels functionality in your own apps.

    '
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  version: 2.0.0
servers:
- url: https://{subdomain}.myclickfunnels.com/api/v2
  description: ClickFunnels API
  variables:
    subdomain:
      default: myworkspace
security:
- BearerAuth: []
tags:
- name: Communities::SpaceGroup
  description: '> Space Groups are named sections within a Community that contain Spaces (Topics).


    A Space Group is a logical grouping of Spaces (Topics) within a Community. Use Space Groups to organize community content into sections. Each Space Group can have its own access level, post/comment approval settings, and visibility controls.

    '
paths:
  /communities/{community_id}/space_groups:
    get:
      tags:
      - Communities::SpaceGroup
      summary: List Space Groups
      description: List space groups for a community
      operationId: listCommunitiesSpaceGroups
      parameters:
      - name: community_id
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/after'
      - $ref: '#/components/parameters/sort_order'
      - $ref: '#/components/parameters/sort_property'
      responses:
        '200':
          description: OK
          headers:
            Pagination-Next:
              $ref: '#/components/headers/PaginationNext'
            Link:
              $ref: '#/components/headers/Link'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CommunitiesSpaceGroupAttributes'
              example:
              - id: 1
                public_id: BcDeFg
                community_id: 1
                workspace_id: 42
                name: General
                description: General discussion group
                access: 0
                group_type: 0
                current_path: /general
                emoji: 💬
                card_image_id: null
                auto_add_to_spaces: false
                approval_terms: null
                require_post_approvals: false
                require_post_approvals_override: false
                require_comment_approvals: false
                require_comment_approvals_override: false
                is_hidden: false
                is_hidden_from_non_members: false
                always_on: null
                upgrade_url: null
                sort_order: 1
                created_at: '2025-01-01T00:00:00.000Z'
                updated_at: '2025-01-01T00:00:00.000Z'
              - id: 2
                public_id: HiJkLm
                community_id: 1
                workspace_id: 42
                name: Announcements
                description: Official announcements
                access: 0
                group_type: 0
                current_path: /announcements
                emoji: 📢
                card_image_id: null
                auto_add_to_spaces: true
                approval_terms: null
                require_post_approvals: true
                require_post_approvals_override: false
                require_comment_approvals: false
                require_comment_approvals_override: false
                is_hidden: false
                is_hidden_from_non_members: false
                always_on: null
                upgrade_url: null
                sort_order: 2
                created_at: '2025-01-01T00:00:00.000Z'
                updated_at: '2025-01-01T00:00:00.000Z'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: API key missing or invalid
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Not found - This usually happens when you try to access a record that does not exist in your account. It can also happen when the provided parent record is missing, e.g. you have put in a non-existent Community parent ID.
              example:
                error: 'Not found: Record missing'
    post:
      tags:
      - Communities::SpaceGroup
      summary: Create Space Group
      description: Create a space group within a community
      operationId: createCommunitiesSpaceGroups
      parameters:
      - name: community_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        description: Information about a new Space Group
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                communities_space_group:
                  type: object
                  $ref: '#/components/schemas/CommunitiesSpaceGroupParameters'
            example:
              communities_space_group:
                name: General
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunitiesSpaceGroupAttributes'
              example:
                id: 3
                public_id: NoPqRs
                community_id: 1
                workspace_id: 42
                name: General
                description: null
                access: 0
                group_type: 0
                current_path: null
                emoji: null
                card_image_id: null
                auto_add_to_spaces: false
                approval_terms: null
                require_post_approvals: false
                require_post_approvals_override: false
                require_comment_approvals: false
                require_comment_approvals_override: false
                is_hidden: false
                is_hidden_from_non_members: false
                always_on: null
                upgrade_url: null
                sort_order: null
                created_at: '2025-01-01T00:00:00.000Z'
                updated_at: '2025-01-01T00:00:00.000Z'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: API key missing or invalid
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: Name can't be blank
