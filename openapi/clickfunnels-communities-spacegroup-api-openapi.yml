components:
  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: string
    after:
      name: after
      in: query
      required: false
      schema:
        type: string
      description: ID of item after which the collection should be returned. More examples and info about pagination [in our guides](https://developers.myclickfunnels.com/docs/pagination).
    sort_property:
      name: sort_property
      in: query
      description: 'Sort property of a list response. The default is id and thus the created_at order.

        If you sort by other properties, we additionally sort by id implicitly as a secondary sort property, so that you can rely on the sort order to be deterministic even if the main sort property ends up with the same values.

        '
      required: false
      schema:
        type: string
        enum:
        - id
        - updated_at
    sort_order:
      name: sort_order
      in: query
      description: Sort order of a list response. Use 'desc' to reverse the default 'asc' (ascending) sort order. Examples [in our guides](https://developers.myclickfunnels.com/docs/pagination).
      required: false
      schema:
        type: string
        enum:
        - asc
        - desc
  schemas:
    CommunitiesSpaceGroupAttributes:
      type: object
      title: Communities::SpaceGroup
      description: Communities::SpaceGroup
      properties:
        id:
          type: integer
          description: Group ID
        public_id:
          type:
          - string
          - 'null'
          description: Group public ID
        community_id:
          type: integer
          description: Community ID the space group belongs to
        workspace_id:
          type: integer
          description: Workspace ID the space group belongs to
        name:
          type:
          - string
          - 'null'
          description: Name
        description:
          type:
          - string
          - 'null'
          description: Description
        access:
          type: string
          enum:
          - is_open
          - is_private
          - is_secret
          description: Access level
        group_type:
          type: string
          enum:
          - standard
          - course
          description: Group type
        current_path:
          type:
          - string
          - 'null'
          description: Current Path
        emoji:
          type:
          - string
          - 'null'
          description: Emoji icon for the group
        card_image_id:
          type:
          - integer
          - 'null'
          description: Card Image ID
        auto_add_to_spaces:
          type: boolean
          description: Automatically add members to new Topics within this Group
        approval_terms:
          type:
          - string
          - 'null'
          description: Approval Terms — if present, these terms are used to AI moderate posts and comments automatically
        require_post_approvals:
          type:
          - boolean
          - 'null'
          description: Require approvals for posts in this Group?
        require_post_approvals_override:
          type:
          - boolean
          - 'null'
          description: Whether the group-level post approval setting overrides the community-level setting
        require_comment_approvals:
          type:
          - boolean
          - 'null'
          description: Require approvals for comments in this Group?
        require_comment_approvals_override:
          type:
          - boolean
          - 'null'
          description: Whether the group-level comment approval setting overrides the community-level setting
        is_hidden:
          type: boolean
          description: Only show joined Topics — when enabled customers only see Topics in the sidebar they have joined
        is_hidden_from_non_members:
          type: boolean
          description: Hide from non-members — when enabled the group is not visible unless the customer belongs to one of its Topics
        always_on:
          type:
          - boolean
          - 'null'
          description: Always On
        upgrade_url:
          type:
          - string
          - 'null'
          description: Upgrade URL — directs non-customers to an action page to gain access to this group
        sort_order:
          type:
          - integer
          - 'null'
          description: Sort order within the community
        created_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Created at
        updated_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Updated at
      example:
        id: 1
        public_id: BcDeFg
        community_id: 1
        workspace_id: 42
        name: General
        description: General discussion group
        access: is_open
        group_type: standard
        current_path: /general
        emoji: 💬
        card_image_id: null
        auto_add_to_spaces: false
        approval_terms: null
        require_post_approvals: false
        require_post_approvals_override: false
        require_comment_approvals: false
        require_comment_approvals_override: false
        is_hidden: false
        is_hidden_from_non_members: false
        always_on: null
        upgrade_url: null
        sort_order: 1
        created_at: '2025-01-01T00:00:00.000Z'
        updated_at: '2025-01-01T00:00:00.000Z'
      required:
      - access
      - always_on
      - approval_terms
      - auto_add_to_spaces
      - card_image_id
      - community_id
      - created_at
      - current_path
      - description
      - emoji
      - group_type
      - id
      - is_hidden
      - is_hidden_from_non_members
      - name
      - public_id
      - require_comment_approvals
      - require_comment_approvals_override
      - require_post_approvals
      - require_post_approvals_override
      - sort_order
      - updated_at
      - upgrade_url
      - workspace_id
