openapi: 3.2.0
info:
  title: ClickFunnels Communities::Memberships::Export Action API
  termsOfService: https://www.clickfunnels.com/terms-of-service
  contact:
    name: ClickFunnels API Team
    url: https://developers.myclickfunnels.com
  x-logo:
    url: https://statics.myclickfunnels.com/image/1126065/file/31edf05760fafe41a82f16a668ab251f.png
  description: 'The ClickFunnels REST API that powers webhooks, native integrations, and Zapier lets you manage your ClickFunnels data, automate your workflows, and recreate ClickFunnels functionality in your own apps.

    '
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  version: 2.0.0
servers:
- url: https://{subdomain}.myclickfunnels.com/api/v2
  description: ClickFunnels API
  variables:
    subdomain:
      default: myworkspace
security:
- BearerAuth: []
tags:
- name: Communities::Memberships::ExportAction
  description: '> Async bulk action that exports community membership data to a file in the background.


    Creating an ExportAction enqueues a background job and immediately returns an action record. Poll the `show` endpoint using the returned `id` and check the `status` field (`queued` → `processing` → `completed`) to track progress. Use the `index` endpoint to list previous export actions for a community.

    '
paths:
  /communities/{community_id}/memberships/export_actions:
    get:
      tags:
      - Communities::Memberships::ExportAction
      summary: List Membership Export Actions
      description: List previous membership export actions for a community
      operationId: listCommunitiesMembershipsExportActions
      parameters:
      - name: community_id
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/after'
      - $ref: '#/components/parameters/sort_order'
      - $ref: '#/components/parameters/sort_property'
      responses:
        '200':
          description: OK
          headers:
            Pagination-Next:
              $ref: '#/components/headers/PaginationNext'
            Link:
              $ref: '#/components/headers/Link'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CommunitiesMembershipsExportActionAttributes'
              example:
              - id: 504
                public_id: ExPrt1
                community_id: 1
                target_all: true
                target_ids: []
                failed_ids: []
                target_count: 150
                performed_count: 150
                started_at: '2025-01-01T00:01:00.000Z'
                completed_at: '2025-01-01T00:01:30.000Z'
                created_at: '2025-01-01T00:00:00.000Z'
                updated_at: '2025-01-01T00:01:30.000Z'
                status: completed
                fields:
                - name
                - email
                - joined_at
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: API key missing or invalid
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: 'Not found: Record missing'
    post:
      tags:
      - Communities::Memberships::ExportAction
      summary: Create Membership Export Action
      description: 'Enqueue an async background job to export community membership data to a file. The action record is returned immediately with `status: queued`. Poll `GET /communities/memberships/export_actions/{id}` until `status` is `completed`.

        '
      operationId: createCommunitiesMembershipsExportActions
      parameters:
      - name: community_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        description: Parameters for the membership export action
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                communities_memberships_export_action:
                  type: object
                  $ref: '#/components/schemas/CommunitiesMembershipsExportActionParameters'
            example:
              communities_memberships_export_action:
                target_all: true
                target_ids: []
                fields:
                - name
                - email
                - joined_at
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunitiesMembershipsExportActionAttributes'
              example:
                id: 504
                public_id: ExPrt1
                community_id: 1
                target_all: true
                target_ids: []
                failed_ids: []
                target_count: null
                performed_count: 0
                started_at: null
                completed_at: null
                created_at: '2025-01-01T00:00:00.000Z'
                updated_at: '2025-01-01T00:00:00.000Z'
                status: queued
                fields:
                - name
                - email
                - joined_at
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: API key missing or invalid
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: 'Fields contains invalid field names: invalid_field'
  /communities/memberships/export_actions/{id}:
    get:
      tags:
      - Communities::Memberships::ExportAction
      summary: Fetch Membership Export Action
      description: Retrieve the current status of a membership export action. Poll this endpoint until `status` is `completed`.
      operationId: getCommunitiesMembershipsExportActions
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunitiesMembershipsExportActionAttributes'
              example:
                id: 504
                public_id: ExPrt1
                community_id: 1
                target_all: true
                target_ids: []
                failed_ids: []
                target_count: 150
                performed_count: 150
                started_at: '2025-01-01T00:01:00.000Z'
                completed_at: '2025-01-01T00:01:30.000Z'
                created_at: '2025-01-01T00:00:00.000Z'
                updated_at: '2025-01-01T00:01:30.000Z'
                status: completed
                fields:
                - name
                - email
                - joined_at
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: API key missing or invalid
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: 'Not found: Record missing'
components:
  schemas:
    CommunitiesMembershipsExportActionParameters:
      type: object
      title: Communities::Memberships::ExportAction
      description: Communities::Memberships::ExportAction
      properties:
        target_all:
          type: boolean
          description: When true, export all members in the community (target_ids is ignored)
        target_ids:
          type: array
          description: Array of membership public IDs to export. Required when target_all is false.
          items:
            type: string
        fields:
          type: array
          description: Array of column names to include in the export
          items:
            type: string
      example:
        communities_memberships_export_action:
          target_all: true
          target_ids: []
          fields:
          - name
          - email
          - joined_at
    CommunitiesActionAttributes:
      type: object
      title: Async Action
      description: 'Base response shape shared by all community async bulk-action resources. The `status` field progresses from `queued` → `processing` → `completed`. Poll the `show` endpoint until `status` is `completed` or `performed_count` equals `target_count`.

        '
      properties:
        id:
          type: integer
          description: Action ID
        public_id:
          type:
          - string
          - 'null'
          description: Action public ID
        community_id:
          type: integer
          description: ID of the Community this action belongs to
        target_all:
          type: boolean
          description: When true the action targets all eligible records in the community rather than the explicit target_ids list
        target_ids:
          type: array
          description: Integer IDs of the targeted records (memberships or bans)
          items:
            type: integer
        failed_ids:
          type: array
          description: Integer IDs of records that could not be processed
          items:
            type: integer
        target_count:
          type:
          - integer
          - 'null'
          description: Total number of records that will be processed
        performed_count:
          type:
          - integer
          - 'null'
          description: Number of records processed so far
        started_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp when the background job began processing
        completed_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp when the background job finished
        created_at:
          type: string
          format: date-time
          description: Created at
        updated_at:
          type: string
          format: date-time
          description: Updated at
        status:
          type: string
          enum:
          - queued
          - processing
          - completed
          description: 'Current status of the async action. Progresses: queued → processing → completed.'
      required:
      - community_id
      - completed_at
      - created_at
      - failed_ids
      - id
      - performed_count
      - public_id
      - started_at
      - status
      - target_all
      - target_count
      - target_ids
      - updated_at
    CommunitiesMembershipsExportActionAttributes:
      type: object
      title: Communities::Memberships::ExportAction
      description: Communities::Memberships::ExportAction
      allOf:
      - $ref: '#/components/schemas/CommunitiesActionAttributes'
      - type: object
        properties:
          fields:
            type: array
            description: Column names included in the export file
            items:
              type: string
      example:
        id: 504
        public_id: ExPrt1
        community_id: 1
        target_all: true
        target_ids: []
        failed_ids: []
        target_count: 150
        performed_count: 150
        started_at: '2025-01-01T00:01:00.000Z'
        completed_at: '2025-01-01T00:01:30.000Z'
        created_at: '2025-01-01T00:00:00.000Z'
        updated_at: '2025-01-01T00:01:30.000Z'
        status: completed
        fields:
        - name
        - email
        - joined_at
      required:
      - community_id
      - completed_at
      - created_at
      - failed_ids
      - fields
      - id
      - performed_count
      - public_id
      - started_at
      - status
      - target_all
      - target_count
      - target_ids
      - updated_at
  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: string
    sort_property:
      name: sort_property
      in: query
      description: 'Sort property of a list response. The default is id and thus the created_at order.

        If you sort by other properties, we additionally sort by id implicitly as a secondary sort property, so that you can rely on the sort order to be deterministic even if the main sort property ends up with the same values.

        '
      required: false
      schema:
        type: string
        enum:
        - id
        - updated_at
    sort_order:
      name: sort_order
      in: query
      description: Sort order of a list response. Use 'desc' to reverse the default 'asc' (ascending) sort order. Examples [in our guides](https://developers.myclickfunnels.com/docs/pagination).
      required: false
      schema:
        type: string
        enum:
        - asc
        - desc
    after:
      name: after
      in: query
      required: false
      schema:
        type: string
      description: ID of item after which the collection should be returned. More examples and info about pagination [in our guides](https://developers.myclickfunnels.com/docs/pagination).
  headers:
    Link:
      description: A direct link to the next page for the cursor-based pagination. It includes the `after` and the Pagination-Next ID value.
      schema:
        type: string
    PaginationNext:
      description: ID of the last item in the current response after which more records exist. You can use it in an `after` query parameter for cursor-based pagination to get to the next page.
      schema:
        type: string
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
externalDocs:
  description: More in-depth guides and further resources
  url: https://developers.myclickfunnels.com
