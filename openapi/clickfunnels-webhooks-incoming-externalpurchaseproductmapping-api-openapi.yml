components:
  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: string
    per_page:
      name: per_page
      in: query
      required: false
      description: Records per page. Defaults to 20; raise it up to 100 for bulk reads. A larger value returns 100 records. Zero, a negative or a non-integer value is a 422. The `Link` next-page URL keeps the value, so a client following it keeps the page size. More [in our guides](https://developers.myclickfunnels.com/docs/pagination).
      schema:
        type: integer
        minimum: 1
        default: 20
    sort_property:
      name: sort_property
      in: query
      description: 'Sort property of a list response. The default is id and thus the created_at order.

        If you sort by other properties, we additionally sort by id implicitly as a secondary sort property, so that you can rely on the sort order to be deterministic even if the main sort property ends up with the same values.

        '
      required: false
      schema:
        type: string
        enum:
        - id
        - updated_at
    sort_order:
      name: sort_order
      in: query
      description: Sort order of a list response. Use 'desc' to reverse the default 'asc' (ascending) sort order. Examples [in our guides](https://developers.myclickfunnels.com/docs/pagination).
      required: false
      schema:
        type: string
        enum:
        - asc
        - desc
    after:
      name: after
      in: query
      required: false
      schema:
        type: string
      description: ID of item after which the collection should be returned. More examples and info about pagination [in our guides](https://developers.myclickfunnels.com/docs/pagination).
  responses:
    InvalidPageSize:
      description: Unprocessable Entity - `per_page` must be a positive integer.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
              hint:
                type:
                - string
                - 'null'
                description: Next step for the caller, or null when no additional guidance applies.
          example:
            error: 'Request unprocessable: per_page must be a positive integer, capped at 100 (got "0")'
            hint: null
  schemas:
    IntegerOrPublicId:
      type:
      - integer
      - string
      description: Integer database id or obfuscated public_id.
    WebhooksIncomingExternalPurchaseProductMappingParametersUpdate:
      type: object
      title: Update Incoming External Purchase Product Mapping
      description: Mutable fields for an incoming external purchase product mapping.
      properties:
        external_product_sku:
          type: string
          maxLength: 255
          description: Provider product, plan, or SKU identifier. For Whop, use the plan ID.
        products_variant_id:
          $ref: '#/components/schemas/IntegerOrPublicId'
          description: Integer ID or obfuscated public ID of a ClickFunnels variant in the endpoint's workspace.
        products_price_id:
          $ref: '#/components/schemas/IntegerOrPublicId'
          description: Integer ID or obfuscated public ID of a ClickFunnels price in the endpoint's workspace.
      example:
        external_product_sku: plan_annual
        products_variant_id: CfVari
        products_price_id: CfPric
      required: []
    WebhooksIncomingExternalPurchaseProductMappingAttributes:
      type: object
      title: Incoming External Purchase Product Mapping
      description: 'Maps an external provider product, plan, or SKU to the ClickFunnels variant and price

        used when an incoming purchase creates an order.

        '
      properties:
        id:
          type: integer
          description: Mapping ID.
        public_id:
          type: string
          description: Obfuscated mapping ID.
        external_purchase_endpoint_id:
          type: integer
          description: Incoming external purchase endpoint that owns this mapping.
        external_product_sku:
          type: string
          description: 'The identifier the provider reports for what was bought. It is the provider''s own id for

            the thing purchased, which is not always its product id: `clickbank` reports the item

            number (`itemNo`), `copecart` reports the product id, and `whop` reports the plan id

            (`plan_...`), because one Whop product can hold several plans.

            '
        clickfunnels_product:
          type: object
          description: ClickFunnels product associated with the mapped price.
          properties:
            id:
              type: integer
              description: Product ID.
            public_id:
              type: string
              description: Obfuscated product ID.
            name:
              type: string
              description: Product name.
        clickfunnels_variant:
          type: object
          description: ClickFunnels product variant selected by this mapping.
          properties:
            id:
              type: integer
              description: Variant ID.
            public_id:
