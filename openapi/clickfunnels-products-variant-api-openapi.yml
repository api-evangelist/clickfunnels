        fulfillment_required:
          type:
          - boolean
          - 'null'
          description: Fulfillment required
        country_of_manufacture_id:
          type:
          - string
          - 'null'
          description: Country of manufacture
        image_ids:
          type:
          - array
          - 'null'
          description: The images for the variant.
        fulfillments_location_ids:
          type:
          - array
