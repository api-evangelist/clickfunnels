  /workflows/{id}/disable:
    post:
      tags:
      - Workflow
      summary: Disable Workflow
      description: 'Disable a workflow, stopping new runs from being started. In-progress runs

        are canceled. Returns the updated workflow.'
      operationId: disableWorkflow
      externalDocs:
        description: Workflows Skill - enabling, disabling
        url: https://accounts.myclickfunnels.com/.well-known/workflows/skill.md#enabling-disabling
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowAttributes'
              example:
                id: 101
                public_id: WfAbCd
                workspace_id: 5001
                name: New Lead Nurture
                status: draft
                disabled: true
                archived: false
                run_type: asynchronous
                active_runs_count: 0
                completed_runs_count: 340
                created_at: '2025-06-01T00:00:00.000Z'
                updated_at: '2025-06-18T00:00:00.000Z'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  hint:
                    type:
                    - string
                    - 'null'
                    description: 'The next step for the caller: how to authenticate, which scope was missing, or where the route list lives. Always present, and null when this error has no next step to offer.'
              example:
                error: API key missing or invalid
                hint: 'Send the token as `Authorization: Bearer <token>`. Create one under Account > Team > Platform Applications (a workspace API key), or obtain one with OAuth 2.1; both use the same scopes. See https://developers.myclickfunnels.com/docs/authentication, or append .md to that URL for markdown.'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  hint:
                    type:
                    - string
                    - 'null'
                    description: 'The next step for the caller: how to authenticate, which scope was missing, or where the route list lives. Always present, and null when this error has no next step to offer.'
              example:
                error: You are not authorized to perform this action.
                hint: null
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
