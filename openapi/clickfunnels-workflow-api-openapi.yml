components:
  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: string
    per_page:
      name: per_page
      in: query
      required: false
      description: Records per page. Defaults to 20; raise it up to 100 for bulk reads. A larger value returns 100 records. Zero, a negative or a non-integer value is a 422. The `Link` next-page URL keeps the value, so a client following it keeps the page size. More [in our guides](https://developers.myclickfunnels.com/docs/pagination).
      schema:
        type: integer
        minimum: 1
        default: 20
    sort_property:
      name: sort_property
      in: query
      description: 'Sort property of a list response. The default is id and thus the created_at order.

        If you sort by other properties, we additionally sort by id implicitly as a secondary sort property, so that you can rely on the sort order to be deterministic even if the main sort property ends up with the same values.

        '
      required: false
      schema:
        type: string
        enum:
        - id
        - updated_at
    sort_order:
      name: sort_order
      in: query
      description: Sort order of a list response. Use 'desc' to reverse the default 'asc' (ascending) sort order. Examples [in our guides](https://developers.myclickfunnels.com/docs/pagination).
      required: false
      schema:
        type: string
        enum:
        - asc
        - desc
    after:
      name: after
      in: query
      required: false
      schema:
        type: string
      description: ID of item after which the collection should be returned. More examples and info about pagination [in our guides](https://developers.myclickfunnels.com/docs/pagination).
  schemas:
    WorkflowParametersCreate:
      type: object
      title: Create Workflow
      description: 'Parameters for creating a new workflow. `run_type` is server-controlled

        (always `asynchronous` for API-created workflows) and is not accepted as a

        request parameter.

        '
      required:
      - workflow
      properties:
        workflow:
          type: object
          required:
          - name
          properties:
            name:
              type: string
              description: Human-readable name for the workflow.
      example:
        workflow:
          name: New Lead Nurture
    WorkflowParametersUpdate:
      type: object
      title: Update Workflow
      description: Parameters for updating an existing workflow. All fields are optional.
      required:
      - workflow
      properties:
        workflow:
          type: object
          properties:
            name:
              type: string
              description: New name for the workflow.
            archived:
              type: boolean
              description: Set to `true` to archive the workflow, `false` to unarchive.
      example:
        workflow:
          name: Updated Nurture Sequence
          archived: false
    WorkflowAttributes:
      type: object
      title: Workflow
      description: A standalone automation workflow.
      properties:
        id:
          type: integer
          description: Workflow ID
        public_id:
          type:
          - string
          - 'null'
          description: Obfuscated workflow ID
        workspace_id:
          type: integer
          description: Integer ID of the workspace that owns this workflow
        name:
          type: string
          description: Human-readable workflow name
        status:
          type: string
          enum:
          - draft
          - live
          - archived
          description: Derived status. `live` = enabled with at least one active trigger; `archived` = archived; otherwise `draft`.
        disabled:
          type: boolean
          description: True when the workflow is disabled (not executing runs).
        archived:
          type: boolean
          description: True when the workflow has been archived.
        run_type:
          type: string
          enum:
          - asynchronous
          - synchronous
          - one_time
          description: How the workflow handles concurrent runs for the same contact. Server-controlled — always `asynchronous` for API-created workflows.
        active_runs_count:
          type: integer
          description: Number of currently active (in-progress) runs.
        completed_runs_count:
          type: integer
          description: Cumulative count of completed runs.
        created_at:
          type: string
          format: date-time
          description: Creation timestamp
        updated_at:
          type: string
          format: date-time
          description: Last update timestamp
      example:
        id: 101
        public_id: WfAbCd
        workspace_id: 5001
        name: New Lead Nurture
        status: live
        disabled: false
        archived: false
        run_type: asynchronous
        active_runs_count: 12
        completed_runs_count: 340
        created_at: '2025-06-01T00:00:00.000Z'
        updated_at: '2025-06-10T00:00:00.000Z'
    WorkflowStructureAttributes:
      type: object
      title: Workflow Structure
      description: 'A complete tree view of a workflow — its header, triggers, and the ordered list

        of visible steps. Internal container nodes (sequence steps, end-step markers) are

        spliced out. Split steps expose their child branches or variants inline.


        Step entries share a common shape (`id`, `public_id`, `step_type`, `name`, `sort_order`,

        `state`, `step_type_settings`) and gain type-specific fields:


        - **`conditional_split_step`**: `convergence_step_id` + `branches` array (`matched` / `unmatched`), each branch carrying its own `steps`.

        - **`split_test_step`**: `convergence_step_id` + `variants` array (each with `weight` and `steps`).

        - All other step types: no extra branching fields.

        '
      properties:
        workflow:
          type: object
          description: Summary header of the workflow.
          properties:
            id:
              type: integer
            public_id:
              type: string
            name:
              type: string
            status:
              type: string
              enum:
              - draft
              - live
              - archived
            disabled:
              type: boolean
            archived:
              type: boolean
            run_type:
              type: string
        triggers:
          type: array
          description: Active triggers attached to the workflow (summary shape).
          items:
            type: object
            properties:
              id:
                type: integer
              public_id:
                type: string
              event_type_key:
                type: string
              active:
                type: boolean
              allow_anonymous_contacts:
                type: boolean
        steps:
          type: array
          description: 'Ordered visible steps. Splits are inlined with their child steps.

            Walk this array top-to-bottom to follow the execution order.

            '
          items:
            type: object
            properties:
              id:
                type: integer
              public_id:
                type: string
              step_type:
                type: string
                description: The step class key, e.g. `send_email_step`, `delay_step`, `conditional_split_step`.
              name:
                type: string
              sort_order:
                type: integer
                description: Position within its own container — not globally unique across the tree.
              state:
                type: string
                enum:
                - active
                - notSetup
                - notDefined
              step_type_settings:
                type: object
                description: One-key map whose key is the step type. See Workflows::Step for the per-type shape.
              convergence_step_id:
                type:
                - integer
                - 'null'
                description: 'Split steps only. Id of the step where this split''s branches reconverge — the first step that runs after the split, which every branch continues to. Example: a conditional_split_step (id 203) whose matched/unmatched branches both lead to the same next step (id 206) → convergence_step_id: 206. null when nothing follows the split (it ends the flow). The referenced step always appears in this tree.'
              branches:
                type: array
                description: conditional_split_step only. Always `[matched, unmatched]`.
                items:
                  type: object
                  properties:
                    branch:
                      type: string
                      enum:
                      - matched
                      - unmatched
                    steps:
                      type: array
                      items:
                        type: object
              variants:
                type: array
                description: split_test_step only.
                items:
                  type: object
                  properties:
                    weight:
                      type: integer
                    steps:
                      type: array
                      items:
                        type: object
      example:
        workflow:
          id: 101
          public_id: WfAbCd
          name: New Lead Nurture
          status: live
          disabled: false
          archived: false
          run_type: asynchronous
        triggers:
        - id: 11
          public_id: TrXxYy
          event_type_key: $contact.tag_applied
          active: true
          allow_anonymous_contacts: false
        steps:
        - id: 201
          public_id: StEm01
          step_type: send_email_step
          name: Send Email
          sort_order: 0
          state: active
          step_type_settings:
            send_email_step:
              subject: Welcome!
              preheadline: We're glad you're here.
              template_id: 3001
              from_address_id: 4001
              reply_to_address_id: null
        - id: 202
          public_id: StDl02
          step_type: delay_step
          name: Wait 3 Days
          sort_order: 1
          state: active
          step_type_settings:
            delay_step:
              delay_type: relative
              duration: 3
              interval: days
              time_zone: null
              use_contact_time_zone: false
              use_execution_window: false
              day_of_week: null
              date_of_month: null
              specific_date: null
              past_date_action: continue
              start_time: null
              end_time: null
              execution_window_days: []
        - id: 203
          public_id: StCs03
          step_type: conditional_split_step
          name: VIP Check
          sort_order: 2
          state: active
          convergence_step_id: null
          step_type_settings:
            conditional_split_step:
              condition:
                filter_id: 6001
                is_setup: true
          branches:
          - branch: matched
            steps:
            - id: 205
              public_id: StTg05
              step_type: contact_tag_step
              name: Tag VIP
              sort_order: 0
              state: active
              step_type_settings:
                contact_tag_step:
                  action: Add Tags
                  contacts_tag_ids:
                  - 7001
          - branch: unmatched
            steps: []
  responses:
    InvalidPageSize:
      description: Unprocessable Entity - `per_page` must be a positive integer.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
              hint:
                type:
                - string
                - 'null'
                description: Next step for the caller, or null when no additional guidance applies.
          example:
            error: 'Request unprocessable: per_page must be a positive integer, capped at 100 (got "0")'
            hint: null
  headers:
    PaginationNext:
      description: ID of the last item in the current response after which more records exist. You can use it in an `after` query parameter for cursor-based pagination to get to the next page.
      schema:
        type: string
    Link:
      description: A direct link to the next page for the cursor-based pagination. It includes the `after` and the Pagination-Next ID value.
      schema:
        type: string
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: 'A workspace API key or an OAuth access token, sent as `Authorization: Bearer <token>`.


        Both carry the same scope vocabulary as the `OAuth2` scheme below. Category-only

        scopes restrict access to the categories they name. Coarse wildcards remain additive:

        `read contacts:read` reads every category, while `write contacts:read` can write every

        category. Omit coarse scopes when restricting access to specific categories.

        Legacy tokens with only coarse scopes retain their existing unrestricted access;

        a bare `read` scope alone does not enforce read-only access.

        '
    OAuth2:
      type: oauth2
      description: 'OAuth 2.0 authorization code flow for REST integrations. Create a Platform Application

        and follow `https://developers.myclickfunnels.com/docs/oauth-20` to connect users.

        Authorization server metadata is published at

        `https://accounts.myclickfunnels.com/.well-known/oauth-authorization-server`.

        Dynamic client registration at `/oauth/register` is for MCP clients only; MCP-scoped

        tokens must use `https://agents.myclickfunnels.com/mcp`, not the REST API.


        Scopes are least-privilege by category. Ask for the two coarse wildcards (`read`,

        `write`) only when an integration genuinely needs the whole workspace; otherwise ask

        for the `<category>:read` / `<category>:write` pairs you use. `write` implies `read`

        for the same category. Protected resource metadata (RFC 9728) for this API lives at

        `https://accounts.myclickfunnels.com/.well-known/oauth-protected-resource`.

        '
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.myclickfunnels.com/oauth/authorize
          tokenUrl: https://accounts.myclickfunnels.com/oauth/token
          refreshUrl: https://accounts.myclickfunnels.com/oauth/token
          scopes:
            read: Read any resource in the granted workspaces
            write: Read and write any resource in the granted workspaces
            contacts:read: Read Contacts
            contacts:write: Read and write Contacts
            workflows:read: Read Workflows (Automations)
            workflows:write: Read and write Workflows (Automations)
            funnels:read: Read Funnels
            funnels:write: Read and write Funnels
            sites:read: Read Sites & Design
            sites:write: Read and write Sites & Design
            courses:read: Read Courses
            courses:write: Read and write Courses
            emails:read: Read Emails
            emails:write: Read and write Emails
            blog:read: Read Blog
            blog:write: Read and write Blog
            community:read: Read Community
            community:write: Read and write Community
            appointments:read: Read Appointments
            appointments:write: Read and write Appointments
            opportunities:read: Read Opportunities
            opportunities:write: Read and write Opportunities
            store:read: Read Store
            store:write: Read and write Store
            forms:read: Read Forms
            forms:write: Read and write Forms
            media:read: Read Media
            media:write: Read and write Media
            webhooks:read: Read Webhooks
            webhooks:write: Read and write Webhooks
            account:read: Read Account
            account:write: Read and write Account
            reference:read: Read Reference Data
            reference:write: Read and write Reference Data
