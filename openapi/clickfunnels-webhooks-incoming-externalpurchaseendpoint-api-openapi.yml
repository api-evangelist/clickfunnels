components:
  schemas:
    WebhooksIncomingExternalPurchaseEndpointParametersUpdate:
      type: object
      title: Update Incoming External Purchase Endpoint
      description: 'Mutable endpoint settings. The provider and live/test mode are fixed at creation and

        are not accepted as update fields.

        '
      properties:
        name:
          type: string
          maxLength: 255
          description: Human-readable endpoint name.
        suppress_order_system_emails:
          type: boolean
          description: Whether ClickFunnels suppresses its order system emails for purchases received by this endpoint.
        secret:
          type: string
          description: 'Whop endpoints only: the ws_ signing secret Whop revealed when you created the webhook in your Whop dashboard, pointed at this endpoint''s url. Whop does not let a user OAuth token manage webhooks, so registration is manual and this is how the secret is supplied. Ignored when blank or on other providers, and must start with ws_. The secret is never returned by any read.'
      example:
        name: Whop purchases - accounting
        suppress_order_system_emails: false
      required: []
    WebhooksIncomingExternalPurchaseEndpointCreatedAttributes:
      type: object
      title: Created Incoming External Purchase Endpoint
      description: 'The newly created endpoint. Where ClickFunnels generates the signing secret, it is returned

        as `webhook_secret` in this response only, so save it immediately: later reads return just

        its last four characters. Where the provider issues its own signing secret, the endpoint is

        created without one and you set it afterwards.

        '
      allOf:
      - $ref: '#/components/schemas/WebhooksIncomingExternalPurchaseEndpointAttributes'
      - type: object
        properties:
          webhook_secret:
            type: string
            description: Signing secret, returned only in this create response and only when ClickFunnels generated it.
      example:
        id: 82
        public_id: CbEndP
        workspace_id: 42000
        name: ClickBank purchases
        provider: clickbank
        live_mode: true
        suppress_order_system_emails: false
        url: https://example.myclickfunnels.com/webhooks/incoming/external_purchases_webhooks/CbEndP
        webhook_secret_last_four: f0ac
        provider_metadata:
          clickbank: {}
        webhook_secret: 8d5aa2a2d13b4a48be2be8649853f0ac
        created_at: '2026-08-26T12:00:00.000Z'
        updated_at: '2026-08-26T12:00:00.000Z'
    WebhooksIncomingExternalPurchaseEndpointAttributes:
      type: object
      title: Incoming External Purchase Endpoint
      description: 'A workspace endpoint that receives purchase events from an external commerce provider.

        The `url` is generated by ClickFunnels; configure that URL as the webhook destination in

        the provider''s own dashboard. Signing secrets are never returned in full by read

        operations.


        Not every `provider` is available to every workspace: creating an endpoint for one a

        workspace has not been granted returns 403.

        '
      properties:
        id:
          type: integer
          description: Endpoint ID.
        public_id:
          type: string
          description: Obfuscated endpoint ID.
        workspace_id:
          type: integer
          description: Workspace that owns the endpoint.
        name:
          type: string
          description: Human-readable endpoint name.
        provider:
          type: string
          enum:
          - clickbank
          - offerlab
          - copecart
          - whop
          description: External commerce provider. The provider cannot be changed after creation.
        live_mode:
          type: boolean
          description: Whether the endpoint receives live rather than test purchases. Set only at creation.
        suppress_order_system_emails:
          type: boolean
          description: Whether ClickFunnels suppresses its order system emails for purchases received by this endpoint.
        url:
          type: string
          format: uri
          description: Public URL to configure as the provider's incoming webhook destination.
        webhook_secret_last_four:
          type:
          - string
          - 'null'
          description: 'Last four characters of the endpoint''s signing secret, or null when it has none. Enough

            to tell whether a secret is set and whether it matches the one you hold. The full value

            is returned only in the create response.

            '
        provider_metadata:
          type: object
          description: 'Read-only provider-specific state, keyed by provider so the single key both names the

            provider and types its value. No provider has fields yet, so every endpoint returns an

            empty object under its provider, for example `{"clickbank": {}}` or `{"whop": {}}`.

            '
        created_at:
          type: string
          format: date-time
          description: Created at.
        updated_at:
          type: string
          format: date-time
          description: Updated at.
      example:
        id: 81
        public_id: WpEndP
        workspace_id: 42000
        name: Whop purchases
        provider: whop
        live_mode: false
        suppress_order_system_emails: true
        url: https://example.myclickfunnels.com/webhooks/incoming/external_purchases_webhooks/WpEndP
        webhook_secret_last_four: kLm9
        provider_metadata:
          whop: {}
        created_at: '2026-08-26T12:00:00.000Z'
        updated_at: '2026-08-26T12:05:00.000Z'
    WebhooksIncomingExternalPurchaseEndpointParameters:
      type: object
      title: Create Incoming External Purchase Endpoint
      description: Parameters for creating an incoming external purchase endpoint.
      properties:
        name:
          type: string
          maxLength: 255
          description: Human-readable endpoint name.
        provider:
          type: string
          enum:
          - clickbank
          - offerlab
          - copecart
          - whop
          description: External commerce provider. This cannot be changed after creation.
        live_mode:
          type: boolean
          default: true
          description: Whether this endpoint receives live rather than test purchases.
        suppress_order_system_emails:
          type: boolean
          default: false
          description: Whether ClickFunnels suppresses its order system emails for purchases received by this endpoint.
      example:
        name: Whop test purchases
        provider: whop
        live_mode: false
        suppress_order_system_emails: true
      required:
      - name
      - provider
  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: string
    per_page:
      name: per_page
      in: query
      required: false
      description: Records per page. Defaults to 20; raise it up to 100 for bulk reads. A larger value returns 100 records. Zero, a negative or a non-integer value is a 422. The `Link` next-page URL keeps the value, so a client following it keeps the page size. More [in our guides](https://developers.myclickfunnels.com/docs/pagination).
      schema:
        type: integer
        minimum: 1
        default: 20
    sort_property:
      name: sort_property
      in: query
      description: 'Sort property of a list response. The default is id and thus the created_at order.

        If you sort by other properties, we additionally sort by id implicitly as a secondary sort property, so that you can rely on the sort order to be deterministic even if the main sort property ends up with the same values.

        '
      required: false
      schema:
        type: string
        enum:
        - id
        - updated_at
    sort_order:
      name: sort_order
      in: query
      description: Sort order of a list response. Use 'desc' to reverse the default 'asc' (ascending) sort order. Examples [in our guides](https://developers.myclickfunnels.com/docs/pagination).
      required: false
      schema:
        type: string
        enum:
        - asc
        - desc
    after:
      name: after
      in: query
      required: false
      schema:
        type: string
      description: ID of item after which the collection should be returned. More examples and info about pagination [in our guides](https://developers.myclickfunnels.com/docs/pagination).
  responses:
    InvalidPageSize:
      description: Unprocessable Entity - `per_page` must be a positive integer.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
              hint:
                type:
                - string
                - 'null'
                description: Next step for the caller, or null when no additional guidance applies.
          example:
            error: 'Request unprocessable: per_page must be a positive integer, capped at 100 (got "0")'
            hint: null
  headers:
    PaginationNext:
      description: ID of the last item in the current response after which more records exist. You can use it in an `after` query parameter for cursor-based pagination to get to the next page.
      schema:
        type: string
    Link:
      description: A direct link to the next page for the cursor-based pagination. It includes the `after` and the Pagination-Next ID value.
      schema:
        type: string
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: 'A workspace API key or an OAuth access token, sent as `Authorization: Bearer <token>`.


        Both carry the same scope vocabulary as the `OAuth2` scheme below. Category-only

        scopes restrict access to the categories they name. Coarse wildcards remain additive:

        `read contacts:read` reads every category, while `write contacts:read` can write every

        category. Omit coarse scopes when restricting access to specific categories.

        Legacy tokens with only coarse scopes retain their existing unrestricted access;

        a bare `read` scope alone does not enforce read-only access.

        '
    OAuth2:
      type: oauth2
      description: 'OAuth 2.0 authorization code flow for REST integrations. Create a Platform Application

        and follow `https://developers.myclickfunnels.com/docs/oauth-20` to connect users.

        Authorization server metadata is published at

        `https://accounts.myclickfunnels.com/.well-known/oauth-authorization-server`.

        Dynamic client registration at `/oauth/register` is for MCP clients only; MCP-scoped

        tokens must use `https://agents.myclickfunnels.com/mcp`, not the REST API.


        Scopes are least-privilege by category. Ask for the two coarse wildcards (`read`,

        `write`) only when an integration genuinely needs the whole workspace; otherwise ask

        for the `<category>:read` / `<category>:write` pairs you use. `write` implies `read`

        for the same category. Protected resource metadata (RFC 9728) for this API lives at

        `https://accounts.myclickfunnels.com/.well-known/oauth-protected-resource`.

        '
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.myclickfunnels.com/oauth/authorize
          tokenUrl: https://accounts.myclickfunnels.com/oauth/token
          refreshUrl: https://accounts.myclickfunnels.com/oauth/token
          scopes:
            read: Read any resource in the granted workspaces
            write: Read and write any resource in the granted workspaces
            contacts:read: Read Contacts
            contacts:write: Read and write Contacts
            workflows:read: Read Workflows (Automations)
            workflows:write: Read and write Workflows (Automations)
            funnels:read: Read Funnels
            funnels:write: Read and write Funnels
            sites:read: Read Sites & Design
            sites:write: Read and write Sites & Design
            courses:read: Read Courses
            courses:write: Read and write Courses
            emails:read: Read Emails
            emails:write: Read and write Emails
            blog:read: Read Blog
            blog:write: Read and write Blog
            community:read: Read Community
            community:write: Read and write Community
            appointments:read: Read Appointments
            appointments:write: Read and write Appointments
            opportunities:read: Read Opportunities
            opportunities:write: Read and write Opportunities
            store:read: Read Store
            store:write: Read and write Store
            forms:read: Read Forms
            forms:write: Read and write Forms
            media:read: Read Media
            media:write: Read and write Media
            webhooks:read: Read Webhooks
            webhooks:write: Read and write Webhooks
            account:read: Read Account
            account:write: Read and write Account
            reference:read: Read Reference Data
            reference:write: Read and write Reference Data
