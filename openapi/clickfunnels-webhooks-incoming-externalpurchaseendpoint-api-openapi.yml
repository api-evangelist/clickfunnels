openapi: 3.2.0
info:
  title: ClickFunnels Webhooks::Incoming::External Purchase Endpoint…
  termsOfService: https://www.clickfunnels.com/terms-of-service
  contact:
    name: ClickFunnels API Team
    url: https://developers.myclickfunnels.com
  x-logo:
    url: https://statics.myclickfunnels.com/image/1126065/file/31edf05760fafe41a82f16a668ab251f.png
  description: 'The ClickFunnels REST API that powers webhooks, native integrations, and Zapier lets you manage your ClickFunnels data, automate your workflows, and recreate ClickFunnels functionality in your own apps.


    ### For AI agents


    This document is the catalogue: every operation ClickFunnels exposes over REST is described here, with a unique operationId, typed schemas, and the scopes it needs. It is served from `/openapi.json`, `/openapi.yaml`, `/api/openapi.{json,yaml}`, and `/api/v2/openapi.{json,yaml}` on the accounts host.


    Three things it does not describe, each one request away:


    - MCP server: the app-native Model Context Protocol server (Streamable HTTP, OAuth 2.1 with PKCE). Prefer it over raw REST when your client supports MCP - it describes itself at runtime.

    - Skill guides, also as an Agent Skills index: one task guide per job (pages, blogs, products, orders, workflows, emails, courses, stats, external SDK pages). Read the guide that matches your job before your first write. llms.txt covers when to use ClickFunnels at all, how to get credentials, and how to behave around rate limits.

    - Protected resource metadata (RFC 9728) and authorization server metadata (RFC 8414): the scope vocabulary and the OAuth endpoints. Dynamic client registration is for MCP clients only.


    On ClickFunnels-owned API hosts (`myclickfunnels.com` and its subdomains), the OpenAPI specification responses and API authentication failures (401, or 403 for insufficient scope) carry those links in an RFC 8288 `Link` header, so clients can discover the documentation and authentication metadata from those responses. Requests sent through a customer''s custom domain keep the Bearer challenge but omit those discovery pointers.'
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  version: 2.0.0
servers:
- url: https://{subdomain}.myclickfunnels.com/api/v2
  description: ClickFunnels API
  variables:
    subdomain:
      default: myworkspace
security:
- BearerAuth: []
- OAuth2: []
tags:
- name: Webhooks::Incoming::ExternalPurchaseEndpoint
  description: Endpoints that receive purchases from external commerce providers and turn them into ClickFunnels orders.
paths:
  /workspaces/{workspace_id}/webhooks/incoming/external_purchase_endpoints:
    get:
      tags:
      - Webhooks::Incoming::ExternalPurchaseEndpoint
      summary: List Incoming External Purchase Endpoints
      description: List the endpoints that receive purchases from external commerce providers for a workspace.
      operationId: listWebhooksIncomingExternalPurchaseEndpoints
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/after'
      - $ref: '#/components/parameters/per_page'
      - $ref: '#/components/parameters/sort_order'
      - $ref: '#/components/parameters/sort_property'
      - name: filter
        in: query
        description: 'Filter by `id`, `provider` or `live_mode`, like this: `?filter[provider]=whop&filter[live_mode]=true`. All about filtering [here](https://developers.myclickfunnels.com/docs/filtering).'
        required: false
        style: deepObject
        explode: true
        schema:
          type: object
          properties:
            id:
              type: string
            provider:
              type: string
            live_mode:
              type: string
      responses:
        '200':
          description: OK
          headers:
            Pagination-Next:
              $ref: '#/components/headers/PaginationNext'
            Link:
              $ref: '#/components/headers/Link'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WebhooksIncomingExternalPurchaseEndpointAttributes'
              example:
              - id: 81
                public_id: WpEndP
                workspace_id: 42000
                name: Whop purchases
                provider: whop
                live_mode: false
                suppress_order_system_emails: true
                url: https://example.myclickfunnels.com/webhooks/incoming/external_purchases_webhooks/WpEndP
                webhook_secret_last_four: kLm9
                provider_metadata:
                  whop: {}
                created_at: '2026-08-26T12:00:00.000Z'
                updated_at: '2026-08-26T12:05:00.000Z'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  hint:
                    type:
                    - string
                    - 'null'
                    description: 'The next step for the caller: how to authenticate, which scope was missing, or where the route list lives. Always present, and null when this error has no next step to offer.'
              example:
                error: API key missing or invalid
                hint: 'Send the token as `Authorization: Bearer <token>`. Create one under Account > Team > Platform Applications (a workspace API key), or obtain one with OAuth 2.1; both use the same scopes. See https://developers.myclickfunnels.com/docs/authentication, or append .md to that URL for markdown.'
        '403':
          description: The access token does not grant read access to Webhooks.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  hint:
                    type:
                    - string
                    - 'null'
                    description: 'The next step for the caller: how to authenticate, which scope was missing, or where the route list lives. Always present, and null when this error has no next step to offer.'
              example:
                error: 'Forbidden: This access token''s scopes do not grant read access to Webhooks. Granted scopes: contacts:read.'
                hint: 'Scopes are granted per category as <category>:read or <category>:write; the `scope` parameter of WWW-Authenticate names the one this request needed. Grantable scopes: https://accounts.myclickfunnels.com/.well-known/oauth-protected-resource'
        '404':
          description: The workspace does not exist or is outside the API key's accessible workspaces.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  hint:
                    type:
                    - string
                    - 'null'
                    description: 'The next step for the caller: how to authenticate, which scope was missing, or where the route list lives. Always present, and null when this error has no next step to offer.'
              example:
                error: Not found
                hint: null
        '422':
          $ref: '#/components/responses/InvalidPageSize'
    post:
      tags:
      - Webhooks::Incoming::ExternalPurchaseEndpoint
      summary: Create Incoming External Purchase Endpoint
      description: 'Create an endpoint for one external commerce provider. Where ClickFunnels generates the

        signing secret, it is returned as `webhook_secret` in this response only, so save it

        immediately: later reads return just `webhook_secret_last_four`. Where the provider issues

        its own signing secret, the endpoint is created without one and you `PATCH` it in

        afterwards.


        Not every provider is available to every workspace: creating an endpoint for one a

        workspace has not been granted returns 403.'
      operationId: createWebhooksIncomingExternalPurchaseEndpoints
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        description: Incoming external purchase endpoint settings.
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                webhooks_incoming_external_purchases_endpoint:
                  type: object
                  $ref: '#/components/schemas/WebhooksIncomingExternalPurchaseEndpointParameters'
              required:
              - webhooks_incoming_external_purchases_endpoint
            example:
              webhooks_incoming_external_purchases_endpoint:
                name: ClickBank purchases
                provider: clickbank
                live_mode: true
                suppress_order_system_emails: false
      responses:
        '201':
          description: Created. This is the only response that includes the full `webhook_secret`, and only when ClickFunnels generated it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhooksIncomingExternalPurchaseEndpointCreatedAttributes'
              example:
                id: 82
                public_id: CbEndP
                workspace_id: 42000
                name: ClickBank purchases
                provider: clickbank
                live_mode: true
                suppress_order_system_emails: false
                url: https://example.myclickfunnels.com/webhooks/incoming/external_purchases_webhooks/CbEndP
                webhook_secret_last_four: f0ac
                provider_metadata:
                  clickbank: {}
                webhook_secret: 8d5aa2a2d13b4a48be2be8649853f0ac
                created_at: '2026-08-26T12:00:00.000Z'
                updated_at: '2026-08-26T12:00:00.000Z'
        '400':
          description: The JSON body is invalid or the required wrapper is missing.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  hint:
                    type:
                    - string
                    - 'null'
                    description: 'The next step for the caller: how to authenticate, which scope was missing, or where the route list lives. Always present, and null when this error has no next step to offer.'
              example:
                error: 'Bad request: param is missing or the value is empty: webhooks_incoming_external_purchases_endpoint'
                hint: null
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  hint:
                    type:
                    - string
                    - 'null'
                    description: 'The next step for the caller: how to authenticate, which scope was missing, or where the route list lives. Always present, and null when this error has no next step to offer.'
              example:
                error: API key missing or invalid
                hint: 'Send the token as `Authorization: Bearer <token>`. Create one under Account > Team > Platform Applications (a workspace API key), or obtain one with OAuth 2.1; both use the same scopes. See https://developers.myclickfunnels.com/docs/authentication, or append .md to that URL for markdown.'
        '403':
          description: The access token does not grant write access to Webhooks, or the provider is not enabled for this workspace.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  hint:
                    type:
                    - string
                    - 'null'
                    description: 'The next step for the caller: how to authenticate, which scope was missing, or where the route list lives. Always present, and null when this error has no next step to offer.'
              examples:
                missing_scope:
                  summary: The token cannot write Webhooks
                  value:
                    error: 'Forbidden: This access token''s scopes do not grant write access to Webhooks. Granted scopes: webhooks:read.'
                    hint: 'Scopes are granted per category as <category>:read or <category>:write; the `scope` parameter of WWW-Authenticate names the one this request needed. Grantable scopes: https://accounts.myclickfunnels.com/.well-known/oauth-protected-resource'
                provider_not_enabled:
                  summary: The provider is not enabled for this workspace
                  value:
                    error: Whop is not enabled for this workspace
                    hint: null
        '404':
          description: The workspace does not exist or is outside the API key's accessible workspaces.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  hint:
                    type:
                    - string
                    - 'null'
                    description: 'The next step for the caller: how to authenticate, which scope was missing, or where the route list lives. Always present, and null when this error has no next step to offer.'
              example:
                error: Not found
                hint: null
        '422':
          description: Endpoint validation failed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  hint:
                    type:
                    - string
                    - 'null'
                    description: 'The next step for the caller: how to authenticate, which scope was missing, or where the route list lives. Always present, and null when this error has no next step to offer.'
              example:
                error: 'Request unprocessable: Name can''t be blank'
                hint: null
