  /orders/{id}/cancel:
    post:
      tags:
      - Order
      summary: Cancel Order
      description: 'Cancel a subscription order through ClickFunnels'' own cancel path (the same path the

        in-app "Cancel subscription" flow uses) so the cancelation actually propagates to the

        payment processor (Payments AI/Rebilly or Stripe). A direct `PATCH /orders/{id}` write

        of `service_status: canceled` is a no-op for processor-managed orders, which is why this

        action exists.


        Only Payments AI and Stripe subscription orders can be canceled. Calling this on a

        one-time order or an external subscription returns a 422. Please refer to [our Orders

        Overview guide](https://developers.myclickfunnels.com/docs/orders) for more information

        about the different types of orders and payment processors.


        See [Cancel a subscription](https://accounts.myclickfunnels.com/.well-known/orders/skill.md#cancel-a-subscription) in the [Orders Skill](https://accounts.myclickfunnels.com/.well-known/orders/skill.md) for the

        request body, the accepted `cancel_reason` values per processor, and a [worked example](https://accounts.myclickfunnels.com/.well-known/orders/skill.md#worked-example---cancel-then-confirm)

        that confirms the scheduled churn.

        '
      operationId: cancelOrder
      parameters:
      - $ref: '#/components/parameters/id'
      requestBody:
        description: 'Optional cancelation parameters. Omit the request body entirely (or send `{"order": {}}`) to cancel with defaults.'
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                order:
                  type: object
                  $ref: '#/components/schemas/OrderParametersCancel'
            example:
              order:
                cancel_reason: too_expensive
                cancel_description: Switching to a cheaper plan
                effective_date: next_renewal
                cancelation_proration: false
                canceled_by: API
                voidable_invoices: []
      responses:
        '200':
          description: OK - the payment processor accepted the cancellation. The returned order is the latest local snapshot. Processor-populated fields such as `canceled_at`, `cancel_reason`, `cancel_description`, `churned_at`, and the final `service_status` can arrive in a later webhook; poll `GET /orders/{id}` when those fields are not yet populated. The caller-provided `canceled_by` value is persisted before that asynchronous sync and remains stable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderAttributes'
