    OrderParameters:
      type: object
      title: Orders
      description: 'Parameters for creating external orders. External orders are orders managed outside of ClickFunnels payment processors (Payments AI or Stripe).


        **Required fields:**

        - `order_type`: Must be `one-time-order` or `subscription-order`

        - `live_mode`: Must be `true` or `false`

        - `contact_id` or `contact_attributes`: Either provide a `contact_id` directly, or use `contact_attributes` with an `email_address` to look up an existing contact

        - `line_items_attributes`: At least one line item with `variant_id`, `products_price_id`, and `quantity`


        **Note:** For one-time orders, line items must reference one-time products. For subscription orders, line items can include both one-time and subscription products.

        '
      required:
      - order_type
      - live_mode
      - line_items_attributes
      properties:
        order_type:
          type: string
          enum:
          - one-time-order
          - subscription-order
          description: 'The type of order. Required for creating orders.

            - `one-time-order`: A single purchase order. Line items must reference one-time products only.

            - `subscription-order`: A recurring subscription order. Line items can include both one-time and subscription products.

            '
        live_mode:
          type: boolean
          description: 'Required. Indicates if the Order is for production or testing.

            - `true`: The order is a live/production order.

            - `false`: The order is a test order.

            '
        contact_id:
          type: integer
          description: 'The ID of the contact associated with the order.

            Either `contact_id` or `contact_attributes` must be provided, but not both.

            If both are provided, `contact_id` takes precedence.

            '
        contact_attributes:
          type: object
          description: 'Alternative to `contact_id`. Provide contact attributes to look up an existing contact by email.

            The contact must already exist in the workspace - by default, this does not create new contacts.

            If `contact_id` is also provided, it takes precedence and `contact_attributes` is ignored.

            '
          properties:
            email_address:
              type: string
              description: The email address of an existing contact in the workspace. Required when using contact_attributes.
          required:
          - email_address
        line_items_attributes:
          type: array
          description: 'Line items for the order. At least one line item is required.

            Each line item must include a valid `variant_id`, `products_price_id`, and `quantity`.

            '
          items:
            type: object
            required:
            - variant_id
            - products_price_id
            - quantity
            properties:
              variant_id:
                type: integer
                description: The ID of the product variant. Must be a valid variant in your workspace.
              products_price_id:
                type: integer
                description: The ID of the price for the product. Must be a valid price for the variant's product.
              quantity:
                type: integer
                description: The quantity of this line item.
                minimum: 1
        shipping_address_first_name:
          type:
          - string
          - 'null'
          description: 'The first name of the recipient''s shipping address.

            '
        shipping_address_last_name:
          type:
          - string
          - 'null'
          description: 'The last name of the recipient''s shipping address.

            '
        shipping_address_organization_name:
          type:
          - string
          - 'null'
          description: 'The organization name of the recipient''s shipping address.

            '
        shipping_address_phone_number:
          type:
          - string
          - 'null'
          description: 'The phone number of the recipient''s shipping address.

            '
        shipping_address_street_one:
          type:
          - string
          - 'null'
          description: The main street information of the shipping address, including the street name and number.
        shipping_address_street_two:
          type:
          - string
          - 'null'
          description: Additional street information for the shipping address, like entrance information and apartment numbers.
        shipping_address_city:
          type:
          - string
          - 'null'
          description: The city of the shipping address.
        shipping_address_region:
          type:
          - string
          - 'null'
          description: The region of the shipping address, like state or province.
        shipping_address_country:
          type:
          - string
          - 'null'
          description: 'The country of the shipping address.

            '
        shipping_address_postal_code:
          type:
          - string
          - 'null'
          description: Postal Code
        billing_address_street_one:
          type:
          - string
          - 'null'
          description: 'The main street information of the billing address, including the street name and number.

            '
        billing_address_street_two:
          type:
          - string
          - 'null'
          description: 'Additional street information of the billing address, like entrance information and apartment numbers.

            '
        billing_address_city:
          type:
          - string
          - 'null'
          description: 'The city of the billing address.

            '
        billing_address_region:
          type:
          - string
          - 'null'
          description: 'The region of the shipping address, like state or province.

            '
        billing_address_country:
          type:
          - string
          - 'null'
          description: 'The billing address country.

            '
        billing_address_postal_code:
          type:
          - string
          - 'null'
          description: 'Billing address postal (ZIP) code.

            '
        notes:
          type:
          - string
          - 'null'
          description: Your internal note about the order. This will be visible in ClickFunnels admin orders-related sections.
        billing_status:
          type: string
          description: 'The billing status reflects the status of the invoice of an order.

            Billing status can be one of the following for Payments AI and Stripe orders:

            `pending`, `draft`, `paid`, `unpaid`, `partially-refunded`, `refunded`, `voided`, `disputed`, `past-due`.


            For external orders, the billing status can be one of: `pending`, `paid`, `unpaid`, `voided` and `refunded`.

            '
        service_status:
          type: string
          description: 'The service status reflects the activity state of the order. For subscriptions, it can control whether a subscription is ongoing, for example despite an irregular (unpaid) invoice status.


            For orders with Payments AI as the payment processor, it can be one of the following:

            `pending`, `active`, `completed`, `churned`, `canceled`, `suspended`, `paused`, `abandoned`, `voided`

            Stripe orders have the same order statuses, except for `voided`. For voided invoices, its service status becomes `abandoned`.

            You can read about the state transitions in more detail in our [orders overview guide](https://developers.myclickfunnels.com/docs/orders).


            For external one-time orders possible service statuses are `pending` or `completed`. For external subscription orders possible statuses are `pending`, `active`, `churned`, `canceled`, `completed`, `paused`.

            '
        next_charge_at:
          type:
          - string
          - 'null'
          description: The date and time of the next scheduled charge for subscription orders. (External subscription orders only)
        activated_at:
          type:
          - string
          - 'null'
          description: Date Activated
        canceled_at:
          type:
          - string
          - 'null'
          description: Order Canceled At
        canceled_by:
          type:
          - string
          - 'null'
          description: Order Canceled By
        cancel_reason:
          type:
          - string
          - 'null'
          description: 'The reason _code_ for the cancelation, it is required when canceling an order.


            Possible codes for Payments AI orders are:

            `did-not-use`, `did-not-want`, `missing-features`, `too-expensive`, `bugs-or-problems`, `other`


            Possible codes for Stripe orders are:

            `customer_service`, `low_quality`, `missing_features`, `other`, `switched_service`, `too_complex`, `too_expensive`, `unused`


            External orders accept the same cancelation reasons as Stripe.

            '
        cancel_description:
          type:
          - string
          - 'null'
          description: A free-text description of the cancellation reason.
        churned_at:
          type:
          - string
          - 'null'
          description: Churned At
        external_id:
          type:
          - string
          - 'null'
          description: An external ID, e.g., a payment provider's ID or an ID managed by the client internally
      example:
        order:
          order_type: one-time-order
          live_mode: true
          contact_id: 10
          line_items_attributes:
          - variant_id: 15
            products_price_id: 23
            quantity: 1
          - variant_id: 18
            products_price_id: 29
            quantity: 2
          shipping_address_first_name: Elmira
          shipping_address_last_name: O'Keefe
          shipping_address_organization_name: Testing, Inc.
          shipping_address_phone_number: '+19053871234'
          shipping_address_street_one: 687 Volkman Trail
          shipping_address_street_two: Suite 665
          shipping_address_city: New Ezequiel
          shipping_address_region: WA
          shipping_address_country: US
          shipping_address_postal_code: '93706'
          billing_address_street_one: 3537 Meridith Overpass
          billing_address_street_two: Apt. 787
          billing_address_city: Tyraside
          billing_address_region: WA
          billing_address_country: US
          billing_address_postal_code: 48869-5657
          notes: Leave package at the front desk
          billing_status: pending
          service_status: pending
          external_id: ext-order-12345
