openapi: 3.2.0
info:
  title: ClickFunnels Emails::Domain API
  termsOfService: https://www.clickfunnels.com/terms-of-service
  contact:
    name: ClickFunnels API Team
    url: https://developers.myclickfunnels.com
  x-logo:
    url: https://statics.myclickfunnels.com/image/1126065/file/31edf05760fafe41a82f16a668ab251f.png
  description: 'The ClickFunnels REST API that powers webhooks, native integrations, and Zapier lets you manage your ClickFunnels data, automate your workflows, and recreate ClickFunnels functionality in your own apps.


    ### For AI agents


    This document is the catalogue: every operation ClickFunnels exposes over REST is described here, with a unique operationId, typed schemas, and the scopes it needs. It is served from `/openapi.json`, `/openapi.yaml`, `/api/openapi.{json,yaml}`, and `/api/v2/openapi.{json,yaml}` on the accounts host.


    Three things it does not describe, each one request away:


    - MCP server: the app-native Model Context Protocol server (Streamable HTTP, OAuth 2.1 with PKCE). Prefer it over raw REST when your client supports MCP - it describes itself at runtime.

    - Skill guides, also as an Agent Skills index: one task guide per job (pages, blogs, products, orders, workflows, emails, courses, stats, external SDK pages). Read the guide that matches your job before your first write. llms.txt covers when to use ClickFunnels at all, how to get credentials, and how to behave around rate limits.

    - Protected resource metadata (RFC 9728) and authorization server metadata (RFC 8414): the scope vocabulary and the OAuth endpoints. Dynamic client registration is for MCP clients only.


    On ClickFunnels-owned API hosts (`myclickfunnels.com` and its subdomains), the OpenAPI specification responses and API authentication failures (401, or 403 for insufficient scope) carry those links in an RFC 8288 `Link` header, so clients can discover the documentation and authentication metadata from those responses. Requests sent through a customer''s custom domain keep the Bearer challenge but omit those discovery pointers.'
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  version: 2.0.0
servers:
- url: https://{subdomain}.myclickfunnels.com/api/v2
  description: ClickFunnels API
  variables:
    subdomain:
      default: myworkspace
security:
- BearerAuth: []
- OAuth2: []
tags:
- name: Emails::Domain
  description: '> Email Domains represent the sending domains (DKIM/SPF/DMARC) available to a workspace for outbound email.


    One domain name has two independent jobs, and sending needs both. This resource covers email transport: `verified` means the name is authenticated for sending (DKIM + SPF + DMARC, or a verified SMTP setting). The other job is proving the workspace owns the name, reported here as `ownership_verified`; that happens by connecting the domain to the workspace as a website/hosting domain inside the ClickFunnels app (a website domain is connected as a subdomain such as `www.example.com`, which confirms ownership of the root sending domain `example.com`), and no call in this API can make it true. Neither substitutes for the other: `ready_for_sending` becomes true only when both are true, and a `200` from verify means the check ran, not that it passed, so always read the booleans back.


    Provision the root domain (`example.com`), not a subdomain: ownership is confirmed at the root domain, so a subdomain is rejected with `422` naming the root domain to use instead.


    Typical workflow: provision the sending domain (`POST /workspaces/{workspace_id}/emails/domains`), have the customer publish the returned DNS records and connect the same name to the workspace in ClickFunnels, then re-check with `POST /emails/domains/{id}/verify` until `ready_for_sending` is true, following `next_steps` for whatever is still missing. Then create sender addresses via `POST /workspaces/{workspace_id}/emails/addresses` with `emails_domain_id` set to this domain''s numeric id.


    See Sending domains in the Emails Skill.'
paths:
  /workspaces/{workspace_id}/emails/domains:
    get:
      tags:
      - Emails::Domain
      summary: List Email Domains
      description: List all email sending domains (DKIM/SPF/DMARC) for a workspace. These are **email sending** domains - for website/hosting domains, see **listDomains**. Each result separates workspace ownership (`ownership_verified`) from email transport (`verified`); addresses on a custom domain can send only when `ready_for_sending` is true. Ownership comes from connecting the domain, as `www.example.com` or another subdomain of it, to this workspace as a website/hosting domain in the ClickFunnels app - no API call makes `ownership_verified` true. Return-path verification is independent of sender readiness. Reads return the stored DNS verification state and never trigger a live DNS lookup (use `verifyEmailsDomains` for that); `ownership_verified` is always current. See Sending domains in the Emails Skill for the complete agent workflow.
      operationId: listEmailsDomains
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/after'
      - $ref: '#/components/parameters/per_page'
      - $ref: '#/components/parameters/sort_order'
      - $ref: '#/components/parameters/sort_property'
      responses:
        '200':
          description: OK
          headers:
            Pagination-Next:
              $ref: '#/components/headers/PaginationNext'
            Link:
              $ref: '#/components/headers/Link'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EmailsDomainAttributes'
              example:
              - id: 1
                public_id: QrStUv
                workspace_id: 42000
                name: example.com
                ownership_verified: false
                verified: false
                ready_for_sending: false
                dkim_verified: false
                spf_verified: false
                dmarc_verified: false
                smtp_verified: false
                return_address_verified: false
                dkim_record:
                  type: TXT
                  name: second._domainkey.example.com
                  value: v=DKIM1; k=rsa; p=...
                  ttl: 300
                  verified: false
                spf_record:
                  type: TXT
                  name: example.com
                  value: v=spf1 include:mailer.myclickfunnels.com -all
                  ttl: 300
                  verified: false
                dmarc_record:
                  type: TXT
                  name: _dmarc.example.com
                  value: v=DMARC1; p=none;
                  ttl: 300
                  verified: false
                return_address_record:
                  type: CNAME
                  name: cf2mail.example.com
                  value: mailer.myclickfunnels.com
                  ttl: 300
                  verified: false
                next_steps:
                - Connect example.com to this workspace in ClickFunnels so ownership is confirmed. Addresses on this domain cannot send until it is, even once every record below verifies.
                - Add dkim_record, spf_record, and dmarc_record at the DNS provider for example.com to authenticate email transport.
                - 'Recommended for ClickFunnels bounce handling: add return_address_record at the DNS provider.'
                - DNS changes can take up to 48 hours to propagate. Re-check with POST /api/v2/emails/domains/QrStUv/verify; results are cached for about 10 minutes.
                - 'Manual setup help: https://support.myclickfunnels.com/docs/email-settings-how-to-verify-email-dns-records'
                created_at: '2025-01-01T00:00:00.000Z'
                updated_at: '2025-01-01T00:00:00.000Z'
              - id: 2
                public_id: LmNoPq
                workspace_id: 42000
                name: verified-example.com
                ownership_verified: true
                verified: true
                ready_for_sending: true
                dkim_verified: true
                spf_verified: true
                dmarc_verified: true
                smtp_verified: false
                return_address_verified: false
                dkim_record:
                  type: TXT
                  name: second._domainkey.verified-example.com
                  value: v=DKIM1; k=rsa; p=...
                  ttl: 300
                  verified: true
                spf_record:
                  type: TXT
                  name: verified-example.com
                  value: v=spf1 include:mailer.myclickfunnels.com -all
                  ttl: 300
                  verified: true
                dmarc_record:
                  type: TXT
                  name: _dmarc.verified-example.com
                  value: v=DMARC1; p=none;
                  ttl: 300
                  verified: true
                return_address_record:
                  type: CNAME
                  name: cf2mail.verified-example.com
                  value: mailer.myclickfunnels.com
                  ttl: 300
                  verified: false
                next_steps:
                - 'Recommended for ClickFunnels bounce handling: add return_address_record at the DNS provider.'
                - Ready to send - create addresses on this domain with POST /api/v2/workspaces/42000/emails/addresses (emails_domain_id 2).
                created_at: '2025-01-01T00:00:00.000Z'
                updated_at: '2025-01-01T00:00:00.000Z'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  hint:
                    type:
                    - string
                    - 'null'
                    description: 'The next step for the caller: how to authenticate, which scope was missing, or where the route list lives. Always present, and null when this error has no next step to offer.'
              example:
                error: API key missing or invalid
                hint: 'Send the token as `Authorization: Bearer <token>`. Create one under Account > Team > Platform Applications (a workspace API key), or obtain one with OAuth 2.1; both use the same scopes. See https://developers.myclickfunnels.com/docs/authentication, or append .md to that URL for markdown.'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  hint:
                    type:
                    - string
                    - 'null'
                    description: 'The next step for the caller: how to authenticate, which scope was missing, or where the route list lives. Always present, and null when this error has no next step to offer.'
              example:
                error: 'Not found: Record missing'
                hint: null
        '422':
          $ref: '#/components/responses/InvalidPageSize'
    post:
      tags:
      - Emails::Domain
      summary: Create Email Domain
      description: 'Provision a sending domain for a workspace. Find-or-create: returns `200` with the existing record if a domain with this name already exists for the workspace, or `201` with freshly generated DNS records if it was just created. These are **email sending** domains (DKIM/SPF/DMARC) - for website/hosting domains, see **listDomains**. The response includes the email-transport records; `dkim_record` can be `null` until the DKIM key finishes generating, and POSTing the same name again retries provisioning. Provisioning also creates a `no-reply@` sender address on the new domain. Follow `next_steps`, which distinguishes the required ownership step, the required transport records, and the recommended return-path record; verified SMTP replaces DKIM/SPF/DMARC. Ownership (`ownership_verified`) is proved by connecting the domain, as `www.example.com` or another subdomain of it, to this workspace as a website/hosting domain in the ClickFunnels app, not through this API. Ownership is confirmed at the root domain, so provision `example.com` rather than a subdomain such as `mail.example.com`, which is rejected with `422` naming the root domain to use instead. Then call **verifyEmailsDomains** until `ready_for_sending` is true; a `200` there means the check ran, not that it passed. The top-level `verified` field means transport only; sender readiness requires both ownership and transport. Return-path verification is independent. Once ready, create addresses via `POST /workspaces/{workspace_id}/emails/addresses` with `emails_domain_id` set to this domain''s numeric `id`.'
      operationId: createEmailsDomains
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        description: Information about the sending domain to provision
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - emails_domain
              properties:
                emails_domain:
                  type: object
                  $ref: '#/components/schemas/EmailsDomainParameters'
            example:
              emails_domain:
                name: example.com
      responses:
        '200':
          description: OK - a sending domain with this name already existed for the workspace and is returned as-is.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailsDomainAttributes'
              example:
                id: 5
                public_id: LmNoPq
                workspace_id: 42000
                name: existing-example.com
                ownership_verified: false
                verified: false
                ready_for_sending: false
                dkim_verified: false
                spf_verified: false
                dmarc_verified: false
                smtp_verified: false
                return_address_verified: false
                dkim_record:
                  type: TXT
                  name: second._domainkey.existing-example.com
                  value: v=DKIM1; k=rsa; p=...
                  ttl: 300
                  verified: false
                spf_record:
                  type: TXT
                  name: existing-example.com
                  value: v=spf1 include:mailer.myclickfunnels.com -all
                  ttl: 300
                  verified: false
                dmarc_record:
                  type: TXT
                  name: _dmarc.existing-example.com
                  value: v=DMARC1; p=none;
                  ttl: 300
                  verified: false
                return_address_record:
                  type: CNAME
                  name: cf2mail.existing-example.com
                  value: mailer.myclickfunnels.com
                  ttl: 300
                  verified: false
                next_steps:
                - Connect existing-example.com to this workspace in ClickFunnels so ownership is confirmed. Addresses on this domain cannot send until it is, even once every record below verifies.
                - Add dkim_record, spf_record, and dmarc_record at the DNS provider for existing-example.com to authenticate email transport.
                - 'Recommended for ClickFunnels bounce handling: add return_address_record at the DNS provider.'
                - DNS changes can take up to 48 hours to propagate. Re-check with POST /api/v2/emails/domains/LmNoPq/verify; results are cached for about 10 minutes.
                - 'Manual setup help: https://support.myclickfunnels.com/docs/email-settings-how-to-verify-email-dns-records'
                created_at: '2025-01-01T00:00:00.000Z'
                updated_at: '2025-01-01T00:00:00.000Z'
        '201':
          description: Created - a new sending domain was provisioned; its DNS records were just generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailsDomainAttributes'
              example:
                id: 6
                public_id: QrStUv
                workspace_id: 42000
                name: example.com
                ownership_verified: false
                verified: false
                ready_for_sending: false
                dkim_verified: false
                spf_verified: false
                dmarc_verified: false
                smtp_verified: false
                return_address_verified: false
                dkim_record:
                  type: TXT
                  name: second._domainkey.example.com
                  value: v=DKIM1; k=rsa; p=...
                  ttl: 300
                  verified: false
                spf_record:
                  type: TXT
                  name: example.com
                  value: v=spf1 include:mailer.myclickfunnels.com -all
                  ttl: 300
                  verified: false
                dmarc_record:
                  type: TXT
                  name: _dmarc.example.com
                  value: v=DMARC1; p=none;
                  ttl: 300
                  verified: false
                return_address_record:
                  type: CNAME
                  name: cf2mail.example.com
                  value: mailer.myclickfunnels.com
                  ttl: 300
                  verified: false
                next_steps:
                - Connect example.com to this workspace in ClickFunnels so ownership is confirmed. Addresses on this domain cannot send until it is, even once every record below verifies.
                - Add dkim_record, spf_record, and dmarc_record at the DNS provider for example.com to authenticate email transport.
                - 'Recommended for ClickFunnels bounce handling: add return_address_record at the DNS provider.'
                - DNS changes can take up to 48 hours to propagate. Re-check with POST /api/v2/emails/domains/QrStUv/verify; results are cached for about 10 minutes.
                - 'Manual setup help: https://support.myclickfunnels.com/docs/email-settings-how-to-verify-email-dns-records'
                created_at: '2025-01-01T00:00:00.000Z'
                updated_at: '2025-01-01T00:00:00.000Z'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  hint:
                    type:
                    - string
                    - 'null'
                    description: 'The next step for the caller: how to authenticate, which scope was missing, or where the route list lives. Always present, and null when this error has no next step to offer.'
              example:
                error: API key missing or invalid
                hint: 'Send the token as `Authorization: Bearer <token>`. Create one under Account > Team > Platform Applications (a workspace API key), or obtain one with OAuth 2.1; both use the same scopes. See https://developers.myclickfunnels.com/docs/authentication, or append .md to that URL for markdown.'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  hint:
                    type:
                    - string
                    - 'null'
                    description: 'The next step for the caller: how to authenticate, which scope was missing, or where the route list lives. Always present, and null when this error has no next step to offer.'
              example:
                error: 'Forbidden: This access token''s scopes do not grant write access to Emails. Granted scopes: emails:read.'
                hint: 'Scopes are granted per category as <category>:read or <category>:write; the `scope` parameter of WWW-Authenticate names the one this request needed. Grantable scopes: https://accounts.myclickfunnels.com/.well-known/oauth-protected-resource'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  hint:
                    type:
                    - string
                    - 'null'
                    description: 'The next step for the caller: how to authenticate, which scope was missing, or where the route list lives. Always present, and null when this error has no next step to offer.'
              example:
                error: 'Not found: Record missing'
                hint: null
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  hint:
                    type:
                    - string
                    - 'null'
                    description: 'The next step for the caller: how to authenticate, which scope was missing, or where the route list lives. Always present, and null when this error has no next step to offer.'
              examples:
                malformed_name:
                  value:
                    error: 'Request unprocessable: Name must be a valid public domain name.'
                    hint: null
                subdomain_name:
                  value:
                    error: 'Request unprocessable: Sending domains are set up on the root domain. Use "example.com" instead of "mail.example.com".'
                    hint: null
                trademarked_name:
                  value:
                    error: 'Request unprocessable: Name includes a trademarked phrase - please select another domain name'
                    hint: null
  /emails/domains/{id}:
    get:
      tags:
      - Emails::Domain
      summary: Get Email Domain
      description: Retrieve a single email sending domain (DKIM/SPF/DMARC), including its ownership, transport, readiness, and return-path flags plus the DNS records to add at the provider. These are **email sending** domains - for website/hosting domains, see **listDomains**. `verified` reports transport only; `ready_for_sending` requires both workspace ownership and transport, while return-path verification is independent. Ownership is confirmed by connecting the domain, as `www.example.com` or another subdomain of it, to this workspace as a website/hosting domain in the ClickFunnels app, not through this API. `dkim_record` is `null` until the DKIM key finishes generating - re-POST the same name to **createEmailsDomains** to retry provisioning. This read returns the stored DNS verification state and never triggers a live DNS lookup (use `verifyEmailsDomains` to re-check), while `ownership_verified` is always current.
      operationId: getEmailsDomains
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailsDomainAttributes'
              example:
                id: 1
                public_id: QrStUv
                workspace_id: 42000
                name: example.com
                ownership_verified: false
                verified: false
                ready_for_sending: false
                dkim_verified: false
                spf_verified: false
                dmarc_verified: false
                smtp_verified: false
                return_address_verified: false
                dkim_record:
                  type: TXT
                  name: second._domainkey.example.com
                  value: v=DKIM1; k=rsa; p=...
                  ttl: 300
                  verified: false
                spf_record:
                  type: TXT
                  name: example.com
                  value: v=spf1 include:mailer.myclickfunnels.com -all
                  ttl: 300
                  verified: false
                dmarc_record:
                  type: TXT
                  name: _dmarc.example.com
                  value: v=DMARC1; p=none;
                  ttl: 300
                  verified: false
                return_address_record:
                  type: CNAME
                  name: cf2mail.example.com
                  value: mailer.myclickfunnels.com
                  ttl: 300
                  verified: false
                next_steps:
                - Connect example.com to this workspace in ClickFunnels so ownership is confirmed. Addresses on this domain cannot send until it is, even once every record below verifies.
                - Add dkim_record, spf_record, and dmarc_record at the DNS provider for example.com to authenticate email transport.
                - 'Recommended for ClickFunnels bounce handling: add return_address_record at the DNS provider.'
                - DNS changes can take up to 48 hours to propagate. Re-check with POST /api/v2/emails/domains/QrStUv/verify; results are cached for about 10 minutes.
                - 'Manual setup help: https://support.myclickfunnels.com/docs/email-settings-how-to-verify-email-dns-records'
                created_at: '2025-01-01T00:00:00.000Z'
                updated_at: '2025-01-01T00:00:00.000Z'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  hint:
                    type:
                    - string
                    - 'null'
                    description: 'The next step for the caller: how to authenticate, which scope was missing, or where the route list lives. Always present, and null when this error has no next step to offer.'
              example:
                error: API key missing or invalid
                hint: 'Send the token as `Authorization: Bearer <token>`. Create one under Account > Team > Platform Applications (a workspace API key), or obtain one with OAuth 2.1; both use the same scopes. See https://developers.myclickfunnels.com/docs/authentication, or append .md to that URL for markdown.'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  hint:
                    type:
                    - string
                    - 'null'
                    description: 'The next step for the caller: how to authenticate, which scope was missing, or where the route list lives. Always present, and null when this error has no next step to offer.'
              example:
                error: 'Not found: Record missing'
                hint: null
  /emails/domains/{id}/verify:
    post:
      tags:
      - Emails::Domain
      summary: Verify Email Domain
      description: Re-run the DNS checks for DKIM, SPF, DMARC, and the return path, cached for about 10 minutes, and return the refreshed status together with the current ownership state. A `200` means the check ran, not that it passed, so always read the booleans back. `verified` reports transport only and becomes true when DKIM, SPF, and DMARC are all live, or when a verified SMTP setting exists. `ownership_verified` reports workspace control of the name, which comes from connecting the domain, as `www.example.com` or another subdomain of it, to this workspace as a website/hosting domain in the ClickFunnels app rather than from any API call. `ready_for_sending` becomes true only when both are true. Return-path verification is checked but remains independent and is not required for readiness. DNS changes can take up to 48 hours to propagate.
      operationId: verifyEmailsDomains
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailsDomainAttributes'
              example:
                id: 1
                public_id: QrStUv
                workspace_id: 42000
                name: example.com
                ownership_verified: true
                verified: true
                ready_for_sending: true
                dkim_verified: true
                spf_verified: true
                dmarc_verified: true
                smtp_verified: false
                return_address_verified: false
                dkim_record:
                  type: TXT
                  name: second._domainkey.example.com
                  value: v=DKIM1; k=rsa; p=...
                  ttl: 300
                  verified: true
                spf_record:
                  type: TXT
                  name: example.com
                  value: v=spf1 include:mailer.myclickfunnels.com -all
                  ttl: 300
                  verified: true
                dmarc_record:
                  type: TXT
                  name: _dmarc.example.com
                  value: v=DMARC1; p=none;
                  ttl: 300
                  verified: true
                return_address_record:
                  type: CNAME
                  name: cf2mail.example.com
                  value: mailer.myclickfunnels.com
                  ttl: 300
                  verified: false
                next_steps:
                - 'Recommended for ClickFunnels bounce handling: add return_address_record at the DNS provider.'
                - Ready to send - create addresses on this domain with POST /api/v2/workspaces/42000/emails/addresses (emails_domain_id 1).
                created_at: '2025-01-01T00:00:00.000Z'
                updated_at: '2025-06-01T12:00:00.000Z'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  hint:
                    type:
                    - string
                    - 'null'
                    description: 'The next step for the caller: how to authenticate, which scope was missing, or where the route list lives. Always present, and null when this error has no next step to offer.'
              example:
                error: API key missing or invalid
                hint: 'Send the token as `Authorization: Bearer <token>`. Create one under Account > Team > Platform Applications (a workspace API key), or obtain one with OAuth 2.1; both use the same scopes. See https://developers.myclickfunnels.com/docs/authentication, or append .md to that URL for markdown.'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  hint:
                    type:
                    - string
                    - 'null'
                    description: 'The next step for the caller: how to authenticate, which scope was missing, or where the route list lives. Always present, and null when this error has no next step to offer.'
              example:
                error: 'Not found: Record missing'
                hint: null
components:
  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: string
    per_page:
      name: per_page
      in: query
      required: false
      description: Records per page. Defaults to 20; raise it up to 100 for bulk reads. A larger value returns 100 records. Zero, a negative or a non-integer value is a 422. The `Link` next-page URL keeps the value, so a client following it keeps the page size. More [in our guides](https://developers.myclickfunnels.com/docs/pagination).
      schema:
        type: integer
        minimum: 1
        default: 20
    sort_property:
      name: sort_property
      in: query
      description: 'Sort property of a list response. The default is id and thus the created_at order.

        If you sort by other properties, we additionally sort by id implicitly as a secondary sort property, so that you can rely on the sort order to be deterministic even if the main sort property ends up with the same values.

        '
      required: false
      schema:
        type: string
        enum:
        - id
        - updated_at
    sort_order:
      name: sort_order
      in: query
      description: Sort order of a list response. Use 'desc' to reverse the default 'asc' (ascending) sort order. Examples [in our guides](https://developers.myclickfunnels.com/docs/pagination).
      required: false
      schema:
        type: string
        enum:
        - asc
        - desc
    after:
      name: after
      in: query
      required: false
      schema:
        type: string
      description: ID of item after which the collection should be returned. More examples and info about pagination [in our guides](https://developers.myclickfunnels.com/docs/pagination).
  schemas:
    EmailsDomainAttributes:
      type: object
      title: Email Domains
      description: Email Domains
      properties:
        id:
          type: integer
          description: Email Domain ID
        public_id:
          type:
          - string
          - 'null'
          description: Email Domain public ID
        workspace_id:
          type: integer
          description: Workspace ID
        name:
          type: string
          description: The sending domain name (lowercase), e.g. `example.com` - the part after the `@` shared by every email address created on this domain.
        ownership_verified:
          type: boolean
          description: Whether ClickFunnels has confirmed that this workspace owns the domain name. It becomes true when the same name is connected to this workspace as a website/hosting domain whose ownership is verified - done in the ClickFunnels app, not through this API. No API call can make it true; ask the customer to connect the domain.
        verified:
          type: boolean
          description: Whether email transport is verified. True once DKIM, SPF, and DMARC are all verified via DNS, or when a verified SMTP setting exists. This field does not prove domain ownership and is not sufficient by itself to send.
        ready_for_sending:
          type: boolean
          description: Whether addresses on this custom domain can be used as senders. True only when both `ownership_verified` and the transport-only `verified` field are true. The return-path record is independent and does not control this value.
        dkim_verified:
          type: boolean
          description: Whether the domain's DKIM DNS record is verified.
        spf_verified:
          type: boolean
          description: Whether the domain's SPF DNS record is verified.
        dmarc_verified:
          type: boolean
          description: Whether the domain's DMARC DNS record is verified.
        smtp_verified:
          type: boolean
          description: Whether email transport is verified via a verified SMTP setting (an alternative to DKIM/SPF/DMARC verification). When true, `verified` can be true while dkim_verified/spf_verified/dmarc_verified are false; ownership must still be verified before `ready_for_sending` becomes true.
        return_address_verified:
          type: boolean
          description: Whether the domain's return-path CNAME record (used for bounce handling) is verified. This is independent of `verified` and `ready_for_sending` and is not required for either one to become true.
        dkim_record:
          description: The DKIM TXT record to add at the registrar. `null` until the DKIM key has been generated, which happens automatically shortly after the domain is created; POST the same name again to retry provisioning if it stays `null`.
          anyOf:
          - $ref: '#/components/schemas/DnsRecord'
          - type: 'null'
        spf_record:
          description: The SPF TXT record to add at the registrar.
          anyOf:
          - $ref: '#/components/schemas/DnsRecord'
          - type: 'null'
        dmarc_record:
          description: The DMARC TXT record to add at the registrar.
          anyOf:
          - $ref: '#/components/schemas/DnsRecord'
          - type: 'null'
        return_address_record:
          description: The return-path CNAME record to add at the registrar (used for bounce handling).
          anyOf:
          - $ref: '#/components/schemas/DnsRecord'
          - type: 'null'
        next_steps:
          type: array
          items:
            type: string
          description: Plain-English guidance you can surface to users. It distinguishes the required ownership step (connect the domain to the workspace in ClickFunnels) and the required transport records from the recommended ClickFunnels return path, accounts for verified SMTP, and explains how to re-check readiness.
        created_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Created at datetime
        updated_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Updated at datetime
      example:
        id: 1
        public_id: QrStUv
        workspace_id: 42000
        name: example.com
        ownership_verified: false
        verified: false
        ready_for_sending: false
        dkim_verified: false
        spf_verified: false
        dmarc_verified: false
        smtp_verified: false
        return_address_verified: false
        dkim_record:
          type: TXT
          name: second._domainkey.example.com
          value: v=DKIM1; k=rsa; p=...
          ttl: 300
          verified: false
        spf_record:
          type: TXT
          name: example.com
          value: v=spf1 include:mailer.myclickfunnels.com -all
          ttl: 300
          verified: false
        dmarc_record:
          type: TXT
          name: _dmarc.example.com
          value: v=DMARC1; p=none;
          ttl: 300
          verified: false
        return_address_record:
          type: CNAME
          name: cf2mail.example.com
          value: mailer.myclickfunnels.com
          ttl: 300
          verified: false
        next_steps:
        - Connect example.com to this workspace in ClickFunnels so ownership is confirmed. Addresses on this domain cannot send until it is, even once every record below verifies.
        - Add dkim_record, spf_record, and dmarc_record at the DNS provider for example.com to authenticate email transport.
        - 'Recommended for ClickFunnels bounce handling: add return_address_record at the DNS provider.'
        - DNS changes can take up to 48 hours to propagate. Re-check with POST /api/v2/emails/domains/QrStUv/verify; results are cached for about 10 minutes.
        - 'Manual setup help: https://support.myclickfunnels.com/docs/email-settings-how-to-verify-email-dns-records'
        created_at: '2025-01-01T00:00:00.000Z'
        updated_at: '2025-01-01T00:00:00.000Z'
    EmailsDomainParameters:
      type: object
      title: Email Domains
      description: A sending domain to provision for a workspace.
      required:
      - name
      properties:
        name:
          type: string
          description: A valid public bare root domain name to provision as a sending domain (e.g. `example.com`), with no URL scheme, port, path, or whitespace. Ownership is confirmed at the root domain, so a subdomain such as `mail.example.com` is rejected with `422` naming the root domain to use instead. The name is trimmed and lowercased before it is matched or created. If a sending domain with this name already exists for the workspace, it is returned as-is rather than creating a duplicate.
      example:
        name: example.com
    DnsRecord:
      type: object
      title: DNS Record
      description: A single DNS record to add at the domain's DNS provider to configure email transport (or, for the return path, bounce handling).
      properties:
        type:
          type: string
          description: The DNS record type (e.g. `TXT`, `CNAME`).
        name:
          type: string
          description: The DNS host/name to create the record on (e.g. `example.com` or `_dmarc.example.com`).
        value:
          type: string
          description: The exact value to paste at the registrar for this record.
        ttl:
          type: integer
          description: Recommended TTL, in seconds, for the record.
        verified:
          type: boolean
          description: Whether this specific record has been confirmed live at the DNS provider. It reflects stored DNS verification state; call `verifyEmailsDomains` to re-check.
      example:
        type: TXT
        name: _dmarc.example.com
        value: v=DMARC1; p=none;
        ttl: 300
        verified: false
  responses:
    InvalidPageSize:
      description: Unprocessable Entity - `per_page` must be a positive integer.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
              hint:
                type:
                - string
                - 'null'
                description: Next step for the caller, or null when no additional guidance applies.
          example:
            error: 'Request unprocessable: per_page must be a positive integer, capped at 100 (got "0")'
            hint: null
  headers:
    PaginationNext:
      description: ID of the last item in the current response after which more records exist. You can use it in an `after` query parameter for cursor-based pagination to get to the next page.
      schema:
        type: string
    Link:
      description: A direct link to the next page for the cursor-based pagination. It includes the `after` and the Pagination-Next ID value.
      schema:
        type: string
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: 'A workspace API key or an OAuth access token, sent as `Authorization: Bearer <token>`.


        Both carry the same scope vocabulary as the `OAuth2` scheme below. Category-only

        scopes restrict access to the categories they name. Coarse wildcards remain additive:

        `read contacts:read` reads every category, while `write contacts:read` can write every

        category. Omit coarse scopes when restricting access to specific categories.

        Legacy tokens with only coarse scopes retain their existing unrestricted access;

        a bare `read` scope alone does not enforce read-only access.

        '
    OAuth2:
      type: oauth2
      description: 'OAuth 2.0 authorization code flow for REST integrations. Create a Platform Application

        and follow `https://developers.myclickfunnels.com/docs/oauth-20` to connect users.

        Authorization server metadata is published at

        `https://accounts.myclickfunnels.com/.well-known/oauth-authorization-server`.

        Dynamic client registration at `/oauth/register` is for MCP clients only; MCP-scoped

        tokens must use `https://agents.myclickfunnels.com/mcp`, not the REST API.


        Scopes are least-privilege by category. Ask for the two coarse wildcards (`read`,

        `write`) only when an integration genuinely needs the whole workspace; otherwise ask

        for the `<category>:read` / `<category>:write` pairs you use. `write` implies `read`

        for the same category. Protected resource metadata (RFC 9728) for this API lives at

        `https://accounts.myclickfunnels.com/.well-known/oauth-protected-resource`.

        '
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.myclickfunnels.com/oauth/authorize
          tokenUrl: https://accounts.myclickfunnels.com/oauth/token
          refreshUrl: https://accounts.myclickfunnels.com/oauth/token
          scopes:
            read: Read any resource in the granted workspaces
            write: Read and write any resource in the granted workspaces
            contacts:read: Read Contacts
            contacts:write: Read and write Contacts
            workflows:read: Read Workflows (Automations)
            workflows:write: Read and write Workflows (Automations)
            funnels:read: Read Funnels
            funnels:write: Read and write Funnels
            sites:read: Read Sites & Design
            sites:write: Read and write Sites & Design
            courses:read: Read Courses
            courses:write: Read and write Courses
            emails:read: Read Emails
            emails:write: Read and write Emails
            blog:read: Read Blog
            blog:write: Read and write Blog
            community:read: Read Community
            community:write: Read and write Community
            appointments:read: Read Appointments
            appointments:write: Read and write Appointments
            opportunities:read: Read Opportunities
            opportunities:write: Read and write Opportunities
            store:read: Read Store
            store:write: Read and write Store
            forms:read: Read Forms
            forms:write: Read and write Forms
            media:read: Read Media
            media:write: Read and write Media
            webhooks:read: Read Webhooks
            webhooks:write: Read and write Webhooks
            account:read: Read Account
            account:write: Read and write Account
            reference:read: Read Reference Data
            reference:write: Read and write Reference Data
