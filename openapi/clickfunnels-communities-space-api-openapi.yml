openapi: 3.2.0
info:
  title: ClickFunnels Communities::Space API
  termsOfService: https://www.clickfunnels.com/terms-of-service
  contact:
    name: ClickFunnels API Team
    url: https://developers.myclickfunnels.com
  x-logo:
    url: https://statics.myclickfunnels.com/image/1126065/file/31edf05760fafe41a82f16a668ab251f.png
  description: 'The ClickFunnels REST API that powers webhooks, native integrations, and Zapier lets you manage your ClickFunnels data, automate your workflows, and recreate ClickFunnels functionality in your own apps.

    '
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  version: 2.0.0
servers:
- url: https://{subdomain}.myclickfunnels.com/api/v2
  description: ClickFunnels API
  variables:
    subdomain:
      default: myworkspace
security:
- BearerAuth: []
tags:
- name: Communities::Space
  description: '> Spaces (Topics) are the individual discussion areas within a Space Group.


    A Space is a single discussion channel or topic area within a Space Group. Members post, comment, and interact inside Spaces. Each Space can be configured with its own layout, access controls, sorting, and SEO settings.

    '
paths:
  /communities/space_groups/{space_group_id}/spaces:
    get:
      tags:
      - Communities::Space
      summary: List Spaces
      description: List spaces within a space group
      operationId: listCommunitiesSpaces
      parameters:
      - name: space_group_id
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/after'
      - $ref: '#/components/parameters/sort_order'
      - $ref: '#/components/parameters/sort_property'
      responses:
        '200':
          description: OK
          headers:
            Pagination-Next:
              $ref: '#/components/headers/PaginationNext'
            Link:
              $ref: '#/components/headers/Link'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CommunitiesSpaceAttributes'
              example:
              - id: 1
                public_id: CdEfGh
                space_group_id: 1
                workspace_id: 42
                name: Welcome
                access: 0
                current_path: /welcome
                emoji: 👋
                card_image_id: null
                social_image_id: null
                members_can_post: true
                members_can_invite: null
                allow_post_titles: null
                allow_cover_images: null
                hide_from_featured: null
                layout_style: null
                default_tab: null
                default_post_sort: null
                default_comment_sort: null
                default_member_sort: null
                pinned_posts_label: null
                seo_title: null
                seo_description: null
                sort_order: 1
                always_on: null
                upgrade_url: null
                created_at: '2025-01-01T00:00:00.000Z'
                updated_at: '2025-01-01T00:00:00.000Z'
              - id: 2
                public_id: IjKlMn
                space_group_id: 1
                workspace_id: 42
                name: Introductions
                access: 0
                current_path: /introductions
                emoji: 🙌
                card_image_id: null
                social_image_id: null
                members_can_post: true
                members_can_invite: null
                allow_post_titles: null
                allow_cover_images: null
                hide_from_featured: null
                layout_style: null
                default_tab: null
                default_post_sort: null
                default_comment_sort: null
                default_member_sort: null
                pinned_posts_label: null
                seo_title: null
                seo_description: null
                sort_order: 2
                always_on: null
                upgrade_url: null
                created_at: '2025-01-01T00:00:00.000Z'
                updated_at: '2025-01-01T00:00:00.000Z'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: API key missing or invalid
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Not found - This usually happens when you try to access a record that does not exist in your account. It can also happen when the provided parent record is missing, e.g. you have put in a non-existent Space Group parent ID.
              example:
                error: 'Not found: Record missing'
    post:
      tags:
      - Communities::Space
      summary: Create Space
      description: Create a space within a space group
      operationId: createCommunitiesSpaces
      parameters:
      - name: space_group_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        description: Information about a new Space
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                communities_space:
                  type: object
                  $ref: '#/components/schemas/CommunitiesSpaceParameters'
            example:
              communities_space:
                name: Welcome
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunitiesSpaceAttributes'
              example:
                id: 3
                public_id: OpQrSt
                space_group_id: 1
                workspace_id: 42
                name: Welcome
                access: 0
                current_path: null
                emoji: null
                card_image_id: null
                social_image_id: null
                members_can_post: true
                members_can_invite: null
                allow_post_titles: null
                allow_cover_images: null
                hide_from_featured: null
                layout_style: null
                default_tab: null
                default_post_sort: null
                default_comment_sort: null
                default_member_sort: null
                pinned_posts_label: null
                seo_title: null
                seo_description: null
                sort_order: null
                always_on: null
                upgrade_url: null
                created_at: '2025-01-01T00:00:00.000Z'
                updated_at: '2025-01-01T00:00:00.000Z'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: API key missing or invalid
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: Name can't be blank
