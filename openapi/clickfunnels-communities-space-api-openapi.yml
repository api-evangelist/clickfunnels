          - string
          - 'null'
          description: Space public ID
        space_group_id:
          type: integer
          description: Space Group ID the space belongs to
        workspace_id:
          type: integer
          description: Workspace ID the space belongs to
        name:
          type:
          - string
          - 'null'
          description: Name
        access:
          type: string
          enum:
          - is_open
          - is_private
          - is_secret
          description: Access level
        current_path:
          type:
          - string
          - 'null'
          description: Current Path
        emoji:
          type:
          - string
          - 'null'
          description: Emoji icon for the space
        card_image_id:
          type:
          - integer
          - 'null'
          description: Card Image ID
        social_image_id:
          type:
          - integer
          - 'null'
          description: Social Image ID
        members_can_post:
          type: boolean
          description: Whether members can post in this space
        members_can_invite:
          type:
          - boolean
          - 'null'
          description: Whether members can invite others to this space
        allow_post_titles:
          type:
          - boolean
          - 'null'
          description: Whether posts can have titles
        allow_cover_images:
          type:
