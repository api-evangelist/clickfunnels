    patch:
      tags:
      - Discount
      summary: Update Discount
      description: 'Update a discount. Money-affecting fields are locked once the discount has been redeemed and return 422, while renaming and expiring still work. A discount that is already expired freezes its other fields and returns 422, a rename included - lift the expiry with `expired: false` (the API side of Remove Expiration in the app) or push `apply_until` into the future, then make the change and expire it again.'
      operationId: updateDiscounts
      parameters:
      - $ref: '#/components/parameters/id'
      requestBody:
        description: Information about updated fields in Discount
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                discount:
                  type: object
                  $ref: '#/components/schemas/DiscountParametersUpdate'
            example:
              discount:
                expired: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscountAttributes'
              example:
                id: 771
                public_id: gBEDMo
                workspace_id: 42000
                name: Launch 20
                code: LAUNCH20
                discount_type: code
                discount_method: percentage
                amount: null
                percent: '20.0'
                currency: usd
                applies_to: all_products
                apply_from: '2025-01-01T00:00:00.000Z'
                apply_until: '2025-01-15T09:30:00.000Z'
                limit_1_per_customer: false
                require_minimum_spend: false
                require_minimum_spend_amount: null
                discounts_per_redemption: null
                redemptions_count: 0
                product_ids: []
                variant_ids: []
                products_collection_ids: []
                active: false
                expired: true
                scheduled: false
                created_at: '2025-01-01T00:00:00.000Z'
                updated_at: '2025-01-15T09:30:00.000Z'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  hint:
                    type:
                    - string
                    - 'null'
                    description: 'The next step for the caller: how to authenticate, which scope was missing, or where the route list lives. Always present, and null when this error has no next step to offer.'
              example:
                error: API key missing or invalid
                hint: 'Send the token as `Authorization: Bearer <token>`. Create one under Account > Team > Platform Applications (a workspace API key), or obtain one with OAuth 2.1; both use the same scopes. See https://developers.myclickfunnels.com/docs/authentication, or append .md to that URL for markdown.'
        '403':
          description: Forbidden - the access token's scopes do not cover this request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  hint:
                    type:
                    - string
                    - 'null'
                    description: 'The next step for the caller: how to authenticate, which scope was missing, or where the route list lives. Always present, and null when this error has no next step to offer.'
              example:
                error: 'Forbidden: This access token''s scopes do not grant write access to Store. Granted scopes: store:read.'
                hint: 'Scopes are granted per category as <category>:read or <category>:write; the `scope` parameter of WWW-Authenticate names the one this request needed. Grantable scopes: https://accounts.myclickfunnels.com/.well-known/oauth-protected-resource'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  hint:
                    type:
                    - string
                    - 'null'
                    description: 'The next step for the caller: how to authenticate, which scope was missing, or where the route list lives. Always present, and null when this error has no next step to offer.'
              example:
                error: 'Not found: Record missing'
                hint: null
        '422':
          description: Unprocessable Entity - validation failed, the discount is locked after redemption, or the discount is expired
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  hint:
                    type:
                    - string
                    - 'null'
                    description: 'The next step for the caller: how to authenticate, which scope was missing, or where the route list lives. Always present, and null when this error has no next step to offer.'
              examples:
                money_field_locked_after_redemption:
                  summary: a money-affecting field on a redeemed discount
                  value:
                    error: 'Request unprocessable: Percent cannot be changed because it has already been applied'
                    hint: null
                already_expired:
                  summary: 'a frozen field on an already-expired discount, including one sent alongside `expired: true`'
                  value:
                    error: 'Request unprocessable: Discount cannot be changed because it has expired'
                    hint: null
                cannot_unexpire_redeemed:
                  summary: '`expired: false` on a discount that has been redeemed'
                  value:
                    error: 'Request unprocessable: Apply until cannot be removed after it has been redeemed'
                    hint: null
                expired_not_boolean:
                  summary: an `expired` value that is neither true nor false
                  value:
                    error: 'Request unprocessable: `expired` must be true or false.'
                    hint: null
                unknown_enum_value:
                  summary: a value outside an enum field's list
                  value:
                    error: 'Request unprocessable: `discount_type` must be one of: code, automatic, sale.'
                    hint: null
                end_before_start:
                  summary: 'apply_until earlier than apply_from - use `expired: true` to expire now'
                  value:
                    error: 'Request unprocessable: Apply until scheduled end date must be after the scheduled start date'
                    hint: null
    delete:
      tags:
      - Discount
      summary: Remove Discount
      description: 'Hard-delete a discount. Only a discount that has NOT been applied to an order can be deleted; a used discount returns 422 (expire it with `expired: true` instead, to preserve its order history).


        A discount enters that state through an applied-discount record, written when a buyer redeems the code at checkout or when a ClickFunnels user applies it in the admin UI. A code an integration created and never published carries none of those records, so it is always deletable.'
      operationId: removeDiscounts
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '204':
          description: No Content
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  hint:
                    type:
                    - string
                    - 'null'
                    description: 'The next step for the caller: how to authenticate, which scope was missing, or where the route list lives. Always present, and null when this error has no next step to offer.'
              example:
                error: API key missing or invalid
                hint: 'Send the token as `Authorization: Bearer <token>`. Create one under Account > Team > Platform Applications (a workspace API key), or obtain one with OAuth 2.1; both use the same scopes. See https://developers.myclickfunnels.com/docs/authentication, or append .md to that URL for markdown.'
        '403':
          description: Forbidden - the access token's scopes do not cover this request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  hint:
                    type:
                    - string
                    - 'null'
                    description: 'The next step for the caller: how to authenticate, which scope was missing, or where the route list lives. Always present, and null when this error has no next step to offer.'
              example:
                error: 'Forbidden: This access token''s scopes do not grant write access to Store. Granted scopes: store:read.'
                hint: 'Scopes are granted per category as <category>:read or <category>:write; the `scope` parameter of WWW-Authenticate names the one this request needed. Grantable scopes: https://accounts.myclickfunnels.com/.well-known/oauth-protected-resource'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  hint:
                    type:
                    - string
                    - 'null'
                    description: 'The next step for the caller: how to authenticate, which scope was missing, or where the route list lives. Always present, and null when this error has no next step to offer.'
              example:
                error: 'Not found: Record missing'
                hint: null
        '422':
          description: Unprocessable Entity - the discount is attached to an order and cannot be deleted. `redemptions_count` does not predict this - it only counts redemptions on an invoice, so a discount reporting zero redemptions can still be undeletable.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  hint:
                    type:
                    - string
                    - 'null'
                    description: 'The next step for the caller: how to authenticate, which scope was missing, or where the route list lives. Always present, and null when this error has no next step to offer.'
              example:
                error: 'Request unprocessable: Cannot delete a discount that has been applied to an order. Expire it instead with `expired: true`.'
                hint: null
components:
  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: string
    per_page:
      name: per_page
      in: query
      required: false
      description: Records per page. Defaults to 20; raise it up to 100 for bulk reads. A larger value returns 100 records. Zero, a negative or a non-integer value is a 422. The `Link` next-page URL keeps the value, so a client following it keeps the page size. More [in our guides](https://developers.myclickfunnels.com/docs/pagination).
      schema:
        type: integer
        minimum: 1
        default: 20
    sort_property:
      name: sort_property
      in: query
      description: 'Sort property of a list response. The default is id and thus the created_at order.

        If you sort by other properties, we additionally sort by id implicitly as a secondary sort property, so that you can rely on the sort order to be deterministic even if the main sort property ends up with the same values.

        '
      required: false
      schema:
        type: string
        enum:
        - id
        - updated_at
    sort_order:
      name: sort_order
      in: query
      description: Sort order of a list response. Use 'desc' to reverse the default 'asc' (ascending) sort order. Examples [in our guides](https://developers.myclickfunnels.com/docs/pagination).
      required: false
      schema:
        type: string
        enum:
        - asc
        - desc
    after:
      name: after
      in: query
      required: false
      schema:
        type: string
      description: ID of item after which the collection should be returned. More examples and info about pagination [in our guides](https://developers.myclickfunnels.com/docs/pagination).
  responses:
    InvalidPageSize:
      description: Unprocessable Entity - `per_page` must be a positive integer.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
              hint:
                type:
                - string
                - 'null'
                description: Next step for the caller, or null when no additional guidance applies.
          example:
            error: 'Request unprocessable: per_page must be a positive integer, capped at 100 (got "0")'
            hint: null
  headers:
    PaginationNext:
      description: ID of the last item in the current response after which more records exist. You can use it in an `after` query parameter for cursor-based pagination to get to the next page.
      schema:
        type: string
    Link:
      description: A direct link to the next page for the cursor-based pagination. It includes the `after` and the Pagination-Next ID value.
      schema:
        type: string
  schemas:
    DiscountAttributes:
      type: object
      title: Discount
      description: A reusable, workspace-scoped discount applied on top of a price.
      properties:
        id:
          type: integer
          description: Discount ID
        public_id:
          type:
          - string
          - 'null'
          description: Discount public ID
        workspace_id:
          type: integer
          description: Workspace ID
        name:
          type: string
          description: Internal name for the discount.
        code:
          type: string
          description: The code a buyer redeems at checkout. Uppercased on save; unique within the workspace (cannot collide with a coupon code).
        discount_type:
          type: string
          enum:
          - code
          - automatic
          - sale
          description: '`code` (the default) is a redeemable coupon code. `automatic` and `sale` are deprecated.'
        discount_method:
          type: string
          enum:
          - percentage
          - fixed
          - shipping
          - bogo
          description: How the discount is calculated. `percentage` uses `percent`; `fixed` uses `amount`. `shipping` and `bogo` exist but are outside the simple flow.
        amount:
          type:
          - string
          - 'null'
          description: Fixed amount off, as a decimal string (e.g. "10.00"). `null` for a percentage discount.
        percent:
          type:
          - string
          - 'null'
          description: Percentage off between 0.01 and 100 (e.g. "20.0"). `null` for a fixed discount.
        currency:
          type: string
          description: ISO currency code, lowercased. Defaults to the workspace currency.
        applies_to:
          type: string
          enum:
          - all_products
          - specific_products
          - specific_variants
          - specific_collections
          description: Scope of the discount. `all_products` (the default) applies workspace-wide; the `specific_*` values restrict it to the ids passed in `product_ids` / `variant_ids` / `products_collection_ids`.
        apply_from:
          type: string
          format: date-time
          description: When the discount becomes active. Defaults to the creation time.
        apply_until:
          type:
          - string
          - 'null'
          format: date-time
          description: When the discount expires. `null` means it never expires.
        limit_1_per_customer:
          type: boolean
          description: When true, each contact can redeem the discount only once.
        require_minimum_spend:
          type: boolean
          description: When true, the order must meet `require_minimum_spend_amount` for the discount to apply.
        require_minimum_spend_amount:
          type:
          - integer
          - 'null'
          description: Minimum order subtotal required, when `require_minimum_spend` is true. In whole currency units, not cents - `50` on a `usd` discount means $50.
        discounts_per_redemption:
          type:
          - integer
          - 'null'
          description: Optional cap on how many line items a single redemption discounts.
        redemptions_count:
          type: integer
          description: How many times the discount has been redeemed on an invoice. On Stripe every invoice counts, renewals included; on Payments AI each customer redemption counts once, however many renewal invoices it covers. This is not a deletability signal - a discount can report zero redemptions and still return 422 on DELETE because it is applied to an order that has no invoice yet.
        product_ids:
          type: array
          items:
            type: integer
          description: The products the discount is scoped to (empty unless `applies_to` is `specific_products`).
        variant_ids:
          type: array
          items:
            type: integer
          description: The variants the discount is scoped to (empty unless `applies_to` is `specific_variants`).
        products_collection_ids:
          type: array
          items:
            type: integer
          description: The collections the discount is scoped to (empty unless `applies_to` is `specific_collections`).
        active:
          type: boolean
          description: Derived - true when the discount is neither scheduled for the future nor expired.
        expired:
          type: boolean
          description: Derived - true when `apply_until` is in the past. An expired discount is frozen - every further update returns 422, so rename before you expire.
        scheduled:
          type: boolean
          description: Derived - true when `apply_from` is in the future.
        created_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Added
        updated_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Updated
      example:
        id: 771
        public_id: gBEDMo
        workspace_id: 42000
        name: Launch 20
        code: LAUNCH20
        discount_type: code
        discount_method: percentage
        amount: null
        percent: '20.0'
        currency: usd
        applies_to: all_products
        apply_from: '2025-01-01T00:00:00.000Z'
        apply_until: null
        limit_1_per_customer: false
        require_minimum_spend: false
        require_minimum_spend_amount: null
        discounts_per_redemption: null
        redemptions_count: 0
        product_ids: []
        variant_ids: []
        products_collection_ids: []
        active: true
        expired: false
        scheduled: false
        created_at: '2025-01-01T00:00:00.000Z'
        updated_at: '2025-01-01T00:00:00.000Z'
    DiscountParameters:
      type: object
      title: Discount
      description: Fields accepted when creating a discount.
      required:
      - name
      properties:
        name:
          type: string
          description: Internal name for the discount.
        code:
          type: string
          pattern: ^[a-zA-Z0-9-]+$
          description: Required for a `code`-type discount. Letters, numbers and hyphens only - spaces, underscores and punctuation return 422. Uppercased on save; must be unique within the workspace (it cannot collide with a coupon code either).
        discount_type:
          type: string
          enum:
          - code
          - automatic
          - sale
          description: Defaults to `code`.
        discount_method:
          type: string
          enum:
          - percentage
          - fixed
          - shipping
          - bogo
          description: Defaults to `percentage`. `percentage` requires `percent`; `fixed` requires a positive `amount`.
        percent:
          type: string
          description: Percentage off (0.01-100). Required when `discount_method` is `percentage`.
        amount:
          type: string
          description: Fixed amount off as a decimal string. Required when `discount_method` is `fixed`.
        currency:
          type: string
          description: ISO currency code. Defaults to the workspace currency.
        applies_to:
          type: string
          enum:
          - all_products
          - specific_products
          - specific_variants
          - specific_collections
          description: Defaults to `all_products`.
        apply_from:
          type: string
          format: date-time
          description: When the discount becomes active. Defaults to now. Set in the future to schedule it.
        apply_until:
          type: string
          format: date-time
          description: 'When the discount expires. Omit for no expiry. There is no `expired` create field - sending one returns 422 whatever its value, including `false`, because expiring on create can never succeed (it would set `apply_until` to now, and `apply_from` then defaults to a hair later). Create the discount first, then expire it with `PATCH { "discount": { "expired": true } }`.'
        limit_1_per_customer:
          type: boolean
        require_minimum_spend:
          type: boolean
        require_minimum_spend_amount:
          type: integer
          description: Minimum order subtotal, in whole currency units rather than cents - `50` on a `usd` discount means $50. Must be positive when `require_minimum_spend` is true.
        discounts_per_redemption:
          type: integer
        product_ids:
          type: array
          items:
            type: integer
          description: Product ids to scope to, when `applies_to` is `specific_products`.
        variant_ids:
          type: array
          items:
            type: integer
          description: Variant ids to scope to, when `applies_to` is `specific_variants`.
        products_collection_ids:
          type: array
          items:
            type: integer
          description: Collection ids to scope to, when `applies_to` is `specific_collections`.
      example:
        name: Launch 20
        code: LAUNCH20
        discount_type: code
        discount_method: percentage
        percent: '20.0'
        applies_to: all_products
    DiscountParametersUpdate:
      type: object
      title: Discount
      description: 'Fields accepted when updating a discount. Two lock-out rules apply, in this order: once the discount has been redeemed on an order its money-affecting fields (amount, percent, discount_method, applies_to, apply_from, the scoping arrays, limit_1_per_customer, discounts_per_redemption) are locked and return 422, while renaming and expiring still work; a discount that is already expired freezes its other fields and returns 422 (`Discount cannot be changed because it has expired`). Expiring is reversible - `expired: false` clears the end date and a future `apply_until` pushes it out, either of which makes the discount live again - so editing an expired discount means lifting the expiry first. Expiring a discount and renaming it in the same request is fine; it is a rename sent to a discount that is already expired that gets refused.'
      required: []
      properties:
        name:
          type: string
        code:
          type: string
          pattern: ^[a-zA-Z0-9-]+$
          description: Letters, numbers and hyphens only. Uppercased on save; must be unique within the workspace.
        discount_type:
          type: string
          enum:
          - code
          - automatic
          - sale
          description: '`code` is a redeemable coupon code. `automatic` and `sale` are deprecated.'
        discount_method:
          type: string
          enum:
          - percentage
          - fixed
          - shipping
          - bogo
        percent:
          type: string
        amount:
          type: string
        currency:
          type: string
          description: ISO currency code. Locked once the discount has been applied to an order.
        applies_to:
          type: string
          enum:
          - all_products
          - specific_products
          - specific_variants
          - specific_collections
        apply_from:
          type: string
          format: date-time
        apply_until:
          type:
          - string
          - 'null'
          format: date-time
          description: 'Schedule a future end date. Must be after `apply_from`; a past date returns 422. To expire a live discount now, use `expired: true` instead.'
        expired:
          type: boolean
          description: 'Virtual switch over `apply_until`, accepted on update only (sending it on create returns 422). `true` expires the discount immediately by setting `apply_until` to now; `false` lifts an expiry by clearing `apply_until`, the same as Remove Expiration in the app. It ends a discount that has not started yet (`scheduled: true`) as well, discarding the future `apply_from`, since nothing can end before it starts. A discount that has been redeemed cannot be un-expired and returns 422. Sending the state the discount is already in changes nothing and returns 200 without moving `apply_until`, so echoing a serialized discount back in a routine update cannot clear a scheduled end date - to remove a future end date, PATCH `apply_until` to null instead. Only `true` and `false` are accepted; any other value returns 422 rather than being read as "expire it".'
        limit_1_per_customer:
          type: boolean
        require_minimum_spend:
          type: boolean
        require_minimum_spend_amount:
          type: integer
          description: Minimum order subtotal, in whole currency units rather than cents - `50` on a `usd` discount means $50.
        discounts_per_redemption:
          type: integer
        product_ids:
          type: array
          items:
            type: integer
        variant_ids:
          type: array
          items:
            type: integer
        products_collection_ids:
          type: array
          items:
            type: integer
      example:
        expired: true
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: 'A workspace API key or an OAuth access token, sent as `Authorization: Bearer <token>`.


        Both carry the same scope vocabulary as the `OAuth2` scheme below. Category-only

        scopes restrict access to the categories they name. Coarse wildcards remain additive:

        `read contacts:read` reads every category, while `write contacts:read` can write every

        category. Omit coarse scopes when restricting access to specific categories.

        Legacy tokens with only coarse scopes retain their existing unrestricted access;

        a bare `read` scope alone does not enforce read-only access.

        '
    OAuth2:
      type: oauth2
      description: 'OAuth 2.0 authorization code flow for REST integrations. Create a Platform Application

        and follow `https://developers.myclickfunnels.com/docs/oauth-20` to connect users.

        Authorization server metadata is published at

        `https://accounts.myclickfunnels.com/.well-known/oauth-authorization-server`.

        Dynamic client registration at `/oauth/register` is for MCP clients only; MCP-scoped

        tokens must use `https://agents.myclickfunnels.com/mcp`, not the REST API.


        Scopes are least-privilege by category. Ask for the two coarse wildcards (`read`,

        `write`) only when an integration genuinely needs the whole workspace; otherwise ask

        for the `<category>:read` / `<category>:write` pairs you use. `write` implies `read`

        for the same category. Protected resource metadata (RFC 9728) for this API lives at

        `https://accounts.myclickfunnels.com/.well-known/oauth-protected-resource`.

        '
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.myclickfunnels.com/oauth/authorize
          tokenUrl: https://accounts.myclickfunnels.com/oauth/token
          refreshUrl: https://accounts.myclickfunnels.com/oauth/token
          scopes:
            read: Read any resource in the granted workspaces
            write: Read and write any resource in the granted workspaces
            contacts:read: Read Contacts
            contacts:write: Read and write Contacts
            workflows:read: Read Workflows (Automations)
            workflows:write: Read and write Workflows (Automations)
            funnels:read: Read Funnels
            funnels:write: Read and write Funnels
            sites:read: Read Sites & Design
            sites:write: Read and write Sites & Design
            courses:read: Read Courses
            courses:write: Read and write Courses
            emails:read: Read Emails
            emails:write: Read and write Emails
            blog:read: Read Blog
            blog:write: Read and write Blog
            community:read: Read Community
            community:write: Read and write Community
            appointments:read: Read Appointments
            appointments:write: Read and write Appointments
            opportunities:read: Read Opportunities
            opportunities:write: Read and write Opportunities
            store:read: Read Store
            store:write: Read and write Store
            forms:read: Read Forms
            forms:write: Read and write Forms
            media:read: Read Media
            media:write: Read and write Media
            webhooks:read: Read Webhooks
            webhooks:write: Read and write Webhooks
            account:read: Read Account
            account:write: Read and write Account
            reference:read: Read Reference Data
            reference:write: Read and write Reference Data
