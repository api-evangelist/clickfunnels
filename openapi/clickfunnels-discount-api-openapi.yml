openapi: 3.2.0
info:
  title: ClickFunnels Discount API
  termsOfService: https://www.clickfunnels.com/terms-of-service
  contact:
    name: ClickFunnels API Team
    url: https://developers.myclickfunnels.com
  x-logo:
    url: https://statics.myclickfunnels.com/image/1126065/file/31edf05760fafe41a82f16a668ab251f.png
  description: 'The ClickFunnels REST API that powers webhooks, native integrations, and Zapier lets you manage your ClickFunnels data, automate your workflows, and recreate ClickFunnels functionality in your own apps.


    ### For AI agents


    This document is the catalogue: every operation ClickFunnels exposes over REST is described here, with a unique operationId, typed schemas, and the scopes it needs. It is served from `/openapi.json`, `/openapi.yaml`, `/api/openapi.{json,yaml}`, and `/api/v2/openapi.{json,yaml}` on the accounts host.


    Three things it does not describe, each one request away:


    - MCP server: the app-native Model Context Protocol server (Streamable HTTP, OAuth 2.1 with PKCE). Prefer it over raw REST when your client supports MCP - it describes itself at runtime.

    - Skill guides, also as an Agent Skills index: one task guide per job (pages, blogs, products, orders, workflows, emails, courses, stats, external SDK pages). Read the guide that matches your job before your first write. llms.txt covers when to use ClickFunnels at all, how to get credentials, and how to behave around rate limits.

    - Protected resource metadata (RFC 9728) and authorization server metadata (RFC 8414): the scope vocabulary and the OAuth endpoints. Dynamic client registration is for MCP clients only.


    On ClickFunnels-owned API hosts (`myclickfunnels.com` and its subdomains), the OpenAPI specification responses and API authentication failures (401, or 403 for insufficient scope) carry those links in an RFC 8288 `Link` header, so clients can discover the documentation and authentication metadata from those responses. Requests sent through a customer''s custom domain keep the Bearer challenge but omit those discovery pointers.'
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  version: 2.0.0
servers:
- url: https://{subdomain}.myclickfunnels.com/api/v2
  description: ClickFunnels API
  variables:
    subdomain:
      default: myworkspace
security:
- BearerAuth: []
- OAuth2: []
tags:
- name: Discount
  description: '> A reusable, workspace-scoped discount the checkout applies on top of a price.


    A Discount is the right tool for a coupon code, a percentage/amount off, or a

    time-boxed sale - anything you would otherwise fake with a second "sale" price.

    It is one reusable object applied on top of the price, so you can start, scope,

    and expire it without touching the product''s prices.


    A `code`-type discount (the default) needs a unique `code` that buyers redeem at

    checkout - letters, numbers and hyphens only. `discount_method` decides which amount

    field is required: `percentage` needs `percent` (0.01-100); `fixed` needs a positive

    `amount`. `currency` defaults to the workspace currency and `apply_from` defaults to

    now, so a discount is live immediately unless you schedule it with a future

    `apply_from` and/or expire it with `apply_until`.


    By default a discount applies to `all_products`. Set `applies_to` to

    `specific_products` / `specific_variants` / `specific_collections` and pass the

    matching `product_ids` / `variant_ids` / `products_collection_ids` array to scope it.


    Two lock-out rules govern the end of a discount''s life. Once it has been redeemed on

    an order its money-affecting fields are locked (422 on update) while renaming and

    expiring still work. Once it has actually expired it is frozen completely - every

    update returns 422 - so rename before you expire, not after. A discount attached to

    an order cannot be deleted at all; `redemptions_count` does not predict that, since

    it only counts redemptions on an invoice.'
paths:
  /workspaces/{workspace_id}/discounts:
    get:
      tags:
      - Discount
      summary: List Discounts
      description: List the discounts in a workspace.
      operationId: listDiscounts
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/after'
      - $ref: '#/components/parameters/per_page'
      - $ref: '#/components/parameters/sort_order'
      - $ref: '#/components/parameters/sort_property'
      - name: filter
        in: query
        description: 'Filter by available properties in query params, like this: `api/v2/resources?filter[id]=value&filter[another_property]=value1,value2`. Check our Filtering guide for examples and all about filtering [here](https://developers.myclickfunnels.com/docs/filtering).

          '
        required: false
        schema:
          type: object
          properties:
            id:
              type: string
              description: A comma-separated list of discount IDs to filter by.
              example: 1,2,3
            code:
              type: string
              description: Filter by discount code (exact match).
            discount_type:
              type: string
              description: Filter by discount type (`code`, `automatic`, `sale`).
            discount_method:
              type: string
              description: Filter by discount method (`percentage`, `fixed`, `shipping`, `bogo`).
            applies_to:
              type: string
              description: Filter by scope (`all_products`, `specific_products`, `specific_variants`, `specific_collections`).
        style: deepObject
        explode: true
      responses:
        '200':
          description: OK
          headers:
            Pagination-Next:
              $ref: '#/components/headers/PaginationNext'
            Link:
              $ref: '#/components/headers/Link'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DiscountAttributes'
              example:
              - id: 771
                public_id: gBEDMo
                workspace_id: 42000
                name: Launch 20
                code: LAUNCH20
                discount_type: code
                discount_method: percentage
                amount: null
                percent: '20.0'
                currency: usd
                applies_to: all_products
                apply_from: '2025-01-01T00:00:00.000Z'
                apply_until: null
                limit_1_per_customer: false
                require_minimum_spend: false
                require_minimum_spend_amount: null
                discounts_per_redemption: null
                redemptions_count: 0
                product_ids: []
                variant_ids: []
                products_collection_ids: []
                active: true
                expired: false
                scheduled: false
                created_at: '2025-01-01T00:00:00.000Z'
                updated_at: '2025-01-01T00:00:00.000Z'
              - id: 772
                public_id: qBEDNp
                workspace_id: 42000
                name: Bundle 10 off
                code: BUNDLE10
                discount_type: code
                discount_method: fixed
                amount: '10.0'
                percent: null
                currency: usd
                applies_to: specific_products
                apply_from: '2025-01-01T00:00:00.000Z'
                apply_until: '2025-02-01T00:00:00.000Z'
                limit_1_per_customer: true
                require_minimum_spend: true
                require_minimum_spend_amount: 50
                discounts_per_redemption: 1
                redemptions_count: 3
                product_ids:
                - 126
                variant_ids: []
                products_collection_ids: []
                active: true
                expired: false
                scheduled: false
                created_at: '2025-01-01T00:00:00.000Z'
                updated_at: '2025-01-01T00:00:00.000Z'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  hint:
                    type:
                    - string
                    - 'null'
                    description: 'The next step for the caller: how to authenticate, which scope was missing, or where the route list lives. Always present, and null when this error has no next step to offer.'
              example:
                error: API key missing or invalid
                hint: 'Send the token as `Authorization: Bearer <token>`. Create one under Account > Team > Platform Applications (a workspace API key), or obtain one with OAuth 2.1; both use the same scopes. See https://developers.myclickfunnels.com/docs/authentication, or append .md to that URL for markdown.'
        '403':
          description: Forbidden - the access token's scopes do not cover this request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  hint:
                    type:
                    - string
                    - 'null'
                    description: 'The next step for the caller: how to authenticate, which scope was missing, or where the route list lives. Always present, and null when this error has no next step to offer.'
              example:
                error: 'Forbidden: This access token''s scopes do not grant read access to Store. Granted scopes: contacts:read.'
                hint: 'Scopes are granted per category as <category>:read or <category>:write; the `scope` parameter of WWW-Authenticate names the one this request needed. Grantable scopes: https://accounts.myclickfunnels.com/.well-known/oauth-protected-resource'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Not found - This usually happens when you try to access a record that does not exist in your account. It can also happen when the provided parent record is missing, e.g. you have put in a non-existent Workspaces parent ID.
                  hint:
                    type:
                    - string
                    - 'null'
                    description: 'The next step for the caller: how to authenticate, which scope was missing, or where the route list lives. Always present, and null when this error has no next step to offer.'
              example:
                error: 'Not found: Record missing'
                hint: null
        '422':
          $ref: '#/components/responses/InvalidPageSize'
    post:
      tags:
      - Discount
      summary: Create Discount
      description: 'Create a discount in a workspace. A `code`-type discount (the default) needs a unique `code`; a `percentage` discount needs `percent`; a `fixed` discount needs a positive `amount`.


        Creating a discount publishes the code; it does not attach it to anything. The link between an order and a discount is a separate applied-discount record, written when a buyer redeems the code at checkout or when a ClickFunnels user applies it in the admin UI - which is why `POST /api/v2/workspaces/{workspace_id}/orders` takes no discount field and the `discount_ids` on an order are read-only. Writing applied discounts is not part of this API yet, and when it lands it will be that record you create rather than a discount field on the order. Until then an integration creates, reads, updates, expires and deletes discounts, and reads back which orders ended up carrying them.'
      operationId: createDiscounts
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        description: Information about a new Discount
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                discount:
                  type: object
                  $ref: '#/components/schemas/DiscountParameters'
            example:
              discount:
                name: Launch 20
                code: LAUNCH20
                discount_type: code
                discount_method: percentage
                percent: '20.0'
                applies_to: all_products
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscountAttributes'
              example:
                id: 771
                public_id: gBEDMo
                workspace_id: 42000
                name: Launch 20
                code: LAUNCH20
                discount_type: code
                discount_method: percentage
                amount: null
                percent: '20.0'
                currency: usd
                applies_to: all_products
                apply_from: '2025-01-01T00:00:00.000Z'
                apply_until: null
                limit_1_per_customer: false
                require_minimum_spend: false
                require_minimum_spend_amount: null
                discounts_per_redemption: null
                redemptions_count: 0
                product_ids: []
                variant_ids: []
                products_collection_ids: []
                active: true
                expired: false
                scheduled: false
                created_at: '2025-01-01T00:00:00.000Z'
                updated_at: '2025-01-01T00:00:00.000Z'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  hint:
                    type:
                    - string
                    - 'null'
                    description: 'The next step for the caller: how to authenticate, which scope was missing, or where the route list lives. Always present, and null when this error has no next step to offer.'
              example:
                error: API key missing or invalid
                hint: 'Send the token as `Authorization: Bearer <token>`. Create one under Account > Team > Platform Applications (a workspace API key), or obtain one with OAuth 2.1; both use the same scopes. See https://developers.myclickfunnels.com/docs/authentication, or append .md to that URL for markdown.'
        '403':
          description: Forbidden - the access token's scopes do not cover this request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  hint:
                    type:
                    - string
                    - 'null'
                    description: 'The next step for the caller: how to authenticate, which scope was missing, or where the route list lives. Always present, and null when this error has no next step to offer.'
              example:
                error: 'Forbidden: This access token''s scopes do not grant write access to Store. Granted scopes: store:read.'
                hint: 'Scopes are granted per category as <category>:read or <category>:write; the `scope` parameter of WWW-Authenticate names the one this request needed. Grantable scopes: https://accounts.myclickfunnels.com/.well-known/oauth-protected-resource'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  hint:
                    type:
                    - string
                    - 'null'
                    description: 'The next step for the caller: how to authenticate, which scope was missing, or where the route list lives. Always present, and null when this error has no next step to offer.'
              example:
                error: 'Not found: Record missing'
                hint: null
        '422':
          description: Unprocessable Entity - validation failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  hint:
                    type:
                    - string
                    - 'null'
                    description: 'The next step for the caller: how to authenticate, which scope was missing, or where the route list lives. Always present, and null when this error has no next step to offer.'
              examples:
                code_taken:
                  summary: code already in use
                  value:
                    error: 'Request unprocessable: Coupon Code is already being used in another Discount or Coupon'
                    hint: null
                missing_percent:
                  summary: percentage method with no percent
                  value:
                    error: 'Request unprocessable: Percent must be greater than 0'
                    hint: null
                code_characters:
                  summary: code contains characters other than letters, numbers and hyphens
                  value:
                    error: 'Request unprocessable: Coupon Code only allows letters, numbers, and hyphens'
                    hint: null
                expired_on_create:
                  summary: '`expired` sent on create, at any value including `false`'
                  value:
                    error: 'Request unprocessable: `expired` is not a create field. Create the discount, then expire it with `PATCH { "discount": { "expired": true } }`.'
                    hint: null
                unknown_enum_value:
                  summary: a value outside an enum field's list
                  value:
                    error: 'Request unprocessable: `discount_type` must be one of: code, automatic, sale.'
                    hint: null
  /discounts/{id}:
    get:
