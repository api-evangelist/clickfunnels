components:
  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: string
    sort_property:
      name: sort_property
      in: query
      description: 'Sort property of a list response. The default is id and thus the created_at order.

        If you sort by other properties, we additionally sort by id implicitly as a secondary sort property, so that you can rely on the sort order to be deterministic even if the main sort property ends up with the same values.

        '
      required: false
      schema:
        type: string
        enum:
        - id
        - updated_at
    sort_order:
      name: sort_order
      in: query
      description: Sort order of a list response. Use 'desc' to reverse the default 'asc' (ascending) sort order. Examples [in our guides](https://developers.myclickfunnels.com/docs/pagination).
      required: false
      schema:
        type: string
        enum:
        - asc
        - desc
    after:
      name: after
      in: query
      required: false
      schema:
        type: string
      description: ID of item after which the collection should be returned. More examples and info about pagination [in our guides](https://developers.myclickfunnels.com/docs/pagination).
  schemas:
    ProductParameters:
      type: object
      title: Products
      description: Products
      required:
      - name
      properties:
        name:
          type: string
          description: Product name
        current_path:
          type:
          - string
          - 'null'
          description: Current Path
        visible_in_store:
          type:
          - boolean
          - 'null'
          description: Visible in Store
        visible_in_customer_center:
          type:
          - boolean
          - 'null'
          description: Visible in Customer Center
        seo_title:
          type:
          - string
          - 'null'
          description: A clear title without branding or mentioning the domain itself. Longer is better, but max is 60 characters.
        seo_description:
          type:
          - string
          - 'null'
          description: A clear SEO description, at least two sentences long. Longer is better, but max is 160 characters. You will find the actual user-facing description on the **default variant of the product** (see the `Products::Variant` resource).
        seo_image_id:
          type:
          - string
          - 'null'
          description: SEO image
        commissionable:
          type:
          - boolean
          - 'null'
          description: Commissionable
        image_ids:
          type:
          - array
          - 'null'
          description: Images
        redirect_funnel_id:
          type:
          - string
          - 'null'
          description: Redirect funnel
        cancellation_funnel_url:
          type:
          - string
          - 'null'
          description: Cancellation Funnel Url
        tag_ids:
          type: array
          items:
            type: integer
          description: Any valid array, empty or with valid tag ids will overwrite existing values. To avoid losing existing tags first use the Fetch Product endpoint, then be sure to include the existing tags in your payload along with any new addition(s)
        variant_properties:
          type: array
          description: The properties of the product's variants. e.g. 'Size', 'Color' etc.
          items:
            type: object
            properties:
              id:
                type: integer
                description: The ID of the property, if updating the property
              name:
                type: string
                description: The name of the property
      example:
        product:
          name: Sample Product
          current_path: null
          visible_in_store: true
          visible_in_customer_center: true
          seo_title: Buy Sample Product Online
          seo_description: This is a sample product.
          seo_image_id: null
          commissionable: true
          image_ids: []
          redirect_funnel_id: null
          cancellation_funnel_url: null
          tag_ids:
          - 1
          - 2
          - 3
          variant_properties:
          - id: 1
            name: Size
          - id: 2
            name: Color
    ProductAttributes:
      type: object
      title: Products
      description: Products
      properties:
        id:
          type: integer
          description: ID
        public_id:
          type:
          - string
          - 'null'
          description: Product Public ID
        workspace_id:
          type: integer
          description: Workspace ID
        name:
          type: string
          description: Product name
        current_path:
          type:
          - string
          - 'null'
          description: Current Path
        archived:
          type:
          - boolean
          - 'null'
          description: Archived
        visible_in_store:
          type:
          - boolean
          - 'null'
          description: Visible in Store
        visible_in_customer_center:
          type:
          - boolean
          - 'null'
          description: Visible in Customer Center
        image_id:
          type:
          - string
          - 'null'
          description: Image
        seo_title:
          type:
          - string
          - 'null'
          description: A clear title without branding or mentioning the domain itself. Longer is better, but max is 60 characters.
        seo_description:
          type:
          - string
          - 'null'
          description: A clear SEO description, at least two sentences long. Longer is better, but max is 160 characters. You will find the actual user-facing description on the **default variant of the product** (see the `Products::Variant` resource).
        seo_image_id:
          type:
          - string
          - 'null'
          description: SEO image
        commissionable:
          type:
          - boolean
          - 'null'
          description: Commissionable
        image_ids:
          type:
          - array
          - 'null'
          description: Images
        default_variant_id:
          type: integer
          description: The ID of the default variant of the product
        variant_ids:
          type:
          - array
          - 'null'
          minContains: 0
          contains:
            type: integer
          description: Variant IDs
        price_ids:
          type:
          - array
          - 'null'
          description: Price IDs
        tag_ids:
          type:
          - array
          - 'null'
          description: Any valid array, empty or with valid tags will overwrite existing values. To avoid losing existing tags first use the Fetch Product endpoint, then be sure to include the existing tags in your payload along with any new addition(s)
        redirect_funnel_id:
          type:
          - string
          - 'null'
          description: Redirect funnel
        cancellation_funnel_url:
          type:
          - string
          - 'null'
          description: Cancellation Funnel Url
        created_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Added
        updated_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Updated
        variant_properties:
          type:
          - array
          - 'null'
          items:
            type: object
            title: Product Properties
            description: Properties
            properties:
              id:
                type: integer
                description: ID
              name:
                type: string
                description: Name
          description: Properties that are specific to the default variant of a product
      example:
        id: 22
        public_id: RTWMAd
        workspace_id: 42000
        name: Sample Product
        current_path: null
        archived: false
        visible_in_store: true
        visible_in_customer_center: true
        image_id: null
        seo_title: Buy Sample Product Online
        seo_description: This is a sample product.
        seo_image_id: null
        commissionable: true
        image_ids: []
        default_variant_id: 22
        variant_ids:
        - 22
        price_ids: []
        tag_ids: []
        redirect_funnel_id: null
        cancellation_funnel_url: null
        created_at: '2025-01-01T00:00:00.000Z'
        updated_at: '2025-01-01T00:00:00.000Z'
        variant_properties:
        - id: 22
          name: Color
      required:
      - archived
      - cancellation_funnel_url
      - commissionable
      - created_at
      - current_path
      - default_variant_id
      - id
      - image_id
      - image_ids
      - name
      - price_ids
      - public_id
      - redirect_funnel_id
      - seo_description
      - seo_image_id
      - seo_title
      - tag_ids
      - updated_at
      - variant_ids
      - variant_properties
      - visible_in_customer_center
      - visible_in_store
      - workspace_id
    ProductParametersUpdate:
      type: object
      title: Products
      description: Products
      required: []
      properties:
        name:
          type: string
          description: Product name
        current_path:
          type:
          - string
          - 'null'
