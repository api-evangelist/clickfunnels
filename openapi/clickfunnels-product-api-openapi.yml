openapi: 3.2.0
info:
  title: ClickFunnels Product API
  termsOfService: https://www.clickfunnels.com/terms-of-service
  contact:
    name: ClickFunnels API Team
    url: https://developers.myclickfunnels.com
  x-logo:
    url: https://statics.myclickfunnels.com/image/1126065/file/31edf05760fafe41a82f16a668ab251f.png
  description: 'The ClickFunnels REST API that powers webhooks, native integrations, and Zapier lets you manage your ClickFunnels data, automate your workflows, and recreate ClickFunnels functionality in your own apps.

    '
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  version: 2.0.0
servers:
- url: https://{subdomain}.myclickfunnels.com/api/v2
  description: ClickFunnels API
  variables:
    subdomain:
      default: myworkspace
security:
- BearerAuth: []
tags:
- name: Product
  description: '> Products can be used to create and edit sellable goods.


    Products have a few boolean attributes including `archived`, `visible_in_store`, and `visible_in_customer_center`.


    Products that are not `archived` are in a `live` state if they are `visible_in_store` or `visible_in_customer_center` or are associated with any live funnels.


    `Live` products cannot be archived.

    Products in an `archived` state can always be unarchived.


    Each product can have one or more variants expressed as a `Products::Variant`.

    All products have a "default variant" that acts as a parent to any further variants

    the product may have.


    When you create a `Product` we will implicitly create a default variant of type `digital`.

    If the product you want to create is actually `physical`, be sure to update the type of it''s

    default variant in a subsequent request.


    The Product Object will always contain a `default_variant_id` attribute that lets you identify

    the default variant.


    If the Product will have variants you should set the `variant_properties` attribute to an array of the properties a variant can have (e.g. "Size", "Color", etc.)

    '
paths:
  /workspaces/{workspace_id}/products:
    get:
      tags:
      - Product
      summary: List Products
      description: List all products for a workspace
      operationId: listProducts
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/after'
      - $ref: '#/components/parameters/sort_order'
      - $ref: '#/components/parameters/sort_property'
      - name: filter
        in: query
        description: 'Filter by available properties in query params, like this: `api/v2/resources?filter[id]=value&filter[another_property]=value1,value2`. Check our Filtering guide for examples and all about filtering [here](https://developers.myclickfunnels.com/docs/filtering).

          '
        required: false
        schema:
          type: object
          properties:
            id:
              type: string
              description: A comma-separated list of product IDs to filter by.
              example: 1,2,3
            visible_in_store:
              type: boolean
              description: Filter products by visibility in the online store.
              example: true
              enum:
              - true
              - false
            visible_in_customer_center:
              type: boolean
              description: Filter products by visibility in the customer center.
              example: true
              enum:
              - true
              - false
            archived:
              type: boolean
              description: Filter products by archived state.
              example: true
              enum:
              - true
              - false
        style: deepObject
        explode: true
      responses:
        '200':
          description: OK
          headers:
            Pagination-Next:
              $ref: '#/components/headers/PaginationNext'
            Link:
              $ref: '#/components/headers/Link'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductAttributes'
              example:
              - id: 126
                public_id: IQGqMi
                workspace_id: 42000
                name: Sample Product
                current_path: null
                archived: false
                visible_in_store: true
                visible_in_customer_center: true
                image_id: null
                seo_title: Buy Sample Product Online
                seo_description: This is a sample product.
                seo_image_id: null
                commissionable: true
                image_ids: []
                default_variant_id: 126
                variant_ids:
                - 126
                price_ids: []
                tag_ids: []
                redirect_funnel_id: null
                cancellation_funnel_url: null
                created_at: '2025-01-01T00:00:00.000Z'
                updated_at: '2025-01-01T00:00:00.000Z'
                variant_properties:
                - id: 126
                  name: Color
              - id: 127
                public_id: eBENtI
                workspace_id: 42000
                name: Sample Product
                current_path: null
                archived: false
                visible_in_store: true
                visible_in_customer_center: true
                image_id: null
                seo_title: Buy Sample Product Online
                seo_description: This is a sample product.
                seo_image_id: null
                commissionable: true
                image_ids: []
                default_variant_id: 127
                variant_ids:
                - 127
                price_ids: []
                tag_ids: []
                redirect_funnel_id: null
                cancellation_funnel_url: null
                created_at: '2025-01-01T00:00:00.000Z'
                updated_at: '2025-01-01T00:00:00.000Z'
                variant_properties:
                - id: 127
                  name: Color
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: API key missing or invalid
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Not found - This usually happens when you try to access a record that does not exist in your account. It can also happen when the provided parent record is missing, e.g. you have put in a non-existent Workspaces parent ID.
              example:
                error: 'Not found: Record missing'
    post:
      tags:
      - Product
      summary: Create Product
      description: Add a new product to a workspace
      operationId: createProducts
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        description: Information about a new Product
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                product:
                  type: object
                  $ref: '#/components/schemas/ProductParameters'
            example:
              product:
                name: Sample Product
                current_path: null
                visible_in_store: true
                visible_in_customer_center: true
                seo_title: Buy Sample Product Online
                seo_description: This is a sample product.
                seo_image_id: null
                commissionable: true
                image_ids: []
                redirect_funnel_id: null
                cancellation_funnel_url: null
                tag_ids:
                - 1
                - 2
                - 3
                variant_properties:
                - id: 1
                  name: Size
                - id: 2
                  name: Color
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductAttributes'
              example:
                id: 129
                public_id: IshNin
                workspace_id: 42000
                name: Sample Product
                current_path: null
                archived: false
                visible_in_store: true
                visible_in_customer_center: true
                image_id: null
                seo_title: Buy Sample Product Online
                seo_description: This is a sample product.
                seo_image_id: null
                commissionable: true
                image_ids: []
                default_variant_id: 129
                variant_ids:
                - 129
                price_ids: []
                tag_ids: []
                redirect_funnel_id: null
                cancellation_funnel_url: null
                created_at: '2025-01-01T00:00:00.000Z'
                updated_at: '2025-01-01T00:00:00.000Z'
                variant_properties:
                - id: 129
                  name: Color
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: 'Bad request: HTTP body must be valid JSON'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: API key missing or invalid
  /products/{id}:
