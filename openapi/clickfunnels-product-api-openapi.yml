            type: integer
          description: Variant IDs
        price_ids:
          type:
          - array
          - 'null'
          description: Price IDs
        redirect_funnel_id:
          type:
          - string
          - 'null'
          description: Redirect funnel
        cancellation_funnel_url:
          type:
          - string
          - 'null'
          description: Cancellation Funnel Url
        tag_ids:
          type: array
          items:
            type: integer
          description: Any valid array, empty or with valid tag ids will overwrite existing values. To avoid losing existing tags first use the Fetch Product endpoint, then be sure to include the existing tags in your payload along with any new addition(s)
        variant_properties:
          type: array
          description: The properties of the product's variants. e.g. 'Size', 'Color' etc.
          items:
            type: object
            properties:
              id:
                type: integer
                description: The ID of the property, if updating the property
              name:
                type: string
                description: The name of the property
      example:
        product:
          name: Heavy Duty Steel
          current_path: null
          visible_in_store: true
          visible_in_customer_center: true
          seo_title: Buy Sample Product Online
          seo_description: This is a sample product.
          seo_image_id: null
          commissionable: true
          image_ids: []
          variant_ids:
          - 22
          price_ids: []
          redirect_funnel_id: null
          cancellation_funnel_url: null
          tag_ids:
          - 1
          - 2
          - 3
          variant_properties:
          - id: 1
            name: Size
          - id: 2
            name: Color
  headers:
    Link:
      description: A direct link to the next page for the cursor-based pagination. It includes the `after` and the Pagination-Next ID value.
      schema:
        type: string
    PaginationNext:
      description: ID of the last item in the current response after which more records exist. You can use it in an `after` query parameter for cursor-based pagination to get to the next page.
      schema:
        type: string
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
