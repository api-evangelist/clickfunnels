openapi: 3.2.0
info:
  title: ClickFunnels Courses::Section API
  termsOfService: https://www.clickfunnels.com/terms-of-service
  contact:
    name: ClickFunnels API Team
    url: https://developers.myclickfunnels.com
  x-logo:
    url: https://statics.myclickfunnels.com/image/1126065/file/31edf05760fafe41a82f16a668ab251f.png
  description: 'The ClickFunnels REST API that powers webhooks, native integrations, and Zapier lets you manage your ClickFunnels data, automate your workflows, and recreate ClickFunnels functionality in your own apps.


    ### For AI agents


    This document is the catalogue: every operation ClickFunnels exposes over REST is described here, with a unique operationId, typed schemas, and the scopes it needs. It is served from `/openapi.json`, `/openapi.yaml`, `/api/openapi.{json,yaml}`, and `/api/v2/openapi.{json,yaml}` on the accounts host.


    Three things it does not describe, each one request away:


    - MCP server: the app-native Model Context Protocol server (Streamable HTTP, OAuth 2.1 with PKCE). Prefer it over raw REST when your client supports MCP - it describes itself at runtime.

    - Skill guides, also as an Agent Skills index: one task guide per job (pages, blogs, products, orders, workflows, emails, courses, stats, external SDK pages). Read the guide that matches your job before your first write. llms.txt covers when to use ClickFunnels at all, how to get credentials, and how to behave around rate limits.

    - Protected resource metadata (RFC 9728) and authorization server metadata (RFC 8414): the scope vocabulary and the OAuth endpoints. Dynamic client registration is for MCP clients only.


    On ClickFunnels-owned API hosts (`myclickfunnels.com` and its subdomains), the OpenAPI specification responses and API authentication failures (401, or 403 for insufficient scope) carry those links in an RFC 8288 `Link` header, so clients can discover the documentation and authentication metadata from those responses. Requests sent through a customer''s custom domain keep the Bearer challenge but omit those discovery pointers.'
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  version: 2.0.0
servers:
- url: https://{subdomain}.myclickfunnels.com/api/v2
  description: ClickFunnels API
  variables:
    subdomain:
      default: myworkspace
security:
- BearerAuth: []
- OAuth2: []
tags:
- name: Courses::Section
  description: '> Represents the modules within a Course


    The section is the organization layer of a course where the content is accessed and managed for

    a customer. Sections can have sub-sections and will have one or more lessons. Access to sections

    can be managed by the `Courses::Enrollment` and also by the completion of previous sections and lessons.


    See Sections (modules) in the Courses Skill for creating modules and the fields you can set.'
paths:
  /courses/{course_id}/sections:
    get:
      tags:
      - Courses::Section
      summary: List Sections
      description: 'List Sections. Ordered by id ascending by default (pass sort_order=desc for

        descending), consistent with the pagination cursor, so following the

        Pagination-Next header returns every section exactly once.


        The list includes the course''s root section - a structural container

        (`parent_id: null`, matching the course''s `root_section_id`) that is not

        shown in the course builder UI; most integrations can ignore it and treat its

        children as the modules. Pass sort_property=sort_order for the builder''s

        display order; note sort_order is scoped per parent, so it is not globally

        unique across the list (the root and each parent''s first child both start at

        0, tie-broken by id).


        See Reading back a course in the

        Courses Skill for the read walk.'
      operationId: listCoursesSections
      parameters:
      - name: course_id
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/after'
      - $ref: '#/components/parameters/per_page'
      - $ref: '#/components/parameters/sort_order'
      - name: sort_property
        in: query
        description: 'Sort property of a list response. The default is id and thus the created_at order.

          If you sort by other properties, we additionally sort by id implicitly as a secondary sort property, so that you can rely on the sort order to be deterministic even if the main sort property ends up with the same values.

          '
        required: false
        schema:
          type: string
          enum:
          - id
          - updated_at
          - sort_order
      responses:
        '200':
          description: OK
          headers:
            Pagination-Next:
              $ref: '#/components/headers/PaginationNext'
            Link:
              $ref: '#/components/headers/Link'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CoursesSectionAttributes'
              example:
              - id: 4
                public_id: JyVHGZ
                course_id: 25
                title: Module 4
                published_at: '2025-01-01T00:00:00.000Z'
                description: Example Course Section
                days_till_drip_access: 5
                blocker_section_id: null
                blocker_lesson_id: null
                current_path: /section-example
                is_hidden_from_non_members: true
                upgrade_url: null
                parent_id: null
                sort_order: 3
                created_at: '2025-01-01T00:00:00.000Z'
                updated_at: '2025-01-01T00:00:00.000Z'
              - id: 5
                public_id: SXZNPl
                course_id: 26
                title: Module 5
                published_at: '2025-01-01T00:00:00.000Z'
                description: Example Course Section
                days_till_drip_access: 5
                blocker_section_id: null
                blocker_lesson_id: null
                current_path: /section-example
                is_hidden_from_non_members: true
                upgrade_url: null
                parent_id: null
                sort_order: 4
                created_at: '2025-01-01T00:00:00.000Z'
                updated_at: '2025-01-01T00:00:00.000Z'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  hint:
                    type:
                    - string
                    - 'null'
                    description: 'The next step for the caller: how to authenticate, which scope was missing, or where the route list lives. Always present, and null when this error has no next step to offer.'
              example:
                error: API key missing or invalid
                hint: 'Send the token as `Authorization: Bearer <token>`. Create one under Account > Team > Platform Applications (a workspace API key), or obtain one with OAuth 2.1; both use the same scopes. See https://developers.myclickfunnels.com/docs/authentication, or append .md to that URL for markdown.'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Not found - This usually happens when you try to access a record that does not exist in your account. It can also happen when the provided parent record is missing, e.g. you have put in a non-existent Workspaces parent ID.
                  hint:
                    type:
                    - string
                    - 'null'
                    description: 'The next step for the caller: how to authenticate, which scope was missing, or where the route list lives. Always present, and null when this error has no next step to offer.'
              example:
                error: 'Not found: Record missing'
                hint: null
        '422':
          $ref: '#/components/responses/InvalidPageSize'
    post:
      tags:
      - Courses::Section
      summary: Create Section
      description: Add a new Section. See Sections (modules) in the Courses Skill.
      operationId: createCoursesSections
      parameters:
      - name: course_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        description: Information about a new Section
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                courses_section:
                  type: object
                  $ref: '#/components/schemas/CoursesSectionParametersUpdate'
            example:
              courses_section:
                title: Module 1
                description: Example Course Section
                days_till_drip_access: 5
                blocker_section_id: 123
                blocker_lesson_id: 123
                is_hidden_from_non_members: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoursesSectionAttributes'
              example:
                id: 7
                public_id: ZkVcQM
                course_id: 28
                title: Module 7
                published_at: '2025-01-01T00:00:00.000Z'
                description: Example Course Section
                days_till_drip_access: 5
                blocker_section_id: null
                blocker_lesson_id: null
                current_path: /section-example
                is_hidden_from_non_members: true
                upgrade_url: null
                parent_id: null
                sort_order: 6
                created_at: '2025-01-01T00:00:00.000Z'
                updated_at: '2025-01-01T00:00:00.000Z'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  hint:
                    type:
                    - string
                    - 'null'
                    description: 'The next step for the caller: how to authenticate, which scope was missing, or where the route list lives. Always present, and null when this error has no next step to offer.'
              example:
                error: API key missing or invalid
                hint: 'Send the token as `Authorization: Bearer <token>`. Create one under Account > Team > Platform Applications (a workspace API key), or obtain one with OAuth 2.1; both use the same scopes. See https://developers.myclickfunnels.com/docs/authentication, or append .md to that URL for markdown.'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  hint:
                    type:
                    - string
                    - 'null'
                    description: 'The next step for the caller: how to authenticate, which scope was missing, or where the route list lives. Always present, and null when this error has no next step to offer.'
              example:
                error: 'Not found: Record missing'
                hint: null
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  hint:
                    type:
                    - string
                    - 'null'
                    description: 'The next step for the caller: how to authenticate, which scope was missing, or where the route list lives. Always present, and null when this error has no next step to offer.'
              example:
