      - name: funnel_id
        in: path
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: branch
        in: query
        required: false
        description: Optional branch to remove. One of `matched`, `unmatched`, or `both` (default).
        schema:
          type: string
          enum:
