  /workspaces/{workspace_id}/contacts/upsert:
    post:
      tags:
      - Contact
      summary: Upsert a Contact
      description: Creates or updates a Contact, matching on the email address. If the Contact does not exist, it will be created. If the Contact does exist, it will be updated. It is not possible to delete a Contact via this endpoint. It is not possible to reset properties of a Contact by passing empty values. E.g. passing `null` for `first_name` or an empty array for `tag_ids` won&#39;t update previous values. To do that you would instead need to use the `Update Contact` endpoint.
      operationId: upsertContacts
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/ExpandContactFields'
      requestBody:
        description: Contact to create or update, matching on the email address. Note that properties of a Contact are not reset when passed empty values, e.g. passing `null` for `first_name` or an empty array for `tag_ids` won't update previous values. To do that you would instead use the `Update Contact` endpoint.
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                contact:
                  type: object
                  $ref: '#/components/schemas/ContactParameters'
            example:
              contact:
                email_address: test-4059727ec8e173ce4648@example.com
                first_name: Sol
                last_name: Jones
                phone_number: (224) 508-1342 x59891
                time_zone: Pacific Time (US & Canada)
                fb_url: https://www.facebook.com/example
                twitter_url: https://twitter.com/example
                instagram_url: null
                linkedin_url: https://www.linkedin.com/in/example
                website_url: https://example.com
      responses:
