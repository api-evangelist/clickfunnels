                  error:
                    type: string
              example:
                error: Forbidden
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: 'Not found: Record missing'
  /communities/spaces/posts/comments/{id}/decline:
    post:
      tags:
      - Communities::Spaces::Post::Comment
      summary: Decline Comment
      description: Decline a comment. Sets `declined_at` to the current time, marking it as rejected.
      operationId: declineCommunitiesSpacesPostsComment
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: OK
          content:
            application/json:
