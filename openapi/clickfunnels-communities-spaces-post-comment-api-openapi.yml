  /communities/spaces/posts/comments/{id}:
    get:
      tags:
      - Communities::Spaces::Post::Comment
      summary: Fetch Comment
      description: Retrieve a comment
      operationId: getCommunitiesSpacesPostsComments
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
