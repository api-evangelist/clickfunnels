components:
  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: string
    sort_property:
      name: sort_property
      in: query
      description: 'Sort property of a list response. The default is id and thus the created_at order.

        If you sort by other properties, we additionally sort by id implicitly as a secondary sort property, so that you can rely on the sort order to be deterministic even if the main sort property ends up with the same values.

        '
      required: false
      schema:
        type: string
        enum:
        - id
        - updated_at
    sort_order:
      name: sort_order
      in: query
      description: Sort order of a list response. Use 'desc' to reverse the default 'asc' (ascending) sort order. Examples [in our guides](https://developers.myclickfunnels.com/docs/pagination).
      required: false
      schema:
        type: string
        enum:
        - asc
        - desc
    after:
      name: after
      in: query
      required: false
      schema:
        type: string
      description: ID of item after which the collection should be returned. More examples and info about pagination [in our guides](https://developers.myclickfunnels.com/docs/pagination).
  schemas:
    CommunitiesSpacesPostsCommentAttributes:
      type: object
      title: Communities::Spaces::Post::Comment
      description: Communities::Spaces::Post::Comment
      properties:
        id:
          type: integer
          description: Comment ID
        public_id:
          type:
          - string
          - 'null'
          description: Comment public ID
        contact_id:
          type:
          - integer
          - 'null'
          description: ID of the Contact who authored the comment
        body:
          type:
          - string
          - 'null'
          description: Comment body as plain text
        url:
          type:
          - string
          - 'null'
          description: Canonical URL of the comment
        contact:
          description: Short representation of the authoring Contact, or null if the contact has been deleted
          type:
          - object
          - 'null'
          properties:
            id:
              type: integer
              description: Contact ID
            public_id:
              type: string
              description: Contact public ID
            email_address:
              type:
              - string
              - 'null'
              description: Contact email address
            first_name:
              type:
              - string
              - 'null'
              description: Contact first name
            last_name:
              type:
              - string
              - 'null'
              description: Contact last name
            phone_number:
              type:
              - string
              - 'null'
              description: Contact phone number
        group:
          description: The Space Group the parent post belongs to
          type: object
          properties:
            id:
              type: integer
              description: Space Group ID
            public_id:
              type:
              - string
              - 'null'
              description: Space Group public ID
            name:
              type:
              - string
              - 'null'
              description: Space Group name
        post:
          description: The Post this comment belongs to
          type: object
          properties:
            id:
              type: integer
              description: Post ID
            public_id:
              type:
              - string
              - 'null'
              description: Post public ID
            title:
              type:
              - string
              - 'null'
              description: Post title
            url:
              type:
              - string
              - 'null'
              description: Post canonical URL
        created_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Created at
        updated_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Updated at
      example:
        id: 202
        public_id: MnOpQr
        contact_id: 55
        body: Great post, thanks for sharing!
        url: https://example.myclickfunnels.com/communities/posts/AbCdEf/comments/MnOpQr
        contact:
          id: 55
          public_id: GhIjKl
          email_address: jane@example.com
          first_name: Jane
          last_name: Doe
          phone_number: null
        group:
          id: 1
          public_id: BcDeFg
          name: General
        post:
          id: 101
          public_id: AbCdEf
          title: Welcome to the community!
          url: https://example.myclickfunnels.com/communities/posts/AbCdEf
        created_at: '2025-01-01T00:00:00.000Z'
        updated_at: '2025-01-01T00:00:00.000Z'
      required:
      - body
      - contact
      - contact_id
      - created_at
      - group
      - id
      - post
      - public_id
      - updated_at
      - url
    CommunitiesSpacesPostsCommentParametersUpdate:
      type: object
      title: Communities::Spaces::Post::Comment
      description: Communities::Spaces::Post::Comment
      properties:
        body:
          type:
          - string
          - 'null'
          description: Comment body as rich HTML
        skip_notifications:
          type:
          - boolean
          - 'null'
          description: When true, suppresses email/push notifications for this comment
      example:
        communities_spaces_posts_comment:
          body: <p>Updated comment text.</p>
    CommunitiesSpacesPostsCommentParameters:
      type: object
      title: Communities::Spaces::Post::Comment
      description: Communities::Spaces::Post::Comment
      required:
      - body
      properties:
        body:
          type: string
          description: Comment body as rich HTML
        contact_id:
          type:
          - integer
          - 'null'
          description: ID of the Contact to author the comment. Optional — defaults to the connected user's own contact.
        parent_comment_id:
          type:
          - integer
          - 'null'
          description: ID of the parent comment for threaded replies. Must be a comment on the same post.
        skip_notifications:
          type:
          - boolean
          - 'null'
          description: When true, suppresses email/push notifications for this comment
      example:
        communities_spaces_posts_comment:
          body: <p>Great post, thanks for sharing!</p>
  headers:
    Link:
      description: A direct link to the next page for the cursor-based pagination. It includes the `after` and the Pagination-Next ID value.
      schema:
        type: string
    PaginationNext:
      description: ID of the last item in the current response after which more records exist. You can use it in an `after` query parameter for cursor-based pagination to get to the next page.
      schema:
        type: string
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
externalDocs:
  description: More in-depth guides and further resources
  url: https://developers.myclickfunnels.com
