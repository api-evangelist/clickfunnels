                error: 'Not found: Record missing'
  /communities/spaces/posts/comments/{id}/dismiss_reports:
    post:
      tags:
      - Communities::Spaces::Post::Comment
      summary: Dismiss Comment Reports
      description: Clear the comment's report flags (reported_at, report_count, report_type) and approve it.
      operationId: dismissReportsCommunitiesSpacesPostsComment
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunitiesSpacesPostsCommentAttributes'
              example:
                id: 202
                public_id: MnOpQr
                contact_id: 55
                body: Great post, thanks for sharing!
                url: https://example.myclickfunnels.com/communities/posts/AbCdEf/comments/MnOpQr
                contact:
