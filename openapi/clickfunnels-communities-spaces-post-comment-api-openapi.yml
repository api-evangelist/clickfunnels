openapi: 3.2.0
info:
  title: ClickFunnels Communities::Spaces::Post::Comment API
  termsOfService: https://www.clickfunnels.com/terms-of-service
  contact:
    name: ClickFunnels API Team
    url: https://developers.myclickfunnels.com
  x-logo:
    url: https://statics.myclickfunnels.com/image/1126065/file/31edf05760fafe41a82f16a668ab251f.png
  description: 'The ClickFunnels REST API that powers webhooks, native integrations, and Zapier lets you manage your ClickFunnels data, automate your workflows, and recreate ClickFunnels functionality in your own apps.

    '
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  version: 2.0.0
servers:
- url: https://{subdomain}.myclickfunnels.com/api/v2
  description: ClickFunnels API
  variables:
    subdomain:
      default: myworkspace
security:
- BearerAuth: []
tags:
- name: Communities::Spaces::Post::Comment
  description: '> Comments are member replies on a Community Post.


    A Comment belongs to a Post and is authored by a Contact. Comments support rich HTML body content and threaded replies via `parent_comment_id`. Comments created via the API are auto-approved.

    '
paths:
  /communities/spaces/posts/{post_id}/comments:
    get:
      tags:
      - Communities::Spaces::Post::Comment
      summary: List Comments
      description: List comments for a post
      operationId: listCommunitiesSpacesPostsComments
      parameters:
      - name: post_id
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/after'
      - $ref: '#/components/parameters/sort_order'
      - $ref: '#/components/parameters/sort_property'
      responses:
        '200':
          description: OK
          headers:
            Pagination-Next:
              $ref: '#/components/headers/PaginationNext'
            Link:
              $ref: '#/components/headers/Link'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CommunitiesSpacesPostsCommentAttributes'
              example:
              - id: 202
                public_id: MnOpQr
                contact_id: 55
                body: Great post, thanks for sharing!
                url: https://example.myclickfunnels.com/communities/posts/AbCdEf/comments/MnOpQr
                contact:
                  id: 55
                  public_id: GhIjKl
                  email_address: jane@example.com
                  first_name: Jane
                  last_name: Doe
                  phone_number: null
                group:
                  id: 1
                  public_id: BcDeFg
                  name: General
                post:
                  id: 101
                  public_id: AbCdEf
                  title: Welcome to the community!
                  url: https://example.myclickfunnels.com/communities/posts/AbCdEf
                created_at: '2025-01-01T00:00:00.000Z'
                updated_at: '2025-01-01T00:00:00.000Z'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: API key missing or invalid
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: 'Not found: Record missing'
    post:
      tags:
      - Communities::Spaces::Post::Comment
      summary: Create Comment
      description: Create a comment on a post. Comments created via the API are auto-approved. The `contact_id` is optional and defaults to the connected user's own contact. Use `parent_comment_id` for threaded replies.
      operationId: createCommunitiesSpacesPostsComments
      parameters:
      - name: post_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        description: Information about a new Comment
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                communities_spaces_posts_comment:
                  type: object
                  $ref: '#/components/schemas/CommunitiesSpacesPostsCommentParameters'
            example:
              communities_spaces_posts_comment:
                body: <p>Great post, thanks for sharing!</p>
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunitiesSpacesPostsCommentAttributes'
              example:
                id: 202
                public_id: MnOpQr
                contact_id: 55
                body: Great post, thanks for sharing!
                url: https://example.myclickfunnels.com/communities/posts/AbCdEf/comments/MnOpQr
                contact:
                  id: 55
                  public_id: GhIjKl
                  email_address: jane@example.com
                  first_name: Jane
                  last_name: Doe
                  phone_number: null
                group:
                  id: 1
                  public_id: BcDeFg
                  name: General
                post:
                  id: 101
                  public_id: AbCdEf
                  title: Welcome to the community!
                  url: https://example.myclickfunnels.com/communities/posts/AbCdEf
                created_at: '2025-01-01T00:00:00.000Z'
                updated_at: '2025-01-01T00:00:00.000Z'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: API key missing or invalid
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: Body can't be blank
  /communities/spaces/posts/comments/{id}/approve:
    post:
      tags:
      - Communities::Spaces::Post::Comment
      summary: Approve Comment
      description: Approve a comment. Sets `approved_at` to the current time and applies any pending draft edit to the live body.
      operationId: approveCommunitiesSpacesPostsComment
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
