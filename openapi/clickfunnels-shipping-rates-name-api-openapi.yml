openapi: 3.2.0
info:
  title: ClickFunnels Shipping::Rates::Name API
  termsOfService: https://www.clickfunnels.com/terms-of-service
  contact:
    name: ClickFunnels API Team
    url: https://developers.myclickfunnels.com
  x-logo:
    url: https://statics.myclickfunnels.com/image/1126065/file/31edf05760fafe41a82f16a668ab251f.png
  description: 'The ClickFunnels REST API that powers webhooks, native integrations, and Zapier lets you manage your ClickFunnels data, automate your workflows, and recreate ClickFunnels functionality in your own apps.

    '
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  version: 2.0.0
servers:
- url: https://{subdomain}.myclickfunnels.com/api/v2
  description: ClickFunnels API
  variables:
    subdomain:
      default: myworkspace
security:
- BearerAuth: []
tags:
- name: Shipping::Rates::Name
  description: Shipping Rate Names
paths:
  /workspaces/{workspace_id}/shipping/rates/names:
    get:
      tags:
      - Shipping::Rates::Name
      summary: List Names
      description: List rate names for a shipping profile
      operationId: listShippingRatesNames
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/after'
      - $ref: '#/components/parameters/sort_order'
      - $ref: '#/components/parameters/sort_property'
      responses:
        '200':
          description: OK
          headers:
            Pagination-Next:
              $ref: '#/components/headers/PaginationNext'
            Link:
              $ref: '#/components/headers/Link'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ShippingRatesNameAttributes'
              example:
              - id: 12
                public_id: tnZCWH
                workspace_id: 42000
                name: Example Shipping Rates Name
                created_at: '2025-01-01T00:00:00.000Z'
                updated_at: '2025-01-01T00:00:00.000Z'
              - id: 13
                public_id: TXNZFQ
                workspace_id: 42000
                name: Example Shipping Rates Name
                created_at: '2025-01-01T00:00:00.000Z'
                updated_at: '2025-01-01T00:00:00.000Z'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: API key missing or invalid
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Not found - This usually happens when you try to access a record that does not exist in your account. It can also happen when the provided parent record is missing, e.g. you have put in a non-existent Workspaces parent ID.
              example:
                error: 'Not found: Record missing'
    post:
      tags:
      - Shipping::Rates::Name
      summary: Create Name
      description: Add a new rate name to a shipping profile
      operationId: createShippingRatesNames
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        description: Information about a new Name
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                shipping_rates_name:
                  type: object
                  $ref: '#/components/schemas/ShippingRatesNameParameters'
            example:
              shipping_rates_name:
                name: Example Shipping Rates Name
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShippingRatesNameAttributes'
              example:
                id: 15
                public_id: sihAmw
                workspace_id: 42000
                name: Example Shipping Rates Name
                created_at: '2025-01-01T00:00:00.000Z'
                updated_at: '2025-01-01T00:00:00.000Z'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: 'Bad request: HTTP body must be valid JSON'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: API key missing or invalid
  /shipping/rates/names/{id}:
    get:
      tags:
      - Shipping::Rates::Name
      summary: Fetch Name
      description: Retrieve a rate name for a shipping profile
      operationId: getShippingRatesNames
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShippingRatesNameAttributes'
              example:
                id: 14
                public_id: kLumcW
                workspace_id: 42000
                name: Example Shipping Rates Name
                created_at: '2025-01-01T00:00:00.000Z'
                updated_at: '2025-01-01T00:00:00.000Z'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: API key missing or invalid
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: 'Not found: Record missing'
    put:
      tags:
      - Shipping::Rates::Name
      summary: Update Name
      description: Update a rate name for a shipping profile
      operationId: updateShippingRatesNames
      parameters:
      - $ref: '#/components/parameters/id'
      requestBody:
        description: Information about updated fields in Name
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                shipping_rates_name:
                  type: object
                  $ref: '#/components/schemas/ShippingRatesNameParametersUpdate'
            example:
              shipping_rates_name:
                name: Example Shipping
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShippingRatesNameAttributes'
              example:
                id: 17
                public_id: vgxZie
                workspace_id: 42000
                name: Example Shipping Rates Name
                created_at: '2025-01-01T00:00:00.000Z'
                updated_at: '2025-01-01T00:00:00.000Z'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: 'Bad request: HTTP body must be valid JSON'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: API key missing or invalid
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: 'Not found: Record missing'
    delete:
      tags:
      - Shipping::Rates::Name
      summary: Remove Name
      description: Delete a rate name for a shipping profile
      operationId: removeShippingRatesNames
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '204':
          description: No Content
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: API key missing or invalid
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: 'Not found: Record missing'
components:
  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: string
    sort_property:
      name: sort_property
      in: query
      description: 'Sort property of a list response. The default is id and thus the created_at order.

        If you sort by other properties, we additionally sort by id implicitly as a secondary sort property, so that you can rely on the sort order to be deterministic even if the main sort property ends up with the same values.

        '
      required: false
      schema:
        type: string
        enum:
        - id
        - updated_at
    sort_order:
      name: sort_order
      in: query
      description: Sort order of a list response. Use 'desc' to reverse the default 'asc' (ascending) sort order. Examples [in our guides](https://developers.myclickfunnels.com/docs/pagination).
      required: false
      schema:
        type: string
        enum:
        - asc
        - desc
    after:
      name: after
      in: query
      required: false
      schema:
        type: string
      description: ID of item after which the collection should be returned. More examples and info about pagination [in our guides](https://developers.myclickfunnels.com/docs/pagination).
  schemas:
    ShippingRatesNameParameters:
      type: object
      title: Rate Names
      description: Rate Names
      required:
      - name
      properties:
        name:
          type: string
          description: Rate Name
      example:
        shipping_rates_name:
          name: Example Shipping Rates Name
    ShippingRatesNameAttributes:
      type: object
      title: Rate Names
      description: Rate Names
      properties:
        id:
          type: integer
          description: Rate Name ID
        public_id:
          type:
          - string
          - 'null'
          description: Rate Name public ID
        workspace_id:
          type: integer
          description: Workspace ID
        name:
          type: string
          description: Rate Name
        created_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Added
        updated_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Updated
      example:
        id: 2
        public_id: DRAhis
        workspace_id: 42000
        name: Example Shipping Rates Name
        created_at: '2025-01-01T00:00:00.000Z'
        updated_at: '2025-01-01T00:00:00.000Z'
      required:
      - created_at
      - id
      - name
      - public_id
      - updated_at
      - workspace_id
    ShippingRatesNameParametersUpdate:
      type: object
      title: Rate Names
      description: Rate Names
      required: []
      properties:
        name:
          type: string
          description: Rate Name
      example:
        shipping_rates_name:
          name: Example Shipping
  headers:
    Link:
      description: A direct link to the next page for the cursor-based pagination. It includes the `after` and the Pagination-Next ID value.
      schema:
        type: string
    PaginationNext:
      description: ID of the last item in the current response after which more records exist. You can use it in an `after` query parameter for cursor-based pagination to get to the next page.
      schema:
        type: string
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
externalDocs:
  description: More in-depth guides and further resources
  url: https://developers.myclickfunnels.com
