                      sort_order: 1
                      convergence_step_id: 696
                      variants:
                      - weight: 50
                        steps:
                        - id: 705
                          public_id: peWaZj
                          step_type: show_page_step
                          name: Premium Offer A
                          sort_order: 0
                          show_page_step_id: nedgRv
                          page:
                            id: 1399
                            public_id: YZxdvJ
                            name: Premium Offer A
                            url: https://acme.myclickfunnels.com/premium-offer-a
                            external: false
                            sdk_token: null
                      - weight: 50
                        steps:
                        - id: 706
                          public_id: GjPaMv
                          step_type: show_page_step
                          name: Premium Offer B
                          sort_order: 0
                          show_page_step_id: QjqPwJ
                          page:
                            id: 1400
                            public_id: eNwqOJ
                            name: Premium Offer B
                            url: https://acme.myclickfunnels.com/premium-offer-b
                            external: false
                            sdk_token: null
                  - branch: unmatched
                    steps:
                    - id: 707
                      public_id: gvDxwv
                      step_type: show_page_step
                      name: Guest Welcome
                      sort_order: 0
                      show_page_step_id: mjLnle
                      page:
                        id: 1401
                        public_id: JvAxxe
                        name: Guest Welcome
                        url: https://acme.myclickfunnels.com/guest-welcome
                        external: false
                        sdk_token: null
                    - id: 709
                      public_id: zvBmoj
                      step_type: conditional_split_step
                      name: Conditional Split Step
                      sort_order: 1
                      convergence_step_id: 696
                      branches:
                      - branch: matched
                        steps:
                        - id: 714
                          public_id: RJgzge
