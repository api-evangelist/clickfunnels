    FunnelStepStats:
      type: object
      title: Funnel Step Stats
      description: Per-step statistics for a funnel step. Used in the `steps` array of the Funnel Stats response and as the `step` object in the Page Stats response.
      properties:
        page_id:
          type:
          - integer
          - 'null'
          description: The id of the page this step renders (when the step is a show-page step). `null` for non-page steps.
        name:
          type: string
          description: The step name
        current_path:
          type: string
          description: 'The workflow-level routing segment for this step (from the `Workflows::Step#current_path` attribute). Note: this is the workflow step path, not the page''s own `current_path` which is the page-level canonical path.'
        views_all:
          type: integer
          description: Total pageviews for this step
        views_unique:
          type: integer
          description: Unique pageviews for this step
        optins:
          type: integer
          description: Number of opt-ins on this step
        optin_rate:
          type: number
          format: float
          description: Opt-in rate (optins / unique views)
        sales_count:
          type: integer
          description: Number of sales on this step
        sales_rate:
          type: number
          format: float
          description: Sales conversion rate (sales / unique views)
        sales_value:
          type: string
          description: Total sales value as a decimal string (see top-level currency field)
        recurring_sales_count:
          type: integer
          description: Number of recurring sales
        recurring_sales_value:
          type: string
          description: Total recurring sales value as a decimal string (see top-level currency field)
        earnings_per_view:
          type: string
          description: Earnings per view as a decimal string (see top-level currency field)
        earnings_per_unique_view:
          type: string
          description: Earnings per unique view as a decimal string (see top-level currency field)
      example:
        page_id: 100
        name: Sign Up Page
        current_path: /
        views_all: 17
        views_unique: 17
        optins: 0
        optin_rate: 0
        sales_count: 0
        sales_rate: 0
        sales_value: '0.00'
        recurring_sales_count: 0
        recurring_sales_value: '0.00'
        earnings_per_view: '0.00'
        earnings_per_unique_view: '0.00'
  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: string
    sort_property:
      name: sort_property
      in: query
      description: 'Sort property of a list response. The default is id and thus the created_at order.

        If you sort by other properties, we additionally sort by id implicitly as a secondary sort property, so that you can rely on the sort order to be deterministic even if the main sort property ends up with the same values.

        '
      required: false
      schema:
        type: string
        enum:
        - id
        - updated_at
    sort_order:
      name: sort_order
      in: query
      description: Sort order of a list response. Use 'desc' to reverse the default 'asc' (ascending) sort order. Examples [in our guides](https://developers.myclickfunnels.com/docs/pagination).
      required: false
      schema:
        type: string
        enum:
        - asc
        - desc
    StatsTimerangeStart:
      name: timerange_start
      in: query
      description: Start of the stats timerange (ISO 8601 format). Defaults to 30 days before `timerange_end`. If the window between start and end exceeds 90 days, start is automatically clamped to 90 days before end. If start is after end, the window resets to the default 30 days ending at `timerange_end`. See [Timerange parameters (both endpoints)](https://accounts.myclickfunnels.com/.well-known/stats/skill.md#timerange-parameters-both-endpoints) in the [Stats Skill](https://accounts.myclickfunnels.com/.well-known/stats/skill.md) for the clamping rules and how to cover longer windows.
      required: false
      schema:
        type: string
        format: date-time
      example: '2026-01-01T00:00:00Z'
    StatsTimerangeEnd:
      name: timerange_end
      in: query
      description: End of the stats timerange (ISO 8601 format). Defaults to the current time. Values in the future are automatically clamped to now.
      required: false
      schema:
        type: string
        format: date-time
      example: '2026-01-31T23:59:59Z'
    ExpandFunnelFields:
      name: expand[]
      in: query
      description: 'Expand additional data in the response. Use `expand[]=field_name` to include optional fields. Available fields: head_code, footer_code. See the [Expanding guide](https://developers.myclickfunnels.com/docs/expand) for examples.'
      required: false
      schema:
        type: array
        items:
          type: string
          enum:
          - head_code
          - footer_code
    after:
      name: after
      in: query
      required: false
      schema:
        type: string
      description: ID of item after which the collection should be returned. More examples and info about pagination [in our guides](https://developers.myclickfunnels.com/docs/pagination).
    ExpandFunnelStatsFields:
      name: expand[]
      in: query
      description: Expand additional data in the response. Use `expand[]=steps` to include per-step statistics. When `expand[]=steps` is set, the response contains a `steps` array with detailed metrics for each funnel step. When omitted, the response contains a `page_public_ids` array instead. See [the expanded steps response](https://accounts.myclickfunnels.com/.well-known/stats/skill.md#response-with-expandsteps) in the [Stats Skill](https://accounts.myclickfunnels.com/.well-known/stats/skill.md) for both response shapes.
      required: false
      schema:
        type: array
        items:
          type: string
          enum:
          - steps
  headers:
    Link:
      description: A direct link to the next page for the cursor-based pagination. It includes the `after` and the Pagination-Next ID value.
      schema:
        type: string
    PaginationNext:
      description: ID of the last item in the current response after which more records exist. You can use it in an `after` query parameter for cursor-based pagination to get to the next page.
      schema:
        type: string
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
