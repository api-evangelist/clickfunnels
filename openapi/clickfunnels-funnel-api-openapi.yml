openapi: 3.2.0
info:
  title: ClickFunnels Funnel API
  termsOfService: https://www.clickfunnels.com/terms-of-service
  contact:
    name: ClickFunnels API Team
    url: https://developers.myclickfunnels.com
  x-logo:
    url: https://statics.myclickfunnels.com/image/1126065/file/31edf05760fafe41a82f16a668ab251f.png
  description: 'The ClickFunnels REST API that powers webhooks, native integrations, and Zapier lets you manage your ClickFunnels data, automate your workflows, and recreate ClickFunnels functionality in your own apps.


    ### For AI agents


    This document is the catalogue: every operation ClickFunnels exposes over REST is described here, with a unique operationId, typed schemas, and the scopes it needs. It is served from `/openapi.json`, `/openapi.yaml`, `/api/openapi.{json,yaml}`, and `/api/v2/openapi.{json,yaml}` on the accounts host.


    Three things it does not describe, each one request away:


    - MCP server: the app-native Model Context Protocol server (Streamable HTTP, OAuth 2.1 with PKCE). Prefer it over raw REST when your client supports MCP - it describes itself at runtime.

    - Skill guides, also as an Agent Skills index: one task guide per job (pages, blogs, products, orders, workflows, emails, courses, stats, external SDK pages). Read the guide that matches your job before your first write. llms.txt covers when to use ClickFunnels at all, how to get credentials, and how to behave around rate limits.

    - Protected resource metadata (RFC 9728) and authorization server metadata (RFC 8414): the scope vocabulary and the OAuth endpoints. Dynamic client registration is for MCP clients only.


    On ClickFunnels-owned API hosts (`myclickfunnels.com` and its subdomains), the OpenAPI specification responses and API authentication failures (401, or 403 for insufficient scope) carry those links in an RFC 8288 `Link` header, so clients can discover the documentation and authentication metadata from those responses. Requests sent through a customer''s custom domain keep the Bearer challenge but omit those discovery pointers.'
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  version: 2.0.0
servers:
- url: https://{subdomain}.myclickfunnels.com/api/v2
  description: ClickFunnels API
  variables:
    subdomain:
      default: myworkspace
security:
- BearerAuth: []
- OAuth2: []
tags:
- name: Funnel
  description: '> The Funnel resource contains relevant metadata about funnels.


    Funnel-level analytics are available via the Fetch Funnel Stats endpoint (`GET /funnels/{funnel_id}/stats`); per-page analytics via the Fetch Page Stats endpoint (`GET /pages/{page_id}/stats`).


    See the Funnels Skill for building and modifying funnel workflows (split tests, conditional splits, structure), and the Stats Skill for reading funnel and page analytics.'
paths:
  /workspaces/{workspace_id}/funnels:
    get:
      tags:
      - Funnel
      summary: List Funnels
      operationId: listFunnels
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/after'
      - $ref: '#/components/parameters/per_page'
      - $ref: '#/components/parameters/sort_order'
      - $ref: '#/components/parameters/sort_property'
      - name: filter
        in: query
        description: 'Filter by available properties in query params, like this: `api/v2/resources?filter[id]=value&filter[another_property]=value1,value2`. Check our Filtering guide for examples and all about filtering [here](https://developers.myclickfunnels.com/docs/filtering).

          '
        required: false
        schema:
          type: object
          properties:
            id:
              type: string
              description: A comma-separated list of funnel IDs to filter by.
              example: 1,42
        style: deepObject
        explode: true
      - $ref: '#/components/parameters/ExpandFunnelFields'
      responses:
        '200':
          description: OK
          headers:
            Pagination-Next:
              $ref: '#/components/headers/PaginationNext'
            Link:
              $ref: '#/components/headers/Link'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FunnelAttributes'
              example:
              - id: 3
                public_id: RefvmT
                workspace_id: 42000
                name: Example Funnel
                archived: false
                current_path: /example-path
                live_mode: true
                domain_id: 42
                favicon_image_id: null
                created_at: '2025-01-01T00:00:00.000Z'
                updated_at: '2025-01-01T00:00:00.000Z'
                tags:
                - id: 4
                  public_id: qFvrak
                  name: Example Funnel Tag
                  color: '#00FF00'
              - id: 4
                public_id: Anaptx
                workspace_id: 42000
                name: Example Funnel
                archived: false
                current_path: /example-path
                live_mode: true
                domain_id: null
                favicon_image_id: null
                created_at: '2025-01-01T00:00:00.000Z'
                updated_at: '2025-01-01T00:00:00.000Z'
                tags:
                - id: 5
                  public_id: wJMVcO
                  name: Example Funnel Tag
                  color: '#00FF00'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  hint:
                    type:
                    - string
                    - 'null'
                    description: 'The next step for the caller: how to authenticate, which scope was missing, or where the route list lives. Always present, and null when this error has no next step to offer.'
              example:
                error: API key missing or invalid
                hint: 'Send the token as `Authorization: Bearer <token>`. Create one under Account > Team > Platform Applications (a workspace API key), or obtain one with OAuth 2.1; both use the same scopes. See https://developers.myclickfunnels.com/docs/authentication, or append .md to that URL for markdown.'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Not found - This usually happens when you try to access a record that does not exist in your account. It can also happen when the provided parent record is missing, e.g. you have put in a non-existent Workspaces parent ID.
                  hint:
                    type:
                    - string
                    - 'null'
                    description: 'The next step for the caller: how to authenticate, which scope was missing, or where the route list lives. Always present, and null when this error has no next step to offer.'
              example:
                error: 'Not found: Record missing'
                hint: null
        '422':
          $ref: '#/components/responses/InvalidPageSize'
    post:
      tags:
      - Funnel
      summary: Create Funnel
      description: 'Create a new funnel in the workspace.


        Creating a funnel automatically creates a workflow. You can then add pages to the funnel by creating pages with `funnel.funnel_id` set to the new funnel''s ID (see the Create Page endpoint).


        **Client flow for building a funnel with pages:**

        1. `POST /api/v2/workspaces/:id/funnels` — creates the funnel (workflow auto-created)

        2. `POST /api/v2/workspaces/:id/pages` with `{ page: { name: "...", funnel: { funnel_id: "" }, markup: "" } }` — creates each page, auto-links it to the funnel, and applies the markup in one call

        3. `PATCH /api/v2/pages/:id` with `{ page: { markup: "" } }` — applies or updates visual content (PML markup) on an existing page

        4. Steps 2 and 3 can be combined: passing `markup` in the create call sets the initial visual content without a separate PATCH


        The internal step/workflow wiring is handled automatically — API clients never need to manage workflows or steps directly.'
      operationId: createFunnel
      externalDocs:
        description: Funnels Skill - build and modify funnel workflows
        url: https://accounts.myclickfunnels.com/.well-known/funnels/skill.md
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                funnel:
                  $ref: '#/components/schemas/FunnelParametersCreate'
            example:
              funnel:
                name: Example Funnel
                current_path: /example-funnel
                live_mode: true
                tag_ids:
                - 1
                - 2
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunnelAttributes'
              example:
                id: 10
                public_id: AbCdEf
                workspace_id: 42000
                name: Example Funnel
                archived: false
                current_path: /example-funnel
                live_mode: true
                domain_id: 42
                favicon_image_id: null
                created_at: '2025-01-01T00:00:00.000Z'
                updated_at: '2025-01-01T00:00:00.000Z'
                tags: []
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  hint:
                    type:
                    - string
                    - 'null'
                    description: 'The next step for the caller: how to authenticate, which scope was missing, or where the route list lives. Always present, and null when this error has no next step to offer.'
              example:
                error: API key missing or invalid
                hint: 'Send the token as `Authorization: Bearer <token>`. Create one under Account > Team > Platform Applications (a workspace API key), or obtain one with OAuth 2.1; both use the same scopes. See https://developers.myclickfunnels.com/docs/authentication, or append .md to that URL for markdown.'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Not found - The workspace or record cannot be found.
                  hint:
                    type:
                    - string
                    - 'null'
                    description: 'The next step for the caller: how to authenticate, which scope was missing, or where the route list lives. Always present, and null when this error has no next step to offer.'
              example:
                error: 'Not found: Record missing'
                hint: null
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  hint:
                    type:
                    - string
                    - 'null'
                    description: 'The next step for the caller: how to authenticate, which scope was missing, or where the route list lives. Always present, and null when this error has no next step to offer.'
              example:
                error: Name can't be blank
                hint: null
  /funnels/{id}:
    get:
      tags:
      - Funnel
      summary: Fetch Funnel
      description: Fetch a funnel by numeric id or public id. The unwrapped response's `live_mode` controls test versus live payment processing, not page visibility or publication status. Use `GET /api/v2/pages/:id` to inspect page content and computed URLs, and the existing structure endpoint for the step tree.
      operationId: getFunnels
      parameters:
      - $ref: '#/components/parameters/id'
      - $ref: '#/components/parameters/ExpandFunnelFields'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunnelAttributes'
              example:
                id: 5
                public_id: SgjNJM
                workspace_id: 42000
                name: Example Funnel
                archived: false
                current_path: /example-path
                live_mode: false
                domain_id: 42
                favicon_image_id: null
                created_at: '2025-01-01T00:00:00.000Z'
                updated_at: '2025-01-01T00:00:00.000Z'
                tags:
                - id: 6
                  public_id: rMxvpb
                  name: Example Funnel Tag
                  color: '#00FF00'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  hint:
                    type:
                    - string
                    - 'null'
                    description: 'The next step for the caller: how to authenticate, which scope was missing, or where the route list lives. Always present, and null when this error has no next step to offer.'
              example:
                error: API key missing or invalid
                hint: 'Send the token as `Authorization: Bearer <token>`. Create one under Account > Team > Platform Applications (a workspace API key), or obtain one with OAuth 2.1; both use the same scopes. See https://developers.myclickfunnels.com/docs/authentication, or append .md to that URL for markdown.'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  hint:
                    type:
                    - string
                    - 'null'
                    description: 'The next step for the caller: how to authenticate, which scope was missing, or where the route list lives. Always present, and null when this error has no next step to offer.'
              example:
                error: 'Not found: Record missing'
                hint: null
    put:
      tags:
      - Funnel
      summary: Update Funnel
      description: 'Update a funnel''s settings, including its path, favicon, domain, and tags, by numeric id or public id with the `funnel` JSON root. PATCH is also supported. The favicon is writable only on this operation; creation already accepts a path. The target image, domain, and tags must belong to the funnel''s workspace. A path edit cannot take an occupied or historical URL or move the root path. Domain changes can continue propagating after this response.


        `live_mode` controls test versus live payment processing; changing it does not publish page content. Use `PUT /api/v2/pages/:id` or `PATCH /api/v2/pages/:id` for an intentional live page content replacement and `GET /api/v2/pages/:id` to read the resource back. There is currently no atomic whole-funnel release or pollable publish receipt.


        Boolean `true`/`false` and their string forms assign `live_mode`; null, empty and other values leave it unchanged. Set it to true only when live payment processing is intended.


        Use head_code and footer_code to inject custom code. Their modes default to append; use replace for repeatable writes. Null clears code.'
      operationId: updateFunnels
      externalDocs:
        description: Funnels Skill - build and modify funnel workflows
        url: https://accounts.myclickfunnels.com/.well-known/funnels/skill.md
      parameters:
      - $ref: '#/components/parameters/id'
      - $ref: '#/components/parameters/ExpandFunnelFields'
      requestBody:
        description: Information about updated fields in Funnel
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - funnel
              properties:
                funnel:
                  type: object
                  $ref: '#/components/schemas/FunnelParametersUpdate'
            example:
              funnel:
                name: Example Funnel
                current_path: /example-funnel
                live_mode: false
                favicon_image_id: 73
                tag_ids:
                - 9
                head_code: <script>console.log('funnel');</script>
                head_code_mode: append
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunnelAttributes'
              example:
                id: 8
                public_id: VeGRjs
                workspace_id: 42000
                name: Example Funnel
                archived: false
                current_path: /example-path
                live_mode: false
                domain_id: 42
                favicon_image_id: null
                created_at: '2025-01-01T00:00:00.000Z'
                updated_at: '2025-01-01T00:00:00.000Z'
                tags:
                - id: 9
                  public_id: EQkhFg
                  name: Example Funnel Tag
                  color: '#00FF00'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  hint:
                    type:
                    - string
                    - 'null'
                    description: 'The next step for the caller: how to authenticate, which scope was missing, or where the route list lives. Always present, and null when this error has no next step to offer.'
              example:
                error: 'Bad request: Invalid code mode ''invalid''. Must be ''append'' or ''replace''.'
                hint: null
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  hint:
                    type:
                    - string
                    - 'null'
                    description: 'The next step for the caller: how to authenticate, which scope was missing, or where the route list lives. Always present, and null when this error has no next step to offer.'
              example:
                error: API key missing or invalid
                hint: 'Send the token as `Authorization: Bearer <token>`. Create one under Account > Team > Platform Applications (a workspace API key), or obtain one with OAuth 2.1; both use the same scopes. See https://developers.myclickfunnels.com/docs/authentication, or append .md to that URL for markdown.'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  hint:
                    type:
                    - string
                    - 'null'
              example:
                error: 'Forbidden: This API key is limited to specific workspaces.'
                hint: null
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  hint:
                    type:
                    - string
                    - 'null'
                    description: 'The next step for the caller: how to authenticate, which scope was missing, or where the route list lives. Always present, and null when this error has no next step to offer.'
              example:
                error: 'Not found: Record missing'
                hint: null
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  hint:
                    type:
                    - string
                    - 'null'
              example:
                error: 'Request unprocessable: current_path is already used on this domain'
                hint: null
    delete:
      tags:
      - Funnel
      summary: Delete an empty Funnel
      description: 'Permanently remove an active or archived, unshared funnel only when its workflow has no steps beyond its generated root. Populated funnels must be archived instead. The workflow and its root step are retained.


        An otherwise empty funnel can still be referenced by products, affiliate campaigns, or store upsells. If a database foreign key blocks deletion, the endpoint returns 409 with guidance to archive instead; the funnel and its dependent records are preserved.


        Funnels write access is required. If the funnel has attached workflow triggers, deletion also requires Workflows write access because those triggers are deleted with the funnel. Trigger-free funnels require only Funnels write access.'
      operationId: destroyFunnels
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '204':
          description: Funnel deleted
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  hint:
                    type:
                    - string
                    - 'null'
                    description: 'The next step for the caller: how to authenticate, which scope was missing, or where the route list lives. Always present, and null when this error has no next step to offer.'
              example:
                error: API key missing or invalid
                hint: 'Send the token as `Authorization: Bearer <token>`. Create one under Account > Team > Platform Applications (a workspace API key), or obtain one with OAuth 2.1; both use the same scopes. See https://developers.myclickfunnels.com/docs/authentication, or append .md to that URL for markdown.'
        '403':
          description: Funnels write access is required; Workflows write access is also required when attached workflow triggers will be deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  hint:
                    type:
                    - string
                    - 'null'
                    description: 'The next step for the caller: how to authenticate, which scope was missing, or where the route list lives. Always present, and null when this error has no next step to offer.'
              example:
                error: 'Forbidden: Token does not grant write access to Funnels'
                hint: 'Scopes are granted per category as <category>:read or <category>:write; the `scope` parameter of WWW-Authenticate names the one this request needed. Grantable scopes: https://accounts.myclickfunnels.com/.well-known/oauth-protected-resource'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  hint:
                    type:
                    - string
                    - 'null'
                    description: 'The next step for the caller: how to authenticate, which scope was missing, or where the route list lives. Always present, and null when this error has no next step to offer.'
              example:
                error: 'Not found: Record missing'
                hint: null
        '409':
          description: Shared, populated, or referenced funnel cannot be deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  hint:
                    type:
                    - string
                    - 'null'
                    description: 'The next step for the caller: how to authenticate, which scope was missing, or where the route list lives. Always present, and null when this error has no next step to offer.'
              example:
                error: 'Conflict: Only empty funnels can be deleted; archive this funnel instead'
                hint: null
        '422':
          description: Funnel destruction failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  hint:
                    type:
                    - string
                    - 'null'
                    description: 'The next step for the caller: how to authenticate, which scope was missing, or where the route list lives. Always present, and null when this error has no next step to offer.'
              example:
                error: 'Request unprocessable: Funnel could not be deleted'
                hint: null
  /funnels/{id}/archive:
    post:
      tags:
      - Funnel
      summary: Archive a Funnel
      description: Synchronously archive the funnel and its attached show-page pages. Its URL path is disambiguated, and redirect steps targeting it are unlinked. Restoring the funnel does not restore the original path or those links. Shared funnels cannot be archived.
      operationId: archiveFunnels
      parameters:
      - $ref: '#/components/parameters/id'
      - $ref: '#/components/parameters/ExpandFunnelFields'
      responses:
        '200':
          description: Archived Funnel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunnelAttributes'
              example:
                id: 5
                public_id: SgjNJM
                workspace_id: 42000
                name: Example Funnel
                archived: true
                current_path: /example-path--a1b2c
                live_mode: true
                domain_id: 42
                favicon_image_id: null
                created_at: '2025-01-01T00:00:00.000Z'
                updated_at: '2025-01-01T00:00:00.000Z'
                tags: []
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  hint:
                    type:
                    - string
                    - 'null'
                    description: 'The next step for the caller: how to authenticate, which scope was missing, or where the route list lives. Always present, and null when this error has no next step to offer.'
              example:
                error: API key missing or invalid
                hint: 'Send the token as `Authorization: Bearer <token>`. Create one under Account > Team > Platform Applications (a workspace API key), or obtain one with OAuth 2.1; both use the same scopes. See https://developers.myclickfunnels.com/docs/authentication, or append .md to that URL for markdown.'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  hint:
                    type:
                    - string
                    - 'null'
                    description: 'The next step for the caller: how to authenticate, which scope was missing, or where the route list lives. Always present, and null when this error has no next step to offer.'
              example:
                error: 'Forbidden: Token does not grant write access to Funnels'
                hint: 'Scopes are granted per category as <category>:read or <category>:write; the `scope` parameter of WWW-Authenticate names the one this request needed. Grantable scopes: https://accounts.myclickfunnels.com/.well-known/oauth-protected-resource'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  hint:
                    type:
                    - string
                    - 'null'
                    description: 'The next step for the caller: how to authenticate, which scope was missing, or where the route list lives. Always present, and null when this error has no next step to offer.'
              example:
                error: 'Not found: Record missing'
                hint: null
        '409':
          description: Already archived or shared Funnel
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  hint:
                    type:
                    - string
                    - 'null'
                    description: 'The next step for the caller: how to authenticate, which scope was missing, or where the route list lives. Always present, and null when this error has no next step to offer.'
