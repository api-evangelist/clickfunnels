  /funnels/{id}/structure:
    get:
      tags:
      - Funnel
      summary: Fetch Funnel Structure
      description: 'A funnel''s steps as a single, flat, ordered list — the same top‑to‑bottom flow you see in the funnel builder. Use it to read or visualize how a funnel is laid out.


        Each entry in `steps` is one of three kinds:


        - **`show_page_step`** — a page. Includes `page` (its `name`, `url`, and the `external` / `sdk_token` flags for externally‑hosted SDK pages) and `show_page_step_id` — the id you hand back as `funnel.show_page_step_id` to swap a page onto this step.

        - **`split_test_step`** — an A/B test: a `variants` list, each with a `weight` and its own `steps`.

        - **`conditional_split_step`** — routing by a saved contact filter: a `branches` list, always `[matched, unmatched]`, each with its own `steps`.


        Splits can nest — a split placed inside a branch shows up inside that branch''s `steps`.


        **Two things to know when reading it:**


        1. **Follow the array order, not `sort_order`.** `sort_order` only numbers a step within its own list, so it repeats across branches and after splits — in the example below the top level runs `0, 1, 0, 1`. The array order is the real sequence. (Separately: when you *create* a step, the `sort_order` you send positions it among the funnel''s top‑level steps.)

        2. **Branches come back together.** A branch lists only its own steps; afterwards the flow continues at the step right after the split, and every branch ends up there. In the example below, both branches lead on to `Order Form → Thank You`. A split with nothing after it ends the funnel.


        The `200` example below is this funnel:


        ```text

        Entry

        └─ Conditional Split

        ├─ matched: VIP Welcome → Split Test ( Premium Offer A 50% / Premium Offer B 50% )

        └─ unmatched: Guest Welcome → Conditional Split ( Returning Customer / New Customer )

        → Order Form → Thank You (every path comes back together here)

        ```


        Related: the Pages skill (create, position, and swap pages) and the Funnels skill (add split tests and conditional splits). When migrating externally-hosted pages to a new domain, this is the read that inventories them: see Migrate an External Page Domain.'
      operationId: getFunnelStructure
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  funnel:
                    type: object
                    properties:
                      id:
                        type: integer
                        description: Funnel ID
                      public_id:
                        type: string
                        description: Funnel public ID
                      name:
                        type: string
                        description: Funnel name
                  steps:
                    type: array
                    description: The funnel's visible steps in order (no internal container steps).
                    items:
                      type: object
                      description: 'A step node. Common fields plus type-specific fields keyed off `step_type`:

                        - `show_page_step`: + `show_page_step_id` + `page` object.

                        - `conditional_split_step`: + `convergence_step_id` + `branches` array (each branch has a flat `steps` array).

                        - `split_test_step`: + `convergence_step_id` + `variants` array (each variant has a `weight` and a flat `steps` array).

                        '
                      properties:
                        id:
                          type: integer
                        public_id:
                          type: string
                        step_type:
                          type: string
                          example: show_page_step
                        name:
                          type: string
                        sort_order:
                          type: integer
                          description: Position within this step's own container (the top-level sequence, or a single branch/variant) — not globally unique across the flattened list. Walk `steps` in array order to read the visible sequence.
                        convergence_step_id:
                          type:
                          - integer
                          - 'null'
                          description: Split steps only. Id of the step where this split's branches/variants reconverge — the first step that runs after the split, which every path continues to (in the example below all paths rejoin at the Order Form, id 696). null when nothing follows the split. The referenced step always appears in this tree.
                        show_page_step_id:
                          type: string
                          description: show_page_step only — the function public id accepted by `funnel.show_page_step_id` on Create/Update Page.
                        page:
                          type:
                          - object
                          - 'null'
                          description: show_page_step only.
                          properties:
                            id:
                              type: integer
                            public_id:
                              type: string
                            name:
                              type: string
                            url:
                              type: string
                            external:
                              type: boolean
                            sdk_token:
                              type:
                              - string
                              - 'null'
                              description: Always present; `null` unless `external` is true.
                        branches:
                          type: array
                          description: conditional_split_step only. Always `[matched, unmatched]`; each branch carries its own flat `steps` array.
                          items:
                            type: object
                            properties:
                              branch:
                                type: string
                                enum:
                                - matched
                                - unmatched
                              steps:
                                type: array
                                items:
                                  type: object
                        variants:
                          type: array
                          description: split_test_step only. Each variant carries a `weight` and its own flat `steps` array.
                          items:
                            type: object
                            properties:
                              weight:
                                type: integer
                              steps:
                                type: array
                                items:
                                  type: object
              example:
                funnel:
                  id: 83
                  public_id: MjngvY
                  name: Coaching Upsell Funnel
                steps:
                - id: 689
                  public_id: zvbpDJ
                  step_type: show_page_step
                  name: Entry
                  sort_order: 0
                  show_page_step_id: qelNpj
                  page:
                    id: 1395
                    public_id: JXkbke
                    name: Entry
                    url: https://acme.myclickfunnels.com/entry
                    external: false
                    sdk_token: null
                - id: 691
                  public_id: RvppEv
                  step_type: conditional_split_step
                  name: Conditional Split Step
                  sort_order: 1
                  convergence_step_id: 696
                  branches:
                  - branch: matched
                    steps:
                    - id: 698
                      public_id: mjLGPJ
                      step_type: show_page_step
                      name: VIP Welcome
                      sort_order: 0
                      show_page_step_id: KvXWoj
                      page:
                        id: 1398
                        public_id: eLQBxJ
                        name: VIP Welcome
                        url: https://acme.myclickfunnels.com/vip-welcome
                        external: false
                        sdk_token: null
                    - id: 700
                      public_id: bJYaaJ
                      step_type: split_test_step
