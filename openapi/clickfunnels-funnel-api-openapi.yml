  /funnels/{funnel_id}/stats:
    get:
      tags:
      - Funnel
      summary: Fetch Funnel Stats
      description: 'Retrieve detailed statistics for a funnel, including a summary of key metrics

        and optional per-step breakdowns of views, opt-ins, sales, and earnings.


        Defaults to a 30-day timerange ending now. Override with `timerange_start` and

        `timerange_end`. Timerange values are automatically clamped: future end dates

        are clamped to now, windows exceeding 90 days are clamped to 90 days, and if

        start is after end the window resets to 30 days ending at `timerange_end`.


        By default the response includes a `page_public_ids` array. Use

        `expand[]=steps` to receive a `steps` array with per-step metrics instead.


        The metric names in the response are defined in Metric vocabulary in the Stats Skill, which also walks a recurring funnel auditor agent built on this endpoint.'
      operationId: getFunnelStats
      externalDocs:
        description: Stats Skill - funnel stats
        url: https://accounts.myclickfunnels.com/.well-known/stats/skill.md#funnel-stats
      parameters:
      - name: funnel_id
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/StatsTimerangeStart'
      - $ref: '#/components/parameters/StatsTimerangeEnd'
      - $ref: '#/components/parameters/ExpandFunnelStatsFields'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunnelStatsAttributes'
              example:
                funnel:
                  id: 1
                  public_id: gESyMv
                  name: My Sales Funnel
                currency: USD
                timerange:
                  from: '2026-03-03T00:00:00Z'
                  to: '2026-04-02T23:59:59Z'
                summary:
                  earnings_per_click: '0.00'
                  upfront_sales: '0.00'
                  upfront_sales_count: 0
                  recurring_sales: '0.00'
                  average_cart_value: '0.00'
                  pageviews: 85
                  optins: 38
                  optins_unique: 27
                page_public_ids:
                - NnAdPE
                - kJzvQi
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  hint:
                    type:
                    - string
                    - 'null'
                    description: 'The next step for the caller: how to authenticate, which scope was missing, or where the route list lives. Always present, and null when this error has no next step to offer.'
              example:
                error: API key missing or invalid
                hint: 'Send the token as `Authorization: Bearer <token>`. Create one under Account > Team > Platform Applications (a workspace API key), or obtain one with OAuth 2.1; both use the same scopes. See https://developers.myclickfunnels.com/docs/authentication, or append .md to that URL for markdown.'
        '403':
          $ref: '#/components/responses/WorkspaceGrantForbidden'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  hint:
                    type:
                    - string
                    - 'null'
                    description: 'The next step for the caller: how to authenticate, which scope was missing, or where the route list lives. Always present, and null when this error has no next step to offer.'
              example:
                error: 'Not found: Record missing'
                hint: null
        '422':
          description: 'Unprocessable Entity — a timerange parameter is not a real date or time. Unparseable

            values and calendar dates that do not exist (2026-02-31) are refused rather than

            silently answered with a different window.

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  hint:
                    type:
                    - string
                    - 'null'
                    description: 'The next step for the caller: how to authenticate, which scope was missing, or where the route list lives. Always present, and null when this error has no next step to offer.'
              example:
                error: 'Request unprocessable: timerange_start ''2026-13-01'' is not a valid date or time. Use an ISO 8601 value, e.g. 2026-09-01T00:00:00Z.'
                hint: null
components:
  parameters:
    StatsTimerangeStart:
      name: timerange_start
      in: query
      description: Start of the stats timerange (ISO 8601 only; any other value is a 422. Send an offset's `+` as `%2B`, since an unencoded `+` arrives as a space). Defaults to 30 days before `timerange_end`. If the window between start and end exceeds 90 days, start is automatically clamped to 90 days before end. If start is after end, the window resets to the default 30 days ending at `timerange_end`. See [Timerange parameters (both endpoints)](https://accounts.myclickfunnels.com/.well-known/stats/skill.md#timerange-parameters-both-endpoints) in the [Stats Skill](https://accounts.myclickfunnels.com/.well-known/stats/skill.md) for the clamping rules and how to cover longer windows.
      required: false
      schema:
        type: string
        format: date-time
      example: '2026-01-01T00:00:00Z'
    per_page:
      name: per_page
      in: query
      required: false
      description: Records per page. Defaults to 20; raise it up to 100 for bulk reads. A larger value returns 100 records. Zero, a negative or a non-integer value is a 422. The `Link` next-page URL keeps the value, so a client following it keeps the page size. More [in our guides](https://developers.myclickfunnels.com/docs/pagination).
      schema:
        type: integer
        minimum: 1
        default: 20
    ExpandFunnelFields:
      name: expand[]
      in: query
      description: 'Expand additional data in the response. Use `expand[]=field_name` to include optional fields. Available fields: head_code, footer_code. See the [Expanding guide](https://developers.myclickfunnels.com/docs/expand) for examples.'
      required: false
      schema:
        type: array
        items:
          type: string
          enum:
          - head_code
          - footer_code
    StatsTimerangeEnd:
      name: timerange_end
      in: query
      description: End of the stats timerange (ISO 8601 only; any other value is a 422. Send an offset's `+` as `%2B`, since an unencoded `+` arrives as a space). Defaults to the current time. Values in the future are automatically clamped to now.
      required: false
      schema:
        type: string
        format: date-time
      example: '2026-01-31T23:59:59Z'
    id:
      name: id
      in: path
      required: true
      schema:
        type: string
    sort_order:
      name: sort_order
      in: query
      description: Sort order of a list response. Use 'desc' to reverse the default 'asc' (ascending) sort order. Examples [in our guides](https://developers.myclickfunnels.com/docs/pagination).
      required: false
      schema:
        type: string
        enum:
        - asc
        - desc
    sort_property:
      name: sort_property
      in: query
      description: 'Sort property of a list response. The default is id and thus the created_at order.

        If you sort by other properties, we additionally sort by id implicitly as a secondary sort property, so that you can rely on the sort order to be deterministic even if the main sort property ends up with the same values.

        '
      required: false
      schema:
        type: string
        enum:
        - id
        - updated_at
    after:
      name: after
      in: query
      required: false
      schema:
        type: string
      description: ID of item after which the collection should be returned. More examples and info about pagination [in our guides](https://developers.myclickfunnels.com/docs/pagination).
    ExpandFunnelStatsFields:
      name: expand[]
      in: query
      description: Expand additional data in the response. Use `expand[]=steps` to include per-step statistics. When `expand[]=steps` is set, the response contains a `steps` array with detailed metrics for each funnel step. When omitted, the response contains a `page_public_ids` array instead. See [the expanded steps response](https://accounts.myclickfunnels.com/.well-known/stats/skill.md#response-with-expandsteps) in the [Stats Skill](https://accounts.myclickfunnels.com/.well-known/stats/skill.md) for both response shapes.
      required: false
      schema:
        type: array
        items:
          type: string
          enum:
          - steps
  schemas:
    FunnelParametersCreate:
      type: object
      title: Funnels
      description: Funnels
      required:
      - name
      properties:
        name:
          type: string
          description: Name of the Funnel
        current_path:
          type: string
          description: The URL path for the funnel. If not provided, a path will be auto-generated from the name.
        live_mode:
          type: boolean
          description: Controls test versus live payment processing, not page visibility or publication. True enables live payments; false keeps test mode. Page content is saved live through the Pages API.
        domain_id:
          type:
          - integer
          - 'null'
          description: The ID of the domain to associate with this funnel. Use the Domains API to look up available domain IDs.
        tag_ids:
          type: array
          items:
            type: integer
          description: An array of tag IDs to associate with this funnel
        head_code:
          type:
          - string
          - 'null'
          description: Custom code to inject into the funnel's <head> section. Content should be wrapped in appropriate HTML tags such as <script>, <link>, <meta>, or <style>.
        head_code_mode:
          type: string
          enum:
          - append
          - replace
          description: How to handle head_code. 'append' adds to existing code (default), 'replace' overwrites.
        footer_code:
          type:
          - string
          - 'null'
          description: Custom code to inject before the closing </body> tag. JavaScript should be wrapped in <script> tags.
        footer_code_mode:
          type: string
          enum:
          - append
          - replace
          description: How to handle footer_code. 'append' adds to existing code (default), 'replace' overwrites.
      example:
        funnel:
          name: Example Funnel
          current_path: /example-funnel
          live_mode: false
          tag_ids:
          - 1
          - 2
    FunnelAttributes:
      type: object
      title: Funnels
      description: Funnels
      properties:
        id:
          type: integer
          description: Funnel ID
        public_id:
          type: string
          description: The public identifier of the funnel
        workspace_id:
          type: integer
          description: The ID of the workspace that the funnel belongs to
        name:
          type: string
          description: Name of the Funnel
        archived:
          type: boolean
          description: Archived status
        current_path:
          type: string
          description: The URL path of the funnel
        live_mode:
          type: boolean
          description: Test versus live payment processing mode, not page visibility or publication status. False means test mode; true enables live payments.
        domain_id:
          type:
          - integer
          - 'null'
          description: The ID of the domain associated with this funnel. Use the Domains API to look up available domain IDs.
        favicon_image_id:
          type:
          - integer
          - 'null'
          description: The ID of the image used as the favicon for this funnel
        created_at:
          type: string
          format: date-time
          description: Created at
        updated_at:
          type: string
          format: date-time
          description: Updated at
        tags:
          type: array
          items:
            type: object
            title: Funnel Tags
            description: Funnel Tags
            properties:
              id:
                type: integer
                description: ID
              public_id:
                type: string
                description: Public ID
              name:
                type: string
                description: The name of the funnel tag
              color:
                type: string
                description: The color of the funnel tag
          description: Funnel Tags
        head_code:
          type:
          - string
          - 'null'
          description: '**Expandable** Custom HTML/JavaScript code injected into the funnel head section. Only returned when expand[]=head_code is provided. Note: expanding may add latency, especially on list endpoints. Use sparingly.'
        footer_code:
          type:
          - string
          - 'null'
          description: '**Expandable** Custom HTML/JavaScript code injected before the closing body tag. Only returned when expand[]=footer_code is provided. Note: expanding may add latency, especially on list endpoints. Use sparingly.'
      example:
        id: 1
        public_id: gESyMv
        workspace_id: 42000
        name: Example Funnel
        archived: false
        current_path: /example-path
        live_mode: false
        domain_id: 42
        favicon_image_id: null
        created_at: '2025-01-01T00:00:00.000Z'
        updated_at: '2025-01-01T00:00:00.000Z'
        tags:
        - id: 1
          public_id: JgjGTv
          name: Example Funnel Tag
          color: '#00FF00'
    FunnelParametersUpdate:
      type: object
      title: Funnels
      description: Funnels
      required: []
      properties:
        name:
          type: string
          description: Name of the Funnel
        current_path:
          type: string
          description: The funnel URL path. It is normalized to lowercase with a leading slash. Blank, root, reserved, and occupied paths are rejected.
        live_mode:
          type: boolean
          description: Controls test versus live payment processing, not page visibility or publication. True enables live payments; false keeps test mode. Boolean values and the strings 'true'/'false' are accepted by the update operation; null, empty and other values leave the current mode unchanged. Use updatePages for intentional live page content writes.
        domain_id:
          type:
          - integer
          - 'null'
          description: The ID of the domain to associate with this funnel. Set to null to remove the domain association. Use the Domains API to look up available domain IDs.
        favicon_image_id:
          description: The ID of an image in the funnel's workspace. A positive numeric ID or digit-only string is accepted; null clears the favicon. Update only.
          oneOf:
          - type: integer
            minimum: 1
          - type: string
            pattern: ^0*[1-9][0-9]*$
          - type: 'null'
        tag_ids:
          type:
          - array
          - 'null'
          description: Replace the funnel's tags with numeric IDs from its workspace. An empty array clears tags; null is ignored.
          items:
            oneOf:
            - type: integer
              minimum: 1
            - type: string
              pattern: ^0*[1-9][0-9]*$
        head_code:
          type:
          - string
          - 'null'
          description: Custom code to inject into the funnel's <head> section. Content should be wrapped in appropriate HTML tags such as <script>, <link>, <meta>, or <style>. Set to null to clear existing code.
        head_code_mode:
          type: string
          enum:
          - append
          - replace
          description: How to handle head_code. 'append' adds to existing code (default), 'replace' overwrites.
        footer_code:
          type:
          - string
          - 'null'
          description: Custom code to inject before the closing </body> tag. JavaScript should be wrapped in <script> tags. Set to null to clear existing code.
        footer_code_mode:
          type: string
          enum:
          - append
          - replace
          description: How to handle footer_code. 'append' adds to existing code (default), 'replace' overwrites.
      example:
        funnel:
          name: Example Funnel
          current_path: /example-funnel
          live_mode: false
          favicon_image_id: 73
          tag_ids:
          - 9
          head_code: <script>console.log('funnel');</script>
          head_code_mode: append
    FunnelStepStats:
      type: object
      title: Funnel Step Stats
      description: Per-step statistics for a funnel step. Used in the `steps` array of the Funnel Stats response and as the `step` object in the Page Stats response.
      properties:
        page_id:
          type:
          - integer
          - 'null'
          description: The id of the page this step renders (when the step is a show-page step). `null` for non-page steps.
        name:
          type: string
          description: The step name
        current_path:
          type: string
          description: 'The workflow-level routing segment for this step (from the `Workflows::Step#current_path` attribute). Note: this is the workflow step path, not the page''s own `current_path` which is the page-level canonical path.'
        views_all:
          type: integer
          description: Total pageviews for this step
        views_unique:
          type: integer
          description: Unique pageviews for this step
        optins:
          type: integer
          description: Number of opt-ins on this step
        optin_rate:
          type: number
          format: float
          description: Opt-in rate (optins / unique views)
        sales_count:
          type: integer
          description: Number of sales on this step
        sales_rate:
          type: number
          format: float
          description: Sales conversion rate (sales / unique views)
        sales_value:
          type: string
          description: Total sales value as a decimal string (see top-level currency field)
        recurring_sales_count:
          type: integer
          description: Number of recurring sales
        recurring_sales_value:
          type: string
          description: Total recurring sales value as a decimal string (see top-level currency field)
        earnings_per_view:
          type: string
          description: Earnings per view as a decimal string (see top-level currency field)
        earnings_per_unique_view:
          type: string
          description: Earnings per unique view as a decimal string (see top-level currency field)
      example:
        page_id: 100
        name: Sign Up Page
        current_path: /
        views_all: 17
        views_unique: 17
        optins: 0
        optin_rate: 0.0
        sales_count: 0
        sales_rate: 0.0
        sales_value: '0.00'
        recurring_sales_count: 0
        recurring_sales_value: '0.00'
        earnings_per_view: '0.00'
        earnings_per_unique_view: '0.00'
    FunnelSummary:
      type: object
      title: Funnel Summary
      description: Lightweight funnel identifier used inside stats responses.
      properties:
        id:
          type: integer
          description: The funnel ID
        public_id:
          type: string
          description: The public identifier of the funnel
        name:
          type: string
          description: The name of the funnel
      example:
        id: 1
        public_id: gESyMv
        name: My Sales Funnel
    FunnelStatsAttributes:
      type: object
      title: Funnel Stats
      description: Detailed funnel statistics with aggregate summary and optional per-step breakdown.
      properties:
        funnel:
          $ref: '#/components/schemas/FunnelSummary'
        currency:
          type: string
          description: ISO 4217 currency code for all monetary values (e.g. USD, EUR)
        timerange:
          type: object
          description: The actual time range used for the stats (after any clamping)
          properties:
            from:
              type: string
              format: date-time
              description: Start of the timerange (ISO 8601)
            to:
              type: string
              format: date-time
              description: End of the timerange (ISO 8601)
        summary:
          type: object
          description: Aggregate funnel summary metrics
          properties:
            earnings_per_click:
              type: string
              description: Earnings per click as a decimal string (see currency field)
            upfront_sales:
              type: string
              description: Total upfront sales as a decimal string (see currency field)
            upfront_sales_count:
              type: integer
              description: Number of upfront sales
            recurring_sales:
              type: string
              description: Total recurring sales as a decimal string (see currency field)
            average_cart_value:
              type: string
              description: Average cart value as a decimal string (see currency field)
            pageviews:
              type: integer
              description: Total pageviews across all funnel steps
            optins:
              type: integer
              description: Opt-in events across the funnel, matching the sum of the per-step `optins` numbers.
            optins_unique:
              type: integer
              description: Distinct contacts associated with an opt-in event anywhere in the funnel.
        page_public_ids:
          type: array
          description: Public IDs of the pages associated with each funnel step, in step order. Present when `expand[]=steps` is NOT requested. Steps without an associated page are omitted.
          items:
            type: string
        steps:
          type: array
          description: Per-step statistics. Present only when `expand[]=steps` is requested. When this field is present, `page_public_ids` is absent.
          items:
            $ref: '#/components/schemas/FunnelStepStats'
      example:
        funnel:
          id: 1
          public_id: gESyMv
          name: My Sales Funnel
        currency: USD
        timerange:
          from: '2026-03-03T00:00:00Z'
          to: '2026-04-02T23:59:59Z'
        summary:
          earnings_per_click: '0.00'
          upfront_sales: '0.00'
          upfront_sales_count: 0
          recurring_sales: '0.00'
          average_cart_value: '0.00'
          pageviews: 85
          optins: 38
          optins_unique: 27
        page_public_ids:
        - NnAdPE
        - kJzvQi
  responses:
    InvalidPageSize:
      description: Unprocessable Entity - `per_page` must be a positive integer.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
              hint:
                type:
                - string
                - 'null'
                description: Next step for the caller, or null when no additional guidance applies.
          example:
            error: 'Request unprocessable: per_page must be a positive integer, capped at 100 (got "0")'
            hint: null
    WorkspaceGrantForbidden:
      description: "Forbidden — this request's workspace is closed to it.\n\nThree cases return this:\n\n* The access token is limited to specific workspaces (see the workspace selection made when\n  the key was provisioned, or the workspaces approved on the OAuth consent screen) and the\n  request acts on a workspace outside that set.\n* The access token is limited to specific workspaces and the request's workspace could not be\n  determined at all. The gate is fail-closed, so a workspace-limited token is denied rather\n  than allowed through when the target workspace is ambiguous.\n* The workspace's team has no active ClickFunnels subscription: it was canceled, is paused,\n  or is locked out after failed payments. Reads and writes are both refused until the\n  subscription is reactivated, and the body carries `\"code\": \"subscription_inactive\"`.\n\nA token with no workspace restriction never receives the first two."
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
              code:
                type: string
                description: A machine-readable cause, when there is one. `subscription_inactive` means the workspace's team has no active ClickFunnels subscription.
                enum:
                - subscription_inactive
              hint:
                type:
                - string
                - 'null'
                description: 'The next step for the caller: how to authenticate, which scope was missing, or where the route list lives. Always present, and null when this error has no next step to offer.'
          examples:
            workspace_not_granted:
              summary: Token not granted this workspace
              value:
                error: 'Forbidden: This access token is limited to specific workspaces and was not granted access to this one.'
                hint: The token's workspace grant was chosen when it was provisioned (Platform Applications) or on the OAuth consent screen. Use GET /api/v2/teams/{team_id}/workspaces to list the workspaces this token can reach (GET /api/v2/teams lists the team ids).
            subscription_inactive:
              summary: Team subscription inactive
              value:
                error: 'Forbidden: This workspace''s team does not have an active ClickFunnels subscription, so API access to it is disabled until the subscription is reactivated.'
                hint: null
                code: subscription_inactive
  headers:
    Link:
      description: A direct link to the next page for the cursor-based pagination. It includes the `after` and the Pagination-Next ID value.
      schema:
        type: string
    PaginationNext:
      description: ID of the last item in the current response after which more records exist. You can use it in an `after` query parameter for cursor-based pagination to get to the next page.
      schema:
        type: string
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: 'A workspace API key or an OAuth access token, sent as `Authorization: Bearer <token>`.


        Both carry the same scope vocabulary as the `OAuth2` scheme below. Category-only

        scopes restrict access to the categories they name. Coarse wildcards remain additive:

        `read contacts:read` reads every category, while `write contacts:read` can write every

        category. Omit coarse scopes when restricting access to specific categories.

        Legacy tokens with only coarse scopes retain their existing unrestricted access;

        a bare `read` scope alone does not enforce read-only access.

        '
    OAuth2:
      type: oauth2
      description: 'OAuth 2.0 authorization code flow for REST integrations. Create a Platform Application

        and follow `https://developers.myclickfunnels.com/docs/oauth-20` to connect users.

        Authorization server metadata is published at

        `https://accounts.myclickfunnels.com/.well-known/oauth-authorization-server`.

        Dynamic client registration at `/oauth/register` is for MCP clients only; MCP-scoped

        tokens must use `https://agents.myclickfunnels.com/mcp`, not the REST API.


        Scopes are least-privilege by category. Ask for the two coarse wildcards (`read`,

        `write`) only when an integration genuinely needs the whole workspace; otherwise ask

        for the `<category>:read` / `<category>:write` pairs you use. `write` implies `read`

        for the same category. Protected resource metadata (RFC 9728) for this API lives at

        `https://accounts.myclickfunnels.com/.well-known/oauth-protected-resource`.

        '
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.myclickfunnels.com/oauth/authorize
          tokenUrl: https://accounts.myclickfunnels.com/oauth/token
          refreshUrl: https://accounts.myclickfunnels.com/oauth/token
          scopes:
            read: Read any resource in the granted workspaces
            write: Read and write any resource in the granted workspaces
            contacts:read: Read Contacts
            contacts:write: Read and write Contacts
            workflows:read: Read Workflows (Automations)
            workflows:write: Read and write Workflows (Automations)
            funnels:read: Read Funnels
            funnels:write: Read and write Funnels
            sites:read: Read Sites & Design
            sites:write: Read and write Sites & Design
            courses:read: Read Courses
            courses:write: Read and write Courses
            emails:read: Read Emails
            emails:write: Read and write Emails
            blog:read: Read Blog
            blog:write: Read and write Blog
            community:read: Read Community
            community:write: Read and write Community
            appointments:read: Read Appointments
            appointments:write: Read and write Appointments
            opportunities:read: Read Opportunities
            opportunities:write: Read and write Opportunities
            store:read: Read Store
            store:write: Read and write Store
            forms:read: Read Forms
            forms:write: Read and write Forms
            media:read: Read Media
            media:write: Read and write Media
            webhooks:read: Read Webhooks
            webhooks:write: Read and write Webhooks
            account:read: Read Account
            account:write: Read and write Account
            reference:read: Read Reference Data
            reference:write: Read and write Reference Data
