                error: 'Conflict: Funnel is already archived'
                hint: null
        '422':
          description: Funnel or page validation failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  hint:
                    type:
                    - string
                    - 'null'
                    description: 'The next step for the caller: how to authenticate, which scope was missing, or where the route list lives. Always present, and null when this error has no next step to offer.'
              example:
                error: 'Request unprocessable: Name can''t be blank'
                hint: null
  /funnels/{id}/unarchive:
    post:
      tags:
      - Funnel
      summary: Restore an archived Funnel
      description: Synchronously restore the funnel and its attached show-page pages. The disambiguated URL path remains. For funnels with show-page steps, associated archived products are submitted for background restoration after commit; they may still be archived when this call returns. A token needs Funnels write access, and also Store write access when archived products will be submitted for restoration. Funnels write alone is sufficient when there are no archived products to restore.
      operationId: unarchiveFunnels
      parameters:
      - $ref: '#/components/parameters/id'
      - $ref: '#/components/parameters/ExpandFunnelFields'
      responses:
        '200':
          description: Restored Funnel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunnelAttributes'
              example:
                id: 5
                public_id: SgjNJM
