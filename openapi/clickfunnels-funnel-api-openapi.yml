      properties:
        name:
          type: string
          description: Name of the Funnel
        current_path:
          type: string
          description: The URL path for the funnel. If not provided, a path will be auto-generated from the name.
        live_mode:
          type: boolean
          description: In Live Mode your Funnel cannot be tested and will process live payments
        domain_id:
          type:
          - integer
          - 'null'
          description: The ID of the domain to associate with this funnel. Use the Domains API to look up available domain IDs.
        tag_ids:
          type: array
          items:
            type: integer
          description: An array of tag IDs to associate with this funnel
        head_code:
          type:
          - string
