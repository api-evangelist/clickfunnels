openapi: 3.2.0
info:
  title: ClickFunnels Forms::Submissions::Answer API
  termsOfService: https://www.clickfunnels.com/terms-of-service
  contact:
    name: ClickFunnels API Team
    url: https://developers.myclickfunnels.com
  x-logo:
    url: https://statics.myclickfunnels.com/image/1126065/file/31edf05760fafe41a82f16a668ab251f.png
  description: 'The ClickFunnels REST API that powers webhooks, native integrations, and Zapier lets you manage your ClickFunnels data, automate your workflows, and recreate ClickFunnels functionality in your own apps.

    '
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  version: 2.0.0
servers:
- url: https://{subdomain}.myclickfunnels.com/api/v2
  description: ClickFunnels API
  variables:
    subdomain:
      default: myworkspace
security:
- BearerAuth: []
tags:
- name: Forms::Submissions::Answer
  description: Form Submission Answers
paths:
  /forms/submissions/{submission_id}/answers:
    get:
      tags:
      - Forms::Submissions::Answer
      summary: List Answers
      description: List answers for a submission
      operationId: listFormsSubmissionsAnswers
      parameters:
      - name: submission_id
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/after'
      - $ref: '#/components/parameters/sort_order'
      - $ref: '#/components/parameters/sort_property'
      responses:
        '200':
          description: OK
          headers:
            Pagination-Next:
              $ref: '#/components/headers/PaginationNext'
            Link:
              $ref: '#/components/headers/Link'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FormsSubmissionsAnswerAttributes'
              example:
              - id: 90
                public_id: eYyCdk
                submission_id: 88
                field_id: 196
                fields_option_id: 579
                entry: MyText
                fields_option_ids: []
                created_at: '2025-01-01T00:00:00.000Z'
                updated_at: '2025-01-01T00:00:00.000Z'
              - id: 93
                public_id: DwJNUR
                submission_id: 90
                field_id: 202
                fields_option_id: 597
                entry: MyText
                fields_option_ids: []
                created_at: '2025-01-01T00:00:00.000Z'
                updated_at: '2025-01-01T00:00:00.000Z'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: API key missing or invalid
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Not found - This usually happens when you try to access a record that does not exist in your account. It can also happen when the provided parent record is missing, e.g. you have put in a non-existent Workspaces parent ID.
              example:
                error: 'Not found: Record missing'
    post:
      tags:
      - Forms::Submissions::Answer
      summary: Create Answer
      description: Add a new answer to a submission
      operationId: createFormsSubmissionsAnswers
      parameters:
      - name: submission_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        description: Information about a new Answer
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                forms_submissions_answer:
                  type: object
                  $ref: '#/components/schemas/FormsSubmissionsAnswerParameters'
            example:
              forms_submissions_answer:
                field_id: 20
                fields_option_id: 56
                entry: MyText
                fields_option_ids: []
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormsSubmissionsAnswerAttributes'
              example:
                id: 99
                public_id: OmoJXl
                submission_id: 94
                field_id: 214
                fields_option_id: 633
                entry: MyText
                fields_option_ids: []
                created_at: '2025-01-01T00:00:00.000Z'
                updated_at: '2025-01-01T00:00:00.000Z'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: 'Bad request: HTTP body must be valid JSON'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: API key missing or invalid
  /forms/submissions/answers/{id}:
    get:
      tags:
      - Forms::Submissions::Answer
      summary: Fetch Answer
      description: Retrieve a answer for a submission
      operationId: getFormsSubmissionsAnswers
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormsSubmissionsAnswerAttributes'
              example:
                id: 96
                public_id: uWNnHP
                submission_id: 92
                field_id: 208
                fields_option_id: 615
                entry: MyText
                fields_option_ids: []
                created_at: '2025-01-01T00:00:00.000Z'
                updated_at: '2025-01-01T00:00:00.000Z'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: API key missing or invalid
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: 'Not found: Record missing'
    put:
      tags:
      - Forms::Submissions::Answer
      summary: Update Answer
      description: Update a answer for a submission
      operationId: updateFormsSubmissionsAnswers
      parameters:
      - $ref: '#/components/parameters/id'
      requestBody:
        description: Information about updated fields in Answer
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                forms_submissions_answer:
                  type: object
                  $ref: '#/components/schemas/FormsSubmissionsAnswerParametersUpdate'
            example:
              forms_submissions_answer:
                field_id: 123
                fields_option_id: 56
                entry: MyText
                fields_option_ids: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormsSubmissionsAnswerAttributes'
              example:
                id: 105
                public_id: CuQXAd
                submission_id: 98
                field_id: 226
                fields_option_id: 669
                entry: MyText
                fields_option_ids: []
                created_at: '2025-01-01T00:00:00.000Z'
                updated_at: '2025-01-01T00:00:00.000Z'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: 'Bad request: HTTP body must be valid JSON'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: API key missing or invalid
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: 'Not found: Record missing'
    delete:
      tags:
      - Forms::Submissions::Answer
      summary: Remove Answer
      description: Delete a answer for a submission
      operationId: removeFormsSubmissionsAnswers
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '204':
          description: No Content
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: API key missing or invalid
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: 'Not found: Record missing'
components:
  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: string
    sort_property:
      name: sort_property
      in: query
      description: 'Sort property of a list response. The default is id and thus the created_at order.

        If you sort by other properties, we additionally sort by id implicitly as a secondary sort property, so that you can rely on the sort order to be deterministic even if the main sort property ends up with the same values.

        '
      required: false
      schema:
        type: string
        enum:
        - id
        - updated_at
    sort_order:
      name: sort_order
      in: query
      description: Sort order of a list response. Use 'desc' to reverse the default 'asc' (ascending) sort order. Examples [in our guides](https://developers.myclickfunnels.com/docs/pagination).
      required: false
      schema:
        type: string
        enum:
        - asc
        - desc
    after:
      name: after
      in: query
      required: false
      schema:
        type: string
      description: ID of item after which the collection should be returned. More examples and info about pagination [in our guides](https://developers.myclickfunnels.com/docs/pagination).
  schemas:
    FormsSubmissionsAnswerAttributes:
      type: object
      title: Answers
      description: Answers
      properties:
        id:
          type: integer
          description: Answer ID
        public_id:
          type:
          - string
          - 'null'
          description: Answer public ID
        submission_id:
          type: integer
          description: Submission ID
        field_id:
          type: integer
          description: Field
        fields_option_id:
          type:
          - integer
          - 'null'
          description: ID of a record from the Forms::Fields::Option API.
        entry:
          type:
          - string
          - 'null'
          description: Entry
        fields_option_ids:
          type:
          - array
          - 'null'
          description: Fields Options
        created_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Added
        updated_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Updated
      example:
        id: 9
        public_id: PKjxCi
        submission_id: 8
        field_id: 20
        fields_option_id: 56
        entry: MyText
        fields_option_ids: []
        created_at: '2025-01-01T00:00:00.000Z'
        updated_at: '2025-01-01T00:00:00.000Z'
      required:
      - created_at
      - entry
      - field_id
      - fields_option_id
      - fields_option_ids
      - id
      - public_id
      - submission_id
      - updated_at
    FormsSubmissionsAnswerParametersUpdate:
      type: object
      title: Answers
      description: Answers
      required: []
      properties:
        field_id:
          type: string
          description: Field
        fields_option_id:
          type:
          - integer
          - 'null'
          description: ID of a record from the Forms::Fields::Option API.
        entry:
          type:
          - string
          - 'null'
          description: Entry
        fields_option_ids:
          type:
          - array
          - 'null'
          description: Fields Options
      example:
        forms_submissions_answer:
          field_id: 123
          fields_option_id: 56
          entry: MyText
          fields_option_ids: []
    FormsSubmissionsAnswerParameters:
      type: object
      title: Answers
      description: Answers
      required:
      - field_id
      properties:
        field_id:
          type: integer
          description: Field
        fields_option_id:
          type:
          - integer
          - 'null'
          description: ID of a record from the Forms::Fields::Option API.
        entry:
          type:
          - string
          - 'null'
          description: Entry
        fields_option_ids:
          type:
          - array
          - 'null'
          description: Fields Options
      example:
        forms_submissions_answer:
          field_id: 20
          fields_option_id: 56
          entry: MyText
          fields_option_ids: []
  headers:
    Link:
      description: A direct link to the next page for the cursor-based pagination. It includes the `after` and the Pagination-Next ID value.
      schema:
        type: string
    PaginationNext:
      description: ID of the last item in the current response after which more records exist. You can use it in an `after` query parameter for cursor-based pagination to get to the next page.
      schema:
        type: string
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
externalDocs:
  description: More in-depth guides and further resources
  url: https://developers.myclickfunnels.com
