    post:
      tags:
      - Shipping::Zone
      summary: Create Zone
      description: Add a new zone to a location group
      operationId: createShippingZones
      parameters:
      - name: location_group_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        description: Information about a new Zone
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                shipping_zone:
