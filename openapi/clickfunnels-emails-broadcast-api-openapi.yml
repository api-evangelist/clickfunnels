openapi: 3.2.0
info:
  title: ClickFunnels Emails::Broadcast API
  termsOfService: https://www.clickfunnels.com/terms-of-service
  contact:
    name: ClickFunnels API Team
    url: https://developers.myclickfunnels.com
  x-logo:
    url: https://statics.myclickfunnels.com/image/1126065/file/31edf05760fafe41a82f16a668ab251f.png
  description: 'The ClickFunnels REST API that powers webhooks, native integrations, and Zapier lets you manage your ClickFunnels data, automate your workflows, and recreate ClickFunnels functionality in your own apps.


    ### For AI agents


    This document is the catalogue: every operation ClickFunnels exposes over REST is described here, with a unique operationId, typed schemas, and the scopes it needs. It is served from `/openapi.json`, `/openapi.yaml`, `/api/openapi.{json,yaml}`, and `/api/v2/openapi.{json,yaml}` on the accounts host.


    Three things it does not describe, each one request away:


    - MCP server: the app-native Model Context Protocol server (Streamable HTTP, OAuth 2.1 with PKCE). Prefer it over raw REST when your client supports MCP - it describes itself at runtime.

    - Skill guides, also as an Agent Skills index: one task guide per job (pages, blogs, products, orders, workflows, emails, courses, stats, external SDK pages). Read the guide that matches your job before your first write. llms.txt covers when to use ClickFunnels at all, how to get credentials, and how to behave around rate limits.

    - Protected resource metadata (RFC 9728) and authorization server metadata (RFC 8414): the scope vocabulary and the OAuth endpoints. Dynamic client registration is for MCP clients only.


    On ClickFunnels-owned API hosts (`myclickfunnels.com` and its subdomains), the OpenAPI specification responses and API authentication failures (401, or 403 for insufficient scope) carry those links in an RFC 8288 `Link` header, so clients can discover the documentation and authentication metadata from those responses. Requests sent through a customer''s custom domain keep the Bearer challenge but omit those discovery pointers.'
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  version: 2.0.0
servers:
- url: https://{subdomain}.myclickfunnels.com/api/v2
  description: ClickFunnels API
  variables:
    subdomain:
      default: myworkspace
security:
- BearerAuth: []
- OAuth2: []
tags:
- name: Emails::Broadcast
  description: '> Email Broadcasts


    Email Broadcasts allow you to send one-time email campaigns to your contacts. Broadcasts are created in draft status and can be sent immediately or scheduled for later delivery.


    To target a broadcast''s audience, set `filter_id` to a contact filter. You can pass the numeric id or the public id of a saved contact filter (a RefineFilter created via the Refine Filters Skill), or a serialized contact filter. The supplied filter is copied onto the broadcast, so editing or deleting the saved filter afterward never changes an existing broadcast''s audience. See Applying filters to email broadcasts for the full flow.


    See Broadcasts in the Emails Skill.'
paths:
  /workspaces/{workspace_id}/emails/broadcasts:
    get:
      tags:
      - Emails::Broadcast
      summary: List Email Broadcasts
      description: List all email broadcasts for a workspace. Filterable by id and status.
      operationId: listEmailsBroadcasts
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/after'
      - $ref: '#/components/parameters/per_page'
      - $ref: '#/components/parameters/sort_order'
      - $ref: '#/components/parameters/sort_property'
      - name: filter
        in: query
        description: 'Filter by available properties in query params, like this: `api/v2/resources?filter[id]=value&filter[another_property]=value1,value2`. Check our Filtering guide for examples and all about filtering [here](https://developers.myclickfunnels.com/docs/filtering).

          '
        required: false
        schema:
          type: object
          properties:
            id:
              type: string
              description: A comma-separated list of broadcast IDs to filter by.
              example: 1,42
            status:
              type: string
              description: A comma-separated list of statuses to filter by (draft, scheduled, sending, paused, unhealthy, complete, canceled).
              example: draft,scheduled
        style: deepObject
        explode: true
      responses:
        '200':
          description: OK
          headers:
            Pagination-Next:
              $ref: '#/components/headers/PaginationNext'
            Link:
              $ref: '#/components/headers/Link'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EmailsBroadcastAttributes'
              example:
              - id: 1
                public_id: GhIjKl
                workspace_id: 42000
                name: Weekly Newsletter
                subject: This Week's Updates
                preheadline: Check out what's new
                status: draft
                origination_channel_type: null
                origination_channel_id: null
                external_id: null
                filter_id: null
                send_at: null
                send_at_local_time: null
                time_zone: Pacific Time (US & Canada)
                send_immediately: false
                smart_sending: true
                smart_sending_time: 0.5
                smart_sending_unit: hour
                sending_at: null
                complete_at: null
                from_email: marketing@example.com
                from_name: Marketing Team
                reply_to_email: null
                template:
                  id: 3001
                  public_id: TmPl01
                  name: Weekly Newsletter Template
                topic_ids:
                - 1
                - 2
                split_test: false
                split_test_percentage: null
                split_test_wait_time: null
                variants:
                - subject: This Week's Updates
                  preheadline: Check out what's new
                  send_percentage: 100.0
                  main: true
                  open_count: 0
                  winner: null
                created_at: '2025-01-01T00:00:00.000Z'
                updated_at: '2025-01-01T00:00:00.000Z'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  hint:
                    type:
                    - string
                    - 'null'
                    description: 'The next step for the caller: how to authenticate, which scope was missing, or where the route list lives. Always present, and null when this error has no next step to offer.'
              example:
                error: API key missing or invalid
                hint: 'Send the token as `Authorization: Bearer <token>`. Create one under Account > Team > Platform Applications (a workspace API key), or obtain one with OAuth 2.1; both use the same scopes. See https://developers.myclickfunnels.com/docs/authentication, or append .md to that URL for markdown.'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  hint:
                    type:
                    - string
                    - 'null'
                    description: 'The next step for the caller: how to authenticate, which scope was missing, or where the route list lives. Always present, and null when this error has no next step to offer.'
              example:
                error: 'Not found: Record missing'
                hint: null
        '422':
          $ref: '#/components/responses/InvalidPageSize'
    post:
      tags:
      - Emails::Broadcast
      summary: Create Email Broadcast
      description: 'Create a new email broadcast. Broadcasts are created in DRAFT status — creating one does not send it. The top-level subject/preheadline are split-test variant A; pass one alternate in variants and set split_test true to configure variant B. To send it, create a send action for the broadcast (POST /emails/broadcasts/{broadcast_id}/send_actions): omit send_at to send now, or pass a future send_at to schedule. (Alternatively, the legacy inline path accepts recipients with send_immediately=true, or send_at/send_at_local_time/time_zone to schedule.) A complete business mailing address is required even when creating a draft. Configure it first with PUT /workspaces/{workspace_id}/emails/settings; an incomplete address returns 422. Pick from_email and reply_to_email from addresses whose top-level `usable_as_sender` is true, not from the sending domain''s `verified` flag: `verified` covers email transport only, and sending a broadcast from an address that is not usable is rejected with 422. List addresses via GET /workspaces/{workspace_id}/emails/addresses. See Broadcasts and the Business mailing address prerequisite in the Emails Skill.'
      operationId: createEmailsBroadcast
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        description: Information about a new Email Broadcast
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                emails_broadcast:
                  type: object
                  $ref: '#/components/schemas/EmailsBroadcastParameters'
            example:
              emails_broadcast:
                name: Weekly Newsletter
                subject: This Week's Updates
                preheadline: Check out what's new
                from_email: marketing@example.com
                reply_to_email: replies@example.com
                html_body: <h1>Hello World</h1>
                text_body: Hello World
                send_immediately: false
                split_test: true
                split_test_percentage: 20
                split_test_wait_time: 4
                variants:
                - subject: Don't miss this week's updates
                  preheadline: See what's new
                smart_sending: false
                send_at: '2025-06-01'
                send_at_local_time: '18:00:00'
                time_zone: Pacific Time (US & Canada)
                topic_ids:
                - 1
                - 2
                recipients:
                - email: user@example.com
