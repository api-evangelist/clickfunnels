              - string
              - 'null'
              description: Broadcast public ID
            name:
              type:
              - string
              - 'null'
              description: Internal name for the broadcast
        currency:
          type:
          - string
          - 'null'
          description: ISO 4217 currency code for all monetary values (e.g. USD, EUR). `null` when the workspace has no currency set; `revenue` then sums every currency the broadcast's orders were paid in.
        timerange:
          type: object
          description: The send window the stats cover
          properties:
            from:
              type:
              - string
              - 'null'
              format: date-time
              description: When sending began. For a broadcast that has not started sending, 90 days before `to`; every number is then zero.
            to:
              type: string
              format: date-time
              description: End of the window, two weeks after sending completed, or now while the broadcast has not completed, capped at 90 days after sending began.
        progress:
          type: object
          description: How far delivery has got
          properties:
            total:
              type:
              - integer
              - 'null'
              description: Audience size recorded when the broadcast sent, summed over every send of the broadcast (a send in the contacts' time zones has one per zone). `null` until the first send has run.
            queued:
              type: integer
              description: Contacts in batches that have not started sending yet (scheduled, waiting for the split-test winner, paused, or halted by a deliverability health check)
            processing:
              type: integer
              description: Contacts in batches being sent right now
            sent:
              type: integer
              description: Contacts the email was sent to
            failed:
              type: integer
              description: Contacts whose delivery failed
        performance:
          type: object
          description: Engagement over the send window. Rates are rounded to whole percentages, so a share under 0.5% reads 0 next to a non-zero count; the counts are authoritative.
          properties:
            delivered:
              type: integer
              description: Contacts the email was sent to (the same number as `progress.sent`)
            bounced:
              type: integer
              description: Contacts whose address bounced
            opened:
              type: integer
              description: Total opens, counting repeat opens by the same contact
            unique_opens:
              type: integer
              description: Contacts who opened at least once
            clicked:
              type: integer
              description: Total clicks, counting repeat clicks by the same contact
            unique_clicks:
              type: integer
              description: Contacts who clicked at least once
            unsubscribed:
              type: integer
              description: Contacts who unsubscribed from this email
            spam_complaints:
              type: integer
              description: Contacts who reported this email as spam
            open_rate:
              type: integer
              description: Unique opens as a whole percentage (0-100) of the audience
            click_rate:
              type: integer
              description: Unique clicks as a whole percentage (0-100) of the audience
            click_to_open_rate:
              type: integer
              description: Unique clicks as a whole percentage (0-100) of unique opens
            bounce_rate:
              type: integer
              description: Bounces as a whole percentage (0-100) of the audience
            unsubscribe_rate:
              type: integer
              description: Unsubscribes as a whole percentage (0-100) of the audience
        revenue:
          type: object
          description: Orders attributed to the broadcast, meaning the buyer reached the order through one of its links, summed across every send of the broadcast. Only live-mode transactions in the workspace currency are counted; a workspace with no currency set (`currency` is `null`) has every currency summed.
          properties:
            total:
              type: string
              description: Revenue attributed to the broadcast (paid minus refunded), as a decimal string in `currency`
            orders_count:
              type: integer
              description: Orders with at least one paid transaction attributed to the broadcast
            per_recipient:
              type: string
              description: Revenue divided by the audience, as a decimal string in `currency`
            per_unique_open:
              type: string
              description: Revenue divided by unique opens, as a decimal string in `currency`
            per_unique_click:
              type: string
              description: Revenue divided by unique clicks, as a decimal string in `currency`
      example:
        broadcast:
          id: 1
          public_id: GhIjKl
          name: Weekly Newsletter
        currency: USD
        timerange:
          from: '2026-08-01T10:00:00Z'
          to: '2026-08-15T12:00:00Z'
        progress:
          total: 1000
          queued: 0
          processing: 0
          sent: 985
          failed: 3
        performance:
          delivered: 985
          bounced: 12
          opened: 610
          unique_opens: 402
          clicked: 95
          unique_clicks: 81
          unsubscribed: 4
          spam_complaints: 1
          open_rate: 40
          click_rate: 8
          click_to_open_rate: 20
          bounce_rate: 1
          unsubscribe_rate: 0
        revenue:
          total: '1234.50'
          orders_count: 17
          per_recipient: '1.23'
          per_unique_open: '3.07'
          per_unique_click: '15.24'
  headers:
    PaginationNext:
      description: ID of the last item in the current response after which more records exist. You can use it in an `after` query parameter for cursor-based pagination to get to the next page.
      schema:
        type: string
    Link:
      description: A direct link to the next page for the cursor-based pagination. It includes the `after` and the Pagination-Next ID value.
      schema:
        type: string
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: 'A workspace API key or an OAuth access token, sent as `Authorization: Bearer <token>`.


        Both carry the same scope vocabulary as the `OAuth2` scheme below. Category-only

        scopes restrict access to the categories they name. Coarse wildcards remain additive:

        `read contacts:read` reads every category, while `write contacts:read` can write every

        category. Omit coarse scopes when restricting access to specific categories.

        Legacy tokens with only coarse scopes retain their existing unrestricted access;

        a bare `read` scope alone does not enforce read-only access.

        '
    OAuth2:
      type: oauth2
      description: 'OAuth 2.0 authorization code flow for REST integrations. Create a Platform Application

        and follow `https://developers.myclickfunnels.com/docs/oauth-20` to connect users.

        Authorization server metadata is published at

        `https://accounts.myclickfunnels.com/.well-known/oauth-authorization-server`.

        Dynamic client registration at `/oauth/register` is for MCP clients only; MCP-scoped

        tokens must use `https://agents.myclickfunnels.com/mcp`, not the REST API.


        Scopes are least-privilege by category. Ask for the two coarse wildcards (`read`,

        `write`) only when an integration genuinely needs the whole workspace; otherwise ask

        for the `<category>:read` / `<category>:write` pairs you use. `write` implies `read`

        for the same category. Protected resource metadata (RFC 9728) for this API lives at

        `https://accounts.myclickfunnels.com/.well-known/oauth-protected-resource`.

        '
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.myclickfunnels.com/oauth/authorize
          tokenUrl: https://accounts.myclickfunnels.com/oauth/token
          refreshUrl: https://accounts.myclickfunnels.com/oauth/token
          scopes:
            read: Read any resource in the granted workspaces
            write: Read and write any resource in the granted workspaces
            contacts:read: Read Contacts
            contacts:write: Read and write Contacts
            workflows:read: Read Workflows (Automations)
            workflows:write: Read and write Workflows (Automations)
            funnels:read: Read Funnels
            funnels:write: Read and write Funnels
            sites:read: Read Sites & Design
            sites:write: Read and write Sites & Design
            courses:read: Read Courses
            courses:write: Read and write Courses
            emails:read: Read Emails
            emails:write: Read and write Emails
            blog:read: Read Blog
            blog:write: Read and write Blog
            community:read: Read Community
            community:write: Read and write Community
            appointments:read: Read Appointments
            appointments:write: Read and write Appointments
            opportunities:read: Read Opportunities
            opportunities:write: Read and write Opportunities
            store:read: Read Store
            store:write: Read and write Store
            forms:read: Read Forms
            forms:write: Read and write Forms
            media:read: Read Media
            media:write: Read and write Media
            webhooks:read: Read Webhooks
            webhooks:write: Read and write Webhooks
            account:read: Read Account
            account:write: Read and write Account
            reference:read: Read Reference Data
            reference:write: Read and write Reference Data
externalDocs:
  description: More in-depth guides and further resources
  url: https://developers.myclickfunnels.com
