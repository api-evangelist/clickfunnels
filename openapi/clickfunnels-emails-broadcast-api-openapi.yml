        external_id:
          type:
          - string
          - 'null'
          description: An optional external identifier for tracking purposes
        filter_id:
          type:
          - integer
          - 'null'
          description: 'The contact filter determining which contacts receive this broadcast. Numeric `Refine::StoredFilter` id (not the public id) — the broadcast''s own unnamed copy of the filter, created automatically from the `filter_id` (or `recipients`) supplied on create/update. `null` until an audience is set. See [Applying filters to email broadcasts](https://accounts.myclickfunnels.com/.well-known/refine-filters/skill.md#applying-filters-to-email-broadcasts).

            '
        send_at:
          type:
          - string
          - 'null'
          description: Scheduled send date
        send_at_local_time:
          type:
          - string
          - 'null'
          description: Scheduled send time in HH:MM:SS format, relative to the specified time zone
        time_zone:
          type:
          - string
          - 'null'
          description: Time zone for scheduled sending
        send_immediately:
          type: boolean
          description: Whether the broadcast sends immediately upon creation
        smart_sending:
          type: boolean
          description: 'Whether Smart Sending is on. When on, the broadcast is delivered gradually across a window instead of all at once, which protects deliverability. Defaults to `true`, so a broadcast batches unless you explicitly send `smart_sending: false`. Above 5,000 recipients Smart Sending is mandatory: the API may coerce `false` to `true`, and the send batches at that size regardless of the stored value.'
        smart_sending_time:
          type:
          - number
          - 'null'
          description: How many `smart_sending_unit`s the delivery window spans. `null` means no override is stored and the window is sized from the audience instead.
        smart_sending_unit:
          type:
          - string
          - 'null'
          enum:
          - hour
          - day
          - null
          description: The unit of the Smart Sending delivery window. `null` means no override is stored and the window is sized from the audience instead.
        sending_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp when sending actually began
        complete_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp when sending completed
        from_email:
          type:
          - string
          - 'null'
          description: The sender email address
        from_name:
          type:
          - string
          - 'null'
          description: The sender display name associated with the from address
        reply_to_email:
          type:
          - string
          - 'null'
          description: The reply-to email address
        template:
          type:
          - object
          - 'null'
          description: 'A lean reference to the email template this broadcast uses (a broadcast points at a template; it does not copy it, unlike a workflow send-email step). Null when no template is attached. The template''s rendered body is not inlined here — fetch it from the templates endpoint via this public_id: GET /api/v2/emails/templates/{public_id}?expand[]=html_body.'
          properties:
            id:
              type: integer
              description: Template ID
            public_id:
              type: string
              description: Template public ID
            name:
              type:
              - string
              - 'null'
              description: Template name
        topic_ids:
          type: array
          items:
            type: integer
          description: IDs of topics associated with this broadcast
        split_test:
          type: boolean
          description: Whether this broadcast is a subject-line split test. When true, a `split_test_percentage` share of the audience is split evenly across the `variants`; after `split_test_wait_time` hours the variant with the most opens wins and the rest of the audience receives it.
        split_test_percentage:
          type:
          - integer
          - 'null'
          description: Share of the audience (0-100) used for the test sends. This can remain populated while a configured test is disabled, and is `null` when no percentage has been configured.
        split_test_wait_time:
          type:
          - integer
          - 'null'
          description: Hours to wait after the test sends before the winner is picked. This can remain populated while a configured test is disabled, and is `null` when no wait time has been configured.
        variants:
          type: array
          description: The subject-line variants, oldest first. The main variant mirrors the broadcast's own subject and preheadline. A disabled test can retain an inactive alternate for later editing. A broadcast created before subject-line split tests existed and already sent has none, so the array can be empty; its subject line is then only on the broadcast's own `subject` and `preheadline`.
          items:
            type: object
            properties:
              subject:
                type:
                - string
                - 'null'
                description: Subject line sent to this variant's share of the audience
              preheadline:
                type:
                - string
                - 'null'
                description: Preview text sent to this variant's share of the audience
              send_percentage:
                type:
                - number
                - 'null'
                description: Share of the audience (0-100) this variant is sent to during the test. Only meaningful when `split_test` is true. Until a `split_test_percentage` is set, the whole audience is split evenly across the variants, as the dashboard reports it.
              main:
                type: boolean
                description: Whether this is the main variant, the one that mirrors the broadcast's subject and preheadline. It wins ties.
              open_count:
                type: integer
                description: Opens counted for this variant while the test was running. Frozen when the winner is picked, so it is not the broadcast's overall open count.
              winner:
                type:
                - boolean
