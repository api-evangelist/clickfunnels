        split_test:
          type: boolean
          description: Enable a subject-line split test. Requires exactly one alternate in `variants`. When enabled without stored settings, percentage defaults to 100 and wait time defaults to 0 hours. Must be a JSON boolean - string spellings such as `"true"` return 422.
        split_test_percentage:
          type: integer
