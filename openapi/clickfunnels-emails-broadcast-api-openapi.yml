  /emails/broadcasts/{broadcast_id}/stats:
    get:
      tags:
      - Emails::Broadcast
      summary: Fetch Email Broadcast Stats
      description: 'Delivery progress, engagement and revenue for one email broadcast, the same numbers as

        the broadcast''s page in the ClickFunnels dashboard.


        The numbers cover the broadcast''s send window, returned as `timerange`: from when

        sending began until two weeks after it completed, or until now while it has not

        completed, capped at 90 days after sending began. A broadcast that has not started

        sending reports the last 90 days, with every number zero. There are no timerange parameters;

        the `timerange_start` and `timerange_end` parameters of the funnel and page stats

        endpoints are refused with a 422 rather than silently ignored.


        Counts are unique contacts, except `opened` and `clicked`, which count every event.

        Rates are whole percentages (0-100) of the audience (`progress.total`), rounded to the

        nearest integer, so a share under 0.5% reads 0 next to a non-zero count; the counts are

        authoritative. `click_to_open_rate` is unique clicks over unique opens. Revenue is

        attributed to the broadcast when the buyer reached the order through one of its links,

        summed across every send of the broadcast. Only live-mode transactions in the workspace

        currency are counted (a workspace with no currency set has nothing to filter on, so

        `currency` is `null` and every currency is summed); test-mode orders are excluded.


        `progress.total` is the audience size recorded when the broadcast sent, summed over every

        send of the broadcast, and is `null` before the first send has run. Stats are cached for a

        few minutes while a broadcast is sending and longer once it has completed.


        The split-test variants and the winner are on the broadcast record itself

        (`GET /api/v2/emails/broadcasts/{id}`), not here.'
      operationId: getEmailsBroadcastStats
      parameters:
      - name: broadcast_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailsBroadcastStatsAttributes'
              example:
                broadcast:
                  id: 1
                  public_id: GhIjKl
                  name: Weekly Newsletter
                currency: USD
                timerange:
                  from: '2026-08-01T10:00:00Z'
                  to: '2026-08-15T12:00:00Z'
