        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  hint:
                    type:
                    - string
                    - 'null'
                    description: 'The next step for the caller: how to authenticate, which scope was missing, or where the route list lives. Always present, and null when this error has no next step to offer.'
              example:
                error: API key missing or invalid
                hint: 'Send the token as `Authorization: Bearer <token>`. Create one under Account > Team > Platform Applications (a workspace API key), or obtain one with OAuth 2.1; both use the same scopes. See https://developers.myclickfunnels.com/docs/authentication, or append .md to that URL for markdown.'
        '403':
          description: Forbidden — the token's scopes don't grant read access to emails. Not retryable.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  hint:
                    type:
                    - string
                    - 'null'
                    description: 'The next step for the caller: how to authenticate, which scope was missing, or where the route list lives. Always present, and null when this error has no next step to offer.'
              example:
                error: 'Forbidden: This access token''s scopes do not grant read access to Emails. Granted scopes: contacts:read.'
                hint: 'Scopes are granted per category as <category>:read or <category>:write; the `scope` parameter of WWW-Authenticate names the one this request needed. Grantable scopes: https://accounts.myclickfunnels.com/.well-known/oauth-protected-resource'
        '404':
          description: Not Found — broadcast not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  hint:
                    type:
                    - string
                    - 'null'
                    description: 'The next step for the caller: how to authenticate, which scope was missing, or where the route list lives. Always present, and null when this error has no next step to offer.'
              example:
                error: 'Not found: Record missing'
                hint: null
        '422':
          description: 'Unprocessable Entity — a `timerange_start` or `timerange_end` parameter was given. Broadcast

            stats always cover the broadcast''s own send window (returned as `timerange`), so the parameter

            is refused rather than silently ignored. Remove it and read `timerange` from the response.

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  hint:
                    type:
                    - string
                    - 'null'
                    description: 'The next step for the caller: how to authenticate, which scope was missing, or where the route list lives. Always present, and null when this error has no next step to offer.'
              example:
                error: 'Request unprocessable: timerange_start not supported: broadcast stats always cover the broadcast''s own send window, which the response returns as timerange.'
                hint: null
        '503':
          description: 'Service Unavailable — a stats query exceeded the database timeout, or a dependency was

            briefly unavailable. Retryable; the numbers are cached once a query completes, so a retry

            shortly after is usually cheap.

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  hint:
                    type:
                    - string
                    - 'null'
                    description: 'The next step for the caller: how to authenticate, which scope was missing, or where the route list lives. Always present, and null when this error has no next step to offer.'
              example:
                error: 'Service unavailable: Transient service issue: Please try again shortly.'
                hint: null
components:
  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: string
    per_page:
      name: per_page
      in: query
      required: false
      description: Records per page. Defaults to 20; raise it up to 100 for bulk reads. A larger value returns 100 records. Zero, a negative or a non-integer value is a 422. The `Link` next-page URL keeps the value, so a client following it keeps the page size. More [in our guides](https://developers.myclickfunnels.com/docs/pagination).
      schema:
        type: integer
        minimum: 1
        default: 20
    sort_property:
      name: sort_property
      in: query
      description: 'Sort property of a list response. The default is id and thus the created_at order.

        If you sort by other properties, we additionally sort by id implicitly as a secondary sort property, so that you can rely on the sort order to be deterministic even if the main sort property ends up with the same values.

        '
      required: false
      schema:
        type: string
        enum:
        - id
        - updated_at
    sort_order:
      name: sort_order
      in: query
      description: Sort order of a list response. Use 'desc' to reverse the default 'asc' (ascending) sort order. Examples [in our guides](https://developers.myclickfunnels.com/docs/pagination).
      required: false
      schema:
        type: string
        enum:
        - asc
        - desc
    after:
      name: after
      in: query
      required: false
      schema:
        type: string
      description: ID of item after which the collection should be returned. More examples and info about pagination [in our guides](https://developers.myclickfunnels.com/docs/pagination).
  responses:
    InvalidPageSize:
      description: Unprocessable Entity - `per_page` must be a positive integer.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
              hint:
                type:
                - string
                - 'null'
                description: Next step for the caller, or null when no additional guidance applies.
          example:
            error: 'Request unprocessable: per_page must be a positive integer, capped at 100 (got "0")'
            hint: null
  schemas:
    EmailsBroadcastParametersUpdate:
      type: object
      title: Email Broadcasts
      description: Email Broadcasts. Only draft broadcasts can be updated.
      required: []
      properties:
        name:
          type: string
          description: Internal name for the broadcast
        subject:
          type: string
          description: Email subject line seen by recipients
        preheadline:
          type:
          - string
          - 'null'
          description: Preview text shown in email clients before opening. Maximum 150 characters.
        from_email:
          type: string
          description: Sender email address. Must be a verified email address that belongs to the workspace.
        reply_to_email:
          type:
          - string
          - 'null'
          description: Reply-to email address. Must be a verified address in the workspace if provided.
        html_body:
          type:
          - string
          - 'null'
          description: HTML email body
        text_body:
          type:
          - string
          - 'null'
          description: Plain text email body
        template_id:
          type:
          - integer
          - 'null'
          description: Numeric id of an existing email template in this workspace to point this draft broadcast at (swaps the referenced template). Takes precedence over an inline html_body/text_body. Only draft broadcasts can be updated; an unknown id returns 422.
        filter_id:
          type:
          - string
          - integer
          - 'null'
          description: 'Contact filter for the broadcast audience. Accepts any of three forms: the numeric `id` or the public id (string) of a saved contact filter (`Refine::StoredFilter`) in this workspace, or a serialized contact filter. The supplied filter is copied onto the broadcast — the broadcast points at its own copy, so later edits to (or deletion of) the saved filter never change this broadcast''s audience. Saved contact filters can be created/listed via the [Refine Filters Skill](https://accounts.myclickfunnels.com/.well-known/refine-filters/skill.md). See [Applying filters to email broadcasts](https://accounts.myclickfunnels.com/.well-known/refine-filters/skill.md#applying-filters-to-email-broadcasts).

            '
        split_test:
          type: boolean
          description: Enable or disable the subject-line split test. Disabling preserves variant B and the stored test settings for later editing. Must be a JSON boolean - string spellings such as `"true"` return 422.
        split_test_percentage:
          type: integer
          minimum: 1
          maximum: 100
          description: Whole-number share of the audience used for the test sends. Omit to preserve the stored value.
        split_test_wait_time:
          type: integer
          minimum: 0
          description: Whole hours to wait before choosing the subject-line winner. Omit to preserve the stored value.
        variants:
          type: array
          maxItems: 1
          description: Omit to preserve variant B, send one entry to replace B, or send an empty array to remove B while split_test is false. The top-level subject and preheadline remain variant A.
          items:
            type: object
            additionalProperties: false
            required:
            - subject
            properties:
              subject:
                type: string
                minLength: 1
                maxLength: 150
                description: Replacement subject line for variant B.
              preheadline:
                type:
                - string
                - 'null'
                maxLength: 150
                description: Replacement preview text for variant B. Omit or send null to clear it.
        smart_sending:
          type: boolean
          description: 'Smart Sending. When true the broadcast is delivered gradually across a window rather than all at once, which protects deliverability. A broadcast is created with this on, so send `false` to deliver the whole audience in one go. Above 5,000 recipients Smart Sending is mandatory: sending `false` is accepted and may be stored as `true`. The send batches at that size regardless of the stored value.'
        smart_sending_time:
          type:
          - number
          - 'null'
          description: How many `smart_sending_unit`s the delivery window spans, for example `2` with `hour`. Must be between 0.5 and 100, and must be sent together with `smart_sending_unit`. Send both as `null` to go back to sizing the window from the audience.
        smart_sending_unit:
          type:
          - string
          - 'null'
          enum:
          - hour
          - day
          - null
          description: The unit of the Smart Sending delivery window. Must be sent together with `smart_sending_time`. Send both as `null` to go back to sizing the window from the audience.
        send_at:
          type:
          - string
          - 'null'
          description: Scheduled send date
        send_at_local_time:
          type:
          - string
          - 'null'
          description: Scheduled send time in HH:MM:SS format
        time_zone:
          type:
          - string
          - 'null'
          description: Time zone for scheduling
        external_id:
          type:
          - string
          - 'null'
          description: An optional external identifier for your own tracking
        topic_ids:
          type: array
          items:
            type: integer
          description: Topic IDs to associate
      example:
        name: Updated Newsletter
        subject: Updated Subject
        split_test: true
        split_test_percentage: 20
        split_test_wait_time: 4
        variants:
        - subject: Alternate subject
          preheadline: Alternate preview
    EmailsBroadcastAttributes:
      type: object
      title: Email Broadcasts
      description: Email Broadcasts
      properties:
        id:
          type: integer
          description: Broadcast ID
