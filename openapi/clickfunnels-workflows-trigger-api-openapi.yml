components:
  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: string
    per_page:
      name: per_page
      in: query
      required: false
      description: Records per page. Defaults to 20; raise it up to 100 for bulk reads. A larger value returns 100 records. Zero, a negative or a non-integer value is a 422. The `Link` next-page URL keeps the value, so a client following it keeps the page size. More [in our guides](https://developers.myclickfunnels.com/docs/pagination).
      schema:
        type: integer
        minimum: 1
        default: 20
    sort_property:
      name: sort_property
      in: query
      description: 'Sort property of a list response. The default is id and thus the created_at order.

        If you sort by other properties, we additionally sort by id implicitly as a secondary sort property, so that you can rely on the sort order to be deterministic even if the main sort property ends up with the same values.

        '
      required: false
      schema:
        type: string
        enum:
        - id
        - updated_at
    sort_order:
      name: sort_order
      in: query
      description: Sort order of a list response. Use 'desc' to reverse the default 'asc' (ascending) sort order. Examples [in our guides](https://developers.myclickfunnels.com/docs/pagination).
      required: false
      schema:
        type: string
        enum:
        - asc
        - desc
    after:
      name: after
      in: query
      required: false
      schema:
        type: string
      description: ID of item after which the collection should be returned. More examples and info about pagination [in our guides](https://developers.myclickfunnels.com/docs/pagination).
  schemas:
    WorkflowsTriggerParametersCreate:
      type: object
      title: Create Workflows::Trigger
      description: 'Parameters for creating a new trigger on a workflow. `event_type_key` is

        required; all condition FK fields accept either the integer id or obfuscated

        `public_id` string for a resource in the same workspace/team scope.


        An invalid `event_type_key` returns 422.

        '
      required:
      - workflows_trigger
      properties:
        workflows_trigger:
          type: object
          required:
          - event_type_key
          properties:
            event_type_key:
              type: string
              description: The event key that fires this trigger (e.g. `$contact.tag_applied`). Must be one of the enumerated keys.
              enum:
              - $appointments.appointment_scheduled
              - $calendar_event.contact_registered
              - $community.join
              - $community.group_join
              - $community.topic_join
              - $community.post
              - $community.ban
              - $community.unban
              - $community.post_view
              - $contact.tag_applied
              - $contact.tag_removed
              - $course.complete
              - $course.enroll
              - $course.unenroll
              - $course.lesson_complete
              - $course.lesson_view
              - $course.section_complete
              - $email.bounce
              - $email.click
              - $email.open
              - $email.sent
              - $email.spam_complaint
              - $send_email_step.bounce
              - $send_email_step.click
              - $send_email_step.open
              - $send_email_step.sent
              - $send_email_step.spam_complaint
              - $order.successful_purchase
              - $order.cancelled
              - $order.churned
              - $subscription.upgraded
              - $subscription.downgraded
              - $transaction.renewal_failed
              - $sales.contact_entered_stage
              - $sales.contact_exited_stage
              - $optin
              - $view
              - $message_hub_event.contact_conversation_started
              - $message_hub_event.agent_conversation_started
              - $message_hub_event.contact_responded
              - $message_hub_event.agent_responded
              - $survey.complete
            active:
              type: boolean
              description: Whether the trigger is active. Defaults to `true` when omitted.
            allow_anonymous_contacts:
              type: boolean
              description: Whether to fire for anonymous contacts.
            subscription_cancelation_reason:
              type: string
              description: Reason filter for `$order.cancelled` subscription cancellation triggers.
            contacts_tag_id:
              $ref: '#/components/schemas/IntegerOrPublicId'
              description: Contacts::Tag id or public_id.
            funnel_id:
              $ref: '#/components/schemas/IntegerOrPublicId'
              description: Funnel id or public_id.
            page_id:
              $ref: '#/components/schemas/IntegerOrPublicId'
              description: Page id or public_id.
            product_id:
              $ref: '#/components/schemas/IntegerOrPublicId'
              description: Product id or public_id.
            cancellation_product_id:
              $ref: '#/components/schemas/IntegerOrPublicId'
              description: Product id or public_id for cancellation condition.
            product_variant_id:
              $ref: '#/components/schemas/IntegerOrPublicId'
              description: Products::Variant id or public_id.
            cancellation_product_variant_id:
              $ref: '#/components/schemas/IntegerOrPublicId'
              description: Products::Variant id or public_id for cancellation.
            subscription_variant_to_id:
              $ref: '#/components/schemas/IntegerOrPublicId'
              description: Products::Variant id or public_id for subscription upgrade/downgrade.
            sales_pipelines_id:
