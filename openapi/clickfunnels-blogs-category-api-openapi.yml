openapi: 3.2.0
info:
  title: ClickFunnels Blogs::Category API
  termsOfService: https://www.clickfunnels.com/terms-of-service
  contact:
    name: ClickFunnels API Team
    url: https://developers.myclickfunnels.com
  x-logo:
    url: https://statics.myclickfunnels.com/image/1126065/file/31edf05760fafe41a82f16a668ab251f.png
  description: 'The ClickFunnels REST API that powers webhooks, native integrations, and Zapier lets you manage your ClickFunnels data, automate your workflows, and recreate ClickFunnels functionality in your own apps.

    '
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  version: 2.0.0
servers:
- url: https://{subdomain}.myclickfunnels.com/api/v2
  description: ClickFunnels API
  variables:
    subdomain:
      default: myworkspace
security:
- BearerAuth: []
tags:
- name: Blogs::Category
  description: Blog Categories. See [Categories (read-only)](https://accounts.myclickfunnels.com/.well-known/blogs/skill.md#categories-read-only) in the [Blogs Skill](https://accounts.myclickfunnels.com/.well-known/blogs/skill.md).
paths:
  /blogs/{blog_id}/categories:
    get:
      tags:
      - Blogs::Category
      summary: List Blog Categories
      description: List the categories within the given blog.
      operationId: listBlogsCategories
      parameters:
      - name: blog_id
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/after'
      - $ref: '#/components/parameters/sort_order'
      - $ref: '#/components/parameters/sort_property'
      responses:
        '200':
          description: OK
          headers:
            Pagination-Next:
              $ref: '#/components/headers/PaginationNext'
            Link:
              $ref: '#/components/headers/Link'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BlogsCategoryAttributes'
              example:
              - id: 1
                public_id: cAbCdE
                blog_id: 1
                name: Tutorials
                current_path: /blog/category/tutorials
                created_at: '2025-01-01T00:00:00.000Z'
                updated_at: '2025-01-01T00:00:00.000Z'
                url: https://myworkspace.myclickfunnels.com/blog/category/tutorials
              - id: 2
                public_id: cFgHiJ
                blog_id: 1
                name: Marketing
                current_path: /blog/category/marketing
                created_at: '2025-01-15T00:00:00.000Z'
                updated_at: '2025-01-15T00:00:00.000Z'
                url: https://myworkspace.myclickfunnels.com/blog/category/marketing
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: API key missing or invalid
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Not found - This usually happens when you try to access a record that does not exist in your account. It can also happen when the provided parent record is missing, e.g. you have put in a non-existent Workspaces parent ID.
              example:
                error: 'Not found: Record missing'
  /blogs/categories/{id}:
    get:
      tags:
      - Blogs::Category
      summary: Fetch Blog Category
      description: Retrieve a blog category.
      operationId: getBlogCategory
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlogsCategoryAttributes'
              example:
                id: 1
                public_id: cAbCdE
                blog_id: 1
                name: Tutorials
                current_path: /blog/category/tutorials
                created_at: '2025-01-01T00:00:00.000Z'
                updated_at: '2025-01-01T00:00:00.000Z'
                url: https://myworkspace.myclickfunnels.com/blog/category/tutorials
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: API key missing or invalid
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: 'Not found: Record missing'
components:
  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: string
    sort_property:
      name: sort_property
      in: query
      description: 'Sort property of a list response. The default is id and thus the created_at order.

        If you sort by other properties, we additionally sort by id implicitly as a secondary sort property, so that you can rely on the sort order to be deterministic even if the main sort property ends up with the same values.

        '
      required: false
      schema:
        type: string
        enum:
        - id
        - updated_at
    sort_order:
      name: sort_order
      in: query
      description: Sort order of a list response. Use 'desc' to reverse the default 'asc' (ascending) sort order. Examples [in our guides](https://developers.myclickfunnels.com/docs/pagination).
      required: false
      schema:
        type: string
        enum:
        - asc
        - desc
    after:
      name: after
      in: query
      required: false
      schema:
        type: string
      description: ID of item after which the collection should be returned. More examples and info about pagination [in our guides](https://developers.myclickfunnels.com/docs/pagination).
  headers:
    Link:
      description: A direct link to the next page for the cursor-based pagination. It includes the `after` and the Pagination-Next ID value.
      schema:
        type: string
    PaginationNext:
      description: ID of the last item in the current response after which more records exist. You can use it in an `after` query parameter for cursor-based pagination to get to the next page.
      schema:
        type: string
  schemas:
    BlogsCategoryAttributes:
      type: object
      title: Blogs::Category
      description: Blog Categories
      required:
      - blog_id
      - created_at
      - current_path
      - id
      - name
      - public_id
      - updated_at
      - url
      properties:
        id:
          type: integer
          description: Category ID
        public_id:
          type: string
          description: The public identifier of the category
        blog_id:
          type: integer
          description: Blog ID that the category belongs to
        name:
          type: string
          description: Category name
        current_path:
          type:
          - string
          - 'null'
          description: The current path of the category
        created_at:
          type: string
          format: date-time
          description: Created at
        updated_at:
          type: string
          format: date-time
          description: Updated at
        url:
          type:
          - string
          - 'null'
          description: The full public URL of the category
      example:
        id: 1
        public_id: cAbCdE
        blog_id: 1
        name: Tutorials
        current_path: /blog/category/tutorials
        created_at: '2025-01-01T00:00:00.000Z'
        updated_at: '2025-01-01T00:00:00.000Z'
        url: https://myworkspace.myclickfunnels.com/blog/category/tutorials
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
externalDocs:
  description: More in-depth guides and further resources
  url: https://developers.myclickfunnels.com
