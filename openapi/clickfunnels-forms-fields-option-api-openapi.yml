openapi: 3.2.0
info:
  title: ClickFunnels Forms::Fields::Option API
  termsOfService: https://www.clickfunnels.com/terms-of-service
  contact:
    name: ClickFunnels API Team
    url: https://developers.myclickfunnels.com
  x-logo:
    url: https://statics.myclickfunnels.com/image/1126065/file/31edf05760fafe41a82f16a668ab251f.png
  description: 'The ClickFunnels REST API that powers webhooks, native integrations, and Zapier lets you manage your ClickFunnels data, automate your workflows, and recreate ClickFunnels functionality in your own apps.

    '
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  version: 2.0.0
servers:
- url: https://{subdomain}.myclickfunnels.com/api/v2
  description: ClickFunnels API
  variables:
    subdomain:
      default: myworkspace
security:
- BearerAuth: []
tags:
- name: Forms::Fields::Option
  description: Form Field Options
paths:
  /forms/fields/{field_id}/options:
    get:
      tags:
      - Forms::Fields::Option
      summary: List Options
      description: List options for a field
      operationId: listFormsFieldsOptions
      parameters:
      - name: field_id
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/after'
      - $ref: '#/components/parameters/sort_order'
      - name: sort_property
        in: query
        description: 'Sort property of a list response. The default is id and thus the created_at order.

          If you sort by other properties, we additionally sort by id implicitly as a secondary sort property, so that you can rely on the sort order to be deterministic even if the main sort property ends up with the same values.

          '
        required: false
        schema:
          type: string
          enum:
          - id
          - updated_at
          - sort_order
      responses:
        '200':
          description: OK
          headers:
            Pagination-Next:
              $ref: '#/components/headers/PaginationNext'
            Link:
              $ref: '#/components/headers/Link'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FormsFieldsOptionAttributes'
              example:
              - id: 430
                public_id: SOxIrU
                field_id: 146
                label: Test Label
                sort_order: 0
                created_at: '2025-01-01T00:00:00.000Z'
                updated_at: '2025-01-01T00:00:00.000Z'
              - id: 433
                public_id: usZlce
                field_id: 147
                label: Test Label
                sort_order: 1
                created_at: '2025-01-01T00:00:00.000Z'
                updated_at: '2025-01-01T00:00:00.000Z'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: API key missing or invalid
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Not found - This usually happens when you try to access a record that does not exist in your account. It can also happen when the provided parent record is missing, e.g. you have put in a non-existent Workspaces parent ID.
              example:
                error: 'Not found: Record missing'
    post:
      tags:
      - Forms::Fields::Option
      summary: Create Option
      description: Add a new option to a field
      operationId: createFormsFieldsOptions
      parameters:
      - name: field_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        description: Information about a new Option
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                forms_fields_option:
                  type: object
                  $ref: '#/components/schemas/FormsFieldsOptionParameters'
            example:
              forms_fields_option:
                label: Test Label
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormsFieldsOptionAttributes'
              example:
                id: 439
                public_id: ZCDsAN
                field_id: 149
                label: Test Label
                sort_order: 0
                created_at: '2025-01-01T00:00:00.000Z'
                updated_at: '2025-01-01T00:00:00.000Z'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: 'Bad request: HTTP body must be valid JSON'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: API key missing or invalid
  /forms/fields/options/{id}:
    get:
      tags:
      - Forms::Fields::Option
      summary: Fetch Option
      description: Retrieve a option for a field
      operationId: getFormsFieldsOptions
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormsFieldsOptionAttributes'
              example:
                id: 436
                public_id: bEavXk
                field_id: 148
                label: Test Label
                sort_order: 0
                created_at: '2025-01-01T00:00:00.000Z'
                updated_at: '2025-01-01T00:00:00.000Z'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: API key missing or invalid
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: 'Not found: Record missing'
    put:
      tags:
      - Forms::Fields::Option
      summary: Update Option
      description: Update a option for a field
      operationId: updateFormsFieldsOptions
      parameters:
      - $ref: '#/components/parameters/id'
      requestBody:
        description: Information about updated fields in Option
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                forms_fields_option:
                  type: object
                  $ref: '#/components/schemas/FormsFieldsOptionParametersUpdate'
            example:
              forms_fields_option:
                label: Example Option
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormsFieldsOptionAttributes'
              example:
                id: 445
                public_id: BkwumP
                field_id: 151
                label: Test Label
                sort_order: 0
                created_at: '2025-01-01T00:00:00.000Z'
                updated_at: '2025-01-01T00:00:00.000Z'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: 'Bad request: HTTP body must be valid JSON'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: API key missing or invalid
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: 'Not found: Record missing'
    delete:
      tags:
      - Forms::Fields::Option
      summary: Remove Option
      description: Delete a option for a field
      operationId: removeFormsFieldsOptions
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '204':
          description: No Content
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: API key missing or invalid
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: 'Not found: Record missing'
components:
  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: string
    sort_order:
      name: sort_order
      in: query
      description: Sort order of a list response. Use 'desc' to reverse the default 'asc' (ascending) sort order. Examples [in our guides](https://developers.myclickfunnels.com/docs/pagination).
      required: false
      schema:
        type: string
        enum:
        - asc
        - desc
    after:
      name: after
      in: query
      required: false
      schema:
        type: string
      description: ID of item after which the collection should be returned. More examples and info about pagination [in our guides](https://developers.myclickfunnels.com/docs/pagination).
  schemas:
    FormsFieldsOptionParameters:
      type: object
      title: Options
      description: Options
      required:
      - label
      properties:
        label:
          type: string
          description: Label
      example:
        forms_fields_option:
          label: Test Label
    FormsFieldsOptionAttributes:
      type: object
      title: Options
      description: Options
      properties:
        id:
          type: integer
          description: Option ID
        public_id:
          type:
          - string
          - 'null'
          description: Option public ID
        field_id:
          type: integer
          description: Field ID
        label:
          type: string
          description: Label
        sort_order:
          type:
          - integer
          - 'null'
          description: Sort order
        created_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Added
        updated_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Updated
      example:
        id: 27
        public_id: gHOzhu
        field_id: 10
        label: Test Label
        sort_order: 0
        created_at: '2025-01-01T00:00:00.000Z'
        updated_at: '2025-01-01T00:00:00.000Z'
      required:
      - created_at
      - field_id
      - id
      - label
      - public_id
      - sort_order
      - updated_at
    FormsFieldsOptionParametersUpdate:
      type: object
      title: Options
      description: Options
      required: []
      properties:
        label:
          type: string
          description: Label
      example:
        forms_fields_option:
          label: Example Option
  headers:
    Link:
      description: A direct link to the next page for the cursor-based pagination. It includes the `after` and the Pagination-Next ID value.
      schema:
        type: string
    PaginationNext:
      description: ID of the last item in the current response after which more records exist. You can use it in an `after` query parameter for cursor-based pagination to get to the next page.
      schema:
        type: string
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
externalDocs:
  description: More in-depth guides and further resources
  url: https://developers.myclickfunnels.com
