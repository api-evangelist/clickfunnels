method: searched
source: github.com/clickfunnels, proxy.golang.org, registry.npmjs.org, rubygems.org, the ClickFunnels SDK skill
note: ClickFunnels publishes no first-party REST client library on npm, PyPI, RubyGems, Maven, NuGet or crates.io.
  What it does ship is a browser SDK loader on its own CDN, a Go command-line client, and the Refine query-builder
  UI library. Every third-party "clickfunnels" package on npm/RubyGems (n8n nodes, clickfunnels-sdk, clickfunnels-ruby-sdk,
  pipedream/activepieces components) is community-published and is deliberately excluded here.
packages:
- language: javascript
  registry: cdn
  name: ClickFunnels SDK (sdk.js)
  url: https://sdk.myclickfunnels.com/sdk.js
  install: <script src="https://sdk.myclickfunnels.com/sdk.js" defer></script>
  official: true
  version: null
  published: null
  note: Unpinned CDN distribution — the script tag carries no version and the loader injects the real bundle
    from the same host, so a consumer cannot tell which build they are running and there is no registry metadata
    endpoint to query. Documented in the SDK skills (create-external-page, add-checkout).
- language: go
  registry: go-modules
  name: github.com/clickfunnels/cli
  url: https://github.com/clickfunnels/cli
  install: GOPRIVATE=github.com/clickfunnels/* go install github.com/clickfunnels/cmd/cf@latest
  official: true
  version: v0.1.1
  published: '2026-06-11'
  note: The `cf` command-line client. Embeds a full typed Go client generated by oapi-codegen from the ClickFunnels
    OpenAPI, but it lives in internal/api so it is not importable as a library — this is a CLI, not a Go SDK.
    Version and date read from proxy.golang.org.
