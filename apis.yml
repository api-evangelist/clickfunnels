  description: >-
    > Countries are a global reference list used when setting addresses.


    The Addresses::Country API provides read-only access to the list of countries, each with its ISO 3166-1
    alpha-2 code (iso2). Use a country's iso2 as the country_code when setting an address, and as the
    {country_id} path segment when listing its regions.
