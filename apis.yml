- aid: clickfunnels:clickfunnels-image-api
  name: ClickFunnels Image API
  description: >-
    > Images can be used in a variety of use cases.


    An image can be created or updated from a URL by defining the `upload_source_url` parameter. The response
    returns

    the hosted `url` and the Image `id`.


    For a blog migration, create an Image for each source image, replace the source URL in the post body
    with the

    returned hosted `url`, and use the Image `id` as the blog post's `image_id` only when it is the featured
    image.

    Keep a source-to-hosted URL map so repeated images are uploaded once. The same Image IDs can also
    be assigned to

    Products with the `image_ids` parameter.


    > Limitations and Constraints


    Images have a file size limit of 10MB and a dimension size limit of 10,000 x 10,000 pixels. Image
    file types currently supported include:


    ```shell

    # IMAGE TYPES

    jpeg, png, webp, x-icon, vnd.microsoft.icon

    # TEXT TYPES

    svg+xml, gif

    ```


    Once uploaded, an image will return the following files and sizes


    | File Description | Width | Height                                                            |

    |--------------------------------------------------|--------------------|------------------------------------------------------------------------|

    | Thumbnail | 80 | 52 |

    | Small | 300 | 300 |

    | Medium | 600 | 600 |

    | Large | 800 | 800 |

    | X-Large | 2000 | 2000 |

    |--------------------------------------------------|--------------------|------------------------------------------------------------------------|
  humanURL: https://developers.myclickfunnels.com/reference
  baseURL: https://{subdomain}.myclickfunnels.com/api/v2
