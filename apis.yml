- aid: clickfunnels:clickfunnels-refinefilter-api
  name: ClickFunnels Refine Filter API
  description: >-
    > Reusable audience filters that scope contacts for conditional splits, email broadcasts, workflow
    branches, and other ClickFunnels surfaces.


    A RefineFilter stores a named, conjunctive set of criteria (attribute + clause + value) scoped to
    a workspace. Once created, pass its `id` as `condition.filter_id` on a Conditional Split Step, or
    as `filter_id` on any other surface that accepts one.


    See the [Refine Filters Skill](https://accounts.myclickfunnels.com/.well-known/refine-filters/skill.md)
    for a full reference of supported attributes, clauses, and the safe-condition policy.


    The public API restricts filter conditions to a [safe whitelist](https://accounts.myclickfunnels.com/.well-known/refine-filters/skill.md#safe-condition-whitelist);
    requests outside it return 422 with a pointer to the dev community.


    For applying a filter to a Conditional Split Step, see [Applying filters to conditional split steps](https://accounts.myclickfunnels.com/.well-known/refine-filters/skill.md#applying-filters-to-conditional-split-steps).
    For email broadcasts, see [Applying filters to email broadcasts](https://accounts.myclickfunnels.com/.well-known/refine-filters/skill.md#applying-filters-to-email-broadcasts).
