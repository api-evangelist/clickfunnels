- aid: clickfunnels:clickfunnels-communities-ban-api
  name: ClickFunnels Communities::Ban API
  description: >-
    > Bans prevent a Contact from accessing a Community.


    A Ban records which Contact is banned, who issued the ban, the scope of the ban (`bannable_type`/`bannable_id`),
    and an optional reason. The `banned_by` moderator is set automatically to the acting user — it cannot
    be set in the request body. Bans have no update operation — delete and recreate to change the reason.


    See also: `Communities::Bans::UnbanAction` and `Communities::Bans::ExportAction` for async bulk operations
    on bans.
  humanURL: https://developers.myclickfunnels.com/reference
  baseURL: https://{subdomain}.myclickfunnels.com/api/v2
