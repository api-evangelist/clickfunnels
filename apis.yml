- aid: clickfunnels:clickfunnels-sales-opportunity-api
  name: ClickFunnels Sales::Opportunity API
  description: >-
    >  Sales Opportunities


    Sales Opportunities are initially created in a specific stage of a Pipeline and can be moved between
    different stages within that Pipeline.


    Each Sales Opportunity requires a name and a reference to a Primary Contact. If the Opportunity is
    associated with a new Contact, you must first create the Contact using the Contacts API.


    The `value` field, which is optional, represents the potential value of the Opportunity in the default
    currency of the Workspace.


    You can assign an Opportunity to a Team Member using the `assignee_id` field. To reassign the Opportunity
    to a different team member, simply update this value. To remove the assignee, set the `assignee_id`
    to `null`. The `assignee_id` corresponds to the `membership.id` in the relevant Team, which can be
    retrieved using the Teams API.


    When an Opportunity is moved to a stage with a `close_probability` value of 0 or 100, the `closed_at`
    timestamp is automatically set. If the Opportunity is later moved to a different stage, the `closed_at`
    timestamp remains unchanged. You can also manually set the `closed_at` timestamp using the API.
  humanURL: https://developers.myclickfunnels.com/reference
  baseURL: https://{subdomain}.myclickfunnels.com/api/v2
  tags:
  - Sales::Opportunity
