aid: clickfunnels
name: ClickFunnels
description: >-
  ClickFunnels is a sales funnel and online business platform that lets
  entrepreneurs build landing pages, sales funnels, checkout flows, courses,
  membership sites, and email marketing campaigns without code. The ClickFunnels
  2.0 REST API gives developers programmatic access to workspaces, funnels,
  pages, products, contacts, orders, and subscriptions, authenticated with
  Bearer tokens or OAuth 2.0.
