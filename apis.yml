  name: ClickFunnels Emails::Broadcasts::Send Action API
  description: >-
    > Send Actions trigger the actual delivery of an email broadcast.


    A Send Action is the trigger that sends (or schedules) the parent broadcast — the same action the
    ClickFunnels dashboard fires when you click "Send". Creating a Send Action will immediately dispatch
    the broadcast (or schedule it for a future date/time if `send_at` is provided).


    Before a Send Action can be created, the broadcast must be ready to send: it requires a topic, a from-address
    whose `usable_as_sender` is `true`, and a complete workspace marketing address. If any of these are
    missing, the create returns 422 listing what is needed.


    The send itself runs asynchronously. Poll the returned Send Action record and compare `performed_count`
    to `target_count` to track progress. `started_at` and `completed_at` reflect async job progress.


    See [Sending or scheduling a broadcast](https://accounts.myclickfunnels.com/.well-known/emails/skill.md#sending-or-scheduling-a-broadcast)
