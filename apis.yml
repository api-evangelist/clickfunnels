- aid: clickfunnels:clickfunnels-products-variant-api
  name: ClickFunnels Products::Variant API
  description: >-
    > Product variants


    If there are multiple variants of a product (like when a T-shirt can come in many sizes or colors),

    then these should be created as `Products::Variant` records related to the `Product` record.


    When creating a variant it is mandatory to set the `properties_values` so that all the Product's `variant_properties`
    have a value.


    All products have a "default variant". Attributes like the below, if left as `null` on a variant (that
    is not the default)

    will inherit the value from the default variant:


    - `product_type`

    - `sku`

    - `taxable`

    - `tax_category_id`

    - `description`

    - `weight`

    - `weight_unit`

    - `height`

    - `width`

    - `length`

    - `image_id`
