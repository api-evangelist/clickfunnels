- aid: clickfunnels:clickfunnels-workflow-api
  name: ClickFunnels Workflow API
  description: >-
    Standalone automation workflows that enroll contacts and execute a sequence of action steps (send
    email, apply tag, delay, split, etc.). A workflow is either `draft` (no active triggers), `live` (enabled
    with at least one active trigger), or `archived`.


    Related sub-resources: Workflows::Trigger, Workflows::Step, Workflows::Run.


    See the [Workflows Skill](https://accounts.myclickfunnels.com/.well-known/workflows/skill.md) for
    the end-to-end guide — lifecycle, [creating a workflow](https://accounts.myclickfunnels.com/.well-known/workflows/skill.md#creating-a-workflow),
    [triggers](https://accounts.myclickfunnels.com/.well-known/workflows/skill.md#triggers), [steps](https://accounts.myclickfunnels.com/.well-known/workflows/skill.md#steps),
    [branching](https://accounts.myclickfunnels.com/.well-known/workflows/skill.md#branching), [enabling/disabling](https://accounts.myclickfunnels.com/.well-known/workflows/skill.md#enabling-disabling),
    and [manual enrollment](https://accounts.myclickfunnels.com/.well-known/workflows/skill.md#runs---manual-enrollment).
