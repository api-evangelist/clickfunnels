- aid: clickfunnels:clickfunnels-emails-domain-api
  name: ClickFunnels Emails::Domain API
  description: >-
    > Email Domains represent the sending domains (DKIM/SPF/DMARC) available to a workspace for outbound
    email.


    One domain name has two independent jobs, and sending needs both. This resource covers email transport:
    `verified` means the name is authenticated for sending (DKIM + SPF + DMARC, or a verified SMTP setting).
    The other job is proving the workspace owns the name, reported here as `ownership_verified`; that
    happens by connecting the domain to the workspace as a website/hosting domain inside the ClickFunnels
    app (a website domain is connected as a subdomain such as `www.example.com`, which confirms ownership
    of the root sending domain `example.com`), and no call in this API can make it true. Neither substitutes
    for the other: `ready_for_sending` becomes true only when both are true, and a `200` from verify means
    the check ran, not that it passed, so always read the booleans back.


    Provision the root domain (`example.com`), not a subdomain: ownership is confirmed at the root domain,
    so a subdomain is rejected with `422` naming the root domain to use instead.


    Typical workflow: provision the sending domain (`POST /workspaces/{workspace_id}/emails/domains`),
    have the customer publish the returned DNS records and connect the same name to the workspace in ClickFunnels,
    then re-check with `POST /emails/domains/{id}/verify` until `ready_for_sending` is true, following
    `next_steps` for whatever is still missing. Then create sender addresses via `POST /workspaces/{workspace_id}/emails/addresses`
    with `emails_domain_id` set to this domain's numeric id.


    See [Sending domains](https://accounts.myclickfunnels.com/.well-known/emails/skill.md#sending-domains)
    in the [Emails Skill](https://accounts.myclickfunnels.com/.well-known/emails/skill.md).
