- aid: clickfunnels:clickfunnels-communities-membership-api
  name: ClickFunnels Communities::Membership API
  description: >-
    > Memberships represent a Contact's membership in a Community.


    A Membership joins a Contact to a Community and tracks whether that member has moderator privileges.
    Creating or updating a membership also syncs the member's Space memberships to exactly the list of
    `space_ids` supplied. Deleting a membership removes the contact from all Spaces in the community as
    well.


    See also: `Communities::Memberships::BanAction`, `Communities::Memberships::AddToGroupAction`, `Communities::Memberships::RemoveFromGroupAction`,
    and `Communities::Memberships::ExportAction` for async bulk operations on memberships.
  humanURL: https://developers.myclickfunnels.com/reference
  baseURL: https://{subdomain}.myclickfunnels.com/api/v2
