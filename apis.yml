- aid: clickfunnels:clickfunnels-contacts-tagaction-api
  name: ClickFunnels Contacts::Tag Action API
  description: >-
    > Bulk apply or remove tags across a filtered set of contacts


    A Tag Action applies (or removes) one or more Contact Tags across an entire audience in a single async
    operation. Instead of looping over contacts one by one, submit a Tag Action with a target selection
    and let ClickFunnels process it in the background.


    **Target selection** — supply exactly one of:

    - `stable_id` — a URL-encoded Refine `stable_id` token (e.g. from `POST /api/v2/workspaces/{workspace_id}/contacts/filters`).
    Pass the token exactly as returned; do not decode or re-encode it. The server persists the decoded
    filter so the async job can re-derive the audience at perform time.

    - `stored_filter_id` — the `id` of a saved `Refine::StoredFilter` scoped to this workspace (must be
    a ContactsFilter). Also accepted as `filter_id`.

    - `target_ids` — an explicit array of contact public IDs.

    - `target_all` — `true` to target every contact in the workspace.


    **Progress tracking** — after creating a Tag Action, poll it with `GET /api/v2/contacts/tag_actions/{id}`.
    The response reflects async progress via `target_count` (total contacts to process) and `performed_count`
    (contacts processed so far).
