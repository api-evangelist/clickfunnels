- aid: clickfunnels:clickfunnels-blogs-post-api
  name: ClickFunnels Blogs::Post API
  description: >-
    > Blog Posts are the individual articles published within a Blog


    Blog posts support rich content via PML markup, visibility controls, SEO settings, categories, tags,
    and authors. Use `expand[]=markup` to retrieve the PML markup for a post's visual content.


    See [Creating a blog post](https://accounts.myclickfunnels.com/.well-known/blogs/skill.md#creating-a-blog-post)
    in the [Blogs Skill](https://accounts.myclickfunnels.com/.well-known/blogs/skill.md); the `markup`
    body is authored in PML — see the [Page Markup Skill](https://accounts.myclickfunnels.com/.well-known/page-markup/skill.md).


    To copy posts in from an external RSS/Atom feed or article page, see the [Import External Blog Post
    Skill](https://accounts.myclickfunnels.com/.well-known/blogs/import-external-post/skill.md), which
    covers [normalizing external HTML for PML](https://accounts.myclickfunnels.com/.well-known/blogs/import-external-post/skill.md#3-normalize-external-html-for-pml),
    [duplicate checking](https://accounts.myclickfunnels.com/.well-known/blogs/import-external-post/skill.md#4-discover-the-destination-and-check-for-duplicates),
    and [verifying the draft](https://accounts.myclickfunnels.com/.well-known/blogs/import-external-post/skill.md#6-verify-the-draft)
    before publishing.
  humanURL: https://developers.myclickfunnels.com/reference
