    >  Sales Pipelines


    Pipelines allow you to organize, track and advance Opportunies between different Stages. A Pipeline
    consists of multiple Stages.


    When creating a Pipeline, you must specify one or more stages by passing them in the `stages_attributes`
    parameter. The Stages

