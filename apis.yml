aid: clickfunnels
name: ClickFunnels
description: 'ClickFunnels is a sales funnel and online business platform that lets entrepreneurs build
  landing pages, sales funnels, checkout flows, courses, membership sites, communities, blogs and email
  marketing campaigns without code. The ClickFunnels 2.0 REST API is a 418-operation OpenAPI 3.1 contract
  covering teams, workspaces, funnels, pages, blogs, products, discounts, orders, invoices, transactions,
  subscriptions, contacts, courses, communities, forms, workflows, email and analytics, authenticated
  with a team-scoped Bearer token or with workspace-scoped OAuth 2.0. It is discoverable the correct way:
  an RFC 9727 api-catalog links the spec, RFC 8414 metadata publishes the OAuth scopes, and sixteen Markdown
  Agent Skills are served from /.well-known/ for agents driving the API.'
