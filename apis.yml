- aid: clickfunnels:clickfunnels-contacts-enrollaction-api
  name: ClickFunnels Contacts::Enroll Action API
  description: >-
    > Bulk-enroll contacts into course sections


    An Enroll Action enrolls an entire audience of contacts into one or more course sections in a single
    async operation. Pass `course_ids` to enroll in every section of those courses, or `section_ids` for
    specific sections (or both).


    **Target selection** — supply exactly one of:

    - `stable_id` — a URL-encoded Refine `stable_id` token.

    - `stored_filter_id` — the `id` or `public_id` of a saved `Refine::StoredFilter` (ContactsFilter).
    Also accepted as `filter_id`.

    - `target_ids` — an explicit array of contact public IDs.

    - `target_all` — `true` to target every contact in the workspace.


    **Progress tracking** — after creating an Enroll Action, poll it with `GET /api/v2/contacts/enroll_actions/{id}`.
    The response reflects async progress via `target_count` and `performed_count`.


    See [How a course is structured](https://accounts.myclickfunnels.com/.well-known/courses/skill.md#how-a-course-is-structured)
    in the [Courses Skill](https://accounts.myclickfunnels.com/.well-known/courses/skill.md) for what
    the `course_ids` and `section_ids` you target refer to and how to list them.
