  name: ClickFunnels Communities::Bans::Export Action API
  description: >-
    > Async bulk action that exports community ban data to a file in the background.


    Creating an ExportAction enqueues a background job and immediately returns an action record. Poll
    the `show` endpoint using the returned `id` and check the `status` field (`queued` → `processing`
    → `completed`) to track progress. Use the `index` endpoint to list previous export actions for a community.
