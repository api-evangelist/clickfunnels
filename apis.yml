- aid: clickfunnels:clickfunnels-products-prices-changeoption-api
  name: ClickFunnels Products::Prices::Change Option API
  description: >-
    > Allowed variant/price upgrade and downgrade targets for a source price.


    Merchant-configured rows define which variant + price combinations a subscription using a

    given source price may switch to. The discovery endpoint returns these grouped by target

    variant; each group lists the prices on that target variant the subscription may move to.


    Use the returned `products_price_id`s as the body's `products_price_id` on

    `POST /orders/line_items/:line_item_id/changes` (preview) or

    `POST /orders/line_items/:line_item_id/changes/perform` (commit).


    See [Step 1 - Discover what's allowed](https://accounts.myclickfunnels.com/.well-known/subscription-changes/skill.md#step-1---discover-whats-allowed)
    in the [Subscription Changes Skill](https://accounts.myclickfunnels.com/.well-known/subscription-changes/skill.md).
