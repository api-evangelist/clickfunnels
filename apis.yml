    name: ClickFunnels 2.0 API
    description: >-
      REST API for managing workspaces, funnels, pages, products, contacts,
      orders, subscriptions, and courses in ClickFunnels 2.0. Authentication
      uses an API access token as a Bearer token, or OAuth 2.0 for public
      integrations.
    humanURL: https://developers.myclickfunnels.com
